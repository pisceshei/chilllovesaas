name: Claude Review

# ============================================================
# 自動驗收閉環（Codex 實作 × Claude 驗收）
#
#   Codex 開 PR / push
#     └→ Claude 依 docs 規格驗收，貼出【驗收結論】
#          ├─ 需修改 → 自動留言 @codex 派修 → Codex push → synchronize 觸發重審（乒乓）
#          │            └─ 超過 MAX_FIX_ROUNDS 輪 → 停止自動派修，改請人工介入
#          └─ 通過   → 自動 approve；AUTO_MERGE=true 時 squash 合併
#                       └→ 關閉本階段 issue，並在下一個里程碑 issue 留言 @codex 自動派工
#
# 開關：
#   MAX_FIX_ROUNDS             同一 PR 自動派修輪數上限（超過即停）
#   AUTO_MERGE                 通過後是否自動合併＋派工下一階段（"false"＝只 approve）
#   secrets.CODEX_PING_TOKEN   可選。設為 pisceshei 的 fine-grained PAT（僅本 repo、
#                              Issues+Pull requests Read/Write）時，@codex 留言以本人身分發出，
#                              Codex 必定視為有效請求；未設定則以 github-actions bot 留言，
#                              Codex 對 bot 留言可能不回應。
#
# 🔴🔴 **改本檔的 PR，自己不會被驗收**（2026-08-14 實測，PR #25）
#   `anthropics/claude-code-action` 有防竄改機制，annotation 原文：
#     「Skipping action due to workflow validation: Workflow validation failed.
#       The workflow file must exist and have **identical content to the version on the
#       repository's default branch**.」
#   ⇒ 只要 PR 動到本檔，驗收步驟**整個跳過**（run 只跑 16–20 秒，且 Job 顯示 success，
#     不是 failure ——非常容易誤判成「Claude 逾時」）。
#   ⇒ **本檔的任何修改都無法在它自己的 PR 上驗證**，只有合併進 main 之後才生效；
#     真正的驗證機會是「合併後開的第一個 PR」。
#   ⇒ 判別方法：Actions 頁的 run 時長。正常驗收 3–4 分鐘；被跳過只有十幾秒。
#   （順帶：dependabot 的 PR 同樣拿不到驗收，但原因不同——dependabot 讀不到 secrets。）
# ============================================================

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MAX_FIX_ROUNDS: "3"
  # 依 2026-08-13 使用者裁定改 "false"（原值 "true"）：合併 main 的唯一閘門是 LLM 留言的一行
  # 【驗收結論】文字，存在兩個已確認的風險形態——
  #   ① diff／PR 描述內的 prompt injection 可誘導「通過」直接落地 main（本檔無程式層防禦）；
  #   ② 驗收留言未綁 commit SHA，且解析步驟 if: !cancelled() 在 Claude 步驟失敗時照跑
  #      ⇒「上輪通過但 merge 失敗 → 新 push → 本輪 Claude 失敗 → 沿用舊通過合併未審核 commit」。
  # 🔴 要改回 "true" 必須先修掉②（留言內嵌 head SHA 並在解析時比對），並接受①的風險。
  AUTO_MERGE: "false"

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Claude 驗收
        id: review          # 供下一步精確判斷「是 Claude 步驟失敗」還是「跑完但沒有結論」
        continue-on-error: true   # 失敗也要讓解析步驟跑完並貼出可讀的診斷
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            你是 CHILL LOVE 專案的**規格守門人與驗收方**。Codex 負責實作，你負責審核——不要自己改代碼，只出驗收意見。

            審核 PR #${{ github.event.pull_request.number }}（`gh pr diff ${{ github.event.pull_request.number }}` 取得變更）。PR 標題或分支對應里程碑（M0–M6）時，驗收範圍以 `HANDOFF.md` §5 該里程碑的完成定義為準。

            ## 驗收依據（依序讀，變更碰到哪塊就讀哪塊）
            1. `AGENTS.md` — 技術鐵律與工作規約（違反即打回）
            2. `HANDOFF.md` §2 決策 D1–D7、§3 法律紅線、§5 里程碑驗收
            3. `docs/research/22-admin-button-inventory.md` — admin 畫面的按鈕級驗收清單
            4. `docs/specs/11-production-baseline.md` §0 — 七維度驗收表（安全/資料/併發/效能/可觀測/測試/合規）
            5. 對應模組的 `docs/specs/12-19`、API 面看 `docs/research/28-api-contract.md`
            6. 主題引擎相關看 `docs/research/25/26/27/31`
            7. UI 值一律對照 `docs/design/23-interaction-css-spec.md` §1 tokens

            ## 必查的硬性紅線（發現即標 🔴 Important）
            - 金額出現 float / 非 integer cents
            - 資料表缺 `shop_id`，或複合索引開頭不是 `shop_id`
            - admin 前端直接打 REST 而非 `/admin/api/{version}/graphql.json`；業務錯誤走 HTTP 4xx 而非 `userErrors`
            - 寫入型操作缺冪等（訂單成立／退款／庫存調整必須帶 idempotencyKey）
            - transaction 內做外部 IO
            - 上限值硬編碼而非引用 `config/limits.yml`
            - 使用 `@shopify/polaris`、抄 Dawn/Horizon 代碼或 Shopify CSS/資產/文案
            - 併發要害（超賣、折扣用量、退款上限）缺測試
            - 新增的 public class/module/方法缺文檔註釋（用途/參數/回傳/副作用）；複雜邏輯（金額/併發/冪等/Liquid 相容）缺「為什麼」註釋與規格出處（規範見 `AGENTS.md` 註釋與文檔節）
            - 新增功能的 PR 缺 `docs/dev/m{N}-{功能}.md` 功能文檔（模板見 `docs/dev/README.md`）；修復/重構 PR 未更新受影響的既有文檔且未在 PR 描述說明理由

            ## 輸出（格式必須嚴格遵守，後續自動化步驟會機器解析）
            用 `gh pr comment ${{ github.event.pull_request.number }} --body "..."` 貼**恰好一則**審核意見：

            - 第一行必須是下列兩者之一，一字不差（全形【】）：
              - 【驗收結論】通過
              - 【驗收結論】需修改：一句話理由
            - 「【驗收結論】」這個標記只能出現在第一行，其餘任何段落都不得再出現這五個字加括號的組合。
            - 之後依序：
              - **🔴 必須修**：逐條，附 `檔案:行號` 與對應規格章節（結論為通過時省略）
              - **🟡 建議**：逐條
              - **✅ 已符合**：簡列有對到規格的部分
              - **未覆蓋**：這個 PR 沒做但該里程碑要求的項目
            - 只要存在任何一條 🔴，結論必須是需修改；沒有 🔴 就下通過（🟡 不擋通過）。

            具體、可執行、指到規格章節；不要泛泛稱讚。
            不要自己 @codex、不要 approve、不要 merge——這些由後續自動化步驟處理。

            🔴🔴 **你的最後一個動作必須是那個 `gh pr comment` 呼叫。**
            **不要把審核意見寫在最終回覆裡**——最終回覆不會出現在 PR 上，整份審核會直接消失。
            （2026-08-15 實測，PR #29 連續兩次：步驟 `outcome=success`、耗時 3m32s／3m58s、
            PR 上零留言。這是本閉環的第四種失效形態，前三種是作者身分、反竄改跳過、max-turns 耗盡。）
            **大型 diff 的正確做法是縮小審核範圍並在意見裡說明**（例如「本輪只逐行看了
            `app/` 與 `spec/`，`docs/` 抽查」），**而不是省略掉那則留言**。
          # 🔴 `--max-turns` 由 40 提高到 200（2026-08-14 事故：PR #26 因此整份驗收作廢）。
          #   現象：run 跑滿 3m20s、**Job 標 Failure**、PR 上沒有任何 Claude 留言，
          #         只剩解析步驟貼的「⚠️ 自動驗收沒有產生結論」。
          #   annotation 原文：`Claude execution failed: Reached maximum number of turns (40)`。
          #   根因：該 PR 動到 `docs/design/chilllove-admin-v2.html`——**單檔 12,943 行**，
          #         驗收要讀 diff ＋ 對照多份規格，光讀檔就把 40 回合燒光，
          #         **根本沒走到 `gh pr comment` 那一步**。
          #   🔴 先前幾個 PR 沒事，是因為它們都是小幅的 Rails 改動（3–4 分鐘就跑完）——
          #      **回合數夠不夠取決於 diff 大小，不是取決於 workflow 有沒有寫對**。
          #      原型檔是本倉庫最大的單檔，任何碰它的 PR 都會壓到上限。
          claude_args: |
            --max-turns 200
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Bash(ls:*),Bash(cat:*)"

      - name: 解析結論並驅動閉環
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_PING_TOKEN: ${{ secrets.CODEX_PING_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          set -uo pipefail
          PING="${CODEX_PING_TOKEN:-}"

          COMMENTS=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100")

          # 🔴 驗收留言的作者允許清單。2026-08-14 事故：本步驟原本只認 "github-actions[bot]"，
          #    但 anthropics/claude-code-action@v1 是以自己的 GitHub App 身分留言——
          #    PR #22／#23 實測，驗收留言的作者連結是 /apps/claude ⇒ login 為 "claude[bot]"。
          #    結果 LATEST 恆為空，**每個 PR 都貼「⚠️ 自動驗收沒有產生結論」，而 Claude 其實
          #    已經貼出了完整且正確的驗收意見**。
          #    後果不只是誤報：ROUNDS 恆為 0、自動 approve 與自動派工從未觸發
          #    ⇒ 本檔頂部畫的那個「乒乓閉環」**從上線起就沒有運作過**，只是沒人發現，
          #    因為 AUTO_MERGE=false 讓它失效得很安靜（fail-safe 掩蓋了 fail-silent）。
          # 🔴 這裡**必須維持作者允許清單**，不得放寬成「只要內文有【驗收結論】就算」：
          #    那等於讓任何人、或 diff／PR 描述裡的 prompt injection 偽造通過結論，
          #    正是本檔頂部 AUTO_MERGE 註解①所指的風險。新增審核者要改這一行。
          REVIEWERS='["claude[bot]","github-actions[bot]"]'

          # 🔴 只認**第一行就是結論標記**的留言，不是「內文任何位置含標記」。
          # 兩個理由：
          #   ① 上面的 prompt 本來就規定「標記只能出現在第一行」——解析端照契約收，
          #      比寬鬆比對更能及早發現產出走樣；
          #   ② 🔴 **防止本步驟自己貼的診斷訊息被下一輪當成結論**：
          #      診斷是由 github-actions[bot] 貼的、而它在 REVIEWERS 裡，
          #      若診斷內文含標記，下一輪 synchronize 會選中它當 LATEST，
          #      而它既不是通過也不是需修改 ⇒ 落到「無法判讀」分支，
          #      **真正的作者身分問題反而再也報不出來**（PR #25 的 Codex review 指出）。
          #      配套：下面所有本步驟產生的留言**一律不得包含結論標記字面值**。
          MARKER='【驗收結論】'

          LATEST=$(printf '%s' "$COMMENTS" | jq -r --argjson who "$REVIEWERS" --arg m "$MARKER" \
            '[.[] | select(.user.login as $l | $who | index($l)) | select(.body | split("\n")[0] | startswith($m))] | (.[-1].body // "")')
          ROUNDS=$(printf '%s' "$COMMENTS" | jq --argjson who "$REVIEWERS" --arg m "$MARKER" \
            '[.[] | select(.user.login as $l | $who | index($l)) | select(.body | split("\n")[0] | startswith($m + "需修改"))] | length')

          if [ -z "$LATEST" ]; then
            # 🔴 把「查無結論」拆成兩種原因並分別報。原本兩種都印同一句「Claude 可能失敗或逾時」，
            #    而真正的原因是**作者身分不在清單內**——那句話把人指去看 Actions log，
            #    log 裡卻一切正常，於是這個 bug 藏了下來。這裡直接把實際作者印出來。
            OTHERS=$(printf '%s' "$COMMENTS" | jq -r --arg m "$MARKER" \
              '[.[] | select(.body | split("\n")[0] | startswith($m)) | .user.login] | unique | join(", ")')
            if [ -n "$OTHERS" ]; then
              # 🔴 本則訊息**刻意不寫出結論標記字面值**（理由見上方 MARKER 註解）。
              gh pr comment "$PR" --body "⚠️ 找到了驗收結論留言，但作者（\`$OTHERS\`）不在允許清單內，已忽略。請把該身分加進 \`.github/workflows/claude-review.yml\` 的 \`REVIEWERS\`。"
            elif [ "$REVIEW_OUTCOME" != "success" ]; then
              # 🔴 分開報「Claude 步驟自己失敗」與「跑完但沒貼結論」。
              #    2026-08-14 事故：原本兩者都印同一句「可能失敗或逾時」，
              #    而真正的原因是 --max-turns 用盡（PR #26）。那句話把人指去看 log，
              #    但沒說要看哪一行，診斷因此多繞了一圈。現在直接寫出最可能的原因。
              # 🔴 用 printf 組多行，**不要在 YAML block scalar 裡直接換行寫長字串**——
              #    續行會落在第 0 欄而終止 block scalar，整份 workflow 就不再是合法 YAML。
              #    （2026-08-14 寫這段時踩過一次；同型事故另見本檔 heredoc 那次。）
              BODY=$(printf '%s\n\n%s\n%s' \
                "⚠️ **Claude 驗收步驟失敗**（outcome=\`$REVIEW_OUTCOME\`），因此沒有結論可解析。" \
                "最常見原因：**\`--max-turns\` 用盡**——大型 diff（尤其動到 \`docs/design/chilllove-admin-v2.html\`，單檔逾 1.2 萬行）會把回合數燒光，且**失敗前不會留下任何驗收留言**。" \
                "請到 Actions 分頁看該 run 的 annotation（會直接寫 \`Reached maximum number of turns\`）。重新 push 即會重跑。")
              gh pr comment "$PR" --body "$BODY"
            else
              # 🔴 **「步驟成功但沒有留言」＝整份審核直接消失**（2026-08-15，PR #29 連續兩次重現：
              #    run 37／39 都是 outcome=success、耗時 3m32s／3m58s、PR 上零留言）。
              #    `outcome=success` 排除了 max-turns 耗盡（那會讓步驟 failure，見上一個分支）。
              #    最可能的形態：agent 把審核結果當成**最終文字輸出**而沒有呼叫 `gh pr comment`。
              #
              # 🔴 **原本的處置只留一句「請到 Actions 分頁查 log」——那是不夠的**：
              #    Actions 的 log 檢視器是虛擬捲動、原始 log 是 gzip，
              #    實測用瀏覽器**拿不到那段文字**（2026-08-15 試過 UI 展開、raw endpoint、
              #    未認證 API 三種路徑皆失敗）。⇒ 診斷資訊在事故當下等於不存在。
              #
              # ⇒ 改成：把 action 的執行輸出撈出來當**回收品**貼上來。
              #    這一步同時解決兩件事：①審核內容不再整份消失；②它本身就是診斷。
              FALLBACK=""
              if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
                # 取最後一則 assistant 的文字內容；jq 失敗（格式不符預期）就退回原始檔尾。
                FALLBACK=$(jq -r '[.. | objects | select(.type? == "text") | .text] | last // ""' \
                  "$EXECUTION_FILE" 2>/dev/null || true)
                if [ -z "$FALLBACK" ]; then FALLBACK=$(tail -c 20000 "$EXECUTION_FILE"); fi
              fi

              if [ -n "$FALLBACK" ]; then
                # 🔴 **中和結論標記**（把【】換成〔〕）。本則留言是由 github-actions[bot] 貼的，
                #    而它在 REVIEWERS 清單內 ⇒ 若原文第一行帶著標記，下一輪 synchronize
                #    會把**這則回收品**當成正式結論，而它並非 Claude 親自貼出、
                #    也沒有經過本輪的作者身分驗證。回收是為了讓人看到，不是為了驅動閉環。
                SAFE=$(printf '%s' "$FALLBACK" | sed 's/【驗收結論】/〔驗收結論〕/g' | head -c 55000)
                BODY=$(printf '%s\n\n%s\n\n%s\n\n---\n\n%s' \
                  "⚠️ **Claude 驗收步驟執行成功，但它沒有呼叫 \`gh pr comment\`**——審核內容原本會整份消失。" \
                  "以下是從 action 執行輸出回收的最終文字。**標記已中和成〔〕，因此不會被下一輪解析成正式結論**；請人工判讀。" \
                  "（若這段看起來就是完整的驗收意見，代表 agent 只是漏了最後那一步 tool call；重新 push 可再試一次。）" \
                  "$SAFE")
                gh pr comment "$PR" --body "$BODY"
              else
                gh pr comment "$PR" --body "⚠️ Claude 驗收步驟**執行成功但沒有貼出結論**，且**執行輸出也取不到**（\`execution_file\` 為空或不存在）。這是目前最難診斷的形態：請用 \`gh run view --log\` 取完整 log（瀏覽器拿不到）。重新 push 即會重跑驗收。"
              fi
            fi
            exit 0
          fi

          if printf '%s' "$LATEST" | grep -q "【驗收結論】需修改"; then
            if [ "$ROUNDS" -le "$MAX_FIX_ROUNDS" ]; then
              FIXBODY="@codex 請依本 PR 最新一則 Claude 驗收意見，逐條修復 🔴 必須修 的項目（🟡 建議 視情況採納），直接 push 到本分支（$PR_BRANCH），不要開新 PR。push 後會自動重新驗收。（自動派修第 $ROUNDS 輪／上限 $MAX_FIX_ROUNDS 輪）"
              if [ -n "$PING" ]; then GH_TOKEN="$PING" gh pr comment "$PR" --body "$FIXBODY"; else gh pr comment "$PR" --body "$FIXBODY"; fi
            else
              gh pr comment "$PR" --body "⛔ 已達自動派修上限（$MAX_FIX_ROUNDS 輪），停止自動 @codex，請人工介入：直接修好 push 本分支會自動重審；或自行留言 @codex 再派一輪。"
            fi
            exit 0
          fi

          if printf '%s' "$LATEST" | grep -q "【驗收結論】通過"; then
            gh pr review "$PR" --approve --body "Claude 驗收通過 ✅（自動核准）" \
              || gh pr comment "$PR" --body "ℹ️ 自動 approve 被擋：到 Settings → Actions → General 勾選 Allow GitHub Actions to create and approve pull requests 可啟用。不影響自動合併。"

            if [ "$AUTO_MERGE" != "true" ]; then
              gh pr comment "$PR" --body "✅ 驗收通過。AUTO_MERGE 已關閉，請手動合併；合併後如需派工下一階段，到下一個里程碑 issue 留言 @codex。"
              exit 0
            fi

            if ! gh pr merge "$PR" --squash --delete-branch; then
              gh pr comment "$PR" --body "⚠️ 驗收通過但自動合併失敗（可能與 main 衝突或被保護規則擋下），請手動合併。"
              exit 0
            fi

            STAGE=$(printf '%s' "$PR_TITLE" | grep -oE '^M[0-9]+' || true)
            if [ -z "$STAGE" ]; then
              STAGE=$(printf '%s' "$PR_BRANCH" | grep -oE '^m[0-9]+' | tr 'a-z' 'A-Z' || true)
            fi

            if [ -n "$STAGE" ]; then
              DONE=$(gh issue list --state open --json number,title --jq "[.[] | select(.title | startswith(\"$STAGE:\"))] | (.[0].number // \"\")")
              if [ -n "$DONE" ]; then
                gh issue close "$DONE" --comment "✅ $STAGE 已通過 Claude 驗收並合併（PR #$PR）。"
              fi
            fi

            NEXT_NUM=$(gh issue list --state open --json number,title --jq '[.[] | select(.title | test("^M[0-9]+:"))] | sort_by(.title) | (.[0].number // "")')
            NEXT_TITLE=$(gh issue list --state open --json number,title --jq '[.[] | select(.title | test("^M[0-9]+:"))] | sort_by(.title) | (.[0].title // "")')

            if [ -n "$NEXT_NUM" ]; then
              NEXT_STAGE=$(printf '%s' "$NEXT_TITLE" | grep -oE '^M[0-9]+')
              NEXT_BRANCH=$(printf '%s' "$NEXT_STAGE" | tr 'A-Z' 'a-z')
              DISPATCH="@codex 上一階段已通過驗收並合併（PR #$PR）。請開始 $NEXT_TITLE — 範圍見本 issue 描述與 HANDOFF.md §5；規約見 AGENTS.md（分支命名 $NEXT_BRANCH/{功能}、不直接推 main、PR 標題以「$NEXT_STAGE:」開頭、描述附規格對照＋自測結果＋假設清單）。完成後開 PR，Claude 會自動驗收。"
              if [ -n "$PING" ]; then GH_TOKEN="$PING" gh issue comment "$NEXT_NUM" --body "$DISPATCH"; else gh issue comment "$NEXT_NUM" --body "$DISPATCH"; fi
              gh pr comment "$PR" --body "🚀 已自動派工下一階段 → issue #$NEXT_NUM（$NEXT_TITLE）"
            else
              gh pr comment "$PR" --body "🏁 沒有待辦的里程碑 issue——所有階段已完成，或下一階段 issue 尚未建立。"
            fi
            exit 0
          fi

          gh pr comment "$PR" --body "⚠️ 驗收意見含結論標記但無法判讀（既非通過也非需修改），請人工判讀最新一則驗收意見。"
