name: Claude Review

# ============================================================
# 自動驗收閉環（雙驗收方，2026-08-15 使用者裁定改制）
#
# 🔴 **本 workflow 不再派工給任何代理去實作或修復。**
#    舊制是「Codex 實作 × Claude 驗收」，需修改時自動留言 @codex 派修，形成乒乓。
#    新制＝**Codex 只做驗收**（與 Claude 並列為兩個獨立驗收方），
#    實作由人主導的工作階段負責。理由：派修等於把「誰來改」的決定權交給
#    一個看不到本輪對話脈絡的代理，而修法選擇（例如 fail-closed 最小修
#    vs 補齊語義）往往需要裁定，不是機械修復。
#
#   開 PR / push
#     ├→ Codex（chatgpt-codex-connector App）自動審查 → inline review
#     └→ Claude 依 docs 規格驗收，貼出【驗收結論】
#          ├─ 需修改 → **只通知，不派工**；修好 push 本分支即自動重審
#          │            └─ 累計 > MAX_FIX_ROUNDS 輪 → 升級提示（可能是結構問題，該拆 PR 或回頭改規格）
#          └─ 通過   → 自動 approve；AUTO_MERGE=true 時 squash 合併
#                       └→ 關閉本階段 issue，並指出下一個里程碑 issue（**不 @ 任何人**）
#
# 開關：
#   MAX_FIX_ROUNDS             同一 PR 累計「需修改」幾輪後升級提示（不再是派修上限）
#   AUTO_MERGE                 通過後是否自動合併（"false"＝只 approve＋貼 18.1 四條件評估；
#                              "true" 時評估器是合併前最後一道硬閘——P-8 引入，四條件缺一不合）
#
# 🔴 `secrets.CODEX_PING_TOKEN` **已不再使用**（2026-08-15）。
#    它存在的唯一理由是「讓 @codex 留言以本人身分發出，Codex 才視為有效請求」——
#    新制不再自動 @codex ⇒ 該 secret 可以刪除。**留著不會有作用，但也不會有害。**
#    要恢復自動派修的人：這是要一併恢復的東西，不要只改留言文字。
#
# 🔴🔴 **改本檔的 PR，自己不會被驗收**（2026-08-14 實測，PR #25）
#   `anthropics/claude-code-action` 有防竄改機制，annotation 原文：
#     「Skipping action due to workflow validation: Workflow validation failed.
#       The workflow file must exist and have **identical content to the version on the
#       repository's default branch**.」
#   ⇒ 只要 PR 動到本檔，驗收步驟**整個跳過**（run 只跑 16–20 秒，且 Job 顯示 success，
#     不是 failure ——非常容易誤判成「Claude 逾時」）。
#   ⇒ **本檔的任何修改都無法在它自己的 PR 上驗證**，只有合併進 main 之後才生效；
#     真正的驗證機會是「合併後開的第一個 PR」。
#   ⇒ 判別方法：Actions 頁的 run 時長。正常驗收 3–4 分鐘；被跳過只有十幾秒。
#   （順帶：dependabot 的 PR 同樣拿不到驗收，但原因不同——dependabot 讀不到 secrets。）
# ============================================================

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MAX_FIX_ROUNDS: "3"
  # 依 2026-08-13 使用者裁定改 "false"（原值 "true"）：合併 main 的唯一閘門是 LLM 留言的一行
  # 【驗收結論】文字，存在兩個已確認的風險形態——
  #   ① diff／PR 描述內的 prompt injection 可誘導「通過」直接落地 main（本檔無程式層防禦）；
  #   ② ✅ **已於 2026-08-15 修掉**（PR #30，由 Codex review 指出）：舊結論會被當成本輪結論。
  #      原文以為它只在「Claude 步驟失敗」時發生，實際上**每一輪都發生**且與 outcome 無關
  #      ——因為 LATEST 取自 PR 的全部留言。修法＝在驗收前記錄留言 id 水位，
  #      LATEST 只認水位之後產生的結論（見 `記錄驗收前的留言水位` 步驟）。
  #      🔴 原本設想的修法是「留言內嵌 head SHA 並比對」，**沒有採用**：那要靠 prompt
  #      叫模型自己寫對 SHA ＝ 賭模型配合；水位由 workflow 自己量，不需要模型配合。
  # 🔴 **AUTO_MERGE 仍維持 "false"**：②雖已修，①（prompt injection 誘導「通過」）
  #    仍然完全沒有程式層防禦 ⇒ 要改回 "true" 等於單獨接受①的風險，那是使用者的裁定，
  #    不得由實作者順手改掉。
  AUTO_MERGE: "false"

jobs:
  review:
    # 🔴 **C-4（2026-08-15 使用者裁定）：`MAX_FIX_ROUNDS` 由「換一句留言」升級成真閘門。**
    #   舊行為：超過門檻只是把提示文字換掉，然後 `exit 0` ⇒ **下一輪照樣全量重審**，
    #   閉環行為完全不變。PR #39／#40 分別跑到第 4／5 輪，兩者都早已越線而毫無作用。
    #   新行為：越線時打上 `review:需人工裁定` label；本 job 見到該 label **直接不跑**，
    #   直到人把 label 移除。
    #   ⇒ 這是**唯一保證有限步終止**的機制；前面三項（C-1／C-2／C-5）都只降低發生率。
    #   ⚠️ 代價寫明白：這等於承認自動驗收有它判不了的區間，把「什麼時候夠好」交回人手上。
    #     這正是它該做的事——一個永遠不會說「夠了」的驗收方，與沒有驗收方一樣沒用。
    if: >-
      github.event.pull_request.draft == false
      && !contains(github.event.pull_request.labels.*.name, 'review:需人工裁定')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 🔴🔴 **最小權限（2026-08-15 收緊，依 PR #44 的 Codex review）**
    #
    #   起因：本 job 現在**會執行被審 PR 帶進來的 `scripts/` 代碼**
    #   （`--allowedTools` 的 `Bash(bash scripts/*)` 等四條）。Codex 逐字：
    #     「Restricting the prefix to `scripts/` **does not establish trust** because the
    #       checked-out script itself comes from the reviewed PR… the process inherits
    #       `GH_TOKEN` while this job grants `contents: write`…」
    #   🔴 **它是對的**：範圍限制不等於信任——`scripts/` 底下的東西正是被審的那些。
    #
    #   ⇒ 逐項稽核實際用到什麼（`grep` 全檔的 gh／git 動作）：
    #     `contents: write`  → **只有 `gh pr merge --squash` 用得到**，而 `AUTO_MERGE` 是 `"false"`
    #                          ⇒ **目前完全用不到，卻是攻擊面最大的一項** ⇒ 降成 `read`。
    #     `pull-requests: write` → `gh pr comment`／`gh pr review --approve`。**核心功能，不能拿掉。**
    #     `issues: write`    → 通過後關階段 issue／在下一階段 issue 登記（`gh issue close/comment`）。
    #                          風險等級遠低於 contents（改不了代碼），保留。
    #     `id-token: write`  → action 換 app token 的 OIDC 流程（log 有 `Requesting OIDC token`）。
    #     `actions: read`    → 本檔沒有直接用，保留（唯讀、無害）。
    #
    #   🔴🔴 **要把 `AUTO_MERGE` 改回 `"true"` 的人注意**：那時 `gh pr merge` 會因為
    #      `contents: read` 而失敗。**不要只改 AUTO_MERGE**——你要同時面對
    #      「讓一個執行過 PR 代碼的 job 重新拿到 contents: write」這個決定。
    #      本檔頂部 AUTO_MERGE 註解已寫明它為什麼是 false，這裡是第二道提醒。
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
      # 🔴 C3（機械 CI 全綠）要讀 head 的 check-runs（Codex #59 r3）：顯式 permissions
      #    區塊會**關閉未列出的權限**，缺這一項時該 API 回權限錯誤 ⇒ `CHECKS_STATE=apifail`
      #    ⇒ C3 恆為 0 ⇒ 四條件結構上永遠湊不齊。AUTO_MERGE 若已啟用，等於自動合併被
      #    永久停用（fail-closed 方向正確，但那是「壞掉」不是「守住」）。
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 🔴 **本步驟必須在驗收之前跑**（2026-08-15，PR #30 的 Codex review 指出）。
      #   它記下「驗收開始前，PR 上最大的留言 id」，讓下一步能分辨
      #   **本輪產生的結論** 與 **前幾輪留下的舊結論**。
      #
      #   沒有它的話（原本的寫法）：`LATEST` 取自 PR 的**全部**留言 ⇒ 只要任何一輪
      #   貼過結論，之後每一輪的 `LATEST` 都非空，於是
      #     ①「成功但沒留言」的回收分支**永遠進不去**（它的守衛是 `[ -z "$LATEST" ]`）
      #        ——那正是本 PR 要修的東西，它在第二輪起就是死碼；
      #     ② 更嚴重：舊的「通過」會被當成本輪結論 ⇒ **自動 approve 一個沒被審過的新 head**；
      #        舊的「需修改」會 ⇒ **拿過期意見再派一次 @codex**。
      #   🔴 ② 就是本檔頂部 AUTO_MERGE 註解②描述的風險，但原文以為它只在
      #      「Claude 步驟失敗」時發生——實際上**每一輪都發生**，與 outcome 無關。
      #
      #   為什麼用 id 水位而不是「把結論綁 head SHA」：綁 SHA 要靠 prompt 叫模型
      #   自己寫對 SHA，那是**賭模型配合**；id 水位由 workflow 自己量，不需要模型配合。
      - name: 記錄驗收前的留言水位
        id: watermark
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # 🔴 `--paginate`：留言超過 100 則時，單頁只會拿到**最舊**的 100 則，
          #    水位會取得太低 ⇒ 舊結論又能混進來。乒乓 PR 累積破百並不罕見。
          LAST_ID=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
            | jq -s 'add // []' | jq -r '[.[].id] | max // 0')
          echo "last_id=$LAST_ID" >> "$GITHUB_OUTPUT"

      - name: Claude 驗收
        id: review          # 供下一步精確判斷「是 Claude 步驟失敗」還是「跑完但沒有結論」
        continue-on-error: true   # 失敗也要讓解析步驟跑完並貼出可讀的診斷
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 🔴 **診斷用，2026-08-15 開啟**：預設 false 時 action 只印
          #   `Running Claude Code via SDK (full output hidden for security)`，
          #   且 result 物件是**白名單式**輸出——只留 6 個欄位，
          #   **錯誤原因所在的 `result` 欄被整個砍掉**。
          #   ⇒ 這正是 08-15 驗收全滅跨四個工作階段的直接原因：
          #     每個人拿到的都是同一組**去掉了原因的數字**，只能靠指紋猜，而且猜錯了
          #     （先猜「無 Fable 5 權限」，被證偽——同一份設定一路成功到 **09:30**）。
          #   ⚠️ action 的 README 說「debug mode 會自動開啟 show_full_output」，
          #     但**在 `@v1` 上實測不成立**（PR #41 run 31863797988→attempt #2 勾了
          #     Enable debug logging：raw log 11,704 行、`##[debug]` 一堆，
          #     那句「full output hidden」照樣印、`result` 欄照樣被砍）。
          #     ⇒ 不要相信那句話，**要開就明文開這個 input**。
          #   ✅ 已驗證這**不是**會被靜默忽略的未知 input（本檔上方 `--model` 那段記的形態）：
          #     `anthropics/claude-code-action@v1` 的 `action.yml` **156 行宣告**、
          #     **325 行 `INPUT_SHOW_FULL_OUTPUT: ${{ inputs.show_full_output }}` 明文映射**。
          #     🔴 這一步非做不可——composite action **不會**把 `with:` 自動傳給內層步驟，
          #       少了 325 行那個映射，寫了也等於沒寫。
          #     ⚠️ 查證方法本身也踩過坑：GitHub 的 blob 檢視是**虛擬捲動**，
          #       只渲染前約 150 行 ⇒ 在頁面上搜「找不到」是**渲染結果**不是事實。
          #       要用 `raw.githubusercontent.com` 的純文字，或 code search。
          #   宣告型別是**字串**（`default: "false"`）⇒ 這裡照字串寫，不寫 YAML 布林。
          #   安全性：本倉庫是 **private**，Actions log 只有協作者看得到；
          #   GitHub 仍會遮罩 secrets。代價是每輪 log 會多出完整審核串流（噪音）。
          #   🔴 **移除條件**：等驗收環境恢復、且失敗留言能穩定貼出「錯誤原文」之後可關掉。
          #   關掉之前先確認上面那段 `ERRTEXT` 真的撈得到 `result` 欄——
          #   若撈不到（存檔與 console 一樣被砍），這個 input 就是唯一手段，**不得關**。
          #   🔴 2026-08-18 已關（P-00 public 安全補課）：倉庫已轉 **public**，Actions log
          #     全網可讀，完整審核串流（含倉庫內容節錄與判詞全文）不得再外印——
          #     `docs/worklog/2026-08-15-驗收失敗看不到原因.md` Pending 4 白紙黑字寫明
          #     「若本倉庫日後改為 public，必須先關掉這一行」，本次即執行該條款。
          #     上面「不得關」的前提（private）已不成立；上下各處「show_full_output 已開」
          #     的除錯指引自此失效——需要錯誤原文時，在**分支上**暫時改回字串 true
          #     重跑取證，取完即 revert，不得帶著它進 main。
          show_full_output: "false"
          prompt: |
            你是 CHILL LOVE 專案的**規格守門人與驗收方**。不要自己改代碼，只出驗收意見。
            分工（2026-08-15 使用者裁定改制，見 `AGENTS.md` 開頭）：**實作由人主導的工作階段負責**；
            你與 **Codex** 並列為兩個**獨立**的驗收方，各自出意見、互不派工。

            審核 PR #${{ github.event.pull_request.number }}（`gh pr diff ${{ github.event.pull_request.number }}` 取得變更）。PR 標題或分支對應里程碑（M0–M6）時，驗收範圍以 `HANDOFF.md` §5 該里程碑的完成定義為準。

            ## 驗收依據（依序讀，變更碰到哪塊就讀哪塊）
            0. `CLAUDE.md` — 專案共用規則與工作方式。🔴 **2026-08-15 補進本清單**：
               它 §工作方式 規定 worklog／handoff **要不要寫、什麼時候寫、固定幾段**。
               先前它不在本清單裡，而九輪驗收裡 12 條 🔴 打的正是它要求產生的產物
               ⇒ 判準來源不在你被授權讀的清單內，那個類別**沒有寫下來的標準**。
               <!-- 🔴 2026-08-16 更正（PR #46 的 Codex review 指出，我複驗成立）：
                    初稿寫「格式與**分層規範**在 §工作方式」——**分層規範不在 CLAUDE.md**。
                    實測 `grep -c '歷史層\|終態層\|契約層'`：CLAUDE.md **0**、AGENTS.md **8**。
                    三層分類是 PR #46 加進 AGENTS.md 的，CLAUDE.md 只定義固定段落格式。
                    ⇒ 指錯出處，正好復現了本 PR 要修的那個病（而且是在修它的那一行上）。 -->
            1. `AGENTS.md` — 技術鐵律與工作規約（違反即打回）。
               🔴 **worklog／handoff 的「怎麼寫」在這裡**：§工作記錄與交接文件的寫法
               ——**歷史層／終態層／契約層**的三層分類、易腐數字、全稱句、跨 PR 錨定
               都在該節。判定文檔類 🔴 時**以這一節為準**。
            2. `HANDOFF.md` §2 決策 D1–D7、§3 法律紅線、§5 里程碑驗收
            3. `docs/research/22-admin-button-inventory.md` — admin 畫面的按鈕級驗收清單
            4. `docs/specs/11-production-baseline.md` §0 — 七維度驗收表（安全/資料/併發/效能/可觀測/測試/合規）
            5. 對應模組的 `docs/specs/12-19`、API 面看 `docs/research/28-api-contract.md`
            6. 主題引擎相關看 `docs/research/25/26/27/31`
            7. UI 值一律對照 `docs/design/23-interaction-css-spec.md` §1 tokens

            ## 🔴🔴 你的工作是**找缺陷**，不是**核對清單**（2026-08-16 新增，最高優先）

            下面那份「硬性紅線」是**地板不是天花板**。它列的是十條合規項；
            **一個 PR 可以十條全過，同時有五個會炸的 bug。**

            ⚠️ **這不是假設，是已經發生的事**：2026-08-16 的 PR #38，你判「通過」、
            理由是「重做紅線抽驗（app/ 無 to_f、無 polaris、無 REST 呼叫…）」——
            同一份 diff 被另一個審核方抓出**五條**真缺陷，**沒有一條在那份清單上**：

            | 缺陷 | 為什麼清單抓不到 |
            |---|---|
            | migration 對**既有資料**會 `Duplicate entry` 而中斷 | 清單只問「有沒有違反鐵律」，不問「這支 migration 在非空的庫上跑得過嗎」 |
            | ActiveRecord **關聯快取**讓物化欄算出舊值 | 框架語義，清單沒有這一類 |
            | 父表漏宣告 `has_many` ⇒ 外鍵讓該資源**永遠刪不掉** | 同上，而且**沒有任何既有測試會紅** |
            | 兩份權威文件對同一件事的規定**互斥** | 清單只看代碼，不看文件之間 |
            | model 驗證只擋「至多一個」擋不住「少給」 | 清單沒有「這個約束真的完整嗎」這一問 |

            ⇒ **每次審核，除了走清單，還必須主動找下列缺陷類別**（找不到就明說找不到）：

            1. **migration 對既有資料安全嗎**——回填會不會撞新加的唯一約束？
               🔴 **「在空庫上跑得過」證明不了任何事**，要問「有 N 筆既有資料時呢」。
               失敗會不會留下半套用狀態（MySQL 的 DDL **不具交易性**）？`down` 真的可逆嗎？
            2. **框架語義用對了嗎**——關聯快取 vs DB 現況、`dependent` 的**宣告順序**、
               callback 的執行時機、`insert_all`／`update_all` 繞過的東西、
               `private` 對 mixin 內部呼叫無效、Rails 的 `rescue_responses` 對映。
            3. **新表／新 model 的關聯宣告完整嗎**——有外鍵指回父表時，父表補了 `has_many` 嗎？
               不補的結果通常是「某個資源永遠刪不掉」，而且**測試不會紅**。
            4. **約束真的完整嗎**——DB 索引與 model 驗證各自擋住了什麼、**擋不住什麼**？
               特別問：「至多一個」與「恰好一個」的差別、NULL 在唯一索引下不去重、
               CHECK 不能跨表。**擋不住的那一半有沒有第二道防線？**
            5. **同一件事寫在幾個地方**——改了其中一處，其他處是不是變成互斥？
               （本倉庫已有前例：刪除策略寫在三處、`sku/barcode` 的歸屬寫在兩處。）
            6. **註釋／訊息宣稱的行為，代碼真的做得到嗎**——`@raise` 寫的例外真的會拋嗎？
               CI 的成功訊息宣告的檢查真的執行了嗎？**說謊的註釋比沒有註釋更糟。**
            7. **PR 描述的「假設清單」逐條檢驗**——那是作者自己標出來的弱點，
               🔴 **不得跳過**。作者說「這條沒做」時，要問「不做的後果是不是比他寫的更嚴重」。

            🔴 **判「通過」的門檻**：你必須能說出「上面七類我各自看了什麼、為什麼沒有發現」。
            **只寫「紅線抽驗皆通過」＝沒有做這份工作。**
            ⚠️ 找不到 🔴 是可以的（也確實會發生）。防蓋章的要求是**具體性，不是必須留缺陷**：
            通過意見的 ✅ 段必須逐類寫出「看了什麼、實跑了什麼、為什麼沒有發現」，
            有範圍外觀察就落 ⚪、有真沒覆蓋的就照實列「未覆蓋」——三者都可以為空，
            但 ✅ 段空泛（如只寫「紅線抽驗皆通過」）＝這份工作沒做。
            <!-- 2026-08-16 改制（PR #51 Codex 複審指出）：原文「至少要有 🟡 或未覆蓋」
                 在 🟡 變閘門後會逼模型捏造待清 🟡 或虛報未覆蓋——防蓋章改由 ✅ 具體性承擔。 -->

            ## 必查的硬性紅線（地板；發現即標 🔴 Important）
            - 金額出現 float / 非 integer cents
            - 資料表缺 `shop_id`，或複合索引開頭不是 `shop_id`
            - admin 前端直接打 REST 而非 `/admin/api/{version}/graphql.json`；業務錯誤走 HTTP 4xx 而非 `userErrors`
            - 寫入型操作缺冪等（訂單成立／退款／庫存調整必須帶 idempotencyKey）
            - transaction 內做外部 IO
            - 上限值硬編碼而非引用 `config/limits.yml`
            - 使用 `@shopify/polaris`、抄 Dawn/Horizon 代碼或 Shopify CSS/資產/文案
            - 併發要害（超賣、折扣用量、退款上限）缺測試
            - 新增的 public class/module/方法缺文檔註釋（用途/參數/回傳/副作用）；複雜邏輯（金額/併發/冪等/Liquid 相容）缺「為什麼」註釋與規格出處（規範見 `AGENTS.md` 註釋與文檔節）
            - 新增功能的 PR 缺 `docs/dev/m{N}-{功能}.md` 功能文檔（模板見 `docs/dev/README.md`）；修復/重構 PR 未更新受影響的既有文檔且未在 PR 描述說明理由

            ## 🔴 實跑證據＝CI 的結果；你自己不執行倉庫腳本（2026-08-18 public 安全改制）
            倉庫已轉 public：**你不得（也沒有權限）執行任何倉庫內腳本**——被審 PR 帶進來的
            代碼不能在持有 token 的本 job 裡執行。實跑證據改由 `ci.yml` 提供：它的
            `quality` job 以唯讀權限、零 secret 跑全部 `check-*`／`test-*` 閘門與回歸 fixture，
            它就是這個倉庫的「獨立唯讀執行環境」。

            - 🔴 用 `gh pr checks ${{ github.event.pull_request.number }}` 讀本 PR 的 CI 結果，
              把各 check 的結論（pass／fail／pending）當作實跑證據引用：fail 的 check 逐條
              對應到你的意見（🔴／🟡）；pending 未完成時在意見中明說「CI 尚未完成，實跑證據不全」。
            - 🔴 本專案的判準是「**破壞那一步本身也要有斷言**」：PR 自稱「N 條 fixture 全過」
              **不算證據**；CI 的對應 step 綠了才算。CI 沒覆蓋到的斷言，在「未覆蓋」段登記
              「無實跑證據」，**不得把沒跑過的東西寫成跑過的**。
            - 🔴 **你沒有寫檔權限**（沒有 `Write`，也沒有任何能建檔的指令），
              所以**「改壞 checker 再跑一次」這種突變測試你做不到**。
              ⇒ 遇到「只有突變測試才能證明」的情形（例如「這條 fixture 是不是承重的」），
              **不要假裝驗過**：在「未覆蓋」段寫明「需要突變測試，本輪環境做不到」，
              並具體說出**該怎麼突變**（改哪一行成什麼），讓人可以照著跑。
