                「建立前登記於 PR 描述」的過渡辦法自此作廢）
              - **✅ 已符合**：簡列有對到規格的部分＋**已清的 🟡（註明清法①②③）**
              - **未覆蓋**：這個 PR 沒做但該里程碑要求的項目
            - 🔴 **判定規則（2026-08-16 使用者裁定改制，取代「🟡 不擋通過」）**：
