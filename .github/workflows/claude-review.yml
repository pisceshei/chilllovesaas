          GH_TOKEN: ${{ github.token }}
          # 🔴 `CODEX_PING_TOKEN` 已移除（2026-08-15，見檔頭）：它唯一的用途是讓
          #    自動 @codex 留言以本人身分發出；新制不派工 ⇒ 沒有留著的理由。
          #    **不要因為「留著也不會怎樣」就把它加回來**——一個沒有用途的
          #    write 權限 token 出現在 workflow env 裡，讀的人會以為它有用途。
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          COMMENT_WATERMARK: ${{ steps.watermark.outputs.last_id }}
          # 🔴 **必須走 env，不得在 run: 內直接寫 `${{ }}`**（2026-08-18 實測事故）：
          #    含 `${{ }}` 的 run 區塊會被整段當成**一個 expression** 求值，而本步驟的
          #    run 有數百行 ⇒ 直接觸發 GitHub 的
          #    `Exceeded max expression length 21000`，整個 workflow 檔變成 invalid、
          #    **每次 push 立即 Failure 且完全不執行**（PR #59 的 e39a96f／c5de2bd 兩輪
          #    連續失敗即此）。env 注入同時也是官方推薦的 script-injection 防護寫法。
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          # 🔴 **水位取不到就什麼都不做**（fail-safe，不是 fail-open）。
          #    本步驟的 `if: !cancelled()` 表示即使水位那一步失敗，這裡照樣會跑。
          #    若此時把水位當 0 處理，行為就**靜默退回**成修掉的那個漏洞
          #    （舊結論被當本輪結論 ⇒ 自動 approve 未審過的 head）。
          #    ⇒ 寧可停掉整個閉環並大聲說出來，也不要安靜地退回不安全的版本。
          if [ -z "${COMMENT_WATERMARK:-}" ]; then
            gh pr comment "$PR" --body "⚠️ 取不到本輪的留言水位（\`記錄驗收前的留言水位\` 步驟失敗或被跳過），**無法分辨本輪結論與前幾輪的舊結論**，因此本輪不驅動任何自動動作（不 approve、不派修、不合併）。請看 Actions log 後重新 push。"
            exit 0
          fi

          # 🔴 `--paginate`：原本是單頁 100 則，而 GitHub 回的是**最舊**的一頁
          #    ⇒ 留言破百的 PR，`LATEST`／`ROUNDS` 會完全看不到近期的留言。
          #    乒乓 PR（每輪至少一則驗收＋一則派修）累積破百並不罕見。
          COMMENTS=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" | jq -s 'add // []')

          # 🔴 驗收留言的作者允許清單。2026-08-14 事故：本步驟原本只認 "github-actions[bot]"，
          #    但 anthropics/claude-code-action@v1 是以自己的 GitHub App 身分留言——
          #    PR #22／#23 實測，驗收留言的作者連結是 /apps/claude ⇒ login 為 "claude[bot]"。
          #    結果 LATEST 恆為空，**每個 PR 都貼「⚠️ 自動驗收沒有產生結論」，而 Claude 其實
          #    已經貼出了完整且正確的驗收意見**。
          #    後果不只是誤報：ROUNDS 恆為 0、自動 approve 與自動派工從未觸發
          #    ⇒ 本檔頂部畫的那個「乒乓閉環」**從上線起就沒有運作過**，只是沒人發現，
          #    因為 AUTO_MERGE=false 讓它失效得很安靜（fail-safe 掩蓋了 fail-silent）。
          # 🔴 這裡**必須維持作者允許清單**，不得放寬成「只要內文有【驗收結論】就算」：
          #    那等於讓任何人、或 diff／PR 描述裡的 prompt injection 偽造通過結論，
          #    正是本檔頂部 AUTO_MERGE 註解①所指的風險。新增審核者要改這一行。
          REVIEWERS='["claude[bot]","github-actions[bot]"]'

          # 🔴 只認**第一行就是結論標記**的留言，不是「內文任何位置含標記」。
          # 兩個理由：
          #   ① 上面的 prompt 本來就規定「標記只能出現在第一行」——解析端照契約收，
          #      比寬鬆比對更能及早發現產出走樣；
          #   ② 🔴 **防止本步驟自己貼的診斷訊息被下一輪當成結論**：
          #      診斷是由 github-actions[bot] 貼的、而它在 REVIEWERS 裡，
          #      若診斷內文含標記，下一輪 synchronize 會選中它當 LATEST，
          #      而它既不是通過也不是需修改 ⇒ 落到「無法判讀」分支，
          #      **真正的作者身分問題反而再也報不出來**（PR #25 的 Codex review 指出）。
          #      配套：下面所有本步驟產生的留言**一律不得包含結論標記字面值**。
          MARKER='【驗收結論】'

          # 🔴 **`LATEST` 只認本輪產生的結論**——`.id > $wm`（水位見上面那個步驟）。
          #    這是 PR #30 的 Codex review 指出的缺陷：原本取全部留言 ⇒ 舊結論會被
          #    當成本輪結果，於是「成功但沒留言」的回收分支永遠進不去，
          #    而且**舊的通過會自動 approve 沒被審過的新 head**。
          #    完整推導寫在 `記錄驗收前的留言水位` 步驟的註釋裡。
          LATEST=$(printf '%s' "$COMMENTS" | jq -r --argjson who "$REVIEWERS" --arg m "$MARKER" \
            --argjson wm "${COMMENT_WATERMARK:-0}" \
            '[.[] | select(.id > $wm) | select(.user.login as $l | $who | index($l)) | select(.body | split("\n")[0] | startswith($m))] | (.[-1].body // "")')
          # 🔴 `ROUNDS` **刻意不加水位過濾**：它是「這個 PR 至今被派修幾輪」的累計計數，
          #    用來擋 MAX_FIX_ROUNDS。加了水位它每輪都會歸零，上限就永遠觸發不到。
          #    ⇒ 兩個變數的時間範圍不同是**刻意的**，不是漏改。
          # 🔴 只計**格式合法**的需修改判詞（Codex #59 r3）：下方 18.1④ 會把格式走樣的判詞
          #    判為不採信（job 轉紅、不驅動任何動作），但舊式 ROUNDS 只看「第一行以標記＋
          #    需修改開頭」，**被拒絕的那一則照樣被計入** ⇒ 熔斷可能提早觸發，而它對應的
          #    那一輪其實沒有產生有效判詞。判準與 FORMAT_OK 對齊：第一行整行匹配合法形
          #    ∧ 標記全文只出現一次。
          ROUNDS=$(printf '%s' "$COMMENTS" | jq --argjson who "$REVIEWERS" --arg m "$MARKER" \
            '[.[]
              | select(.user.login as $l | $who | index($l))
              | select(.body | split("\n")[0] | test("^" + $m + "需修改：[ \t]*[^ \t].*$"))
              | select(((.body | split($m) | length) - 1) == 1)] | length')

          if [ -z "$LATEST" ]; then
            # 🔴 把「查無結論」拆成兩種原因並分別報。原本兩種都印同一句「Claude 可能失敗或逾時」，
            #    而真正的原因是**作者身分不在清單內**——那句話把人指去看 Actions log，
            #    log 裡卻一切正常，於是這個 bug 藏了下來。這裡直接把實際作者印出來。
            #
            # 🔴🔴 **本行在 2026-08-15 修過一次，那是加水位時漏改造成的 regression**
            #    （PR #29 實測命中）。原本它**既沒有水位過濾、也沒有排除清單內的作者**：
            #      `[.[] | select(.body|...startswith($m)) | .user.login]`
            #    ⇒ 它列的是**這個 PR 歷來所有**結論留言的作者。於是當本輪沒產生結論時，
            #      它會撈到**前幾輪** `claude[bot]` 貼的舊結論，貼出
            #      「作者（`claude[bot]`）**不在允許清單內**」——而 `claude[bot]`
            #      **就在 `REVIEWERS` 裡**。訊息是**假的**，而且指向一個不存在的問題。
            #    ⚠️ 後果實測：驗收方讀到這則診斷，以為自己的意見被忽略而**重貼了一次**。
            #      結果正確只是因為重試碰巧成功。
            #    ⇒ 兩個條件缺一不可：①`.id > $wm`（只看本輪）②`index($l) | not`（只列**不在**清單的）。
            #
            # 🔴 **教訓（比這個修正本身重要）**：加水位那一輪我改了 `LATEST`、
            #    也想清楚了 `ROUNDS` 為什麼**不能**加，卻**沒有把第三個消費者 `OTHERS` 一起檢查**。
            #    引入一個新的過濾維度時，要逐一走過**每一個讀同一份資料的地方**，
            #    而不是只改觸發這次改動的那一個。
            OTHERS=$(printf '%s' "$COMMENTS" | jq -r --argjson who "$REVIEWERS" --arg m "$MARKER" \
              --argjson wm "${COMMENT_WATERMARK:-0}" \
              '[.[] | select(.id > $wm) | select(.user.login as $l | $who | index($l) | not) | select(.body | split("\n")[0] | startswith($m)) | .user.login] | unique | join(", ")')
            if [ -n "$OTHERS" ]; then
              # 🔴 本則訊息**刻意不寫出結論標記字面值**（理由見上方 MARKER 註解）。
              gh pr comment "$PR" --body "⚠️ 找到了驗收結論留言，但作者（\`$OTHERS\`）不在允許清單內，已忽略。請把該身分加進 \`.github/workflows/claude-review.yml\` 的 \`REVIEWERS\`。"
            elif [ "$REVIEW_OUTCOME" != "success" ]; then
              # 🔴 分開報「Claude 步驟自己失敗」與「跑完但沒貼結論」。
              #    2026-08-14 事故：原本兩者都印同一句「可能失敗或逾時」，
              #    而真正的原因是 --max-turns 用盡（PR #26）。那句話把人指去看 log，
              #    但沒說要看哪一行，診斷因此多繞了一圈。
              #
              # 🔴 **2026-08-15 再修：上一版矯枉過正。** 它把「最常見原因＝`--max-turns` 用盡」
              #    寫死成留言，還斷言「annotation 會直接寫 `Reached maximum number of turns`」。
              #    **PR #33 實測證偽**（連續兩次 attempt 完全相同）：
              #      execution result payload＝`{ is_error: true, num_turns: 1,
              #                                  total_cost_usd: 0, duration_ms: 654 }`
              #      annotation 只有 `Claude execution failed: result is_error:true`，
              #      **完全沒有**它叫人去找的那句話。
              #    ⇒ 真因是「**第一個 API 請求就失敗**」（配額／額度／認證／模型可用性），
              #      與 max-turns 用盡（跑滿回合、耗時數分鐘、有花費）在數據上**完全相反**。
              #    ⇒ 那則留言把人指向錯誤方向，並要他去找一句不存在的 annotation。
              #
              #    教訓與本檔上面 OTHERS 那次同型：**寫死的猜測會變成自信的假診斷**，
              #    而假診斷比「沒有診斷」更貴——它讓人先花時間去否證一個錯的方向。
              #    ⇒ **不要猜**：把 execution_file 裡的 result payload 直接撈出來貼上，
              #      再附一張判準表讓讀的人自己對號入座。
              #
              # 🔴 **判準表本身也差點犯同一個錯**（PR #36 的 Codex review 指出，已修）：
              #    初版把 `num_turns: 1` ＋ 零花費直接判成「配額／額度／認證 ⇒ 重跑通常無效」，
              #    但**暫時性服務中斷、runner 網路失敗、上游一次性拒絕**會產生**一模一樣**的數據。
              #    ⇒ 光憑這組數據**分不出**是暫時性還是持續性，
              #      判準改成「兩種都列出來 ＋ 用**重跑一次**當分辨手段」：
              #      重跑就過＝暫時性；重跑得到逐字相同的結果＝持續性，那時才往帳號側查。
              #      （PR #33 那次正是靠「連續兩次 attempt 完全相同」才排除暫時性的。）
              #
              # ⚠️ 已知副作用（本輪未處理，見本 PR 的 worklog Pending）：驗收步驟失敗時
              #    job 層 conclusion 仍是 `success`（失敗被下游 `exit 0` 吞掉）⇒
              #    `POST /actions/runs/{id}/rerun-failed-jobs` 會回 403「cannot be retried」，
              #    只能整個 workflow rerun。
              #
              # 🔴 用 printf 組多行，**不要在 YAML block scalar 裡直接換行寫長字串**——
              #    續行會落在第 0 欄而終止 block scalar，整份 workflow 就不再是合法 YAML。
              #    （2026-08-14 寫這段時踩過一次；同型事故另見本檔 heredoc 那次。）
              # 🔴 **分報四種「取不到」的原因**（2026-08-15，多代理驗收 Y7 指出）。
              #    原本四條路徑全部收斂成同一句「取不到 execution_file」：
              #      ①env 空 ②檔不存在 ③**檔在且可解析，但裡面沒有 result 物件**
              #      ④**檔在但 JSON 壞掉**
              #    其中③④**檔案明明在** ⇒ 那句話本身就是假歸因，
              #    而它就印在一段**承認③存在**的註釋下面幾行（「`select(. != null)` 讓
              #    『找不到 result』落空成空字串」）——註釋與訊息互相矛盾。
              #    🔴 這正是本分支上一輪才修掉的那個錯（寫死的猜測當診斷），換個位置又犯一次。
              #    姊妹分支（下方回收品）有 `tail -c` 的 fallback，所以它那句「為空或不存在」
              #    是可信的；失敗分支缺的就是這道分辨。
              DIAG=""
              DIAG_WHY=""
              # 🔴 `ERRTEXT`／`HAVE_RESULT` **必須在這裡初始化**（2026-08-15 事故修正）。
              #    本步驟是 `set -uo pipefail`，而 `ERRTEXT` 只在下面「檔案存在」那個分支
              #    才被賦值，卻在後面**無條件被讀**（`if [ -n "$ERRTEXT" ]`）⇒
              #    「EXECUTION_FILE 為空」與「檔案不存在」這兩條路徑會以
              #    `line …: ERRTEXT: unbound variable` 中止，**PR 上一則留言都貼不出來**。
              #    ⚠️ 那正好是本 PR（Y7 四路分辨）要救的四條路徑裡的兩條，
              #      也正是本檔花大篇幅在防的「審核整份消失」形態——修診斷的改動自己弄壞了診斷。
              #    ⚠️ 引入這個 bug 的自測只跑了「檔案存在」的兩種輸入就收工。
              #      教訓：**新增一個變數時，要走過每一個讀它的地方**，
              #      而不是只測你新寫的那條路徑。
              ERRTEXT=""
              ERRSTATE=""
              HAVE_RESULT=0
              if [ -z "${EXECUTION_FILE:-}" ]; then
                DIAG_WHY="action 沒有輸出 execution_file——步驟可能在產生它之前就失敗了"
              elif [ ! -f "$EXECUTION_FILE" ]; then
                DIAG_WHY="execution_file 指向 $EXECUTION_FILE，但該檔不存在"
              else
                JQ_ERR="$(mktemp)"
                # `-s`（slurp）＋ `..` 的理由同下方回收品那段：對「單一 JSON 陣列」與
                # 「JSONL」兩種格式都正確。`select(. != null)` 讓「找不到 result」落空成空字串。
                # 🔴 `g()` 逐欄位用 `has()` 判斷（Y8）：`select(. != null)` 只擋**整個物件**不存在，
                #    擋不住**欄位被上游改名** ⇒ 會印出一行 `num_turns=null total_cost_usd=null`，
                #    那行對不上下面判準表的任何一列，而讀的人會拿它去對號入座。
                #    ⚠️ 不能用 `// "缺欄位"`：jq 的 `//` 對 `false` 也會取右邊，
                #      而 `is_error: false` 是**完全正常的值**，會被誤報成缺欄位。
                DIAG=$(jq -s -r 'def g(k): if has(k) then (.[k] | tostring) else "缺欄位" end;
                  [.. | objects | select(.type? == "result")] | last | select(. != null)
                  | "is_error=\(g("is_error")) num_turns=\(g("num_turns")) total_cost_usd=\(g("total_cost_usd")) duration_ms=\(g("duration_ms"))"' \
                  "$EXECUTION_FILE" 2>"$JQ_ERR" || true)
                # 🔴 撈**錯誤原文**（2026-08-15 追加）。上面那四個數字是「症狀」，
                #    真正的原因（額度用盡／認證失效／模型不可用⋯）在 result 物件的
                #    `result` 欄裡，而 action 的 console 是**白名單式**印出——只印 6 個欄位，
                #    `result` 被整個砍掉。⚠️ 這一行是在賭「存檔比 console 完整」，
                #    **沒有實測過**：若印出「無 result 欄」，代表存檔同樣被砍，
                #    那時就只能靠本步驟上方開啟的 `show_full_output: true`。
                # 🔴 **三態，不是兩態**（2026-08-15 修正）。原本 `has("result")` 後直接
                #    `tostring`，把「沒有這個欄」「欄位是 null」「欄位是空字串」壓成一態：
                #    `"result": null` 會**貼出一個內容就是 `null` 的程式碼區塊**——那正是
                #    上面 10 行的 Y8 註釋（:437-441）特地擋掉的「null 垃圾」，同一份檔案原地復發。
                #    ⇒ 先取狀態，再依狀態決定訊息；ERRTEXT 只在「真的有非空文字」時才有值。
                ERRSTATE=$(jq -s -r '[.. | objects | select(.type? == "result")] | last
                  | if (type != "object") then "noobj"
                    elif (has("result") | not) then "nofield"
                    elif (.result == null) then "null"
                    elif ((.result | tostring) == "") then "empty"
                    else "text" end' "$EXECUTION_FILE" 2>/dev/null || echo noobj)
                if [ "$ERRSTATE" = "text" ]; then
                  RAW=$(jq -s -r '[.. | objects | select(.type? == "result")] | last | .result | tostring' \
                    "$EXECUTION_FILE" 2>/dev/null || true)
                  # 🔴 三道處理，缺一則這則留言會反過來害人：
                  #  ①**中和結論標記**——與下方回收品那段（:552-556）同一個理由，也是同一個做法：
                  #    本則留言由 github-actions[bot] 貼出，而它在 REVIEWERS 清單內；
                  #    錯誤原文是**外部文字**，裡面完全可能出現【驗收結論】。
                  #    🔴 這份檔案已經為姊妹路徑立了這條不變量，新路徑不照做就是把它戳個洞。
                  #  ②**打散 ``` 柵欄**——原文含程式碼區塊時會提前關閉下面那個 fence，
                  #    留言後半段變成 Markdown 渲染。改成全形反引號，肉眼看得出來但不會破版。
                  #  ③**截斷要切在字元邊界**——`head -c` 是**位元組**截斷，中文錯誤訊息
                  #    會從三位元組字中間切開，產生非法 UTF-8。`iconv -c` 丟掉殘缺序列；
                  #    沒有 iconv 的環境退回原值（GitHub runner 都有）。
                  SAFE_ERR=$(printf '%s' "$RAW" | sed 's/【驗收結論】/〔驗收結論〕/g; s/```/｀｀｀/g' | head -c 1500)
                  # 🔴 **不能寫成 `... | iconv -c || printf '%s' "$SAFE_ERR"`**（實測踩過）：
                  #    `iconv -c` 丟掉殘缺序列之後**仍然回傳 1**，於是 `||` 會觸發，
                  #    把原始（非法）內容**再接在清乾淨的內容後面** ⇒ 清完又貼回去，等於沒清，
                  #    而且內容還變成兩份。改成先收下輸出、再判斷。
                  #    （iconv 不存在時輸出為空 ⇒ 退回未清理的原值，總比沒有訊息好。）
                  CLEANED=$(printf '%s' "$SAFE_ERR" | iconv -f UTF-8 -t UTF-8 -c 2>/dev/null) || true
                  if [ -n "$CLEANED" ]; then ERRTEXT="$CLEANED"; else ERRTEXT="$SAFE_ERR"; fi
                fi
                # 有沒有真的解析到 result 物件——決定下面「撈不到原文」該歸因成哪一種。
                [ -n "$DIAG" ] && HAVE_RESULT=1
                if [ -z "$DIAG" ]; then
                  SIZE=$(wc -c < "$EXECUTION_FILE" | tr -d ' ')
                  if [ -s "$JQ_ERR" ]; then
                    DIAG_WHY="execution_file 在（${SIZE} bytes）但 **jq 解析失敗**：$(head -c 300 "$JQ_ERR" | tr '\n' ' ')"
                  else
                    DIAG_WHY="execution_file 在（${SIZE} bytes）且可解析，但裡面**沒有 type==\"result\" 的物件**——action 可能在產生總結前就中止了"
                  fi
                fi
                rm -f "$JQ_ERR"
              fi
              if [ -z "$DIAG" ]; then
                DIAG="取不到 —— $DIAG_WHY"
              fi
              # 🔴 三分支，不是兩分支。原本的 else 把**兩種完全不同的原因**收斂成
              #    同一句「result 物件裡沒有 result 欄（被白名單砍掉了）」——但只要
              #    execution_file 根本取不到（為空／不存在／解析失敗／沒有 result 物件），
              #    這句歸因就是**假的**：那時我們連 result 物件都沒有，談不上「欄位被砍」。
              #    ⚠️ 這正是 Y7 修掉的形態（四條路徑一句假歸因），差點在同一個 PR 裡復發。
              # 🔴 依 ERRSTATE 分五種，各報各的。**不要收斂**——這個步驟存在的全部理由
              #    就是 Y7「四條路徑一句假歸因」，在同一段裡復發過一次已經夠了。
              if [ -n "$ERRTEXT" ]; then
                # ⚠️ 這行說明**不得**寫出半形反引號柵欄的字面——寫了會在段落中開一個
                #    行內 code span，把後面的字吃掉。用文字描述。
                ERRBLOCK=$(printf '**錯誤原文**（取自 execution_file 的 `result` 欄；結論標記已中和成〔〕、原文裡的反引號柵欄已改全形）：\n\n```\n%s\n```' "$ERRTEXT")
              elif [ "$HAVE_RESULT" != "1" ]; then
                ERRBLOCK="**錯誤原文：無從撈起** —— 連 result 物件都沒有（原因見上一行的「本次執行結果」）。這一則**不是**「欄位被砍」，不要照那個方向查。"
              elif [ "$ERRSTATE" = "nofield" ]; then
                ERRBLOCK="**錯誤原文：取不到** —— result 物件在，但**沒有 \`result\` 這個欄位**（action 白名單式輸出把它砍掉了）。⇒ \`show_full_output\` 已因 public 條款關閉（2026-08-18）：需要原文時在分支上暫時改回 true 重跑取證，取完即 revert。"
              elif [ "$ERRSTATE" = "null" ]; then
                ERRBLOCK="**錯誤原文：欄位在但值是 \`null\`** —— 這與「欄位被砍掉」**不是同一件事**：上游有給這個欄，只是沒有填內容。⇒ 先看 log 的完整串流；若那裡也沒有，就是 SDK 沒有產生錯誤敘述。"
              else
                ERRBLOCK="**錯誤原文：欄位在但值是空字串** —— 同樣不是「欄位被砍掉」。⇒ 看 log 的完整串流。"
              fi
              BODY=$(printf '%s\n\n%s\n\n%s\n\n%s\n\n%s\n%s\n%s\n%s\n%s\n\n%s' \
                "⚠️ **Claude 驗收步驟失敗**（outcome=\`$REVIEW_OUTCOME\`），因此沒有結論可解析。" \
                "本次執行結果：\`$DIAG\`" \
                "$ERRBLOCK" \
                "**判準——請照上面的數據對號入座，不要預設是哪一種**：" \
                "- \`num_turns\` 接近 \`--max-turns\` 上限、\`total_cost_usd\` > 0、耗時數分鐘 ⇒ **回合數用盡**（大型 diff 會燒光，尤其動到 \`docs/design/chilllove-admin-v2.html\`）。重新 push 前先想辦法縮小 diff。" \
                "- \`num_turns: 1\`、\`total_cost_usd: 0\`、耗時不到一秒 ⇒ **第一個 API 請求就失敗**。🔴 **光憑這組數據分不出是哪一種**，下面兩者長得一模一樣：" \
                "    - ①**暫時性**（服務中斷、runner 網路、上游一次性拒絕）⇒ **重跑一次就會過**。" \
                "    - ②**持續性**（配額／額度／認證／模型可用性）⇒ 重跑會得到**逐字相同**的結果。" \
                "    ⇒ **先重跑一次當作分辨手段**（整個 workflow rerun；注意 \`rerun-failed-jobs\` 會回 403，因為 job 層 conclusion 是 success）。**兩次結果相同才往帳號側查。**" \
                "完整 log：\`gh run view $GITHUB_RUN_ID --log\`，或 Actions 頁面 ⚙ → **View raw logs**（瀏覽器的分步檢視器是虛擬捲動，只渲染幾百行，拿不到；raw logs 是純文字，拿得到）。🔴 **不要勾「Enable debug logging」重跑**——2026-08-15 於 PR #41 實測無效：11,704 行 raw log 裡 action 照樣印「full output hidden for security」，\`result\` 欄一樣被砍。action 那句提示的兩條路只有 \`show_full_output: true\` 是真的。🔴 **`num_turns: 1`＋零花費這一種，把 `--model` 那一行排進優先檢查項**：2026-08-15 的全滅（09:30→10:14 起連續失敗）**最可能**是它——換成 `claude-opus-5` 後立刻恢復。⚠️ 但那是**先後對照、不是受控對照**（時間與模型一起變），**尚未確認**。分辨順序：①先讀上面的「錯誤原文」②把 `--model` 換成一個已知可用的完整名再跑一次 ③才輪到帳號側（用量／方案／token）。⚠️ 本段先前寫的是「不要靠換模型來試」，**那是錯的、已刪**——換模型正是最後解決它的手段。")
              gh pr comment "$PR" --body "$BODY"
            else
              # 🔴 **「步驟成功但沒有留言」＝整份審核直接消失**（2026-08-15，PR #29 連續兩次重現：
              #    run 37／39 都是 outcome=success、耗時 3m32s／3m58s、PR 上零留言）。
              #    `outcome=success` 排除了 max-turns 耗盡（那會讓步驟 failure，見上一個分支）。
              #    最可能的形態：agent 把審核結果當成**最終文字輸出**而沒有呼叫 `gh pr comment`。
              #
              # 🔴 **原本的處置只留一句「請到 Actions 分頁查 log」——那是不夠的**：
              #    Actions 的 log 檢視器是虛擬捲動、原始 log 是 gzip，
              #    實測用瀏覽器**拿不到那段文字**（2026-08-15 試過 UI 展開、raw endpoint、
              #    未認證 API 三種路徑皆失敗）。⇒ 診斷資訊在事故當下等於不存在。
              #
              # ⇒ 改成：把 action 的執行輸出撈出來當**回收品**貼上來。
              #    這一步同時解決兩件事：①審核內容不再整份消失；②它本身就是診斷。
              FALLBACK=""
              if [ -n "${EXECUTION_FILE:-}" ] && [ -f "$EXECUTION_FILE" ]; then
                # 取最後一則 assistant 的文字內容；jq 失敗（格式不符預期）就退回原始檔尾。
                # 🔴 **`-s`（slurp）不可省**（2026-08-15，PR #30 的 Codex review 指出）。
                #    執行記錄若是 JSONL（一行一個 JSON），不加 `-s` 時 jq 會**對每一筆各跑一次**
                #    filter，`last` 取的是「每筆記錄自己的最後一段文字」，
                #    命令替換再把它們全部串起來 ⇒ 拿到的是**全部中間輸出**而不是最終那一段。
                #    接著 `head -c 55000` 會從頭截斷 ⇒ **留下開頭的雜訊、丟掉要回收的審核意見**，
                #    而且看起來還「有東西」，是最會騙人的失效形態。
                #    加 `-s` 後所有記錄先合成一個陣列，`..` 依序遞迴 ⇒ `last` 才是全域最後一段。
                #    ⚠️ 這個寫法對「單一 JSON 陣列」與「JSONL」**兩種格式都正確**——
                #      因為 `..` 會穿過 slurp 多包的那一層。格式未經實測，故取兩者皆可的寫法。
                FALLBACK=$(jq -s -r '[.. | objects | select(.type? == "text") | .text] | last // ""' \
                  "$EXECUTION_FILE" 2>/dev/null || true)
                if [ -z "$FALLBACK" ]; then FALLBACK=$(tail -c 20000 "$EXECUTION_FILE"); fi
              fi

              if [ -n "$FALLBACK" ]; then
                # 🔴 **中和結論標記**（把【】換成〔〕）。本則留言是由 github-actions[bot] 貼的，
                #    而它在 REVIEWERS 清單內 ⇒ 若原文第一行帶著標記，下一輪 synchronize
                #    會把**這則回收品**當成正式結論，而它並非 Claude 親自貼出、
                #    也沒有經過本輪的作者身分驗證。回收是為了讓人看到，不是為了驅動閉環。
                SAFE=$(printf '%s' "$FALLBACK" | sed 's/【驗收結論】/〔驗收結論〕/g' | head -c 55000)
                BODY=$(printf '%s\n\n%s\n\n%s\n\n---\n\n%s' \
                  "⚠️ **Claude 驗收步驟執行成功，但它沒有呼叫 \`gh pr comment\`**——審核內容原本會整份消失。" \
                  "以下是從 action 執行輸出回收的最終文字。**標記已中和成〔〕，因此不會被下一輪解析成正式結論**；請人工判讀。" \
                  "（若這段看起來就是完整的驗收意見，代表 agent 只是漏了最後那一步 tool call；重新 push 可再試一次。）" \
                  "$SAFE")
                gh pr comment "$PR" --body "$BODY"
              else
                gh pr comment "$PR" --body "⚠️ Claude 驗收步驟**執行成功但沒有貼出結論**，且**執行輸出也取不到**（\`execution_file\` 為空或不存在）。這是目前最難診斷的形態：請用 \`gh run view --log\` 取完整 log（瀏覽器拿不到）。重新 push 即會重跑驗收。"
              fi
            fi
            exit 0
          fi

          # ── 18.1④ 判詞格式機械驗證（P-8 引入）─────────────────────────────
          # 🔴 這一步之前，格式契約只存在兩端：prompt 規定（供）與 LATEST 的 jq 過濾（收）。
          #    jq 只保證「第一行以標記開頭」，沒人驗：①第一行是否恰為兩種合法結論形之一
          #    ②標記是否全文只出現一次（prompt 的原文契約）。亂寫的第一行會一路落到
          #    檔尾「無法判讀」留言、job 照綠——18.1④ 要堵的正是這種永真化。
          # 🔴 失敗＝exit 1（job 轉紅），不是留言後 exit 0：格式走樣代表產出端出事或
          #    注入面得手，綠燈會讓「判詞經格式機械驗證」變成寫在條文裡的擺設。
          #    （本步驟留言不得含結論標記字面值——理由見上方 MARKER 註解；下面用「標記」代稱。）
          FIRST_LINE=$(printf '%s' "$LATEST" | head -n 1)
          # 🔴 兩處都要「全量」語義（Codex #59 r1）：①regex 必須錨定行尾——不錨定的話
          #    「標記＋通過＋垃圾尾巴」照樣過（允許行尾空白/CR，其餘不放）；②出現次數用
          #    grep -o 數「每一次出現」——grep -c 數的是「有命中的行數」，同一行兩個標記
          #    仍算 1，唯一性斷言等於沒驗。
          MARKER_COUNT=$(printf '%s' "$LATEST" | grep -o -- "$MARKER" | wc -l | tr -d '[:space:]')
          FORMAT_OK=0
          # 🔴 理由不得全空白（Codex #59 r6）：`.+` 會把「需修改：　」的尾空白當理由吃掉
          #    ——空理由照樣綠、照樣計輪、可能觸發熔斷。要求冒號後至少一個非空白字元。
          if printf '%s' "$FIRST_LINE" | grep -qE "^${MARKER}(通過|需修改：[[:space:]]*[^[:space:]].*)[[:space:]]*$" && [ "$MARKER_COUNT" -eq 1 ]; then
            FORMAT_OK=1
          else
            gh pr comment "$PR" --body "🔴 判詞**格式驗證失敗**（18.1④，P-8 機制）：第一行必須恰為「標記＋通過」或「標記＋需修改：理由」兩形之一，且標記全文只准出現一次（實得 $MARKER_COUNT 次）。本輪判詞不採信、job 轉紅；請檢查產出端或人工判讀最新一則驗收意見。"
            exit 1
          fi

          # 🔴 **需修改＝只通知，不派工**（2026-08-15 使用者裁定）。
          #    舊制在這裡自動留言 `@codex 請…逐條修復…`。**已移除。**
          #    ⚠️ 本則留言**不得**包含 `@` 開頭的代理呼叫——Codex 對 @ 提及會接單，
          #      在新制下那等於繞過裁定直接改代碼。要人改就寫給人看。
          #    （本則留言同樣不得含結論標記字面值，理由見上方 MARKER 註解。）
          if printf '%s' "$LATEST" | grep -q "【驗收結論】需修改"; then
            if [ "$ROUNDS" -le "$MAX_FIX_ROUNDS" ]; then
              gh pr comment "$PR" --body "🔴 **驗收未通過**（本 PR 累計第 $ROUNDS 輪）。請依上一則驗收意見逐條處理：🔴 必須修；🟡 必須清（修復／裁定不修入 DECISIONS／證偽附證據，三擇一——2026-08-16 起 🟡 也擋通過）。修好後 **push 到本分支（\`$PR_BRANCH\`）即會自動重新驗收**，不要開新 PR。"
            else
              # 🔴 這裡不再是「派修上限」，是**結構問題的警示線**。
              #    同一個 PR 被打回超過 MAX_FIX_ROUNDS 輪，通常不是「再修一次就好」，
              #    而是 PR 太大、或規格本身沒定案 ⇒ 提示往那兩個方向處理，而不是繼續修。
              # 🔴 C-4：打 label 讓 job 層的 `if:` 在下一次 push 時直接跳過本 workflow。
              # 🔴 P-8 更正（2026-08-18 實測）：舊註釋稱「label 不存在時 --add-label 會自動
              #    建立它」——**是錯的**。`gh pr edit --add-label` 不建 label；label 不存在時
              #    整條失敗、又被 `|| true` 吞掉 ⇒ 熔斷歷輪都「宣稱已掛」而從未掛上——
              #    PR #58 連續多輪 ⛔ 留言與照常驗收並存就是實跡（label 最終由人工補建）。
              #    修法：①先冪等確保 label 存在（已存在時 create 報錯，那是唯一可吞的失敗）
              #    ②add-label 本身**不再吞錯**——掛不上就留言講明閘門沒生效，不許再靜默。
              gh label create "review:需人工裁定" --color B60205 \
                --description "鐵律17.4熔斷：掛上=自動驗收停止等人工裁定；移除後push恢復" || true
              # 🔴 掛上與否決定後面那則升級留言怎麼寫（Codex #59 r2）：舊版在 add-label
              #    失敗後仍無條件貼「已打上 label、之後 push 不會再驗收」，於是同一個 PR
              #    同時收到「閘門沒生效」與「閘門已生效」兩則互斥指引，而操作者會依賴
              #    一個實際不存在的熔斷。
              LABEL_OK=1
              gh pr edit "$PR" --add-label "review:需人工裁定" || LABEL_OK=0
              if [ "$LABEL_OK" = "0" ]; then
                gh pr comment "$PR" --body "⚠️ 熔斷 label 掛上失敗（add-label 回非零）——**閘門此刻沒有生效**，下一次 push 仍會觸發驗收。請人工到本 PR 補掛 \`review:需人工裁定\`；補掛前不要把「已熔斷」當成現況。"
              fi
              # 🔴 用 printf 多參數寫檔、再 --body-file。兩個都不能用：
              #   ①直接 `--body "多行…"` ⇒ 續行落到第 0 欄，YAML block scalar 解析失敗（實測過）；
              #   ②heredoc ⇒ YAML 去縮排後分隔符仍帶殘餘縮排，而 `<<"EOF"` 要求頂格、
              #     `<<-` 只吃 tab 不吃空白 ⇒ `bash -n` 報 "delimited by end-of-file"（也實測過）。
              #   printf 的每一段都是獨立參數，完全不受縮排影響。
              # 🔴 兩種文案二擇一（Codex #59 r2）：label 沒掛上時，自動驗收**並沒有**停止，
              #    不得沿用「就此停止／不會再觸發」那組措辭。
              if [ "$LABEL_OK" = "1" ]; then
                FUSE_LINE1="⛔ 本 PR 已累計 **$ROUNDS 輪**驗收未通過（門檻 $MAX_FIX_ROUNDS 輪），**自動驗收就此停止**。"
                FUSE_LINE2="已打上 \`review:需人工裁定\` label；在移除該 label 之前，push 到本分支**不會**再觸發驗收。"
                FUSE_TAIL="要恢復自動驗收：移除 \`review:需人工裁定\` label 後再 push。"
              else
                FUSE_LINE1="⛔ 本 PR 已累計 **$ROUNDS 輪**驗收未通過（門檻 $MAX_FIX_ROUNDS 輪）——已達熔斷線。"
                FUSE_LINE2="🔴 **但熔斷 label 掛上失敗（見上一則）⇒ 閘門沒有生效，push 仍會觸發驗收。** 請人工補掛 \`review:需人工裁定\` 才算真的停下。"
                FUSE_TAIL="補掛之後要恢復自動驗收：移除該 label 再 push。"
              fi
              printf '%s\n' \
                "$FUSE_LINE1" \
                "" \
                "$FUSE_LINE2" \
                "" \
                "到這個次數通常不是「再修一次就好」。請先判斷：" \
                "" \
                "1. **PR 範圍太大該拆**？" \
                "2. **規格本身還沒定案**？（若是，裁定要落進 spec／DECISIONS，不能只留在 PR 留言）" \
                "3. 🔴 **剩下的 🔴 是不是同一類反覆出現？** 2026-08-15 的實測：兩個 PR 九輪裡 15 條 🔴 有 12 條是文檔敘述類，而它們**不是被修出來的**——是每輪抽樣抽到不同切片。這一類請跑 \`ruby scripts/check-doc-claims.rb\` 確定性地清乾淨，不要靠再審一輪。" \
                "" \
                "$FUSE_TAIL" \
                > "$RUNNER_TEMP/escalate.md"
              gh pr comment "$PR" --body-file "$RUNNER_TEMP/escalate.md"

            fi
            exit 0
          fi

          if printf '%s' "$LATEST" | grep -q "【驗收結論】通過"; then
            gh pr review "$PR" --approve --body "Claude 驗收通過 ✅（自動核准）" \
              || gh pr comment "$PR" --body "ℹ️ 自動 approve 被擋：到 Settings → Actions → General 勾選 Allow GitHub Actions to create and approve pull requests 可啟用。不影響自動合併。"

            # ── 18.1 四條件評估器（P-8 引入；fail-closed，1=成立）──────────────
            # 🔴 每一條都是**存在型判定**（沒跑≠零意見）：取值失敗、解析不到、狀態未完成
            #    一律記 0，寧可不合併。AUTO_MERGE 關閉期它只留言存證（18.4 過渡期止於評估），
            #    開啟後它是合併前的最後一道硬閘。
            # 🔴 ① 的已知限制（誠實寫明，18.4 啟用裁定前不遮）：Codex「零未清」無法直接
            #    機械讀取（inline thread 的 resolved 狀態拿不到）——代理判準＝該 review
            #    的 `commit_id` 等於本輪 head ∧ 其名下 inline 意見數＝0。Codex「無建議輪」
            #    可能只按 👍 不發 review ⇒ 找不到該 head 的 review ⇒ C1=0 ⇒ 不合併：
            #    方向是 fail-closed，代價是可能多等一輪人工，不是誤合併。
            # 🔴 **一律用 workflow event 的 head，不用即時 `gh pr view`**（Codex #59 r2）：
            #    判詞貼出後、本步驟查詢前若發生 synchronize，即時查詢會拿到**新** head，
            #    而 LATEST／C2／C4 描述的是**舊** head ⇒ 併發取消抵達前，新 commit 可能
            #    在沒有自己的判詞的情況下被合併。event head 是本輪 checkout 的那一個。
            HEAD_SHA="${EVENT_HEAD_SHA:-}"
            if [ -z "$HEAD_SHA" ]; then
              HEAD_SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
            fi
            CODEX_LOGIN='chatgpt-codex-connector[bot]'
            # 🔴 C1 要**正向證據**（Codex #59 r1）：「內文沒有某句話」不算零建議——同一
            #    connector 有多種措辭（review suggestions／review comments），漏掉任一種就
            #    誤判零建議。改查該 review 實際掛的 inline 意見數。
            # 🔴 身分與 commit 都走**權威欄位**（Codex #59 r2）：`user.login` 精確比對
            #    （`contains` 會被任何含 codex 的 login 命中）、commit 身分用 review 物件的
            #    `commit_id` 精確比對（用內文含 9 位 SHA 會被引述舊 SHA 的散文騙過，
            #    那正是「拿舊 review 當本輪證據」的路）。
            CODEX_REVIEW=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews?per_page=100" \
              | jq -s -c --arg who "$CODEX_LOGIN" --arg head "$HEAD_SHA" \
                  'add // [] | [.[] | select(.user.login == $who) | select(.commit_id == $head)] | (.[-1] // null)')
            C1=0
            if [ "$CODEX_REVIEW" != "null" ] && [ -n "$HEAD_SHA" ]; then
              CODEX_RID=$(printf '%s' "$CODEX_REVIEW" | jq -r '.id // 0')
              if [ "$CODEX_RID" != "0" ]; then
                CODEX_INLINE=$(gh api --paginate "repos/$REPO/pulls/$PR/comments?per_page=100" \
                  | jq -s --argjson rid "$CODEX_RID" \
                      'add // [] | [.[] | select(.pull_request_review_id == $rid)] | length' \
                  || printf '%s' '-1')
                [ "$CODEX_INLINE" = "0" ] && C1=1
              fi
            fi
            C2=1  # ②bot 判詞通過＝本分支的進入條件，且上方格式驗證已過
            # ③機械 CI 全綠：讀 head 的 check-runs，排除本 review job 自身（它此刻必然
            #   in_progress）。任何非 success ⇒ 0。空集合⇒ 0（沒跑≠綠）。
            # 🔴 有界等待（Codex #59 r1）：一次性查詢會把「還在跑」永久記 0——判詞常比
            #   test job 先出。改為 pending 時每 30 秒重查、至多 20 次（約 10 分鐘），
            #   仍未落定＝維持 0（fail-closed）。⚠️ 誠實限制：本 job 結束後才完成的 check
            #   不會回頭重評——那屬 18.4 啟用時自動合併 workflow 的再評路徑
            #   （workflow_run 觸發），本步驟只負責「當下證據」，AUTO_MERGE 開啟前
            #   後果僅是評估留言偏保守。
            # 🔴 `--paginate`＋`jq -s` 聚合全部頁（Codex #59 r2）：單頁上限 100，check-run
            #    破百時後面幾頁的 pending／failed 會整批看不到，評估器就會誤報 allgreen。
            C3=0
            CHECKS_STATE="apifail"
            for _i in $(seq 1 20); do
              CHECKS_STATE=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
                | jq -s -r '[.[].check_runs[] | select(.name != "review")]
                         | if length == 0 then "empty"
                           elif any(.status != "completed") then "pending"
                           elif all(.conclusion == "success") then "allgreen"
                           else "notgreen" end' || printf 'apifail')
              [ "$CHECKS_STATE" = "pending" ] || break
              sleep 30
            done
            [ "$CHECKS_STATE" = "allgreen" ] && C3=1
            C4="$FORMAT_OK"  # ④判詞格式機械驗證（上方步驟；失敗根本走不到這裡）
            EVAL="①Codex 錨定 head 且 inline 意見數=0（正向證據）=$C1 ②bot 通過=$C2 ③機械 CI 全綠=$C3（$CHECKS_STATE）④判詞格式驗證=$C4"

            # 🔴 指示文案必須跟著條件走（Codex #59 r2）：舊版在 EVAL 有 0 時照樣說
            #    「請人工合併」，跟前一句「缺任一即不得合併」自相矛盾，而 C1 未確認／
            #    CI 未跑完正是最常見的狀態——操作者照著它按下去就是搶跑。
            if [ "$AUTO_MERGE" != "true" ]; then
              if [ "$C1$C2$C3$C4" = "1111" ]; then
                gh pr comment "$PR" --body "✅ 驗收通過。18.1 四條件評估（P-8 證據留存；AUTO_MERGE 關閉、18.4 過渡期**止於評估**）：$EVAL ⇒ **四條件齊**，可人工合併。"
              else
                gh pr comment "$PR" --body "✅ bot 側驗收通過，但 18.1 四條件**尚未齊**：$EVAL（1=成立、0=不成立或無法機械確認）⇒ **先不要合併**。待補：0 的那幾項——①＝Codex 尚未對本輪 head 出零意見 review（可在本 PR 留言 \`@codex review\` 觸發）；③＝機械 CI 未全綠或未跑完。齊了之後再人工合併。"
              fi
              exit 0
            fi

            if [ "$C1$C2$C3$C4" != "1111" ]; then
              gh pr comment "$PR" --body "⛔ 18.1 四條件未齊：$EVAL ⇒ **不自動合併**（fail-closed；沒跑≠零意見）。請人工核對後處置。"
              exit 0
            fi

            # 🔴 合併前 head 守衛（Codex #59 r2 引入、r3 改為原子）：評估與合併之間仍有
            #    時間窗，期間的 push 會讓「已驗證的 head」與「即將被合併的 head」分岔。
            #    r2 版是 `gh pr view` 查完再 merge ＝ **check-then-act**，競態窗只是變小
            #    沒有消失；r3 改用 `gh pr merge --match-head-commit`（gh 2.97.0 實測有此
            #    旗標），由 **GitHub 服務端**在合併前比對 head，不相等直接拒絕 ⇒ 原子。
            #    先做一次前置查詢只為了**產生可讀的診斷留言**，真正的保證在下面那個旗標。
            HEAD_NOW=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
            if [ "$HEAD_NOW" != "$HEAD_SHA" ]; then
              gh pr comment "$PR" --body "⛔ 合併前複驗發現 head 已變動（評估時 \`$HEAD_SHA\`、現在 \`$HEAD_NOW\`）⇒ **放棄本輪自動合併**。新 head 會由它自己的驗收輪處理。"
              exit 0
            fi

            if ! gh pr merge "$PR" --squash --delete-branch --match-head-commit "$HEAD_SHA"; then
              gh pr comment "$PR" --body "⚠️ 驗收通過但自動合併失敗（可能與 main 衝突或被保護規則擋下），請手動合併。"
              exit 0
            fi

            STAGE=$(printf '%s' "$PR_TITLE" | grep -oE '^M[0-9]+' || true)
            if [ -z "$STAGE" ]; then
              STAGE=$(printf '%s' "$PR_BRANCH" | grep -oE '^m[0-9]+' | tr 'a-z' 'A-Z' || true)
            fi

            if [ -n "$STAGE" ]; then
              DONE=$(gh issue list --state open --json number,title --jq "[.[] | select(.title | startswith(\"$STAGE:\"))] | (.[0].number // \"\")")
              if [ -n "$DONE" ]; then
                gh issue close "$DONE" --comment "✅ $STAGE 已通過 Claude 驗收並合併（PR #$PR）。"
              fi
            fi

            NEXT_NUM=$(gh issue list --state open --json number,title --jq '[.[] | select(.title | test("^M[0-9]+:"))] | sort_by(.title) | (.[0].number // "")')
            NEXT_TITLE=$(gh issue list --state open --json number,title --jq '[.[] | select(.title | test("^M[0-9]+:"))] | sort_by(.title) | (.[0].title // "")')

            if [ -n "$NEXT_NUM" ]; then
              NEXT_STAGE=$(printf '%s' "$NEXT_TITLE" | grep -oE '^M[0-9]+')
              NEXT_BRANCH=$(printf '%s' "$NEXT_STAGE" | tr 'A-Z' 'a-z')
              # 🔴 **只登記，不派工**（2026-08-15 使用者裁定）。
              #    舊制在這裡 `@codex 請開始 $NEXT_TITLE`。**已移除**——理由同需修改分支：
              #    開一個新里程碑是裁定，不是可以自動觸發的事。
              #    留言仍然貼在該 issue 上，因為「上一階段何時合併」是這個 issue 需要的事實。
              gh issue comment "$NEXT_NUM" --body "ℹ️ 上一階段已通過驗收並合併（PR #$PR）。本階段（$NEXT_TITLE）的範圍見本 issue 描述與 \`HANDOFF.md\` §5；規約見 \`AGENTS.md\`（分支 \`$NEXT_BRANCH/{功能}\`、不直接推 main、PR 標題以「$NEXT_STAGE:」開頭、描述附規格對照＋自測結果＋假設清單）。**本則為登記，不是派工。**"
              gh pr comment "$PR" --body "📌 已在下一階段 issue #$NEXT_NUM（$NEXT_TITLE）登記本次合併。**未派工**——開始下一階段是人的裁定。"
            else
              gh pr comment "$PR" --body "🏁 沒有待辦的里程碑 issue——所有階段已完成，或下一階段 issue 尚未建立。"
            fi
            exit 0
          fi

          # 🔴 P-8 後這一行**結構上不可達**：上方 18.1④ 格式驗證已保證第一行恰為兩種合法
          #    結論形之一，兩個分支必中其一。保留當縱深防線；真走到＝上面的邏輯被改壞了
          #    ⇒ exit 1（job 紅），不再是綠燈留言——那正是格式驗證要消滅的形態。
          gh pr comment "$PR" --body "⚠️ 驗收意見含結論標記但無法判讀（既非通過也非需修改）——18.1④ 格式驗證後本分支不應可達，代表判讀邏輯被改壞。job 轉紅，請人工判讀最新一則驗收意見並檢查本檔。"
          exit 1
