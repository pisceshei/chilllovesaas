name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # 🔴 判準與實作都在 `scripts/check-exec-bits.sh`（2026-08-15 由 inline shell 抽出）。
      # 抽出的三個理由，全部是實測後果：
      #   ①**`bin/ci` 跑得到**——inline shell 進不了 `config/ci.rb`，
      #     `scripts/check-ci-parity.rb` 也看不到它（那是它誠實聲明裡登記的已知缺口）。
      #   ②**可以寫回歸測試**（65 §K.7）——抽出前它是全 ci.yml 唯一「判準才剛被大改、
      #     卻沒有反向自測」的檢查；抽出後有 `scripts/test-exec-bits-rules.sh` 整組回歸測試守著（條數不寫死，實跑為準）。
      #   ③**兩個 job 不會分岔**——原本 test 與 quality 各有一份 inline 複製。
      # 抽出時一併修掉兩個實測漏洞：非 ASCII 檔名被 core.quotePath 跳脫後靜默漏掉、
      # 以及「掃到 0 個檔卻印 OK」。細節見該腳本檔頭。
      - name: Verify bin/ and scripts/ are executable
        run: bash scripts/check-exec-bits.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.17.1
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 跑 migration（不是 db:prepare 載 schema.rb）：migration 才是 DDL 的
      # source of truth，這一步同時驗證 migration 本身可執行。
      - name: Run migrations
        run: bin/rails db:create db:migrate

      # migration 跑完 Rails 會重新 dump schema.rb——若與版控內的手寫版有任何
      # 漂移，這裡直接紅燈（2026-08-13 移植輪新增：schema.rb 是在無本機 MySQL
      # 環境下手工同步的，本步驟就是它的機械驗證）。
      - name: Verify schema.rb has no drift
        run: git diff --exit-code db/schema.rb

      - name: Run Rails specs
        env:
          M0_SCREENSHOT_PATH: ${{ github.workspace }}/tmp/m0-admin-shell.png
        run: bundle exec rspec

      - name: Upload M0 acceptance screenshot
        uses: actions/upload-artifact@v7
        with:
          name: m0-admin-shell
          path: tmp/m0-admin-shell.png
          if-no-files-found: error

      - name: Run frontend tests
        run: pnpm test

      - name: Type-check frontend
        run: pnpm typecheck

      - name: Build frontend
        env:
          CHILLLOVE_BASE_HOST: ci.example.test
          RAILS_ENV: production
        run: pnpm build

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # 🔴 判準與實作都在 `scripts/check-exec-bits.sh`（2026-08-15 由 inline shell 抽出）。
      #    理由註釋只保留一份在 test job 的同名步驟上方（本 PR 主旨就是把兩份 inline
      #    複製收成一份，理由不再第二次複製——腳本檔頭是規範版）。
      - name: Verify bin/ and scripts/ are executable
        run: bash scripts/check-exec-bits.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.17.1
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Ruby
        run: bin/rubocop -f github

      - name: Scan Rails security
        run: bin/brakeman --no-pager --exit-on-warn --exit-on-error

      - name: Audit Ruby dependencies
        run: bin/bundler-audit

      - name: Audit frontend dependencies
        run: pnpm audit --audit-level high

      # 原型（三份高保真 HTML，admin 一份就 12,000+ 行）是本專案最大的產出物之一，
      # 但先前只在本機跑 lint、CI 不擋。scripts/lint-prototype.py 把 49/51/53 號人工稽核
      # 確立的不變量固化成可重跑檢查，每條規則都註明對應事故——例如「同檔頂層函式不得重名」，
      # 那次事故是整頁功能靜默消失。退出碼 1=有 ERROR；WARN 不擋（目前基準線 WARN 13）。
      - name: Lint prototypes
        run: python3 scripts/lint-prototype.py

      # r_dead_control 的 fixture 回歸測試。為什麼要單獨一步：那條規則在四輪內踩了
      # 四種不同的「漏看」形態（註釋盲區／泛型 token 免死／選擇器來源沒剝註釋／跨行標籤），
      # 每一種 CI 都是綠的。手動驗證抓不住這種東西——改一次正則就可能讓上一次的修正
      # 靜默失效，而失效的方向是「少報」，不會有任何跡象。
      - name: Regression-test lint rules
        run: python3 scripts/test-lint-rules.py

      # 🔴 文檔引用保真——把「指出處之前先打開來看一眼」從紀律變成機制。
      #   立這一步的直接理由：2026-08-15 的 PR #39／#40 連續九輪驗收，
      #   15 條 🔴 裡 12 條是文檔敘述與事實不符，**沒有一條是代碼缺陷**。
      #   更關鍵的是「修的動作本身」就是新缺陷的主要產地——九輪之後用機械檢查
      #   掃同一批檔案，30 分鐘內又找到三條，全部出自修正 commit。
      #   ⇒ 這是紀律型條款的固有失效率，與 config/ci.rb 那條「兩邊要同步」
      #     在寫下的隔天就被違反是同一形態。本專案對這種東西的處置是讓機器擋。
      #   ⚠️ 需要 base 才能算 R4／R5 的範圍（見下一步的 fetch）。
      - name: Fetch base for doc-claim scope
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.base_ref || 'main' }}:refs/remotes/origin/${{ github.base_ref || 'main' }}" || true

      - name: Check doc claims
        run: ruby scripts/check-doc-claims.rb --base "origin/${{ github.base_ref || 'main' }}"

      # 上一步自己的反向證明（65 §K.7）。它守的是「防止文檔說謊」，
      # 壞掉的話所有人會以為引用已經被守著——這種失效沒有任何外部跡象。
      - name: Regression-test doc claim rules
        run: ruby scripts/test-doc-claims-rules.rb

      # 🔴 死控件基準線只准因為「量表變準」而調高，不准因為「新增了死控件」而調高。
      # 這件事原本只寫在 DEAD_CONTROL_BASELINE 的註釋裡，靠 review 肉眼看 diff 方向——
      # 而 89 §7 這一節的標題就叫「把死控件從紀律變成機制」，它自己卻停在紀律層。
      # 判準保守：調高 ＋ 掃描邏輯一行沒改 ⇒ fail；調降永遠放行。
      # 🔴 actions/checkout 預設 fetch-depth: 1（淺 clone）⇒ `origin/main` 這個 ref
      # 根本不存在，直接跑會每次都走「取不到基準 ⇒ 略過」，機制形同沒掛。必須先抓 base。
      - name: Guard dead-control baseline
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --depth=1 origin "$BASE" || true
          python3 scripts/check-baseline-raise.py FETCH_HEAD

      # 🔴 把裁定 D8／§A G24 的配套條款從「紀律」變成「機制」（docs/specs/85 §4）。
      # 身分表升組織層後資料庫不再擋跨店引用，所以必須有東西守住兩件事：
      #   ①白名單以外的表一律帶 shop_id（防新表漏掉、防偷偷擴充豁免）
      #   ②身分表的 model 不得再宣告 acts_as_tenant
      # 白名單是逐表列舉的常數，改它會出現在 diff 裡。
      - name: Check tenant isolation
        run: ruby scripts/check-tenant-isolation.rb

      # 🔴 把 docs/specs/86 的命名契約從「紀律」變成「機制」。
      # returns（實體退貨）與 sales_reversals（撤銷款項聚合）是兩個概念，
      # 官方 2026-03-05 特地拆開；合併會導致總銷售額對不上或退貨資料無處可放。
      - name: Check reversal naming
        run: ruby scripts/check-reversal-naming.rb

      # 🔴 鐵律 3 的 L4（機器的編譯期）。L1–L3 的型別層只約束**已經用了值物件的路徑**；
      # 本檢查約束的是「還沒寫出來的路徑」——三個月後有人在 app/services/psp/<某家>/
      # 新寫一行、不經 adapter 直接組 HTTP body 時，擋得住他的只有這個腳本
      # （他不會先去讀 app/models/money.rb 的註釋）。
      # 而這個 bug 在 HKD／USD 下測試全綠：exponent=2 時 divisor 是 1，
      # 錯誤實作與正確實作的輸出完全相同。
      - name: Check money unit boundary
        run: ruby scripts/check-money-boundary.rb

      # 🔴 為什麼要單獨一步：65 §K 第 7 條逐字「**檢查本身也要被測試**——
      # 一條永遠不會紅的 CI 規則等於沒有」。
      # （2026-08-15 更正：原文寫成逐字「只有前者綠不算交付」，該句不在 65 號裡。）
      # 一個什麼都不檢查的腳本在乾淨倉庫上也是綠的。本步證明**每一條規則
      # 各自被一個故意違反的 fixture 打紅**，外加一條反向斷言（乾淨倉庫必須 exit 0），
      # 免得一個「永遠 fail」的檢查器讓九條全過。
      # 形態比照 scripts/test-lint-rules.py —— 那個形態是被上一輪打出來的
      # （r_dead_control 在四輪內踩了六種漏看，每一種 CI 都是綠的）。
      - name: Regression-test money boundary rules
        run: ruby scripts/test-money-rules.rb

      # 執行位元閘門的 fixture 回歸測試（65 §K.7）。每條 case 都在 $TMPDIR 現場建小 git repo（條數不寫死，實跑為準）——
      # 這個檢查讀的是 git index 的 mode 不是檔案系統權限，所以 fixture 必須是真的 repo，
      # 而巢狀 .git 沒辦法提交進本倉庫。最後三條（only_bin／only_scripts／empty）
      # 全部是實測抓到的漏洞，不是想像出來的。
      - name: Regression-test exec-bit rules
        run: bash scripts/test-exec-bits-rules.sh

      # 🔴 YAML 1.1 的裸字 on/off/yes/no/true/false（含大小寫變體）會被 Psych 解析成布林——對「值」是常識，
      # 但沒人預期它同樣適用於「鍵」。limits.yml 的 gift_card_entry_points 就中了這個陷阱
      # （六個 `on` 鍵實際是 true），而 deep_symbolize_keys 對非字串鍵原樣保留 ⇒
      # `Limits.fetch` 只看到 KeyError，看不出根因，最可能的誤修是改用 true 當鍵、把 bug 固化。
      # 這一類只在「鍵名剛好是那幾個字」時出現，review 肉眼看不出來，必須由機制擋。
      - name: Check limits.yml key types
        run: ruby scripts/check-limits-keys.rb

      # 🔴 同 65 §K.7 的理由（見上面 money 那一組）：檢查器自己要有反向證明。
      # 本步用故意違反的 fixture 證明「非 String 鍵會被打紅」與「ERB 會被擋」，
      # 並反向斷言乾淨 fixture 必須 exit 0——否則一個永遠 fail 或永遠 pass 的
      # 檢查器在 CI 上看起來與正常的一模一樣。
      - name: Regression-test limits key rules
        run: ruby scripts/test-limits-key-rules.rb

      # 🔴 把 config/ci.rb 那條「兩邊要同步」的條款從紀律變成機制。
      # 那條條款寫下的隔天就被違反了：PR #33 往本 job 加了兩步、config/ci.rb 一行未動，
      # 於是本機 `bin/ci` 全綠但 CI 會紅——而擋下來的理由本機沒有機會發現。
      # 本步驟斷言「ci.yml 用到的每一支 scripts/* 都出現在 config/ci.rb」。
      # ✅ 「多行 inline shell 的腳本邏輯看不到」那個已知缺口，自 PR #41 起**已關**：
      #    執行位元閘門抽成 scripts/check-exec-bits.sh 之後自動落入規則 1。
      #    ⚠️ 精確地說（2026-08-16 收窄——初稿的全稱句「本 workflow 沒有多行
      #    inline shell 檢查步驟」被同檔的「Guard dead-control baseline」步驟直接證偽；
#    行號易漂移，指位置只寫步驟名）：
      #    仍存在的多行 run 是「fetch base ＋ 呼叫 scripts/*」的**環境準備**形態，
      #    檢查**邏輯**都在被呼叫的 scripts/* 裡、由規則 1 對等；
      #    不得再新增「檢查邏輯寫在 run 區塊裡」的步驟。
      - name: Check CI parity
        run: ruby scripts/check-ci-parity.rb

      # 上一步自己的反向證明。它送審時是同批新增檢查器中唯一沒有回歸測試的一支，
      # 直接原因是 ROOT 曾被寫死 ⇒ 餵不進故意違反的 fixture。改成吃 ARGV[0] 之後補上。
      # 🔴 它在被寫出來的當天就抓到兩個活的 bug（`npm` 子字串命中 `pnpm`、
      #    腳本名寫在 step「名稱」裡就算有跑），兩者當時都讓對等性檢查 exit 0。
      - name: Check CI parity rules regression
        run: ruby scripts/test-ci-parity-rules.rb
