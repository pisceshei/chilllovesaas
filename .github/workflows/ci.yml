name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify bin/ scripts are executable
        run: |
          # 🔴 Windows 的 git 預設 core.filemode=false，bin/* 會以 100644 提交，
          #    到 Linux runner 上執行就是 exit 126（Permission denied）——訊息很難懂。
          #    這一步讓它早失敗且說人話。修法：git update-index --chmod=+x <檔>
          bad=$(git ls-files -s bin/ scripts/*.sh | awk '$1 != "100755" { print $4 }')
          if [ -n "$bad" ]; then
            echo "::error::以下檔案缺少執行位元（git mode 應為 100755）："
            echo "$bad"
            echo "修法：git update-index --chmod=+x <上列檔案>"
            exit 1
          fi
          echo "OK：bin/ 與 scripts/*.sh 全部可執行"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.17.1
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 跑 migration（不是 db:prepare 載 schema.rb）：migration 才是 DDL 的
      # source of truth，這一步同時驗證 migration 本身可執行。
      - name: Run migrations
        run: bin/rails db:create db:migrate

      # migration 跑完 Rails 會重新 dump schema.rb——若與版控內的手寫版有任何
      # 漂移，這裡直接紅燈（2026-08-13 移植輪新增：schema.rb 是在無本機 MySQL
      # 環境下手工同步的，本步驟就是它的機械驗證）。
      - name: Verify schema.rb has no drift
        run: git diff --exit-code db/schema.rb

      - name: Run Rails specs
        env:
          M0_SCREENSHOT_PATH: ${{ github.workspace }}/tmp/m0-admin-shell.png
        run: bundle exec rspec

      - name: Upload M0 acceptance screenshot
        uses: actions/upload-artifact@v7
        with:
          name: m0-admin-shell
          path: tmp/m0-admin-shell.png
          if-no-files-found: error

      - name: Run frontend tests
        run: pnpm test

      - name: Type-check frontend
        run: pnpm typecheck

      - name: Build frontend
        env:
          CHILLLOVE_BASE_HOST: ci.example.test
          RAILS_ENV: production
        run: pnpm build

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify bin/ scripts are executable
        run: |
          # 🔴 Windows 的 git 預設 core.filemode=false，bin/* 會以 100644 提交，
          #    到 Linux runner 上執行就是 exit 126（Permission denied）——訊息很難懂。
          #    這一步讓它早失敗且說人話。修法：git update-index --chmod=+x <檔>
          bad=$(git ls-files -s bin/ scripts/*.sh | awk '$1 != "100755" { print $4 }')
          if [ -n "$bad" ]; then
            echo "::error::以下檔案缺少執行位元（git mode 應為 100755）："
            echo "$bad"
            echo "修法：git update-index --chmod=+x <上列檔案>"
            exit 1
          fi
          echo "OK：bin/ 與 scripts/*.sh 全部可執行"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.17.1
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Ruby
        run: bin/rubocop -f github

      - name: Scan Rails security
        run: bin/brakeman --no-pager --exit-on-warn --exit-on-error

      - name: Audit Ruby dependencies
        run: bin/bundler-audit

      - name: Audit frontend dependencies
        run: pnpm audit --audit-level high

      # 原型（三份高保真 HTML，admin 一份就 12,000+ 行）是本專案最大的產出物之一，
      # 但先前只在本機跑 lint、CI 不擋。scripts/lint-prototype.py 把 49/51/53 號人工稽核
      # 確立的不變量固化成可重跑檢查，每條規則都註明對應事故——例如「同檔頂層函式不得重名」，
      # 那次事故是整頁功能靜默消失。退出碼 1=有 ERROR；WARN 不擋（目前基準線 WARN 13）。
      - name: Lint prototypes
        run: python3 scripts/lint-prototype.py

      # r_dead_control 的 fixture 回歸測試。為什麼要單獨一步：那條規則在四輪內踩了
      # 四種不同的「漏看」形態（註釋盲區／泛型 token 免死／選擇器來源沒剝註釋／跨行標籤），
      # 每一種 CI 都是綠的。手動驗證抓不住這種東西——改一次正則就可能讓上一次的修正
      # 靜默失效，而失效的方向是「少報」，不會有任何跡象。
      - name: Regression-test lint rules
        run: python3 scripts/test-lint-rules.py

      # 🔴 死控件基準線只准因為「量表變準」而調高，不准因為「新增了死控件」而調高。
      # 這件事原本只寫在 DEAD_CONTROL_BASELINE 的註釋裡，靠 review 肉眼看 diff 方向——
      # 而 89 §7 這一節的標題就叫「把死控件從紀律變成機制」，它自己卻停在紀律層。
      # 判準保守：調高 ＋ 掃描邏輯一行沒改 ⇒ fail；調降永遠放行。
      # 🔴 actions/checkout 預設 fetch-depth: 1（淺 clone）⇒ `origin/main` 這個 ref
      # 根本不存在，直接跑會每次都走「取不到基準 ⇒ 略過」，機制形同沒掛。必須先抓 base。
      - name: Guard dead-control baseline
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --depth=1 origin "$BASE" || true
          python3 scripts/check-baseline-raise.py FETCH_HEAD

      # 🔴 把裁定 D8／§A G24 的配套條款從「紀律」變成「機制」（docs/specs/85 §4）。
      # 身分表升組織層後資料庫不再擋跨店引用，所以必須有東西守住兩件事：
      #   ①白名單以外的表一律帶 shop_id（防新表漏掉、防偷偷擴充豁免）
      #   ②身分表的 model 不得再宣告 acts_as_tenant
      # 白名單是逐表列舉的常數，改它會出現在 diff 裡。
      - name: Check tenant isolation
        run: ruby scripts/check-tenant-isolation.rb

      # 🔴 把 docs/specs/86 的命名契約從「紀律」變成「機制」。
      # returns（實體退貨）與 sales_reversals（撤銷款項聚合）是兩個概念，
      # 官方 2026-03-05 特地拆開；合併會導致總銷售額對不上或退貨資料無處可放。
      - name: Check reversal naming
        run: ruby scripts/check-reversal-naming.rb

      # 🔴 鐵律 3 的 L4（機器的編譯期）。L1–L3 的型別層只約束**已經用了值物件的路徑**；
      # 本檢查約束的是「還沒寫出來的路徑」——三個月後有人在 app/services/psp/<某家>/
      # 新寫一行、不經 adapter 直接組 HTTP body 時，擋得住他的只有這個腳本
      # （他不會先去讀 app/models/money.rb 的註釋）。
      # 而這個 bug 在 HKD／USD 下測試全綠：exponent=2 時 divisor 是 1，
      # 錯誤實作與正確實作的輸出完全相同。
      - name: Check money unit boundary
        run: ruby scripts/check-money-boundary.rb

      # 🔴 為什麼要單獨一步：65 §K 第 7 條逐字「只有前者綠不算交付」——
      # 一個什麼都不檢查的腳本在乾淨倉庫上也是綠的。本步證明**每一條規則
      # 各自被一個故意違反的 fixture 打紅**，外加一條反向斷言（乾淨倉庫必須 exit 0），
      # 免得一個「永遠 fail」的檢查器讓九條全過。
      # 形態比照 scripts/test-lint-rules.py —— 那個形態是被上一輪打出來的
      # （r_dead_control 在四輪內踩了六種漏看，每一種 CI 都是綠的）。
      - name: Regression-test money boundary rules
        run: ruby scripts/test-money-rules.rb

      # 🔴 YAML 1.1 的裸字 on/off/yes/no/true/false（含大小寫變體）會被 Psych 解析成布林——對「值」是常識，
      # 但沒人預期它同樣適用於「鍵」。limits.yml 的 gift_card_entry_points 就中了這個陷阱
      # （六個 `on` 鍵實際是 true），而 deep_symbolize_keys 對非字串鍵原樣保留 ⇒
      # `Limits.fetch` 只看到 KeyError，看不出根因，最可能的誤修是改用 true 當鍵、把 bug 固化。
      # 這一類只在「鍵名剛好是那幾個字」時出現，review 肉眼看不出來，必須由機制擋。
      - name: Check limits.yml key types
        run: ruby scripts/check-limits-keys.rb
