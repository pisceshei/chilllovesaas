# Omakase Ruby styling for Rails
require:
  - ./lib/rubocop/cop/chilllove/inventory_direct_write.rb

inherit_gem: { rubocop-rails-omakase: rubocop.yml }

inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
    # Rails 與 Solid gems 會重建這些 schema snapshots；lint migration source，
    # 避免不同 adapter/dumper 版本造成無業務意義的格式漂移。
    - "db/schema.rb"
    - "db/*_schema.rb"
    # Phase 1 的 Liquid 相容性 PoC 不會載入 M0 runtime；其格式債由 M2
    # 正式移植時處理，避免 M0 CI 擅自改寫既有研究樣本。
    - "poc/**/*"

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

# 庫存唯一寫入入口（13 §F5；D43 無豁免口）。spec/ 不掃＝fixture 直建資料是測試需要，
# cop 守的是生產代碼；唯一的 Exclude 是入口自己。
Chilllove/InventoryDirectWrite:
  Enabled: true
  Include:
    - "app/**/*.rb"
    - "lib/**/*.rb"
  Exclude:
    - "app/services/inventory/adjust.rb"
