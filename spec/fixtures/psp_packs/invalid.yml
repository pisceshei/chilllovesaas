# 故意不合法的 pack —— 每一個都必須讓 `Psp::Pack` 在**建構期**就 raise。
#
# 🔴 這些不是「壞資料」，是**斷言的載體**。65 §K 第 7 條的判準是
# 「檢查綠不算交付，要證明每個違反 fixture 各自被擋下」。

# T19：未宣告 amount_format ⇒ 🔴 **不得預設 minor_units**。
# 預設 minor_units 會對 Airwallex 型 PSP 送出「主單位被當 minor unit 解讀」的金額，
# 而**該錯誤在所有幣別上都成立**（不像 exponent 的錯只在 zero-decimal 幣別現形）。
no_format:
  minor_unit_source: iso4217
  minor_unit_overrides: {}
  divisibility: {}
  divisibility_scope: []
  storage_precision_shortfall: reject
  enable_gate: []

# A6：decimal_places > 2 ⇒ 不得 enable。
# 我方儲存尺度 ×100 只能無損表達 2 位；宣告 3 位卻只給得出 2 位
# ＝**靜默的精度謊報**（我方送 "2.90"，PSP 以為那是 "2.900"）。
too_many_places:
  amount_format: decimal_string
  decimal_places: 3
  decimal_places_overrides: {}  # 補齊必填鍵，讓本 fixture 只測自己的斷言
  divisibility: {}
  divisibility_scope: []
  storage_precision_shortfall: reject
  enable_gate: []

# A6b：decimal_places < 2 ⇒ 不得 enable（2026-08-15 新增，PR #29 驗收指出的缺口）。
#
# 🔴 **這兩個 fixture 在本次修正之前是「合法」的**——A6 只擋上限。
# 而 `to_psp_decimal` 會 `fixed_string(major, decimal_places)`，
# 內部 `value.round(digits)` **靜默四捨五入**：
#   one_place ＋ HKD 14.85（儲存 1485）⇒ 送出 "14.9"
#   ＝帳上 14.85、送款 14.90，差額 0.05 沒有任何一張表記得住（65 §D.2 A5：不得自動湊整）。
# ⚠️ 這條路徑**在 HKD 這個基準法域上就會發生**，不像 exponent 的錯只在 zero-decimal
# 幣別現形 ⇒ 現有 §H 矩陣（全部宣告 2 位）證明不了它。
too_few_places:
  amount_format: decimal_string
  decimal_places: 1
  decimal_places_overrides: {}  # 補齊必填鍵，讓本 fixture 只測自己的斷言
  divisibility: {}
  divisibility_scope: []
  storage_precision_shortfall: reject
  enable_gate: []

# 🔴 `0` 要**單獨**有一個 fixture，不能只測 `1`：
# 它額外觸發 `fixed_string` 的格式 bug（`"1480.0"`——一位小數，連宣告的 0 位都不符）。
# 兩者根因不同（一個是湊整、一個是格式），只測其中一個會讓另一個留著。
zero_places:
  amount_format: decimal_string
  decimal_places: 0
  decimal_places_overrides: {}  # 補齊必填鍵，讓本 fixture 只測自己的斷言
  divisibility: {}
  divisibility_scope: []
  storage_precision_shortfall: reject
  enable_gate: []

# 🔴 空表 ≠ 缺鍵：`divisibility` 整個鍵不見了＝「沒人查過」⇒ 不得 enable。
# （若寫成 `divisibility: {}` 則是「已查證、無此約束」，合法。）
missing_divisibility:
  amount_format: minor_units
  minor_unit_source: iso4217
  minor_unit_overrides: {}
  divisibility_scope: []
  storage_precision_shortfall: reject
  enable_gate: []

# 缺 divisibility_scope ⇒ V-206 未結案，不得 enable（65 §D.3）。
missing_scope:
  amount_format: minor_units
  minor_unit_source: iso4217
  minor_unit_overrides: {}
  divisibility: {}
  storage_precision_shortfall: reject
  enable_gate: []

# enable_gate 非空卻 enabled: true ⇒ 把「V 編號還沒結案」從備忘變成機械限制。
gated_but_enabled:
  amount_format: minor_units
  minor_unit_source: iso4217
  minor_unit_overrides: {}
  divisibility: {}
  divisibility_scope: []
  storage_precision_shortfall: reject
  enable_gate: [V-999]
  enabled: true

# 🔴 空表 ≠ 缺鍵（A7 的鍵面）：`decimal_places_overrides` 整個鍵不見了＝「沒人查過」
# ⇒ 不得 enable。與 missing_divisibility 同一條紀律——PayPal/Airwallex 兩家實證
# 都覆蓋自己引用的底表（HUF 在 ISO 是 2 位、PayPal/Airwallex 皆記 0），
# 「沒查過覆蓋表」的 decimal pack 會對這些幣別送出帶小數的金額。
missing_places_overrides:
  amount_format: decimal_string
  decimal_places: 2
  divisibility: {}
  divisibility_scope: []
  storage_precision_shortfall: reject
  enable_gate: []

# A7 值域：覆蓋 > 2 必須在**載入**就擋（不能等轉換）——places=3 時
# `storage_scale / 10**places` 整數除法得 0，A6c 的 `% 0` 會 ZeroDivisionError，
# 錯誤變得不可讀且晚爆。與 A2「儲存尺度表達不了」同一個理由。
override_too_many_places:
  amount_format: decimal_number
  decimal_places: 2
  decimal_places_overrides:
    BHD: 3
  divisibility: {}
  divisibility_scope: []
  storage_precision_shortfall: reject
  enable_gate: []
