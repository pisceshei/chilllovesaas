# 故意違反：用一個**不存在的錨點**當 mapping 的鍵（`*nope`）。
#
# 守的是「checker 自己炸掉時，退出碼不得說謊」——期望 exit 2（檢查跑不了）。
#
# 🔴 這一份是第 5 輪照著「列舉例外類別列不完」這個懷疑找出來的**活缺口**：
#    ①`Psych.parse_file` 對這份檔案**解析成功**（AST 建得起來，別名是合法語法）；
#    ②炸點在 `key_node.to_ruby`，也就是 `walk` 裡面、第 4 輪那個 rescue 的**外面**；
#    ③例外類別也不是 `Psych::SyntaxError`。
#    ⇒ 三件事全部繞過第 4 輪的修法，結果是**裸 exit 1 ＋ 一整片 backtrace**，
#      而 1 的定義是「檢查跑了，發現違規」——退出碼在說謊。
#
# 教訓：逐一列舉例外類別列不完。判準要改成語義的——
# **只要 checker 自己炸了，它就沒有「發現違規」，它是沒檢查完** ⇒ 一律 2。
*nope: 1
