# 反向斷言用：這一份**必須通過**（exit 0）。
# 沒有這條，一個「永遠 fail」的檢查器會讓上面兩條 fixture 全部「通過」，
# 而 CI 看起來與正常無異（65 §K.7 的判準：只有前者綠不算交付）。
#
# 🔴 `y` / `n` 刻意放在這裡：YAML 1.1 **規格**的 bool 全集含它們，
#    但 Psych 5.2.2 實測**不轉**（Ruby 3.4.10，2026-08-15 取證）⇒ 它們是合法的 String 鍵。
#    這條 fixture 同時守住「不得反過來加一條禁止裸字 y/n 的字面規則」——
#    真有人加了，這裡會紅。
jurisdictions:
  hk:
    accounting:
      gift_card_entry_points:
        M27: { "on": gift_card_issued_by_admin, direction: liability_increase }
flags:
  y: 1
  n: 2
  "Off": 3
