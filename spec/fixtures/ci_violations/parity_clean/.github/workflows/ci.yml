name: CI
on: [push]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Self guard
        run: ruby scripts/check-ci-parity.rb
      - name: Self guard regression
        run: ruby scripts/test-ci-parity-rules.rb
      - name: Style
        run: bin/rubocop -f github
      - name: Frontend audit
        run: pnpm audit --audit-level high
      - name: Install deps
        run: pnpm install --frozen-lockfile
