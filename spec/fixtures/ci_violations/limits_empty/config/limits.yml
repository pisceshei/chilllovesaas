# 故意違反：這份 limits.yml **只有註釋，0 個 mapping 鍵**。
#
# 守的是「0 鍵 canary」——期望 exit 3（檢查沒有生效），訊息含「0 個 mapping 鍵」。
#
# 🔴 為什麼非有不可（PR #40 第 6 輪驗收指出，實測復現）：
#    canary 原本只數「檔案」不數「鍵」⇒ limits.yml 被清空成只剩註釋時，
#    掃描檔數 1、violations 空，checker 印「OK：通過」並 exit 0——
#    而 limits.yml 是鐵律 6 的唯一上限值來源，它不可能合法地沒有任何鍵。
#    「沒有違規」與「沒有東西可查」長得一模一樣，這是同一形態第三次出現
#    （TARGETS 空 → 檔案層；本條 → 內容層）。
#    ⚠️ 與 TARGETS canary 不同：這一條 fixture 蓋得到（不需要改腳本常數）。
