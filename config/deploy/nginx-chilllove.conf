# CD-1（2026-08-23）：CHILL LOVE 的 nginx 反代配置。
# 部署位置＝bt3 /etc/nginx/sites-available/chilllove（deploy.sh 同步並 reload）。
#
# 🔴 **TLS 在前置機終結，不在這裡**（第 31 包，2026-08-25）：
#   瀏覽器 --https--> 192.168.31.187（萬用憑證 *.chilling.com.hk）
#                --http--> bt3:80（本檔）--> puma:3000
#   前置機的 vhost＝`.187:/www/server/panel/vhost/nginx/demo.chilling.com.hk.conf`
#   （不在本倉庫——它是那台機器的設定，那台還跑著另外八個站）。
#   本檔因此**仍然只聽 80**，且沒有憑證——bt3 不做 TLS 是刻意的，不是待辦。
upstream chilllove_puma {
  server 127.0.0.1:3000;
}

# 🔴 前置機送來的 X-Forwarded-Proto 必須**透傳**，不能用 bt3 自己的 $scheme。
#   .187→bt3 這一段是明文 ⇒ bt3 的 $scheme 恆為 `http`。若照抄 $scheme，
#   Rails 會以為使用者走的是 http，force_ssl 於是 301 到 https，前置機再以
#   http 轉進來 ⇒ **無限轉址迴圈**（開 force_ssl 的當下就會發生）。
#   缺少該標頭時（例如 LAN 直連 bt3）才回落 $scheme。
map $http_x_forwarded_proto $chilllove_fwd_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80 default_server;
  server_name _;

  root /www/wwwroot/chilllove/app/public;
  # 🔴 這裡是整條鏈**最小**的上限，因此是實際生效值（前置機是 512m）。
  #    商品圖上傳受此限制。
  client_max_body_size 32m;

  # 指紋資產由 nginx 直接服務（vite build 產物在 public/vite/）
  location ^~ /vite/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri @puma;
  }

  location @puma {
    proxy_pass http://chilllove_puma;
    # $http_host 而非 $host：$host 會剝掉埠號，外部走 28080 轉發時
    # Rails 產生的 redirect（如未登入→/login）就掉回 80 埠、落在前置機的 404
    # （2026-08-23 實測）。走前置機的標準 443 時前置機送的是乾淨主機名，兩者等價。
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $chilllove_fwd_proto;
    proxy_redirect off;
  }
}
