# CD-1（2026-08-23）：CHILL LOVE walking skeleton 的 nginx 反代配置。
# 部署位置＝bt3 /etc/nginx/sites-available/chilllove（deploy.sh 同步並 reload）。
# ⚠️ TLS 尚未終結（bt3 在 NAT 後、WAN 443 由前置機器佔用）——本檔只聽 80，
#    對應 Rails 側 DISABLE_FORCE_SSL=1（config/environments/production.rb）。
#    TLS 就緒後：加 443 server block＋憑證，移除該環境變數，本註釋同步更新。
upstream chilllove_puma {
  server 127.0.0.1:3000;
}

server {
  listen 80 default_server;
  server_name _;

  root /www/wwwroot/chilllove/app/public;
  client_max_body_size 32m;

  # 指紋資產由 nginx 直接服務（vite build 產物在 public/vite/）
  location ^~ /vite/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri @puma;
  }

  location @puma {
    proxy_pass http://chilllove_puma;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 明文階段刻意傳 http——配合 DISABLE_FORCE_SSL；TLS 後改 $scheme。
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
}
