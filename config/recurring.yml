# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  # 第 19 包（docs/plans/2026-08-24-第19包執行規格.md §4.6）。
  # 🔴 間隔＝limits.events.outbox_poll_interval_s（5）——recurring.yml 不讀 Limits，
  #    改該鍵時要同步這裡（雙寫點已在 limits 鍵旁註明）。
  events_relay:
    class: Events::RelayJob
    queue: default
    schedule: every 5 seconds
  events_outbox_purge:
    class: Events::OutboxPurgeJob
    queue: background
    schedule: at 4am every day
  # 第 28 包：staged 區孤兒清掃（25→26→27 三度順延後在此收口）。
  # 🔴 判準窗＝limits.media.staged_upload_ttl_seconds ＋ .staged_purge_grace_seconds，
  #    **在服務裡讀**；本檔只決定「多久跑一次」，與那兩個鍵無雙寫關係。
  #    排在 outbox purge 之後半小時，避開兩個清掃同時吃磁碟 IO。
  storage_staged_purge:
    class: Storage::StagedPurgeJob
    queue: background
    schedule: at 4:30am every day
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # 包 33 後半（A3）：90 天未動 cart 清理（specs/15 F1 #4）。
  # 🔴 判準窗＝limits.cart.purge_days，**在 job 裡讀**；本檔只定頻率。排開 4 點檔清掃群。
  storefront_cart_purge:
    class: Storefront::CartPurgeJob
    queue: background
    schedule: at 5am every day
