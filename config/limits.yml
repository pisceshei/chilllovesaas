# config/limits.yml — CHILL LOVE 全域上限與預設值（唯一真相）
#
# 鐵律 6（CLAUDE.md）：所有上限值一律引用本檔，**不得硬編碼**。
# 建立依據：docs/specs/50-logic-gap-register.md P0-11／H-02／H-18／H-44～H-47，
#           以及 docs/research/22 §9.4「配額類常數表 → 建 config/limits.yml 一處管理」。
#
# 每一條都必須帶出處註解，格式：
#   # 出處：<檔案>:<行號>（<官方層級>）
#   官方層級：dev＝shopify.dev 開發文檔（46a/46b，最高權威）
#             help＝help.shopify.com 商家文檔（46c，次高）
#             live＝2026-08 實測畫面（44，第三）
#             ours＝本專案決策（官方未載明；必須註明「Shopify 未公開，本專案決策」）
#
# ⚠ 標記 `verify: true` 的條目代表「來源未載明或三方衝突」，實作前必須查證（見 docs/specs/52 §附錄 A）。

# =============================================================================
# 1. API 契約（GraphQL）
# =============================================================================
api:
  # 分頁 cursor 每頁上限。出處：docs/research/28-api-contract.md:18（ours，對齊 Shopify）
  pagination_max_page_size: 250
  # 陣列型 input 元素上限。出處：docs/research/28-api-contract.md:21（ours，對齊 Shopify）
  array_input_max_items: 250
  # 單一請求 cost 上限。出處：docs/research/28-api-contract.md:23（ours，對齊 Shopify）
  max_query_cost_points: 1000
  # Leaky bucket 容量與回填速率。出處：docs/research/28-api-contract.md:24（ours）
  cost_bucket_capacity: 2000
  cost_restore_points_per_sec: 100
  # metafieldsSet 單次原子上限。出處：docs/research/28-api-contract.md:159（ours，對齊 Shopify）
  metafields_set_max_items: 25

# =============================================================================
# 2. 冪等（P0-11）
# =============================================================================
idempotency:
  # 冪等鍵保留期。逾期後同一把 key 的重試「視為全新操作」。
  # 出處：docs/research/46a-shopify-docs-orders-returns.md:789、46a:1006（dev，逐字
  #       「The retention window is 24 hours from the original request.」）
  ttl_hours: 24
  # 回放策略：由「當前 DB 狀態重建回應」，不存原始回應快照。
  # 出處：46a:791、46a:1009（dev，逐字「Successfully cached responses are constructed
  #       from current database state」）。11 號 spec 原本寫「存 response_body 原樣回放」＝寫錯，已修正。
  replay_strategy: rebuild_from_current_state
  # 參數指紋：欄位遞迴排序後再 hash，否則同一請求換欄位順序會誤判 mismatch。
  # 出處：46a:793、46a:816（dev，逐字「Ensure consistent ordering of input fields」）
  fingerprint_normalize_field_order: true
  # 建議的 key 產生方式：互動請求 UUID v4/v7；排程/背景任務 UUID v5（namespace + job 參數）。
  # 出處：46a（dev，S47/S48）
  key_format_interactive: uuid_v4_or_v7
  key_format_scheduled: uuid_v5
  # Bulk 操作每個 JSONL row 一把獨立 key，絕不共用。出處：46a:1015（dev）
  bulk_key_per_row: true
  # 強制帶 key 的 mutation 家族（Shopify 自 2026-04 起強制，共 17 個，以 refund/inventory 為主）。
  # 出處：46a:781–787（dev，公告日 2025-12-12）
  required_for:
    - refundCreate
    - returnProcess        # Shopify 文檔未載明其冪等；本專案強制（46a:620、46a:1062，ours）
    - orderCancel          # 非同步 job，本專案強制（46a:877 async；ours）
    - orderEditCommit      # 🔴 46a:962 逐字「不在強制冪等名單內」，但它產生應收/退款＝金流寫入，
                           #    與 returnProcess 同性質；重覆 commit ⇒ 重複扣款或重複退款。
                           #    **本專案強制**（NP1-D，50 號漏列；見 docs/specs/16 F8.1(c)、docs/specs/54 §4）
    - inventoryAdjustQuantities
    - inventoryMoveQuantities
    - inventorySetQuantities
    - inventorySetOnHandQuantities
    - inventoryShipmentReceive
    - inventoryShipmentCreate
    - inventoryTransferCreate
    - locationActivate
    - locationDeactivate

# =============================================================================
# 3. 訂單／取消／編輯
# =============================================================================
order:
  # 訂單流水號起始值（只能改前後綴，流水號不可變）。出處：docs/research/22:146（live）
  number_start: 1001
  # orderCancel.staffNote 字元上限（買家不可見）。出處：46a:848、46a:880（dev）
  cancel_staff_note_max_chars: 255
  # 批次取消訂單單次上限。出處：46c:149（help）
  bulk_cancel_max_orders: 250
  # 匯出/批次動作轉背景 job 的門檻。出處：docs/research/22:160（ours）
  bulk_async_threshold: 50
  # 訂單編輯 session TTL 與並發鎖。
  # ⚠ Shopify 文檔未載明鎖/TTL/並發行為（46a:961、46a:988–989、46a:1061）→ 本專案決策。
  edit_session_ttl_hours: 24
  edit_session_single_open_per_order: true
  # orderEditAddVariant.allowDuplicates 預設值。出處：46a:924、46a:991（dev）
  edit_add_variant_allow_duplicates_default: false
  # orderEditSetQuantity.restock 預設值。出處：46a:929、46a:991（dev）
  edit_set_quantity_restock_default: false
  # 訂單草稿閒置自動刪除（2025-04-01 後建立者）。出處：46c:552（help）
  draft_idle_auto_delete_days: 365

# =============================================================================
# 4. 履行（FulfillmentOrder / Fulfillment）
# =============================================================================
fulfillment_order:
  # 每張 FulfillmentOrder 最多同時存在的 active hold 數，超過回 userError。
  # 出處：46a:320、46a:374（dev）
  max_active_holds: 10
  # fulfillmentOrderSplit 單次最大拆分數。
  # ⚠ 文檔未載明（46a:1049–1067 已逐條列為未載明項）→ 實作前查證，暫不設限。
  max_splits_per_call: null
  verify_max_splits: true

fulfillment:
  # 單張 fulfillment 的 tracking number / URL 數量上限。
  # ⚠ 文檔未載明（46a §3②）→ 實作前查證。
  max_tracking_numbers: null
  verify_max_tracking_numbers: true

# =============================================================================
# 5. 退貨／退款（P0-01、P0-02）
# =============================================================================
return:
  # returnReasonNote 字元上限。出處：46a:523、46a:653（dev）
  reason_note_max_chars: 255
  # 自助退貨單次可申請的品項上限。出處：46c:375–384（help，H16 zh-TW）
  self_serve_max_line_items: 250
  # 退貨期間可選檔位（天）；`unlimited` 代表「不限」。出處：46c:415–416（help）
  window_day_options: [14, 30, 90, unlimited, custom]
  # 退貨期間起算點二選一。出處：46c:415–416（help）
  window_start_options: [item_delivered_at, order_last_item_delivered_at]
  # 退貨運費三選一。出處：46c:417（help）
  shipping_fee_modes: [free, flat_fee_per_return, customer_buys_own_label]
  # 重新上架費：以退貨金額的**百分比**計（per line item）。出處：46c:418–419（help）、46a:526（dev）
  restocking_fee_is_percentage: true
  # RestockingFeeInput.percentage 最大值。
  # ⚠ 文檔未載明（46a §4② 逐字「最大值：文檔未載明」）→ 實作前查證；暫以 100 作為程式防呆上界。
  restocking_fee_max_percentage_guard: 100
  verify_restocking_fee_max: true
  # 在 Shopify 內建立退貨運送單的地區限制。出處：46c:297（help，逐字「僅限美國地點」）
  platform_label_supported_countries: [US]
  # 台灣消保法「網購七日鑑賞期」。⚠ TW-10，法規原文須覆核（本檔僅記錄，不得直接當唯一依據）。
  tw_minimum_window_days: 7
  verify_tw_minimum_window: true
  # 🔻 P1-31 處置更正：**不是硬下限，是軟 guard**（見 docs/specs/16 F7.4(b) 與 docs/specs/54 §P1-31）。
  # 理由：①七日解約權是**法定權利，獨立於商家退貨規則存在**，商家設 3 天並不會消滅它；
  #      ②「合理例外情事適用準則」明列多類排除適用的商品（易腐敗／客製化／已拆封影音…），硬性 ≥7 會讓合法例外無法設定；
  #      ③退貨規則可按市場切換，把台灣法規套到所有市場是錯的。
  # 真正的合規保證是 B2：TW 市場恆提供「依消保法申請解約」的法定管道入口。
  tw_minimum_window_enforcement: warn      # warn | block（**不得**改成 block）
  tw_statutory_channel_always_available: true
  tw_statutory_reason_code: STATUTORY_WITHDRAWAL_TW

refund:
  # 退款金額下限鉗制：建議退款不得為負，一律 floor 到 0。
  # 出處：46a:595–601（dev，逐字「the suggested amount cannot be lower than $0 CAD」）
  floor_to_zero: true
  # 軟上限：預設 netPayment（Σcaptured − Σrefunded）。**不得做成 DB CHECK 硬擋**——
  # help 明載「先發過商店抵用金者可對原付款方式超額退款」（46c:223、46c:241）。
  # maximumRefundable 公式 ⚠ Shopify 未公開（46a:606、46a:770、46a:819）→ 以下為本專案決策。
  soft_cap_strategy: net_payment
  over_refund_requires_permission: "orders.over_refund"
  over_refund_requires_confirm: true
  verify_maximum_refundable_formula: true
  # 混合付款的退款分配順序（P1-05／H-83）：**禮品卡永遠第一順位**，逐筆吃滿再進下一筆（不按比例攤）。
  # 出處：46c:221（help，H05 zh-TW 逐字「混合付款時，系統先把退款金額套用到禮品卡，直到禮品卡達可退全額，餘額才用其他付款方式」）
  # 🔴 這是硬規則，**不得做成商家可調整的順序設定**。演算法與三個算例見 docs/specs/16 F5.4。
  allocation_order: [gift_card, others]
  allocation_within_group_sort: [created_at, id]   # 同類多筆：先收先退（結果可重現）
  allocation_strategy: greedy_fill                 # 逐筆吃滿，**不是** proportional
  # 稅額分攤（P1-02／H-07）：分攤**原始已收稅額**，不用現行稅率重算；餘數歸最後一次退貨。
  # ⚠ 官方未載明退款稅額分攤規則（46a:1049–1067 列為未載明項）→ 以下為本專案定義。見 16-F5.1 X1–X6。
  tax_allocation_basis: original_collected_tax
  tax_allocation_rounding: largest_remainder
  tax_allocation_remainder_owner: last_refund
  return_fees_taxable: false
  verify_tax_allocation_rule: true

# =============================================================================
# 6. 請款／授權（P0-12）
# =============================================================================
capture:
  # 請款四模式（**不是三模式**；22:147/22:157 原本寫「三模式」＝寫錯，已修正）。
  # 出處：46c:508–514（help，H33 zh-TW）
  modes:
    - automatic_at_checkout      # 結帳時自動請款（預設，全方案）
    - automatic_after_fulfilled  # 整張訂單出貨完成後自動請款（全方案）
    - automatic_per_fulfillment  # 每次出貨各自請款一次（🔴 僅 Shopify Plus）
    - manual                     # 手動請款（全方案）
  default_mode: automatic_at_checkout
  plus_only_modes: [automatic_per_fulfillment]
  # 授權效期（天）。出處：46c:517–525（help，Shopify Payments）
  authorization_days_default: 7
  authorization_days_plus:
    visa: 30
    mastercard: 30
    amex: 30
    discover: 10
    jcb: 10
    diners: 7
    cup: 7
  # 顧客銀行帳單上的 pending hold 最長顯示天數。出處：46c:517–525（help）
  pending_hold_display_max_days: 30
  # 🔻 informational only — 不參與任何計算（P1-06 降級）。
  # 出處：46c:526（help）逐字「超過授權期限後才請款，需付 1.75% 附加費」。
  # 那是 **Shopify Payments 對商家的收單定價**；CHILL LOVE 依 TW-9 電支條例鐵律（37 §3、37 §479–491）
  # 不代收代付、不是收單機構，租戶貨款直接進租戶自持商戶號 → 既不收這筆費、也無權加收。
  # **不得**在帳單或訂單金額引擎產生 1.75% 行項。保留此鍵僅供「若未來自營收單」時參考。見 docs/specs/54 §P1-06。
  late_capture_surcharge_rate_informational_only: 0.0175
  # 上方 authorization_days_* 是 **PSP／卡組織屬性，不是方案旗標**（P1-07）：
  # 只作為 UI 顯示與到期提醒 job 的預設值，實際上界以 Stripe PaymentIntent 為準。
  # 寫成「Plus ⇒ 30 天」的硬邏輯會產生「系統說還能請款、Stripe 已 declined」的錯誤狀態。見 docs/specs/15 F4.1(b)。
  authorization_days_source: psp_and_card_network   # 非 shop.plan
  # 授權到期示警提前天數。出處：docs/research/22:40（ours，對應 46c:536「即將到期 badge」）
  expiry_warning_days_before: 2

# =============================================================================
# 7. 庫存（P0-15）
# =============================================================================
inventory:
  # 頂層五態（不可省略）。出處：46c:891–907（help，H18 zh-TW）、44:150（live）
  top_level_states: [on_hand, available, committed, unavailable, incoming]
  # unavailable 的子分類。出處：46c:925–927（help，H20 zh-TW）
  unavailable_subtypes: [damaged, quality_control, safety_stock, draft_reserved, app_reserved, other]
  # 調整原因七項（第一項為預設）。出處：46c:608–617（help）
  adjustment_reasons: [correction, count, received, return_restock, damaged, theft_or_loss, promotion_or_donation]
  # 調整歷史保留天數。出處：docs/research/22:81（live）
  adjustment_history_retention_days: 180
  # 訂單草稿保留庫存的去向＝unavailable（**不是 committed**）。出處：46c:546–549、46c:895（help）
  draft_reservation_target_state: unavailable

# =============================================================================
# 8. 商品／集合／媒體
# =============================================================================
product:
  # 出處：46c:657–669（help）、docs/research/22:70/74/160（live）
  max_options: 3
  max_variants: 2048
  max_media: 250
  title_max_chars: 255
  description_max_bytes: 65536
  # 子類每日上傳速率（>500,000 子類的店）；Plus 豁免。出處：46c:657–669（help）
  daily_variant_upload_limit: 10000
  daily_variant_upload_plus_exempt: true

collection:
  # 出處：docs/research/22:160（live）
  max_smart_collections_per_shop: 5000
  max_rules_per_collection: 60

media:
  # 出處：docs/research/22:160（live）
  csv_max_upload_mb: 15

# =============================================================================
# 9. 折扣（P0-03 相關上限）
# =============================================================================
discount:
  # 同時 active 的自動折扣上限（**全店口徑，不是每張訂單**；錯誤碼 ACTIVE_PERIOD_OVERLAP）。
  # 出處：46b:264（dev）。46c:688 寫「每張訂單」是 help 自身誤植（50 號表 3 T-09）。
  max_active_automatic_per_shop: 25
  # 每店累計唯一折扣碼數。出處：46b:265（dev）
  max_codes_per_shop: 20000000
  # 單一折扣碼可指定的顧客／商品／變體數。出處：46b:266（dev）
  max_entitlements_per_code: 100
  # 單次結帳可用碼數。出處：46b:267（dev）
  max_codes_per_checkout_product_and_order: 5
  max_codes_per_checkout_shipping: 1
  # 自動折扣可指定客群數／折扣碼可指定客群數。出處：46c:690–691（help）
  max_segments_per_automatic: 5
  max_segments_per_code: 100
  # 折扣 tags。出處：46b:268–270（dev）
  max_tags: 5
  tag_max_chars: 255
  max_tags_same_cart_line_plus: 10
  # 百分比值域為 0–1 Float（不是 0–100）；內部以 basis points（0–10000 整數）儲存，
  # 序列化除以 10000。出處：46b:189、46b:272（dev），46b §2⑥-2 建議。
  percentage_wire_range: [0.0, 1.0]
  percentage_storage: basis_points
  # combines_with 三旗標的預設值＝全 false（組合不會自動發生，商家須逐折扣開啟）。
  # 出處：46c:705（help）
  combines_with_default: false
  # 硬規則：運費折扣不可疊運費折扣（非 combinesWith 旗標可控）。出處：46b:285、46c:716（dev+help）
  shipping_plus_shipping_allowed: false

# =============================================================================
# 10. 結帳／購物車／棄單
# =============================================================================
cart:
  # 加入購物車「總件數」上限（cart_item_limit），系統建議值 50。
  # 例外：POS／草稿單／B2B／不追蹤庫存的品項不受限。
  # 出處：44:378（live，modal 實測 stepper=50＋「您商店的建議上限為 50」）、24:230
  item_limit_suggested: 50
  item_limit_enabled_default: true
  item_limit_exempt: [pos, draft_order, b2b, untracked_inventory]
  # 單行數量上限與行數上限（本專案防呆，與 cart_item_limit 是不同概念，兩者並存）。
  # 出處：docs/specs/15:9（ours）
  max_quantity_per_line: 999
  max_lines: 100
  # 未動作的 cart purge 天數。出處：docs/specs/15:9（ours）
  purge_days: 90

abandoned_checkout:
  # 判定為棄單的門檻：**留下 email 後 10 分鐘未完成**（唯一權威門檻）。
  # 出處：44:373（live）、docs/research/22:60（live）。
  # 15:94 原寫「active 超過 1 小時」、三處門檻不一致，已統一至此值。
  qualify_after_minutes: 10
  # 棄單挽回信延遲四檔（小時），預設 10 且官方標「建議」。出處：44:373（live）、24:228
  recovery_delay_hour_options: [1, 6, 10, 24]
  recovery_delay_default_hours: 10
  # 寄送對象二選一。出處：44:373（live）
  recovery_audience_options: [any_incomplete_checkout, email_subscribers_only]
  # 棄單資料保留期。出處：docs/research/22:60、22:160（live）
  retention_days: 90

checkout:
  # 表單欄位三態。出處：46c:756–768（help）、44:369–371（live）
  field_visibility_modes: [hidden, optional, required]
  # 「要求登入」⇒ 強制 email 通道（欄位聯動硬規則）。出處：46c:756–768（help）、44:369（live）
  require_login_forces_email_contact: true
  # SMS 行銷同意永不可預先勾選。出處：46c:756–768（help）
  sms_consent_never_prechecked: true

# =============================================================================
# 11. 地點／運送
# =============================================================================
location:
  # 地點配額（app 建立的地點不佔配額），頁面須顯示「已用 N / 配額 M」。
  # 出處：44:400（live）、docs/research/22:152（live）
  quota_basic_to_advanced: 10
  quota_plus: 200
  app_locations_count_toward_quota: false

shipping:
  # 運送設定檔：一般 1 ＋ 自訂 ≤99；預設設定檔的商品集合是「補集」。
  # 出處：46c:863（help）、44:513（live）
  general_profiles: 1
  max_custom_profiles: 99
  # 本地外送半徑上限與郵遞區號字數。出處：docs/research/22:150（live）
  local_delivery_max_radius_km: 160
  local_delivery_postal_codes_max_chars: 3000
  local_delivery_max_zones_per_location: 10

  # --- 跨設定檔合併運費（P1-23／原 NP0-F；完整公式與五個算例見 docs/specs/15 F2.1）---
  # 出處：46c:869–876（help，H42 zh-TW 逐字四條）：
  #   「名稱相同的運費費率會相加」／「若所有費率的名稱都不同，系統會將最便宜的選項相加」
  #   「（同一 location group 內多地點）系統會只收取一次單一費率」
  #   「重量制逐品項加上商店預設包裹重量後再相加，可能算出比單一設定檔更高的總額」
  #   46c:876 逐字：「費率名稱是**合併鍵**。名稱一字之差就會從『相加』變成『取最便宜相加』」
  rate_merge_key: rate_name                       # 合併鍵＝費率名稱（不是 rate id、不是 service code）
  rate_merge_participant_unit: profile_x_location_group   # 合併的最小單位，同 group 多地點只收一次
  rate_merge_no_common_name_strategy: sum_of_cheapest_per_participant
  # 名稱正規化規則：Unicode NFC ＋ trim，**大小寫敏感**。
  # ⚠ 46c 只說「名稱相同」，未定義正規化 → 以下為本專案決策，實作前查證（V-15）。
  rate_merge_key_normalization: nfc_trim_case_sensitive
  verify_rate_name_case_sensitivity: true
  # 無共同名稱時，合併選項對顧客顯示的名稱。⚠ 文檔未載明（V-15）。
  merged_option_fallback_label: "運費"
  # 重量制：每個 participant 各加一次商店預設包裹重量（這是 46c 說「可能更貴」的成因，不是 bug）
  weight_adds_package_weight_per_participant: true
  # UI 硬要求（46c:876 明確點名）：跨設定檔的近似但不相同名稱要出警示
  warn_on_near_duplicate_rate_names: true
  near_duplicate_edit_distance: 2

  # --- zone ≠ market（P1-24／H-112）---
  # 出處：44:524（live，zone 頁黃色警示橫幅逐字「若要在此區域開始銷售至 27 個國家/地區，請將這些國家/地區加入市場」）
  # 兩個方向都要 guard：有 zone 不在 market → 不可販售；在 market 無 zone → 結帳運送階段擋。見 15-F2.2／29 §5。
  zone_requires_market: true

# 超商取貨／取貨點（P0-13）
pickup_point:
  # Shopify 側「其他配送方式」第三種（取貨點 / pickup points）。出處：44:322（live）
  # 台灣通路對應 ECPay LogisticsSubType。出處：docs/research/42:521–540（ours，已查證 ECPay 合約）
  carriers:
    unimart:  { name: "7-ELEVEN", subtypes: [UNIMART, UNIMARTC2C, UNIMARTFREEZE] }
    fami:     { name: "全家",     subtypes: [FAMI, FAMIC2C] }
    hilife:   { name: "萊爾富",   subtypes: [HILIFE, HILIFEC2C] }
    okmart:   { name: "OK",       subtypes: [OKMARTC2C] }
  # 貨到付款（超商代收）金額上限（TWD）。出處：docs/research/42:530（ours，超商代收慣例）
  cod_max_amount_twd: 20000
  # 材積／重量慣例上限。出處：docs/research/42:530（ours，超商慣例，非官方文檔）
  max_dimension_sum_cm: 105
  max_weight_kg: 5
  # ⚠ 以上 COD 上限與材積限制為業界慣例值，非 Shopify 官方文檔；各物流商合約值須逐一覆核。
  verify_tw_carrier_limits: true

# 貨到付款（COD）代收手續費（P1-08／TW-7；金額引擎行項規格見 docs/specs/15 F2.3）
cod:
  # 宅配到府代收常見手續費區間（TWD cents）。出處：docs/research/42:542（ours，業界慣例，**非官方文檔**）
  # 這是 UI 預設值提示用的區間，**不是硬約束**——實際值存 `shipping_rates.cod_fee_cents`。
  fee_cents_default_range: [3000, 6000]
  # COD 上限比較的基數＝顧客實際要付的代收金額（含手續費），不是商品小計。
  # 用小計比較會讓 19,900 + 60 的單超出物流商上限而被退件。
  cap_compares_against: total_including_fee
  # 代收手續費是否課稅。⚠ 台灣實務有兩種做法，官方文檔無載 → 暫定不課稅（V-16）。
  fee_taxable: false
  verify_fee_taxable: true
  # 對帳匯入冪等鍵。出處：docs/research/42:542（ours）
  settlement_idempotency_key: [carrier, statement_id, row_no]
  # 金額不符時**不得**自動回寫 paid（現金流入口，差 1 元也不放行）。
  settlement_mismatch_action: hold_for_manual_review

# =============================================================================
# 12. 商店抵用金（store credit）
# =============================================================================
store_credit:
  # 單一顧客累計上限（美元）。出處：46c:253–277（help）
  max_balance_usd: 15000
  # 需新版顧客帳號；最早到期的先用；到期以商店時區當日結束為準。出處：46c:253–277（help）
  requires_new_customer_accounts: true
  consumption_order: earliest_expiry_first
  expiry_boundary: shop_timezone_end_of_day
  unsupported_contexts: [draft_order, edited_order, third_party_channel]

# =============================================================================
# 13. 顧客帳號／內容
# =============================================================================
customer_account:
  # session 最長天數。出處：46c:796–800（help）、44:414（live）
  session_max_days: 365
  # 升級新版後可還原的天數（超過即不可逆）。出處：46c:807–819（help）
  upgrade_revert_window_days: 30

content:
  # 密碼保護頁與 SEO 字元計數。出處：44:571–578（live）
  password_page_password_max_chars: 100
  password_page_message_max_chars: 5000
  seo_title_max_chars: 70
  seo_meta_description_max_chars: 320
  # 主題庫與試用。出處：docs/research/22:160（live）
  theme_library_max: 20
  theme_trial_max: 19
  # 留言可編輯窗（分鐘）。出處：docs/research/22:160（live）
  comment_edit_window_minutes: 5

# =============================================================================
# 14. 通知範本（P1-28）
# =============================================================================
notification:
  # 顧客通知範本總數與分組數。出處：44:449–469（live，後台 /settings/notifications/customer 實測）
  customer_template_count_observed: 45
  group_count: 12
  # 🔴 `toggleable` 是**白名單**，不是預設值——預設 false（強制寄）。
  # 出處：44:469（live）逐字「**只有部分範本可關閉**（當地配送/運送狀態更新/雙重確認/Shop 再行銷），
  #       交易性範本強制寄——這是一條**合規約束，不是 UI 偏好**」。
  # 照原規格（22 只寫「模板分類+個別開關」）實作會做成全部可關 → 關掉訂單確認信/退款通知信＝合規風險。
  toggleable_groups:
    - local_delivery          # 當地配送（預設開）
    - shipping_update         # 運送資訊更新（預設開）
    - double_optin            # 行銷訊息雙重確認加入（預設**關**）
    - offsite_remarketing     # 站外再行銷（對應本尊「透過 Shop 再行銷」，預設開）
  toggleable_default: false
  # `toggleable` 由種子決定、API 唯讀；`enabled` 只在 toggleable=true 時可寫。
  toggleable_is_readonly: true
  # 不可關閉的範本在 UI 要**灰化＋tooltip**（「此為交易性通知，依法必須寄送」），不是隱藏。
  non_toggleable_ui: disabled_with_tooltip
  # M1–M4 先落地的交易性範本數（其餘進種子表標 implemented:false，表結構一次做對）
  phase1_implemented_count: 12
  # ⚠ 44 的 45+ 範本清單為 UI 實測，官方文檔未提供完整 event_key 列表；本專案 event_key 命名為自定（V-18）。
  verify_event_key_catalog: true

# =============================================================================
# 15. Markets 繼承（P1-32）
# =============================================================================
market:
  # 父子關係**由 conditions 自動推導**，不是手動指定的欄位。
  # 出處：46b:636–639（dev）逐字「parent 不是手動指定的，是自動推導的（lineage inference）」；
  #       46b:664 逐字「沒有 `inherited: Boolean` 這種顯式旗標，也沒有 `parentMarketId` 欄位」。
  # 🔴 我方 29:42 原本把 `parent_market_id` 當權威欄位存 → 商家改 regions 後父子關係不會變。已改為 derived 快取。
  parent_resolution: derived_from_conditions
  parent_column_is_cache: true            # markets.derived_parent_market_id
  # 命中優先序（buyer 同時命中多市場）。出處：46b:641–648（dev）
  specificity_stack: [company_location, retail_location, region, store_default]
  # 繼承語義：NULL ＝ 繼承。出處：46b:650–664（dev）
  inheritance_additive: [catalogs, web_presences]
  inheritance_override: [currency_settings, price_inclusions]
  # ⚠ V-02：`delivery.shipping` 到底繼不繼承——46b:659–661「Null means the market inherits shipping from its parent」
  #   vs 44:866「運送與隱私權不繼承，永遠市場本地」。**直接矛盾，未定案前不得預設任一邊**。
  shipping_inherits: null
  verify_shipping_inheritance: true
  # UI 有 8 個可繼承維度（44:862 實測），公開 API 只對 4＋1 個有官方語義（46b:788）。
  # 其餘 4 個標「Shopify 公開 API 未載明，本專案決策」。
  ui_inheritable_dimensions:
    [currency, catalogs, discounts, theme, checkout_profile, domain_and_language, tax_and_duties, return_rules]
  api_documented_dimensions: [catalogs, web_presences, currency_settings, price_inclusions]
  # ⚠ 每店 markets 總數上限／巢狀層數上限／MarketUserErrorCode：46b:993–1010 逐條標未載明。
  #   社群的「50 markets」說法**未經官方證實，勿引用**。
  max_markets_per_shop: null
  max_nesting_depth: null
  verify_market_limits: true

# =============================================================================
# 16. B2B（P1-33／H-64～H-68；規格見 29 §10、契約見 28 §13b）
# =============================================================================
b2b:
  # 出處：46b:898–904（help + dev）
  max_companies_per_shop: null            # 官方逐字「Unlimited」
  max_locations_per_company: 10000
  max_contacts_per_company: 10000
  max_contacts_per_location: 50           # 🔴 最容易漏的一條（與 per company 的 10,000 差兩個數量級）
  max_catalogs_per_location: 25
  max_prices_per_price_list_request: 250
  max_companies_per_customer: 1           # 逐字「can add a customer only to one company」
  # B2B market catalog 指派：Basic/Grow/Advanced 3；Plus unlimited。出處：46b:905（help）
  max_market_catalogs_non_plus: 3
  # 方案要求：Shopify Plus 才有 B2B（dev store 例外）。出處：46b:906（dev）
  requires_plus: true
  # 不支援的購買選項。出處：46b:907（dev）
  unsupported_purchase_options: [subscriptions, pre_orders, try_before_you_buy]
  # 🔴 掛載鐵律（H-64）：以下一律掛 company_location；company 層只有 name/note/default_role/main_contact。
  # 出處：46b:817–830（dev + help）逐字「Catalogs attach exclusively to company locations, not companies.」
  location_scoped_settings:
    [catalog, payment_terms, tax, checkout_config, currency, locale, billing_address, shipping_address]
  company_scoped_settings: [name, note, default_role, main_contact]
  # PaymentTermsType 5 值。出處：46b:881–889（dev）
  payment_terms_types: [FIXED, FULFILLMENT, NET, RECEIPT, UNKNOWN]
  # 多 catalog 解析取最低價；商品須至少發佈到一個 applicable publication。出處：46b:910–911（dev）
  multi_catalog_price_resolution: lowest
  # CompanyLocation.market 已 deprecated → 不得建 location→market 正向外鍵。出處：46b:830、46b:943（dev）
  location_to_market_fk_forbidden: true
  # ⚠ 標準 NET 7/15/30/45/60/90 內建清單：46b:892 逐字「文檔未載明」；CheckoutProfile 有無 company/location 欄位：46b:828 未載明。
  verify_net_terms_catalog: true

