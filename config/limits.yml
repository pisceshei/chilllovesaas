# 14. 通知範本（P1-28）
# =============================================================================
notification:
  # 顧客通知範本總數與分組數。出處：44:449–469（live，後台 /settings/notifications/customer 實測）
  customer_template_count_observed: 45
  group_count: 12
  # 🔴 `toggleable` 是**白名單**，不是預設值——預設 false（強制寄）。
  # 出處：44:469（live）逐字「**只有部分範本可關閉**（當地配送/運送狀態更新/雙重確認/Shop 再行銷），
  #       交易性範本強制寄——這是一條**合規約束，不是 UI 偏好**」。
  # 照原規格（22 只寫「模板分類+個別開關」）實作會做成全部可關 → 關掉訂單確認信/退款通知信＝合規風險。
  toggleable_groups:
    - local_delivery          # 當地配送（預設開）
    - shipping_update         # 運送資訊更新（預設開）
    - double_optin            # 行銷訊息雙重確認加入（預設**關**）
    - offsite_remarketing     # 站外再行銷（對應本尊「透過 Shop 再行銷」，預設開）
  toggleable_default: false
  # `toggleable` 由種子決定、API 唯讀；`enabled` 只在 toggleable=true 時可寫。
  toggleable_is_readonly: true
  # 不可關閉的範本在 UI 要**灰化＋tooltip**（「此為交易性通知，依法必須寄送」），不是隱藏。
  non_toggleable_ui: disabled_with_tooltip
  # M1–M4 先落地的交易性範本數（其餘進種子表標 implemented:false，表結構一次做對）
  phase1_implemented_count: 12
  # ⚠ 44 的 45+ 範本清單為 UI 實測，官方文檔未提供完整 event_key 列表；本專案 event_key 命名為自定（V-18）。
  verify_event_key_catalog: true

# =============================================================================
# 14b. 司法管轄區包（jurisdiction packs）
# =============================================================================
# 🔴 本區塊**取代**原本的頂層 `einvoice:` 區塊（55 號建立、本輪整段搬入 `jurisdictions.tw.tax_invoice`）。
#    搬移對照表見 `jurisdiction._moved_keys`；**既有台灣內容一行未刪**，只是降級為 tw pack 的素材。
#
# 出處標記在本區塊另加兩級（檔頭的 dev／help／live／ours 之外）：
#   hk-user      ＝ 使用者 2026-08-12 裁定時提供並聲明「已查證」的香港事實（四條）
#   hk-secondary ＝ 本專案查得的第二手來源（律所／立法會秘書處研究刊物／業者頁面）；URL 見 56 §H
#   未標者一律 **⚠ 待查證**，不准臆造。
jurisdictions:

  # ---------------------------------------------------------------------------
  # 香港（基準法域，2026-08-12 決議）
  # ---------------------------------------------------------------------------
  hk:
    enabled: true
    display_name: 香港
    country_codes: [HK]
    enable_gate: []          # 無阻擋項；待查證項見各能力的 verify_* 與 56 §E.2（V-25～V-33）

    # 【tax_invoice】香港無增值稅／銷售稅／消費稅 ⇒ 沒有政府強制發票、沒有字軌、沒有折讓單、
    #   沒有作廢重開。收據＝純商業單據。（hk-user，已查證）
    # 🔴 `none` 是**明確宣告**，不是「沒填」。核心流程照常發稅務事件，pack 一律回 no_document
    #    並落一列 `jurisdiction_capability_skips`（documented_no_op），**不得靜默略過**。
    tax_invoice:
      kind: none
      issues_documents: false
      numbering_authority: null
      void_mechanism: null
      allowance_mechanism: null
      reissue_mechanism: null
      # 55 §B 的 30 條稅務事件點在 HK 的重分類見 56 §B.2：
      #   20 條轉純會計事件／8 條完全消失／1 條改由 tax_id_format 承接／1 條不受影響（跨境關稅）。
      event_handling: accounting_only
      # 🔴 55 §D G-01 的「未定案前擋下多次出貨並轉人工佇列」**不得**在本法域生效——
      #    HK 沒有憑證可開，照搬會把所有多次出貨的訂單卡死。（56 §E.1）
      # 🔴 **本鍵的唯一呼叫端＝`docs/specs/16` F5.5(a) 的 V-23 擋單註記**（57 §G-01 補上）。
      #    56 §E.1 只把值落進 limits，規格檔的擋單規則當時**沒有任何法域條件**——
      #    這正是 55 §D G-03 的病根（「掛勾寫了卻沒接上」）換到法域層：旗標寫了但沒有人讀，
      #    照 16-F5.5 實作的人仍會在 HK 擋下所有多次出貨的訂單。
      block_multi_fulfillment_when_undecided: false

    # 【consumption_tax】無 VAT／GST／SST／營業稅。（hk-user，已查證）
    # 🔴 稅額必須寫成「**已宣告的 0**」而非「未計算」：金額引擎仍寫 tax_cents: 0 並帶
    #    tax_basis: no_consumption_tax_regime，報表與稽核才分得出「無稅制」與「漏算稅」。
    consumption_tax:
      kind: none
      rate_bp: 0
      taxes_included_default: false           # 無稅可內含（對照 tw: true，16-F5.1 X1）
      tax_basis_label: no_consumption_tax_regime
      zero_rated_exports: null                # 沒有稅率就沒有零稅率（55 T26／G-21 在 HK 為 N/A）
      # ⚠ V-31：賣往有 VAT／GST 的市場時，**買方所在地**的代收與註冊義務（EU IOSS／UK／AU／SG
      #   低價值貨物）未由本專案覆核。這是「目標全球市場」的真正稅務風險，不是 HK 本地問題。
      verify_outbound_vat_obligations: true

    # 【stored_value_regime】使用者 2026-08-12 裁定：**PSSVFO 不列為法遵閘門**。
    #   理由（使用者原話）：不自建支付系統，整合 Airwallex / Stripe / PayPal 等持牌業者。
    #   ── 本檔補充的判斷依據（避免日後誤解為「已豁免所以怎樣都行」）──
    #   PSP 整合解決的是「支付處理」；禮品卡是「預先收款、之後兌換」，兩者是不同問題。
    #   真正讓 PSSVFO 不構成風險的是**現行設計本身**：禮品卡由租戶發行、僅限自家店兌換
    #   ＝單一用途，且平台僅提供軟體、非發行人。
    #   ⇒ 因此 `issuing_shop_only` 從「法遵硬限制」降級為 **設計預設（design default）**：
    #      不再作為啟動阻擋條件，但仍是預設值。若日後要做跨租戶通用儲值，
    #      **那不是改一個列舉值，而是要重新評估發行人身分與牌照**（屆時再議）。
    #   出處：PSSVFO 單一用途豁免（HKMA）；本專案不依賴此豁免作為合規主張。
    #   單一用途（只能在發行商自己的店消費）豁免；跨多個不相關商戶＝多用途需牌照；
    #   有限多場所豁免設 HK$1,000,000 儲值總額上限。
    #   二次來源（hk-secondary）：ONC《PSSVFO》說明——Schedule 3 單一用途豁免、Schedule 8 多用途豁免
    #   （逐字「HK$1,000,000 or its equivalent」）。URL 見 56 §H；**法例原文未由本專案覆核**。
    # 🔴 **產品級硬限制**：每張禮品卡／每個抵用金帳戶只能在**發行它的那一個租戶店內**使用。
    #    若 CHILL LOVE 發行跨租戶通用禮品卡 ⇒ 平台自己可能需要 SVF 牌照。（56 §B.3）
    stored_value_regime:
      kind: svf_pssvfo
      single_purpose_exempt: true
      cross_shop_redemption_allowed: false            # 🔴 不得改成 true
      cross_shop_redemption_error_code: CROSS_SHOP_REDEMPTION_FORBIDDEN
      redeemable_scope_enum: [issuing_shop_only]      # 設計預設；擴充需先評估發行人身分（見上）
      platform_wide_instrument_forbidden: false       # 2026-08-12 降級：不再作為啟動阻擋條件
      cross_tenant_requires_licensing_review: true    # 但要做跨租戶時必須先走一次評估
      # 備援路線（我們走單一用途，不走這條）：有限多場所豁免的儲值總額上限。
      limited_premises_float_cap_cents: 100000000     # HK$1,000,000
      # ⚠ V-32：上限的適用主體是租戶還是平台、單一用途豁免下是否仍有 HKMA 申報義務——未覆核。
      # verify_svf_exemption_scope: 已移除——不再以 SVF 豁免作為合規主張（2026-08-12）
      # 無資金池：租戶貨款直接進租戶自持的通道商戶號，平台不代收代付、不得出現「平台錢包／提現」。
      # 🔴 這條在 TW 的法源是《電子支付機構管理條例》（37:895 TW-9），在 HK 的法源是 PSSVFO
      #    ＋ ⚠ 其他 HK 金融監管（未覆核）。**法源換了，結論不變**——不得因為「HK 沒有電支條例」就放寬。
      no_fund_pooling: true
      verify_hk_money_service_rules: true

    # 【accounting】HKFRS 15：禮品卡／抵用金**售出＝合約負債（遞延收入）**，兌換時才認列收入；
    #   未兌換 breakage 依預期兌換模式比例認列，或於兌換可能性極低時認列。（hk-user，已查證）
    # 🔴 這是**會計問題不是稅務問題**——55 號 V-21「開立時點二選一」在 HK 不成立（56 §E.1）。
    #    對應地，`gift_card.resolver_refuses_start_when_undecided` 若照搬到 HK 會讓禮品卡永遠無法啟用。
    accounting:
      framework: hkfrs
      gift_card_on_sale: contract_liability
      gift_card_on_redeem: recognise_revenue
      gift_card_breakage_method: expected_redemption_pattern_or_remote
      # --- 以下為 57 §G-07 落地：分錄方向、落庫表與觸發點（原 56 §B.3.1 只有五列對照表）---
      # 🔴 方向是**唯一真相**，不是科目名稱。科目名稱各家帳務系統不同，方向錯了帳就反了。
      #    落庫表 `contract_liability_entries`（jurisdiction.schema_union_rules.required_tables），
      #    唯一鍵 `(shop_id, source_type, source_id, direction)` ⇒ 同一筆金流只能落一次分錄。
      # 🔴 `"on"` 的引號是**必要的，不是風格**（2026-08-15 修）：Psych 走 YAML 1.1，
      #    裸字 `on`/`off`/`yes`/`no`/`true`/`false`（含大小寫變體）一律解析成布林
      #    （`y`/`n` 不在此列——YAML 1.1 規格含它們，但 Psych 5.2.2 實測不轉）。
      #    原文寫成 `{ on: ... }` 時，
      #    這六筆的鍵是 `true`（TrueClass）而不是字串 `"on"`；config/application.rb 的
      #    `deep_symbolize_keys` 對非字串鍵原樣保留（`true` 不能 `to_sym`）⇒ M27 的鍵實測是
      #    `[true, :direction, :revenue]`，取值端
      #    `Limits.fetch(:jurisdictions, :hk, :accounting, :gift_card_entry_points, :M27, :on)`
      #    會 KeyError，而錯誤訊息看不出根因（它會說「缺少 limits.….M27.on 設定」，
      #    讀起來像**設定沒寫**，而本檔明明寫著 `on:`）。
      #    <!-- 2026-08-15 修正：本行原本示範的是
      #         `Rails.configuration.x.limits.dig(...).fetch(:on)`。兩個問題：
      #         ①`app/models/limits.rb` 才是正式取值入口（缺鍵一律 raise），
      #           而該檔檔頭正好警告不要用 `.dig` 拿 nil——本行卻在示範 `.dig`；
      #         ②PR #33 的 worklog 宣稱「已全部改回 Limits.fetch」，但本檔漏改，
      #           那句宣稱因此是假的。修好代碼讓宣稱成真，而不是改宣稱。 -->
      #    最可能的誤修是「那就改用 `true` 當鍵」——那會把 bug 固化成契約。
      #    機制化：`scripts/check-limits-keys.rb` 斷言本檔所有鍵皆為 String（CI 跑）。
      gift_card_entry_points:
        M27: { "on": gift_card_issued_by_admin, direction: liability_increase, revenue: 0 }
        M28: { "on": gift_card_product_sold,    direction: liability_increase, revenue: 0 }
        M29: { "on": gift_card_credited,        direction: liability_increase, revenue: 0 }
        M30: { "on": gift_card_redeemed,        direction: liability_decrease, revenue: recognise }
        M31: { "on": gift_card_expired_or_deactivated, direction: breakage, revenue: see_breakage }
        M32: { "on": refund_credited_to_card,   direction: liability_increase, revenue: 0 }
      # 🔴 M32 是最容易做反的一條：退款回補到卡片是**負債增加**，不是收入沖銷。
      #    做成收入沖銷會同時少計負債與少計收入，兩邊都錯，且 nightly 恆等式抓不到（兩個錯誤互相抵銷）。
      refund_to_instrument_is_liability_increase: true
      # 恆等式（property test，integer cents）：任一時點皆成立
      invariant: "Σ liability_increase − Σ liability_decrease − Σ breakage_recognised == Σ outstanding_balance_cents"
      # 🔴 **明確宣告的 false，不是「沒填」**（56 §0.2 原則 2：未宣告 ≠ none）。
      #    原 `limits.gift_card.resolver_refuses_start_when_undecided: true` 已移入 `tw.accounting`；
      #    但「tw 有、hk 沒有」在程式上長得像「hk 忘了填」。實作者讀到 nil 時若沿用預設 true，
      #    禮品卡在香港就**永遠無法啟用**（HK 的 tax_event_* 本來就不存在 ⇒ 條件永遠成立）。
      #    56 §E.1 把此列為危險等級**最高**（功能永久不可用）——所以這裡要寫出來。（57 §G-06）
      gift_card_resolver_refuses_start: false
      # ⚠ V-28：breakage 的估計方法與**首年無歷史兌換資料**時的處置未覆核。
      #   定案前保守側錯：**不認列 breakage**（負債留著），不得為了帳面好看提前認列。
      breakage_recognition_when_undecided: defer_all
      # breakage 需要「預期兌換模式」的估計 ⇒ 需要歷史兌換率 rollup；專案內無此 rollup（56 §B.3.1 J-02）。
      # 🔴 `defer_all` 是**行為**不是**藉口**：仍要建 rollup 並累積資料，否則永遠湊不出估計基礎。
      breakage_requires_redemption_rate_rollup: true
      breakage_rollup_min_history_months: null        # ⚠ 待查證，與估計方法同屬 V-28，不得自訂
      verify_breakage_method: true
      # ⚠ V-29（＝55 號 V-22 的 HK 版）：商店抵用金是合約負債還是退款負債（refund liability）未覆核。
      #   問題**沒有消失，只是從稅務變成會計**——影響收入認列金額，不影響任何憑證。
      #   TW 的二選一（付款方式／折扣）決定**發票金額**；HK 的二選一決定**收入認列金額**，差額同樣等於
      #   抵用金全額。🔴 兩者答案**不可互相套用**：TW 定案了不代表 HK 定案。（57 §G-07）
      store_credit_on_issue: null
      store_credit_on_use: null
      # 定案前的行為：**不阻擋發放與使用**（金流照走），但每一筆落一列 `contract_liability_entries`
      # 且 `basis: 'undetermined_v29'` ＋ 開人工覆核工單。🔴 **不得**比照 tw 的
      # `resolver_refuses_start_when_undecided`——那會讓抵用金在香港永遠無法啟用（同 G-06 的病根）。
      store_credit_when_undecided: record_with_undetermined_basis
      store_credit_resolver_refuses_start: false
      verify_store_credit_liability_class: true
      # ⚠ V-30（＝55 號 V-24 的 HK 版）：chargeback lost 的會計處理未覆核 → 不自動沖銷，開人工工單。
      chargeback_lost_treatment: null
      verify_chargeback_lost_treatment: true

    # 【privacy_regime】PDPO（個人資料（私隱）條例），**不是**台灣個資法。（hk-user，已查證）
    privacy_regime:
      kind: pdpo_hk
      # ⚠ V-26：DSR 法定回覆天數、資料外洩通報是否強制與時限、跨境傳輸條文的生效狀態——皆未覆核。
      #   定案前沿用 38:885 的既有處置：以「已宣告 pack 中最嚴者」為內部 SLA，UI 標「法定期限待確認」。
      dsr_statutory_days: null
      breach_notification_hours: null
      breach_notification_mandatory: null
      cross_border_transfer_rule: null
      log_retention_years: null
      fallback_sla_source: strictest_enabled_pack
      verify_pdpo_details: true

    # 【tax_id_format】HK 是 BR number（商業登記號），**不是**統編。（hk-user，已查證）
    # 🔴 36:457／36:1646 的 `tax_id VARCHAR(8)` 是**寫死的台灣假設**，BR number 放不進去
    #    ⇒ schema 級待修（56 §D.1 P0）。
    tax_id_format:
      label: BR number
      regex: null
      checksum_rule: null
      length: null
      # TW 有「前台須揭露營業人名稱與統編」的義務（38:1444）；HK 是否有等價義務未覆核。
      storefront_disclosure_required: null
      verify_br_number_format: true            # ⚠ V-25

    # 【pickup_networks】⚠ hk-secondary（第三方 Shopify app 供應商說明頁＋業者頁面，URL 見 56 §H）：
    #   順豐（SF Express）聚合的自取網絡＝EF Locker 智能櫃／順豐站（Service Centre）／
    #   合作便利店（7-Eleven、Circle K、VanGO），逾 1,000 點。
    # 🔴 **合約值一律未查證**：COD 是否支援與上限、材積／重量、離島限制、領件身分驗證方式、
    #    API 與回拋契約——**不得**把台灣的 NT$20,000／三邊和 105cm／5kg 換算過來充當 HK 值。（V-27）
    pickup_networks:
      available: true
      # 三層模型（carrier → network → brand）；TW 是兩層（carrier == brand，ECPay 直接對應四大超商）。
      # 差異六項見 56 §B.4。
      model: carrier_network_brand
      providers: null
      cod_supported: null
      cod_max_cents: null
      max_dimension_sum_cm: null
      max_weight_kg: null
      identity_at_pickup: null
      outlying_island_rule: null
      verify_hk_pickup_contract_values: true

    # 【address】地址表單的**預設形態**（不是法域能力閘門，見 checkout.address_field_*）。
    # 🔴 每一鍵都只是**預設值**，商家可在後台逐市場覆寫（2026-08-12 裁定）。
    address:
      # 郵遞區號預設 `optional`（顯示、可空、不阻擋），**刻意不用 `hidden`**：
      #   「香港不使用郵遞區號」是上一輪未查證就下的結論。用 `hidden` 當預設，等於把同一條
      #   未查證假設換個位置繼續寫死；用 `optional` 則兩邊都不賭——想收的商家改 `required`、
      #   確定用不到的商家改 `hidden`，兩個方向都只是改設定，不用改程式。
      #   （若日後 V-34 查證確認香港確實無郵遞區號制度，再把預設改成 hidden 即可。）
      postal_code: optional
      postal_code_regex: null                  # ⚠ V-34 未查證 ⇒ 不得臆造格式來擋輸入
      postal_code_label: null
      verify_hk_postal_code_usage: true        # ⚠ V-34
      # 電話：上一輪寫死 `^[2-9]\d{7}$`（香港 8 碼）**且直接阻擋送出**——同樣是未查證的假設
      # 被寫成硬行為。規則本身應該是 per-jurisdiction 設定，而未查證的規則不得阻擋使用者。
      phone_regex: null                        # ⚠ V-35 未查證（8 碼／首位數字域／固網與流動是否同式）
      phone_enforcement: warn                  # off | warn | block（商家可覆寫）
      phone_min_digits: 6                      # 法域無關的防呆下限，**不是**格式主張
      verify_hk_phone_format: true             # ⚠ V-35

    # 【currency_format】HKD；symbol／position／grouping 為 ISO 4217 慣例（hk-secondary）。
    #   CLAUDE.md 鐵律 10 的示例 `HK$1,480` 是整數金額的顯示樣態，不代表 exponent 為 0。
    currency_format:
      default_currency: HKD
      symbol: "HK$"
      exponent: 2               # ＝ISO 4217 值，同時符合 currency_display.force_minor_unit_digits
      symbol_position: prefix
      grouping: [3]
      # 是否隱藏 .00：**不隱藏**（`currency_display.force_minor_unit_digits: 2` 一律顯示兩位）。
      # 29 §3.3 的 rounding 設定管的是**金額本身**怎麼進位，不是顯示位數，兩者不要混。
      verify_hkd_display_convention: true

    # 【consumer_rights】香港**無**通訊交易的法定鑑賞期；適用 TDO（不公平營商手法）與
    #   SGO（貨品須有令人滿意的品質、符合說明）。
    #   出處（hk-secondary）：立法會秘書處《E-consumer protection》ISE08/19-20，URL 見 56 §H。
    # 🔴 反直覺結論：在 HK **不是少做一件事，而是多做會出事**——16-F7.4(b) 的 B2「法定管道恆存在」
    #    若照搬到 HK，等於對買家宣稱一個不存在的法定權利，本身可能構成 TDO 的不實陳述／誤導性遺漏。
    #    **HK 市場不得出現「依法申請解約」入口**。（56 §E.1）
    consumer_rights:
      cooling_off_days: null
      statutory_channel_required: false
      statutory_channel_forbidden: true        # 🔴 不得提供
      statutory_reason_code: null
      applicable_laws: [TDO, SGO]
      # 消費者委員會 2018 年報告倡議特定行業強制 7 天冷靜期，**尚未立法** → 追蹤項。
      pending_legislation_watch: mandatory_cooling_off_specific_trades
      verify_hk_consumer_law_details: true     # ⚠ V-33

    # 【invoice_document】買家收到的單據＝**純商業收據**，無稅務效力。（hk-user，已查證）
    invoice_document:
      kind: commercial_receipt
      mandatory: false
      numbering_authority: merchant            # 商家自行編號，無政府字軌
      amendment_mechanism: free_form           # 直接改開／註記，無「作廢重開」的法定程序
      must_state_not_a_tax_document: true      # 單據上必須明示「本文件非稅務憑證」
      retention_years: null
      verify_hk_receipt_requirements: true

  # ---------------------------------------------------------------------------
  # 台灣（既有內容歸位處；**未啟用**，待台灣市場開通時實作）
  # ---------------------------------------------------------------------------
  # 🔴 本 pack 的內容**全部來自既有規格，一行未刪**，只是從「核心設定」降級為「tw pack 素材」。
  #    來源檔案與章節對照表見 56 §C.1。
  tw:
    enabled: false
    display_name: 台灣
    country_codes: [TW]
    # 🔴 啟用前必須先結案的待查證（55 號已證明這些未定案項會導致重複開立／漏開）：
    enable_gate: [V-04, V-05, V-06, V-20, V-21, V-22, V-23, V-24]

    # 【tax_invoice】統一發票（政府強制、字軌管制、作廢／折讓／補開皆有法定程序）。
    # 🔴 以下 whole block 為 55 號建立的頂層 `einvoice:` 原樣搬入（縮排＋4，內容一字未改）。
    #    官方層級全部是 ours：Shopify **不開立台灣統一發票**，46a/46b/46c 不可能是來源。
    tax_invoice:
      kind: gui
      issues_documents: true
      numbering_authority: government_track      # 字軌，由加值中心代辦
      void_mechanism: void_and_reissue
      allowance_mechanism: credit_note           # 折讓證明單
      reissue_mechanism: additional_invoice
      event_handling: issue_documents
      # 55 §D G-01 的既有處置——🔴 **只在本法域生效**（HK 為 false，見 hk.tax_invoice）。
      # 呼叫端：`docs/specs/16` F5.5(a) 的 V-23 擋單註記（57 §G-01 補上法域條件）。
      block_multi_fulfillment_when_undecided: true
      # --- 字軌與憑證監控（出處：docs/specs/38:1467、38:1265、38:910，ours 轉述 33 §2.14）---
      track_low_ratio: 0.15            # 餘量低於 15% 開 track_low 告警（38 明言「台灣營運最常見的事故來源」）
      cert_warn_days: 60               # 工商憑證到期前 60 天示警

      # --- 開立時機（出處：docs/specs/38:876，ours，逐字「付款／**出貨（建議）**／收貨」三選一）---
      issue_timing_options: [on_payment, on_fulfillment, on_delivery]
      issue_timing_default: on_fulfillment
      # ⚠ 待查證 V-23：`on_fulfillment` 在**部分出貨**（一張訂單分多次出貨）時的開立粒度——
      #   「每次出貨各開一張」與「全部出完才開一張」互斥；38:876／33 §2.14 只寫「出貨」，未定義多次出貨。
      #   🔴 定案前：`on_fulfillment` ＋ 多次出貨的組合**一律擋下並轉人工佇列**，不得靜默選一邊。（55 §D G-01）
      partial_fulfillment_issue_granularity: null
      verify_partial_fulfillment_granularity: true

      # --- 上傳／作廢／折讓的法定期限（全部未覆核）---
      # ⚠ V-06（52 號既有）：38:885 逐字「『48 小時上傳』來自媒體整理，建議以財政部《電子發票實施作業要點》
      #   原文複核——**不得寫死**」；作廢是否受「該期別申報前」限制 33 未載。
      upload_deadline_hours: null
      verify_upload_deadline: true
      void_window_policy: null                 # 對應 38:1356 的 EinvoiceVoidPolicy.window_open? 掛勾
      verify_void_window: true
      allowance_deadline_days: null            # ⚠ V-06 延伸：折讓證明單的開立期限，38 未載
      verify_allowance_deadline: true

      # --- 折讓／作廢的路由不變量（55 §B.2 收斂版，修正 38:1341 的單張單次判定）---
      # 🔴 38:1341 原本用 `refund.amount_cents >= invoice.total_cents` 只看**本次**退款額：
      #    兩次各退 60% 會開出兩張各 60% 的折讓 ⇒ 折讓總額 120% > 發票金額 ⇒ 稅務申報錯誤且不可逆。
      allowance_cumulative_cap: invoice_total          # Σ allowances(per invoice) ≤ einvoices.total_cents
      allowance_cap_enforcement: conditional_update
      # 作廢窗已關時**降級為全額折讓**（不是失敗）——38:1356 的掛勾原本從未被 router 呼叫。（55 §D G-03）
      void_window_closed_fallback: full_allowance
      # 開立在途（state='issuing'）時發生退款 ⇒ **延後重試**，🔴 不得判為 no_invoice 而 no-op。（55 §D G-10）
      defer_when_issuing: true
      # 一張訂單可有多張發票（訂單編輯加收補開、以及 V-23 若定案為「每次出貨各開一張」）。
      # 🔴 **不得**對 `einvoices(shop_id, order_id)` 建唯一索引——38:1346 的 `refund.order.einvoice`（單數）
      #    與 16-F5.5 的「補開一張」直接矛盾，此鍵為裁決結果。（55 §D G-04）
      multiple_invoices_per_order_allowed: true
      # 多張發票的沖銷順序：能追溯到品項的先沖該張；不能追溯者 LIFO（後開的先沖，離作廢窗關閉最遠）。
      # ⚠ 無官方來源，本專案決策。
      allowance_offset_order: traceable_then_lifo

      # --- 折讓基數（55 §B.3 的收斂定義）---
      # 基數＝**實際金流退款額**（Σ F5.4 的 allocation），不是 suggested_refund 名目值、不是退貨品項價值。
      # 退貨費用不需再扣一次（它們在 F5.1 的 net 階段就沒被退出去；重複扣 ⇒ 短報銷貨退回）。
      allowance_base: actual_cash_refund
      # ⚠ V-20（54 號，本輪**擴大至商店抵用金**）＋ V-22：兩者是否計入折讓基數皆未定案，暫扣除。
      allowance_base_excludes: [gift_card_allocation, store_credit_allocation]
      verify_allowance_base: true
      # 稅額拆分：未稅 floor、稅額用差額法 ⇒ 保證 `未稅 + 稅 == 含稅` 精確相等（無 1 分錢漂移）。
      # ⚠ 法定捨入方向未覆核；此為本專案決策的機械規則。
      allowance_tax_split: floor_untaxed_then_difference

      # --- 買方與載具（出處：docs/research/42:518–523，ours，我方依台灣法規自訂）---
      buyer_types: [b2c, b2b]
      carrier_types: [member, mobile_barcode, natural_person_cert]
      mobile_barcode_regex: '^/[0-9A-Z.+-]{7}$'
      natural_person_cert_regex: '^[A-Z]{2}[0-9]{14}$'
      donation_code_length_range: [3, 7]
      tax_id_length: 8
      # ⚠ V-04（52 號既有）：42:520 的統編檢核為舊規則（權重 1,2,1,2,1,2,4,1）；
      #   財政部是否已放寬（新增「可被 5 整除」）**須以原文覆核**，不得臆測。
      verify_tax_id_checksum_rule: true
      # 營業稅率（basis points）。**我方依台灣法規自訂**；專案內既有假設見 docs/specs/16:360 算例 2「TW 5% 內含」。
      # 法規原文未由本專案覆核 → 保留 verify 旗標（含稅反推公式在 16-F5.1 X1／55 §B.3）。
      business_tax_rate_bp: 500
      verify_tax_rate_source: true

      # --- 對帳（55 §B.2 不變量 2／§D G-24）---
      # nightly 斷言：Σ 該訂單 issued 發票金額 − Σ 折讓 == Σ 實收金流。38:1509 的 ReconcileJob 只對字軌，不對金額。
      reconcile_invoice_vs_cash: true
    # 【consumption_tax】營業稅。稅率鍵沿用上方 tax_invoice.business_tax_rate_bp（⚠ V-04／未覆核），
    #   不另立第二處真相。
    consumption_tax:
      kind: business_tax
      rate_bp_ref: jurisdictions.tw.tax_invoice.business_tax_rate_bp
      taxes_included_default: true             # 16-F5.1 X1「含稅定價（台灣預設）」
      zero_rated_exports: null                 # ⚠ 55 §D G-21 外銷零稅率規則未覆核
      verify_zero_rated_exports: true

    # 【stored_value_regime】《電子支付機構管理條例》（37 §3、37:479–491、37:895 的 TW-9 鐵律）。
    stored_value_regime:
      kind: epayment_act
      no_fund_pooling: true                    # 不代收代付、不保管資金；後台不得出現「平台錢包／提現」
      cross_shop_redemption_allowed: false
      platform_wide_instrument_forbidden: true
      verify_epayment_act_scope: true

    # 【accounting】台灣的禮品卡／抵用金問題是**稅務時點**（開立時 vs 兌換時），不是會計分類——
    #   與 HK 的 HKFRS 15 合約負債是**不同性質的問題**，不可互相套用。（56 §B.3、§E.1）
    accounting:
      framework: null
      gift_card_on_sale: null                  # ⚠ V-21（原 limits.gift_card.tax_event_on_issue）
      gift_card_on_redeem: null                # ⚠ V-21（原 limits.gift_card.tax_event_on_redeem）
      gift_card_on_expire: null                # ⚠ V-21（原 limits.gift_card.tax_event_on_expire）
      store_credit_on_issue: null              # ⚠ V-22（原 limits.store_credit.tax_event_on_issue）
      store_credit_on_use: null                # ⚠ V-22（原 limits.store_credit.tax_event_on_use）
      chargeback_lost_treatment: null          # ⚠ V-24（原 limits.dispute.tax_event_on_lost）
      verify_tw_voucher_tax_treatment: true
      verify_tw_store_credit_tax_treatment: true
      verify_chargeback_tax_treatment: true
      # 🔴 原 `limits.gift_card.resolver_refuses_start_when_undecided: true` 移到這裡並**限定本法域**：
      #    照搬到 HK 會讓禮品卡永遠無法啟用（HK 的 tax_event_* 本來就不存在）。（56 §E.1）
      resolver_refuses_start_when_undecided: true

    # 【privacy_regime】《個人資料保護法》。
    privacy_regime:
      kind: pdpa_tw
      dsr_statutory_days: null                 # ⚠ V-07／38:885、38:1146 逐字「待定，需使用者確認」
      breach_notification_hours: 72            # 38:1012 `pdpa_incidents`
      breach_notification_mandatory: true
      breach_clock_start: null                 # ⚠ V-07：起算點是「知悉」或「發生」，33 未載
      log_retention_years: 5                   # 38:1701、38 §12 C1（與 PCI 12 個月衝突，取嚴）
      verify_pdpa_details: true

    # 【tax_id_format】統一編號。
    tax_id_format:
      label: 統一編號
      length_ref: jurisdictions.tw.tax_invoice.tax_id_length          # 8
      checksum_rule: weighted_1_2_1_2_1_2_4_1
      verify_tax_id_checksum_rule: true        # ⚠ V-04（是否含「可被 5 整除」的放寬）
      storefront_disclosure_required: true     # 38:1444 前台合規巡檢「揭露的統編必須等於 shops.tax_id」

    # 【pickup_networks】超商取貨（原 `limits.pickup_point` 的台灣段，原樣搬入）。
    pickup_networks:
      available: true
      model: carrier_equals_brand              # 兩層；HK 是三層 carrier→network→brand
      # 台灣通路對應 ECPay LogisticsSubType。出處：docs/research/42:521–540（ours，已查證 ECPay 合約）
      providers:
        unimart:  { name: "7-ELEVEN", subtypes: [UNIMART, UNIMARTC2C, UNIMARTFREEZE] }
        fami:     { name: "全家",     subtypes: [FAMI, FAMIC2C] }
        hilife:   { name: "萊爾富",   subtypes: [HILIFE, HILIFEC2C] }
        okmart:   { name: "OK",       subtypes: [OKMARTC2C] }
      # 貨到付款（超商代收）金額上限。出處：docs/research/42:530（ours，超商代收慣例）
      cod_supported: true
      cod_max_cents: 2000000                   # NT$20,000（原 pickup_point.cod_max_amount_twd: 20000）
      # 材積／重量慣例上限。出處：docs/research/42:530（ours，超商慣例，非官方文檔）
      max_dimension_sum_cm: 105
      max_weight_kg: 5
      identity_at_pickup: mobile_number_and_id # 42:537 逐字「以手機號＋證件領件」
      outlying_island_rule: cvs_outside_flag   # 42:538 外島門市常排除（CVSOutSide=1）
      # ⚠ 以上 COD 上限與材積限制為業界慣例值，非 Shopify 官方文檔；各物流商合約值須逐一覆核。
      verify_tw_carrier_limits: true           # ⚠ V-11

    # 【cod】宅配到府代收的台灣慣例值（原 `limits.cod` 的台灣段）。
    cod:
      # 常見手續費區間（TWD cents）。出處：docs/research/42:542（ours，業界慣例，**非官方文檔**）
      # 這是 UI 預設值提示用的區間，**不是硬約束**——實際值存 `shipping_rates.cod_fee_cents`。
      fee_cents_default_range: [3000, 6000]
      # 代收手續費是否課稅。⚠ V-16：台灣實務有兩種做法，官方文檔無載 → 暫定不課稅。
      # 🔴 本鍵在 HK 為 **N/A**（無消費稅 ⇒ 沒有「是否課稅」這個問題）。
      fee_taxable: false
      verify_fee_taxable: true

    # 【address】地址表單的**預設形態**（同 hk：只是預設值，商家可逐市場覆寫）。
    address:
      postal_code: required                    # 台灣地址實務上會收；商家仍可改 optional/hidden
      postal_code_regex: '^\d{3}(\d{2}|\d{3})?$'
      postal_code_label: 郵遞區號
      verify_tw_postal_code_format: true       # ⚠ 3+2／3+3 的並行狀態未由本專案覆核
      # ⚠ 原型原本用 `^09\d{8}$` **阻擋**送出——那條式子只涵蓋行動門號，市話（02-…）一律被擋。
      #   規則保留為 pack 資料，但 enforcement 降為 warn，與 hk 同一條裁定精神。
      phone_regex: '^09\d{8}$'
      phone_enforcement: warn                  # off | warn | block（商家可覆寫）
      phone_min_digits: 6
      verify_tw_phone_format: true             # ⚠ 市話／預付卡／境外門號未涵蓋

    # 【currency_format】TWD。
    currency_format:
      default_currency: TWD
      symbol: "NT$"
      # 🔴 exponent 2 是**產品決策**（`currency_display`，2026-08-12 裁定「所有國家的貨幣金額
      #    都顯示兩位小數」），**不是** ISO 4217——ISO 給 TWD 的 minor unit 是 0，
      #    42:508 也記著「TWD exponent=0 實務顯示整數」。看到 2 不要當 bug 改回 0。
      exponent: 2
      symbol_position: prefix
      grouping: [3]

    # 【consumer_rights】《消費者保護法》第 19 條七日解約權（原 `limits.return.tw_*`，原樣搬入）。
    # 🔴 處置＝**軟 guard 不是硬下限**（16-F7.4(b)、54 §P1-31）；三個理由見原註解。
    consumer_rights:
      cooling_off_days: 7
      verify_cooling_off_source: true          # ⚠ 法規原文須覆核（原 verify_tw_minimum_window）
      enforcement: warn                        # warn | block（**不得**改成 block）
      statutory_channel_required: true         # 真正的合規保證是 B2：法定管道恆存在
      statutory_channel_forbidden: false
      statutory_reason_code: STATUTORY_WITHDRAWAL_TW
      applicable_laws: [消保法, 通訊交易解除權合理例外情事適用準則]
      exceptions_source: null                  # ⚠ V-17：例外品類清單不得由本規格臆測

    # 【invoice_document】統一發票本身即稅務憑證，與商業收據不是同一份文件。
    invoice_document:
      kind: tax_document
      mandatory: true
      numbering_authority: government_track
      amendment_mechanism: void_or_credit_note
      must_state_not_a_tax_document: false
      retention_years: null                    # ⚠ 未覆核

# =============================================================================
# 14c. 爭議與退單（租戶側；55 號盤點新增。平台側完整規格見 docs/specs/37 §爭議與風控）
# =============================================================================
# 🔴 平台側 `disputes` 表齊備（37:986）但**租戶側完全無模型**：`order_transactions.kind` 沒有 chargeback，
#    `OrderDisplayFinancialStatus` 8 值也沒有爭議態 ⇒ 訂單頁看不到「這筆被爭議了」，仍顯示 PAID。（55 §D G-18）
dispute:
  tenant_transaction_kinds: [chargeback, chargeback_reversal]   # ours
  # 負餘額 180 天由平台承擔。出處：docs/specs/37:531（ours，33 §2.6）
  negative_balance_deadline_days: 180
  # 🔴 敗訴的稅務／會計後果已搬到 `jurisdictions.<code>.accounting.chargeback_lost_treatment`。
  #    TW＝是否構成銷貨退回而應開立折讓（V-24）；HK＝HKFRS 下如何沖銷（V-30，無折讓可開）。
  #    兩者定案前的處置相同：**不自動沖銷，開人工工單由合規窗口判定**。
  accounting_ref: jurisdictions.<code>.accounting

# =============================================================================
# 15. Markets 繼承（P1-32）
# =============================================================================
market:
  # 父子關係**由 conditions 自動推導**，不是手動指定的欄位。
  # 出處：46b:636–639（dev）逐字「parent 不是手動指定的，是自動推導的（lineage inference）」；
  #       46b:664 逐字「沒有 `inherited: Boolean` 這種顯式旗標，也沒有 `parentMarketId` 欄位」。
  # 🔴 我方 29:42 原本把 `parent_market_id` 當權威欄位存 → 商家改 regions 後父子關係不會變。已改為 derived 快取。
  parent_resolution: derived_from_conditions
  parent_column_is_cache: true            # markets.derived_parent_market_id
  # 命中優先序（buyer 同時命中多市場）。出處：46b:641–648（dev）
  specificity_stack: [company_location, retail_location, region, store_default]
  # 繼承語義：NULL ＝ 繼承。出處：46b:650–664（dev）
  inheritance_additive: [catalogs, web_presences]
  inheritance_override: [currency_settings, price_inclusions]
  # ⚠ V-02：`delivery.shipping` 到底繼不繼承——46b:659–661「Null means the market inherits shipping from its parent」
  #   vs 44:866「運送與隱私權不繼承，永遠市場本地」。**直接矛盾，未定案前不得預設任一邊**。
  shipping_inherits: null
  verify_shipping_inheritance: true
  # UI 有 8 個可繼承維度（44:862 實測），公開 API 只對 4＋1 個有官方語義（46b:788）。
  # 其餘 4 個標「Shopify 公開 API 未載明，本專案決策」。
  ui_inheritable_dimensions:
    [currency, catalogs, discounts, theme, checkout_profile, domain_and_language, tax_and_duties, return_rules]
  api_documented_dimensions: [catalogs, web_presences, currency_settings, price_inclusions]
  # ⚠ 每店 markets 總數上限／巢狀層數上限／MarketUserErrorCode：46b:993–1010 逐條標未載明。
  #   社群的「50 markets」說法**未經官方證實，勿引用**。
  max_markets_per_shop: null
  max_nesting_depth: null
  verify_market_limits: true

  # --- 新市場的 web presence 預設（62 §J.2；依 68 號 §C-2 跟隨 Shopify 做法新增）--------
  # 🔴 **預設值與建議值是兩件事，Shopify 刻意把它們拆開，我方照做。**
  # 原本 62 §J.2 只寫「預設＝子資料夾」一個值，把兩者壓成一個 ⇒ 商家每開一個市場就靜默多一份站點。
  # Shopify 實際做法（出處：changelog.shopify.com/posts/
  #   subfolders-are-no-longer-created-by-default-for-new-markets，**2023-05-23**，dev）：
  #   在此之前新的單國市場會**自動建立語言／國家子資料夾**；此後**新市場預設沿用 primary market 的
  #   URL 結構**，子資料夾改為商家自行設定。
  # 建議值（help.shopify.com/en/manual/international/managing-international-domains，help）：
  #   首次設定國際銷售**建議**子資料夾（設定簡單、共享網域權重）——這一條我方一致，維持。
  # 🔴 **為什麼不是雞毛蒜皮**：自動配子資料夾＝新增一批可索引 URL、一批 hreflang 條目、一批
  #    sitemap 列。Shopify 在 2023 專門為此發 changelog 把它關掉，方向很明確——
  #    **多市場的 URL 增生必須是商家的明示動作。**
  # 🔴 **防回退**：看到 `inherit_primary` 不要當成「還沒設定好」而改成 subfolder。
  #    要改的是 UI 建議值（ui_recommended_strategy），不是這個鍵。
  web_presence:
    default_for_new_market: inherit_primary      # 繼承 primary web presence 的網域與 URL 結構
    auto_create_subfolder_on_market_create: false
    ui_recommended_strategy: subfolder           # 建議值（help）；建議 ≠ 預設
    # 四種可選策略（help 同頁）。URL 參數（?loc=de）Google 明文不建議 ⇒ 我方不提供（62 §J.1）。
    strategies_allowed: [primary_domain_only, cctld, subdomain, subfolder]
    # domain 與 subfolderSuffix 互斥（XOR）；語言-only 子資料夾僅限 primary market（29 §1.2）。
    domain_xor_subfolder: true
    # 建議獨立網域的判準一律走法域能力，不得寫國別 if-else（鐵律 11；62 §J.2）。
    local_domain_recommendation_source: jurisdiction_pack_capability

# =============================================================================
# 16. B2B（P1-33／H-64～H-68；規格見 29 §10、契約見 28 §13b）
# =============================================================================
b2b:
  # 出處：46b:898–904（help + dev）
  max_companies_per_shop: null            # 官方逐字「Unlimited」
  max_locations_per_company: 10000
  max_contacts_per_company: 10000
  max_contacts_per_location: 50           # 🔴 最容易漏的一條（與 per company 的 10,000 差兩個數量級）
  max_catalogs_per_location: 25
  max_prices_per_price_list_request: 250
  max_companies_per_customer: 1           # 逐字「can add a customer only to one company」
  # B2B market catalog 指派：Basic/Grow/Advanced 3；Plus unlimited。出處：46b:905（help）
  max_market_catalogs_non_plus: 3
  # 方案要求：Shopify Plus 才有 B2B（dev store 例外）。出處：46b:906（dev）
  requires_plus: true
  # 不支援的購買選項。出處：46b:907（dev）
  unsupported_purchase_options: [subscriptions, pre_orders, try_before_you_buy]
  # 🔴 掛載鐵律（H-64）：以下一律掛 company_location；company 層只有 name/note/default_role/main_contact。
  # 出處：46b:817–830（dev + help）逐字「Catalogs attach exclusively to company locations, not companies.」
  location_scoped_settings:
    [catalog, payment_terms, tax, checkout_config, currency, locale, billing_address, shipping_address]
  company_scoped_settings: [name, note, default_role, main_contact]
  # PaymentTermsType 5 值。出處：46b:881–889（dev）
  payment_terms_types: [FIXED, FULFILLMENT, NET, RECEIPT, UNKNOWN]
  # 多 catalog 解析取最低價；商品須至少發佈到一個 applicable publication。出處：46b:910–911（dev）
  multi_catalog_price_resolution: lowest
  # CompanyLocation.market 已 deprecated → 不得建 location→market 正向外鍵。出處：46b:830、46b:943（dev）
  location_to_market_fk_forbidden: true
  # ⚠ 標準 NET 7/15/30/45/60/90 內建清單：46b:892 逐字「文檔未載明」；CheckoutProfile 有無 company/location 欄位：46b:828 未載明。
  verify_net_terms_catalog: true

# =============================================================================
# 17. Shopify Functions（P2，先記錄不實作）
# =============================================================================
functions:
  # 每店每類上限。出處：46b:99–104、46b:964–969（dev）
  max_discount_functions_per_shop: 25
  max_validation_functions_per_shop: 25
  max_delivery_customizations_per_shop: 25
  max_payment_customizations_per_shop: 25
  max_cart_transform_per_app_per_shop: 1
  max_discounts_allocator_per_shop: 1
  # 資源限制。出處：46b:69–94、46b:953–963（dev）
  binary_max_kb: 256
  linear_memory_max_kb: 10000
  stack_max_kb: 512
  log_max_kb: 1
  max_instructions: 11000000
  input_max_kb: 128
  output_max_kb: 20
  input_query_max_bytes: 3000
  metafield_max_bytes: 10000
  list_argument_max_items: 100
  query_cost_max: 30
  # 本專案等價護欄（46b §1⑥-2 建議換算）。（ours）
  equivalent_guard_max_cart_lines: 200

# =============================================================================
# 18. 商品資料流（後台寫入 → 前台渲染 → 平台總後台）
# =============================================================================
# 出處：docs/specs/63-product-data-flow.md（本區塊全部鍵的唯一規格出處）
# 上游事實：docs/research/60 §1（無變體＝隱含變體）、§4（庫存五態官方定義）、§5（發布錯誤排序維度）；
#           docs/research/59 §2/§7（pill 收合、建立與詳情同元件）；
#           test/fixtures/themes/ella-7.2.0（golden theme 原始碼實測，出處等級 `fixture`）。
# 🔴 本區塊只新增鍵，不改既有鍵的值。
catalog_flow:
  # --- B. 商品與變體的寫入語義（63 §B）---------------------------------------
  # 商品恆有至少一個變體；「無變體」＝ variants.length == 1 的呈現特例。
  # 出處：docs/research/60:36–54（live，三張卡的分組 id 為 product_variant_collapsible_*）
  product_min_variants: 1
  # Liquid 對外必須吐這個字串（後台 UI 不得顯示）。
  # 出處：test/fixtures/themes/ella-7.2.0（fixture）——golden theme 四處直接比對：
  #   blocks/_color-comparison-content.liquid:20 / snippets/product-swatch.liquid:23 /
  #   snippets/card-product-flex.liquid:195 / snippets/product-card-compare.liquid:195
  # 不做 ⇒ 無變體商品在 Ella 渲染出空的變體選擇器（M6 golden theme 驗收直接失敗，27 §8）。
  default_variant_liquid_title: "Default Title"
  # **sku** 的權威表＝inventory_items（單一權威欄位，避免雙寫漂移）。63 §B.6
  # 佐證：docs/research/60:122（live）——庫存頁 checkbox value 為 gid://shopify/InventoryItem/…
  # 本尊佐證：InventoryItemInput.sku 是官方寫入面（2024-07 起）。
  sku_owner: inventory_item
  # 🔴 **barcode 不跟著搬**（2026-08-15 parity 查證修正）。
  #    本尊的 `InventoryItem` 型別**根本沒有 barcode 欄位**，`InventoryItemInput` 也沒有
  #    ⇒ barcode 就在 `ProductVariant` 上。
  #    ⚠️ 原註釋寫「sku/barcode 的權威表＝inventory_items」，那是 bug——兩個欄位不同命。
  #    🔴 **db/schema.rb 目前是對的**（product_variants.barcode 存在）——
  #       任何人「照舊規格修 schema」都會把它改壞。
  barcode_owner: product_variant
  # SKU 是**軟唯一**：官方要求唯一、偵測到重複顯示警告但**不阻擋**。
  # 出處：docs/research/61 §1.5（help P10）。⇒ DB 建**一般索引** (shop_id, sku)，不是唯一索引；
  #      唯一索引會讓「同款不同包裝共用 SKU」與 CSV 批次匯入（合法情境）直接失敗，與官方相反。
  # 🔴 specs/11 §2-1 把「SKU per shop」列為唯一索引的例子——**那個例子是錯的**（63 §L-1）。
  sku_unique_per_shop: false
  # 重複時回 payload 的 `warnings`（不是 userErrors——後者代表操作失敗，鐵律 4）。28 §0.3 目前沒有
  # warnings 慣例，需補（63 §L-9）。
  sku_duplicate_action: warn_not_block
  # 官方措辭是「建議不超過 16 字元」——**建議不是技術上限**，硬上限官方未載明 ⇒ 不驗證，只在 UI 提示。
  sku_recommended_max_chars: 16
  # ⚠ V-91：要不要提供「SKU 必須唯一」設定項以服務有 WMS 整合的商家（比官方嚴）——需使用者裁定。
  verify_sku_strict_mode_option: true
  # ProductInput / ProductUpdateInput 不得出現的欄位（schema 快照測試斷言）。（ours，63 §B.1 B1-5）
  # 一旦出現過一次，前端就會有人用它，之後兩套價格欄位的同步邏輯會爛掉（60:54 逐字警告）。
  product_input_forbidden_fields:
    [price, compareAtPrice, sku, barcode, weight, inventoryQuantity]
  # admin 商品頁「儲存」的唯一映射（全樹宣告式 upsert；建立與更新同一支）。（ours，63 §B.4）
  product_write_entry_mutation: productSet
  # 變體價格的合法寫入路徑（其餘一律 userErrors）。（ours，63 §B.3）
  variant_price_write_mutations: [productSet, productVariantsBulkUpdate]
  # 商品寫入路徑不得寫庫存數量；唯一例外＝建立頁的初始量（同 transaction，冪等鍵由父請求派生）。
  # 出處：docs/research/59:172（live，建立頁有「數量」input、詳情頁只有逐地點表格）
  initial_quantity_allowed_on_create_only: true

  # --- D. 前台渲染與快取（63 §D）---------------------------------------------
  # 🔴 唯一許可的快取策略。delete-based 失效的失敗是靜默的（顯示舊價格且沒有人會知道）。
  # 出處：docs/specs/11 §4-3（既有：cache key 永遠 key-based expiry，不手動 delete）
  cache_strategy: key_based_expiry_only
  # cache key 必須覆蓋的資料維度。漏一個＝顯示舊值，這是 key-based 策略的唯一真實風險。
  cache_stamp_sources:
    - products.updated_at
    - products.variants_updated_at
    - products.publications_updated_at
    - products.media_updated_at
    - shops.catalog_version
    # 包 32（2026-08-31）：markets 表已建 ⇒ 依 cache_stamps_spec 絆線改帶前綴現況寫法
    # （原規劃名 `market_settings_version`，2026-08-25 D2 曾標「欄位尚未存在」）。
    # 市場鏈子表寫入（regions／presences／白名單開關）以 belongs_to touch 鏈 bump 到本欄——
    # 市場繼承解析結果變了，商品 updated_at 一動也沒動（63 §G.5）。
    # 🔴 消費端（步 2 頁級快取）取 stamp 要沿 **resolved lineage** 取 max(updated_at)，
    #    不是只看當前 market 一列（父市場改設定，子市場的解析結果也變）；
    #    market_settings 表（NULL=繼承）落地時沿同一欄，不另立來源。
    - markets.updated_at
    # S10（D76，2026-08-30）：`price_lists` 表已建 ⇒ 依 cache_stamps_spec 的絆線改帶前綴現況寫法。
    # price list 是 catalog 級聚合（一 catalog 一張）⇒ 它自己的 updated_at 就是 stamp 欄，
    # 任何調價（百分比／模式／幣別）都會推進它；變體級固定價（M5 的 price_list_prices）
    # 落地時再加該表的 stamp 來源。
    - price_lists.updated_at
  # render 期記錄 drop 讀過哪些表，結束時斷言 touched_sources ⊆ cache_stamp_sources。
  # 把「漏維度」從人工紀律變成可執行斷言。（ours，63 §D.3）
  cache_stamp_selfcheck_envs: [development, test, staging]
  # HTML 不進 CDN（首發）。purge 是跨網路的分散式操作，會部分失敗、會靜默。（ours，63 §D.4）
  html_cdn_cache_enabled: false
  # 開啟 html_cdn_cache_enabled 前必須先做到的四條之二（另兩條見 63 §D.4）。
  cdn_surrogate_key_template: "s{shop_id}-p{product_id}"   # 🔴 必帶 shop 命名空間，否則跨租戶 purge
  cdn_purge_failure_action: degrade_to_max_age_zero        # 寧可全部回源，也不要顯示舊價格
  # volatile 欄位：讀到即把該 fragment 的 cache entry 加 TTL 上限（drop 內自動註冊，非人工標註）。
  # 出處：test/fixtures/themes/ella-7.2.0（fixture）——inventory_quantity 41 處／16 檔，
  #       其中 snippets/card-product-flex.liquid 是**商品卡**⇒ 集合頁卡片會退化成 TTL 快取。
  #       incoming 與 next_incoming_date 在 Ella 為 0 處，但仍列入（其他主題會用）。
  volatile_liquid_fields:
    ["variant.inventory_quantity", "variant.incoming", "variant.next_incoming_date",
     "variant.store_availabilities"]
  # ⚠ V-96：60 秒無真實流量佐證。太長 ⇒「僅剩 3 件」長期失真；太短 ⇒ 集合頁命中率崩。
  volatile_section_ttl_seconds: 60
  verify_volatile_ttl: true
  # 價格類欄位零容忍陳舊（它們天然被 cache_stamp 覆蓋，不需要 TTL）。（ours，63 §D.5）
  price_critical_fields_zero_staleness: true

  # --- E. 庫存（63 §E）---------------------------------------------------------
  # available_for_sale 只在「可買 ⇄ 不可買」翻轉時才寫 product_variants（bump updated_at）。
  # available: 5→4 不寫；1→0 才寫。同時解決快取命中率與「售罄要即時」兩個需求。（ours，63 §D.2）
  availability_materialization: flip_only
  # zh-TW 顯示用詞：**維持 specs/13 §F5.1 現況（help 官方那套：可販售／已分配／不可販售／待入庫）**。
  # 60 §4 建議改採「庫存頁那套」，但 docs/research/61 §3.2 指出那是**回退**——實站 UI 譯名在兩個頁面
  # 就已經不一致（不穩），help 文檔是唯一同時給出「術語＋定義＋恆等式」的錨。
  # ⚠ **V-52（61 號登記）**：三套譯名的最終取捨需使用者裁定。API enum 與恆等式在三套下完全相同，
  #    所以此項不阻擋實作；唯一硬要求是**全站只用一套**（逐頁不同正是 Shopify 自己犯的錯）。
  inventory_display_terms_source: help_official
  # 同一 (shop_id, inventory_item_id, location_id) 在窗內且仍 pending 的事件合併成一筆。
  # ledger 不合併（append-only 稽核帳，13 §F5-1），合併的只有事件。（ours，63 §C.6）
  inventory_event_coalesce_window_ms: 1000
  # 🔴 永不被合併掉：它驅動快取 stamp、JSON-LD availability、IndexNow、feed。
  #    漏掉＝已售罄的商品在前台還能加入購物車。
  inventory_event_coalesce_exempt: [availability_flipped]
  # 多地點：地點指派與 available 扣減必須同一 transaction；扣減失敗改派下一順位並重試。
  # 不做 ⇒ 兩個併發訂單都被指派到同一個只剩 1 件的地點 ⇒ 一張永遠出不了貨的訂單。（ours，63 §E.4）
  location_assignment_max_retries: 3

  # --- G. 多市場價格（63 §G）---------------------------------------------------
  # 中間值放大到 micro-cents，只在最後一步取整一次。逐步取整會累積 3 cents 誤差
  # 且不同呼叫順序得到不同結果（違反鐵律 7 數字同源）。（ours，63 §G.3）
  price_scale_internal: micro_cents
  # 匯率存 parts-per-million 的 BIGINT。29 §1.4 的 currency_exchange_rates.rate 未指定型別（63 §L-5）。
  exchange_rate_storage: rate_ppm
  # 依 68 號 §D-3 跟隨 Shopify 做法修正（2026-08-12）。
  # 原值 `[3]`，原註釋：「🔴 儲存尺度 ×100 不足以表達 exponent=3 幣別（KWD/BHD/JOD）的最小單位。
  #   首發擋下：market 建立時回 userErrors{code: INCLUSION}。⚠ V-94（63 §G.4）」
  # Shopify 實際做法（68 §D-3）：
  #   幣別代碼**支援**——`CurrencyCode` enum 含 KWD／BHD／JOD／OMR／TND（dev）；
  #   金額**四捨五入到 2 位**——商家以 API 送 `3.004`，Shopify 存成 `3.00`（press，community 147003）；
  #   顯示不一致（BHD 首頁 3 位、商品頁 2 位，press 197071）⇒ 官方沒有把 3 位小數做通；
  #   收款：Shopify Payments **不支援** Kuwait／Bahrain／Oman 開店（press 1069509）。
  #   ⇒ 本尊的實質做法是「**幣別代碼開放、金額當 2 位處理、精度損失不處理**」，不是「擋掉幣別」。
  # ⇒ 我方改成：**不擋幣別**（擋掉會讓 1:1 對齊出現一個 Shopify 沒有的缺口），改為下列三條。
  #
  # 🔴🔴 **不得把本條讀成「鐵律 3 放寬了」。** 改的是**幣別清單**，不是**金額邊界**：
  #    KWD 的 milli-unit 問題**依然無解**（`2.905` 存不進 ×100 的尺度，會落成 `2.90`）——
  #    Shopify 也是直接四捨五入，所以這是**跟隨的結果**，不是我方的缺陷；但它必須被寫下來，不能靠沉默。
  #    `money_boundary.max_supported_iso_exponent: 2` 與 `psp_undeclared_currency_action: reject`
  #    **一個字都不動**（65 號單位邊界契約）。市場建立期的閘門被移除之後，**PSP 邊界是唯一的執法點**。
  unsupported_currency_exponents: []
  # ① 幣別可選：market／price list 可選 exponent=3 幣別，建立時**不再**回 INCLUSION。
  exponent3_currency_selectable: true
  # ② 顯示與儲存一律 2 位小數——與 2026-08-12 裁定二（所有國家一律兩位小數）**天然吻合**，
  #    不需要任何例外邏輯（currency_display.force_minor_unit_digits: 2 已涵蓋）。
  exponent3_amount_decimals: 2
  # ③ 精度損失必須明文登記，不得靜默：KWD 2.905 ⇒ 落 2.90。
  #    建立 exponent=3 市場時 UI 必須明示此損失（形態同 58 §D 的 degradation report）。
  exponent3_precision_loss_disclosed_on_market_create: true
  # 🔴 收款仍受 PSP 邊界節制：該幣別要能結帳，PSP pack 必須**明文宣告** minor unit，
  #    且（因為 ISO 的 KWD exponent=3 與我方 ×100 的儲存尺度不同源）**必須同時宣告
  #    儲存精度不足時如何處理**；未宣告一律 reject（money_boundary.psp_undeclared_currency_action）。
  #    ⇒ 幣別可選 ≠ 可收款。這兩件事在 UI 上必須分開講，否則商家會開了店才發現不能結帳。
  # ✅ 依 69 號 §V-188（2026-08-12）：上面這兩項要求現在有了落腳的鍵——
  #    `psp_packs.<code>.amount_format`（先決條件，A0）＋ `minor_unit_overrides`＋
  #    `storage_precision_shortfall: reject`（見 0c 區塊與 65 §D.3）。
  #    🔴 並且 69 號證實 **Adyen／Datatrans 兩家都把這五個幣別宣告為 exponent 3**（`alt`）⇒
  #       「宣告 3 位」不是假想情境，是接上任一家就會立刻遇到的 ⇒ A2 這道閘門會真的被觸發。
  exponent3_checkout_requires_psp_pack_declaration: true
  # ⚠ V-94 的處置**已改變**（原＝首發擋下）：現為「可選、2 位、PSP 未宣告即 reject」。
  #    ⚠ V-188（68 §I）：Shopify 對 exponent=3 幣別**有無官方立場**通篇沉默，本條全靠社群回報。
  # 🔴 **63 §G.4 / 65 §A2·T11 / 55 金額測試矩陣仍寫著「market 建立時擋下」——那三處尚未更新**
  #    （本輪不得改 13/15/16/55/58/63/65）。實作前必須以本鍵為準，並回頭修那三處。
  verify_currency_exponent_3: true
  # 多 catalog 命中同商品取 MIN。官方 H-66 只講 company location，本篇延伸適用所有市場類型。
  # ⚠ V-93（不延伸就會有「兩個 catalog 命中時行為未定義」）。（ours，63 §G.2）
  multi_catalog_price_resolution: min
  verify_multi_catalog_min: true

  # --- H. 發布到銷售管道會失敗（63 §H.2）---------------------------------------
  # 出處：docs/research/60:139（live）——商品列表排序選單有「發布錯誤」維度。
  # 反推：發布不是商品上的布林欄位，而是跨系統的非同步操作，會失敗，且失敗要能排序。
  publication_retry_max_attempts: 5
  publication_retry_backoff_seconds: [30, 120, 600, 3600, 21600]
  # 🔴 發布是**兩層**的：商品級 ＋ 變體級，且是 AND 規則
  #（「要在某管道顯示，父商品與該變體必須都發布到該管道」）。
  # 出處：docs/research/61 §2.2（help P16）＋ docs/research/60:66（live，變體表有「發佈」欄）。
  # 我方原本只有商品級 ⇒ Product.published scope 不加變體層過濾會**洩漏未發布的變體**。
  variant_level_publishing: true
  # 官方明載**不能為個別變體設定排程發布日期**（排程只有商品級）。出處：61 §2.2（help P16）
  variant_publish_scheduling_allowed: false
  # 未發布到某目錄的變體**不套用**該目錄的定價調整 ⇒ PresentmentResolver 收集 catalog price 前
  # 必須先過 variant_publications 過濾（63 §G.2）。出處：61 §2.2（help P16）
  catalog_pricing_requires_variant_publication: true
  # ⚠ V-98：各管道錯誤碼各異，不硬編列舉；存管道原始碼字串＋我方分類。
  publication_error_categories: [VALIDATION, AUTH, RATE_LIMIT, UNKNOWN]
  verify_publication_error_codes: true

  # --- F. 平台總後台（63 §F）---------------------------------------------------
  # 🔴 平台側的商品線指標一律走 rollup，不得直查租戶明細表。
  #    CI 靜態掃描：app/**/platform/** 內出現 Product/ProductVariant/InventoryLevel 查詢即 fail
  #    （without_tenant 也不放行）。平台後台不得成為繞過租戶隔離的後門。
  platform_product_access: rollup_only
  # rollup 落後超過此值 ⇒ 顯示昨日值＋「資料延遲」註記，**不顯示 0**（36 §2 既有規則）。
  # 顯示 0 會讓平台人員以為租戶把商品刪光了。
  platform_rollup_staleness_warn_minutes: 60
  # 違禁品掃描：租戶推、平台不拉。平台只持有摘要，不持有商品全文。（ours，63 §F.3）
  scan_excerpt_max_chars: 120

  # --- 其他上限 ---------------------------------------------------------------
  # 商品列表每頁筆數。出處：docs/research/60:133、docs/research/59:183（live，「選取此頁的全部 50」）
  # 與 api.pagination_max_page_size(250) 是兩回事：後者是 API 硬上限，本鍵是 admin 列表預設。
  admin_list_page_size: 50
  # 變體列表的渲染分批（單一商品最多 product.max_variants(2048) 個變體）。（ours）
  variant_render_batch: 250
  # 投影全量重建任務清單。新增投影必須同時新增重建任務，CI 斷言清單與 rake task 一一對應。
  # 商品線沒有 saga，只有可重跑的投影——這是本篇對「補償」的統一答案（63 §H.3）。
  projection_rebuild_tasks:
    - catalog:rebuild:collections
    - catalog:rebuild:search
    - catalog:rebuild:materialized
    - catalog:rebuild:feed
    - catalog:resync:publications

# =============================================================================
# 18. SEO 與多地區（GEO-R）——規格見 docs/specs/62-seo-geo.md
# =============================================================================
# 出處等級在本區塊另加三級（檔頭的 dev／help／live／ours 之外；定義見 62 §0.3）：
#   google  ＝ developers.google.com/search 官方文檔（最高權威，搜尋引擎規則的唯一來源）
#   openai  ＝ developers.openai.com 官方文檔
#   ucp     ＝ ucp.dev 規格 / shopify.engineering 工程文
#   press   ＝ 業界二手來源轉述官方發言 ⇒ **一律登記 V 編號，不得據以寫死實作**
# 🔴 既有鍵不重複定義：標題／描述上限在 `content.seo_title_max_chars` 與
#    `content.seo_meta_description_max_chars`（§13）；顯示位數在 `currency_display`；
#    市場繼承語義在 `market.inheritance_additive`。本區塊只放 62 號新增的鍵。
seo:
  # --- 標題與描述（62 §E）----------------------------------------------------
  # 建議值（非上限）。出處：help.shopify.com/.../seo/adding-keywords（help）
  #   「標題最多 70 字元；為避免搜尋結果被截斷，建議 60 字元以內」「描述建議 160 字元」
  # ⚠ 上限請引用 content.seo_title_max_chars(70) / content.seo_meta_description_max_chars(320)。
  title_recommended_chars: 60
  meta_description_recommended_chars: 160
  # 截斷一律在詞界／字界，多位元組字元不得截半（62 §E.2）。（ours）
  truncate_suffix: "…"
  truncate_on_grapheme_boundary: true
  # 🔴 最終描述為空時**不輸出** <meta name="description">，不得輸出空字串或以店家標語充數。
  omit_empty_meta_description: true

  # --- Canonical 與重導（62 §B）----------------------------------------------
  # Google 記載 redirect ≤10 hops。出處：docs/research/30-seo-merchant-feeds.md:8（google）
  redirect_max_chain: 10
  # ── 第 6 包：url_redirects（62 §B.5 的表形狀落鍵）──
  # source 值域＝62 §B.5 逐字「source ∈ {handle_change, manual, domain_move, import}」。
  redirect_sources: [handle_change, manual, domain_move, import]
  # status 值域＝62 §F.3：改名 301；下架預設 410（可選 301）。302 未在規格出現、
  # manual 重導的完整值域待第 36 包（後台自訂重導管理）取證 ⇒ 先收斂 [301, 410]，
  # 屆時要擴充是加值不是改值。
  redirect_status_codes: [301, 410]
  # 路徑長度上界。🔴 官方未載明（62 §B.5 無長度）⇒ ours 防呆：unique 索引
  # utf8mb4 下 512×4＝2048 bytes < InnoDB 3072 bytes 鍵上限，且遠大於
  # /products/{handle} 的實際長度（handle 上限見 handle 區塊）。
  redirect_path_max_chars: 512
  # 參與 canonical 的 query 參數採**白名單**制，白名單外一律剝除（62 §B.1 變形 6）。（ours）
  canonical_query_allowlist: [page, q, type, constraint]
  # 變體 URL 模式：a＝單頁多變體（canonical 去 ?variant=）。
  # 出處：developers.google.com/search/docs/appearance/structured-data/product-variants（google）
  #   「單頁站的整個 ProductGroup 只能有一個 canonical，通常是不預選變體的基底 URL」
  # ✅ 依 68 號 §B-6(b) 補一手實測（test）：Shopify 自身 `canonical_url` 在 `?variant=` 下
  #    **不含該參數**（thesill.com、otherland.com 兩店主題不同、輸出形態一致）⇒ **V-110 結案**，
  #    我方「按 Google 規則去參數」的既有實作**證實與 Shopify 一致**。
  variant_url_mode_default: a
  # 依 68 號 §B-6(c) 跟隨 Shopify 做法修正（2026-08-12）：**模式 B 廢除**。
  # 原鍵 `variant_url_mode_b_requires_unique_content: true`，原註釋：「模式 b 開啟前的強制檢查：
  #   每個變體頁的標題／描述／主圖至少各自不同，否則拒絕開啟。（ours）」
  #
  # ❌ 68 號當時寫的理由（保留供追溯）：「🔴「同一個商品的變體各自有 URL」正是 Shopify **刻意不做**
  #    的形態（會產生近似頁）。官方等價物是 Combined Listings……⇒ 模式 B 不是「Shopify 有而我方關掉」，
  #    是**一個本尊沒有的形態**，開關本身就不該存在。」
  # 🔴 **69 號 §B-6 證偽了上面那個理由（`std` ×2 ＝ Google Search Central），值不變、理由換掉：**
  #    ① Google **明文建議**每個變體能被一個獨立 URL 識別 ⇒「變體可索引」是**官方推薦的目標**；
  #    ② Google 定義 single-page（查詢參數 ＋ 去參數 canonical）與 multi-page（各頁對等、
  #       單一 canonical 要求**不適用**）**兩種都合規**，且**不表偏好**；
  #    ③ Shopify **兩種都做了**——預設＝single-page、Combined Listings＝multi-page，
  #       只是把後者鎖在 Plus ⇒ **「本尊沒有這個形態」是錯的**。
  #    ⇒ 廢除的是「**同一個 product 下 variant 各掛 URL**」這個**資料模型**（它同時違反兩種形態的規則：
  #      對 single-page 而言多出 canonical 候選；對 multi-page 而言那些頁不是真的獨立商品），
  #      **不是「變體可索引」這個目標**——那個目標我方 single-page 模式**已經達成**，
  #      而且達成方式正是 Google 明文建議的那一種。
  variant_independent_urls_supported: false
  # 🔴 依 69 §B-6 新增的兩條 Google 官方硬規則（62 §B.2 硬規則 2／3）：
  #    fragment 切變體 ⇒ Google 索引**不使用** fragment，等於變體完全不可識別；
  #    參數須 `?key=value`（不得 `?value`），canonical 白名單的剝除邏輯也依賴 key 存在。
  variant_url_fragment_forbidden: true
  variant_param_must_be_key_value: true
  # 我方的等價缺口登記在 62 §B.2-1；上限值見 §22 combined_listing（是否實作待裁定）。
  combined_listing_is_the_official_equivalent: true
  # 🔴 **不得跨市場 canonical**（62 §B.4）：被 canonical 指走的 URL 不會被索引，
  #    也就無法作為 hreflang 的有效目標。兩者互斥，我方一律 self-canonical。⚠ V-120 未結案前不得改。
  cross_market_canonical_forbidden: true

  # --- Sitemap（62 §C；分片結構見 30 §3/§9-1）--------------------------------
  # 出處：docs/research/30-seo-merchant-feeds.md:45（google）
  sitemap_max_urls_per_file: 50000
  sitemap_max_bytes: 52428800          # 50MB
  sitemap_max_images_per_url: 1000
  # priority/changefreq 一律忽略 ⇒ 不輸出。ping endpoint 2024-01 已移除 ⇒ 不實作。
  sitemap_emit_priority_changefreq: false
  sitemap_ping_endpoint_enabled: false
  # lastmod ＝**實質內容更新**時間，不是任何欄位的 updated_at（庫存變動不算）。灌水會讓
  # Google 整體不信任本站 lastmod（30 §3）。
  sitemap_lastmod_source: substantive_content_update
  # draft market（可瀏覽不可結帳，29 §1.1）的 URL 不入 sitemap／hreflang，且輸出 noindex。
  # ⚠ Shopify 的處置未取得（V-112）；本鍵為我方定案，不等 V-112。（ours）
  sitemap_include_draft_markets: false
  noindex_draft_market_urls: true

  # --- robots（62 §D）--------------------------------------------------------
  # 出處：docs/research/30-seo-merchant-feeds.md:8（google，robots.txt ≤500KiB）
  robots_max_bytes: 512000
  # 平台保底注入：無論主題怎麼覆寫都會 append（62 §D.1）。（ours）
  robots_platform_enforced_disallow: ["/cart", "/checkout", "/account", "/search"]
  robots_platform_enforced_sitemap_line: true
  # 覆寫造成 Disallow: / 或移除 Sitemap: 行時，儲存需二次確認並常駐紅色橫幅。
  robots_override_requires_confirmation: true

  # --- hreflang（62 §I）------------------------------------------------------
  hreflang:
    # 碼格式：ISO 639-1 (+ 可選 ISO 15924 script) (+ 可選 ISO 3166-1 alpha-2)。
    # 出處：developers.google.com/search/docs/specialty/international/localized-versions（google）
    #   官方明確舉例 `zh-Hant` 為合法值；並列 `EU`／`UK`／單獨地區碼為常見錯誤。
    code_format: "iso639_1[-iso15924][-iso3166_1_alpha2]"
    forbidden_codes: [EU, UK, es-419]          # es-419 另見 30 §9-12
    # 🔴 基準法域＝香港（鐵律 11）：繁體中文一律 zh-Hant，HK 市場 ⇒ zh-Hant-HK。
    #    **不得**借用 zh-TW 表示繁體（那是地區碼不是字體）；TW 若啟用是 zh-Hant-TW，由 market 推導。
    #    本鍵是**格式範例**不是市場清單——SEO 層不得出現任何寫死的國別清單。
    script_subtag_example: zh-Hant
    # 🔴 碼粒度（2026-08-13 裁定，62 §I.2／§I.2-1 明知偏離登記）：**恆帶 ISO 3166-1 地區**，
    #    多國市場**逐國展開**成 N 個碼、全部指向同一 URL；全站輸出不得出現裸語言碼（x-default 除外，
    #    驗證＝62 §O REG-4 的 CI 紅燈掃描）。
    # 依 62 §L 處方修正（2026-08-13，71-R0-V1 結案）：原鍵
    #   `region_qualified_when_single_country_market: true`（註釋「單國市場 ⇒ 語言-國家；多國市場 ⇒ 語言碼」）
    # ＝裁定前語義——鍵名把「單國市場」寫進去，留著會讓人以為多國市場還有另一種行為。
    # 比照 D-2：改名不留別名。原出處（help/dev 的 Shopify 行為）降為被偏離對象，見 §I.2-1。
    always_region_qualified: true
    multi_country_market_expands_per_country: true
    # 裸碼出現在我方輸出 ⇒ CI 紅燈（62 §O REG-4 掃描 <head> 與 sitemap；x-default 除外）。
    bare_language_code_forbidden: true
    # 殘留衝突（同一市場多 presence 掛同碼）解析：先自身 presence、再祖先（62 §I.3(c) 步驟 2——
    # 原 specificity_stack 比市場，恆帶地區後衝突兩邊是同一市場 ⇒ 比不出東西，換這把尺）。
    multi_presence_resolution: nearest_own_then_ancestor
    # 丟棄決定必須逐頁相同，否則 hreflang 雙向性破裂（62 §O REG-2b）。
    dedupe_must_be_page_independent: true
    # 逐國展開超上限時：部分標註＋blocking lint。🔴 不得退回裸碼（裸碼已被禁）。
    over_limit_action: emit_partial_and_lint
    # 🔴 認得 ≠ 允許輸出：驗證器巡檢外部標註要能認裸碼（報 seo_lint_findings）；
    #    我方自己產生裸碼是 CI 紅燈。兩個檢查點、兩種嚴重度，不得合併成一個布林（62 §I.4）。
    validator_accepts_bare_code_for_audit_only: true
    # x-default 指「預設 (market, locale) 的帶前綴 URL」——根路徑已非內容頁（67 §F.1(b)），不得指 /。
    x_default_target: default_market_locale_prefixed_url
    # x-default 恰一個，指主網域上 primary market 預設語言的對應 URL。（help）
    x_default_required: true
    # 碼衝突（兩個多國市場同語言）的解析：先展開為逐國碼，超過此上限則依 market.specificity_stack 取捨。
    # ⚠ Shopify 的規則未載明（V-111）；**不得靜默丟棄**，一律落 seo_lint_findings。（ours）
    max_expanded_countries_per_market: 40
    conflict_resolution: [expand_to_country_codes, specificity_stack, lint_finding]
    silent_drop_forbidden: true
    # 🔴 集合必須用**解析後（沿 lineage 累加）**的 web presence 集合，不是 market 自己那一列。
    #    依據 market.inheritance_additive 含 web_presences（29 §1.5）。寫成後者會漏掉繼承的語言版本
    #    ⇒ 雙向性破裂 ⇒ 整組標註可能被 Google 忽略（62 §I.3(a)）。
    use_resolved_web_presences: true
    # market conditions 變更 ⇒ 矩陣與 sitemap 必須失效重算（去抖沿用 IndexNow 的 5 分鐘）。
    invalidate_on_market_conditions_change: true
    invalidation_debounce_minutes: 5

  # --- 地區重導（62 §K）------------------------------------------------------
  redirect_geo:
    # 依 68 號 §C-3 跟隨 Shopify 做法修正（2026-08-12）。
    # 原值 `false`，原註釋：「🔴 預設**關閉**。Google 明文建議避免自動重導，且 IP 判斷不可靠、
    #   可能導致無法正確抓取各版本。出處：developers.google.com/search/docs/specialty/international/
    #   managing-multi-regional-sites（google）」
    # Shopify 實際做法：**新店預設啟用地區自動重導**（出處：help.shopify.com/en/manual/markets/
    #   getting-started/localization，help，明文給出預設值）；**自動語言偵測預設停用**。
    # 🔴 **這一條是「跟隨 Shopify」與「外部權威（Google）」的直接衝突，不是與使用者裁定衝突。**
    #    Google 的多地區指南**仍然成立**、原註釋的推理**沒有被推翻**——Shopify 之所以敢預設開，
    #    靠的是「爬蟲不重導 ＋ hreflang 完整」把 Google 的疑慮擋掉。⇒ 見下面 non_disableable_invariants。
    enabled_default: true
    # 開啟時：302（地區偏好不是永久事實）、只攔一次、對已驗證爬蟲不套用。
    status_code: 302
    once_per_visitor: true
    exclude_verified_crawlers: true
    crawler_verification: reverse_dns          # UA 比對 ＋ 反向 DNS；未通過驗證者當一般使用者
    # 🔴 不變量：出現在 hreflang／sitemap 的 URL 必須對**任何**客戶端直接回 200（62 §0.2 原則 4）。
    hreflang_urls_must_return_200: true
    # 🔴 **本清單內的鍵自 2026-08-12 起是不可關閉的不變量，不是「開啟時的選配護欄」**（68 §C-3）。
    #    升格理由：預設值一翻成 true，這三條就是「預設開」與「不傷索引」之間唯一的東西。
    #    少了任何一條，預設開就是真的傷索引——而且傷的是**每一個新租戶**，不是有意開啟的那些。
    #    實作面：不得提供關閉這三條的後台開關、API 欄位或環境變數；試圖關閉一律 reject。
    non_disableable_invariants:
      [exclude_verified_crawlers, hreflang_urls_must_return_200, once_per_visitor]
    # ⚠ V-116 **已依 68 §C-3 重寫**：原處置是「未取得 Google 對『排除爬蟲』的官方表態 ⇒ 預設維持關閉」，
    #    該處置的**前提（預設關閉）已消失**。新處置＝預設開、三條護欄不可關、風險登記在 62 §K。
    #    本鍵保留為「該風險已知且已登記」的旗標，不再是「等表態才開」的閘門。
    verify_crawler_exclusion_is_compliant: true
    # 🔴 **EU 例外是法遵不是偏好**（68 §C-3，出處 help.shopify.com/en/manual/international/
    #    automatic-redirection）：使用 EU ccTLD 的在地化體驗，EU 來源客戶**不得**被自動重導；
    #    Shopify 官方要商家改用第三方 app 提供「建議」而不是重導。
    #    市場用非國別網域（.com／.shop）時 EU 客戶照常重導。
    #    🔴 判定不得寫成 SEO 層的國別 if-else（鐵律 11）——由 jurisdiction pack 宣告
    #    `forbids_geo_auto_redirect`，SEO 層只讀該能力（掛載點見 56 號 capability contract）。
    eu_cctld_no_redirect: true
    eu_exception_source: jurisdiction_pack_capability
    # Shopify 自己**沒有**內建 recommendation banner（官方把「建議」推給第三方 app）。
    # 我方在自動重導關閉時本來就有建議橫幅（62 §K.2）⇒ 這是**超出 Shopify** 的一條，
    # 也正好是 EU ccTLD 情境下唯一合法的形態。⚠ 是否要把它做成正式產品能力待裁定（68 §H）。
    recommendation_banner_is_ours_not_shopify: true

  # --- JSON-LD（62 §A）-------------------------------------------------------
  jsonld:
    # 🔴 換算尺度**一律 ×100，不看幣別**（同 carrier.money.storage_multiplier 的理由）。
    #    ⚠️ **不要**用 jurisdictions.<code>.currency_format.exponent —— 那一欄在 2026-08-12 裁定後
    #    已改為「顯示位數」（TWD 由 0 改為 2），拿它當換算基數會在 zero-decimal 幣別上算出 100 倍誤差。
    #    出處：58 §G.3 的同一條警告；本鍵是它在 SEO 序列化層的對應。
    amount_divisor: 100
    # price 一律固定兩位小數字串、無幣別符號、無千分位。
    # 出處：developers.google.com/search/docs/appearance/structured-data/merchant-listing（google）
    price_decimals: 2
    price_regex: '^\d+\.\d{2}$'
    # priceCurrency ＝ presentment 幣別（29 §3.1），**不是** shop currency，也不是法域預設幣別。
    price_currency_source: presentment
    # priceValidUntil 只在有真實結束時點（促銷檔期／price list 排程）時輸出；否則整個屬性省略。
    # 理由：浮動匯率市場無法誠實宣告有效期；Google 對過期值可能不顯示富摘要。（ours ＋ google）
    price_valid_until_only_when_scheduled: true
    # compare_at ≤ price 時不輸出 StrikethroughPrice（不是輸出相等值）。（ours）
    strikethrough_requires_higher_compare_at: true
    # 評論筆數為 0 一律不輸出整個 AggregateRating 節點。（ours）
    omit_aggregate_rating_when_zero: true
    # 不實作清單（連理由一起記，避免日後有人補上）：
    #   FAQPage（Google 2026-05 移除富摘要）／WebSite+SearchAction（2024-11 落日）／
    #   AggregateOffer（merchant listing 要求 Offer）／自家 Review。出處：30 §2.4 ＋ 本輪覆核。
    forbidden_types: [FAQPage, SearchAction, AggregateOffer]
    # 平台注入層主題不可移除；主題只能新增節點（62 §A.1）。
    platform_layer_removable_by_theme: false

  # --- Core Web Vitals（62 §G；門檻沿用 30 §4）--------------------------------
  cwv:
    lcp_ms: 2500
    inp_ms: 200
    cls: 0.1
    # 伺服器端預算：超過即記 slow_render 事件（M8 可觀測）。（ours）
    ttfb_budget_ms: 600
    # 渲染期 DB 查詢上限（防主題 N+1 drop）；dev 模式報錯、生產記事件。（ours）
    max_queries_per_render: 80

# =============================================================================
# 19. 生成式引擎與代理通路（GEO-G）——規格見 docs/specs/62-seo-geo.md §H
# =============================================================================
# 🔴 本區塊的第一原則（承 56 §A.3、58 §0.2 原則 2）：**未宣告 ≠ 支援**。
#    能力沒實作就**不輸出該欄位**，不得輸出空字串或佔位 URL——輸出一個指向 404 的
#    ucp_discovery_url，代理會在買家面前失敗，那比沒有這個欄位糟糕得多。
agents:
  # --- 三個 AI 面向端點（62 §H.3）--------------------------------------------
  # 形態對齊 shopify.dev/changelog/customize-llmstxt-llms-fulltxt-and-agentsmd（2026-05-28，dev）：
  #   /agents.md ← templates/agents.md.liquid → 平台預設
  #   /llms.txt / /llms-full.txt ← 各自模板 → agents.md 模板 → 平台預設
  agents_md_enabled: true
  llms_txt_enabled: true                 # 零成本別名；**不做內容策展**（62 §H.2 結論）
  # 依 68 號 §C-1 跟隨 Shopify 做法修正（2026-08-12）。
  # 原值 `false`，原註釋：「🔴 llms-full.txt 預設**關閉**：①沒有任何引擎官方宣稱消費它（V-117）
  #   ②等於把商家全站內容做成一鍵可抓封包（授權／頻寬／競品比價）③生成成本隨商品數線性成長。
  #   商家可開，開啟後受大小上限。（ours）」
  # 🔴 **原理由②③的前提是錯的**：它們針對的是 `llms-full.txt` 的**原始語義**（整站 markdown 打包），
  #    而 Shopify 的實作**不是打包**——`/llms.txt` 與 `/llms-full.txt` 預設都是 `agents.md` 的**別名**
  #    （出處：shopify.dev/changelog/customize-llmstxt-llms-fulltxt-and-agentsmd，2026-05-28，dev）。
  #    別名形態下沒有第二份內容、沒有第二套快取、成本不隨商品數成長 ⇒ ②③消失；
  #    ①（無引擎宣稱消費）對 `/llms.txt` 同樣成立而我方已接受 ⇒ 不構成兩者差別待遇的理由。
  #    這是**我方誤讀 Shopify 實作造成的分歧，不是價值觀分歧**。
  # 🔴 **防回退**：看到這個鍵是 `true` 不要當成「沒評估過就打開」而改回 `false`。改回去會讓
  #    從 Shopify 搬過來的商家的 `/llms-full.txt` 從有內容變成 404，且與 GEN-4 驗收直接衝突。
  #    要改回 `false` 的前提是：Shopify 把這條路徑改成非別名，或使用者推翻「全部跟隨 Shopify」。
  llms_full_txt_enabled: true
  # 🔴 別名形態下用不到，但**保留**：商家一旦自訂 templates/llms-full.txt.liquid，
  #    原始語義（整站打包）就回來了，那時這個護欄是必要的。刪掉它＝把護欄留給第一個踩到的大租戶。
  llms_full_txt_max_bytes: 5242880       # 5MB
  # 三條路徑預設全開且內容相同（agents.md 為 fallback 源）。（dev，同一 changelog）
  llms_paths_default_alias_of_agents_md: true
  # 受限 Liquid context：只有 request 與 agents 兩個物件（避免市場/語言污染快取鍵）。
  # 出處：shopify.dev/docs/storefronts/themes/architecture/templates/agents-md-liquid（dev）
  template_context_objects: [request, agents]
  # 該檔走裸主網域、無 locale 前綴、不可在地化。（dev）
  served_at_bare_primary_domain: true
  localizable: false
  # agents drop 欄位（命名對齊 Shopify 以利主題移植）。（dev）
  drop_fields: [store_name, store_url, sitemap_url, currency, ucp_discovery_url, mcp_endpoint_url, ucp_versions]

  # --- UCP（62 §H.3(c)）------------------------------------------------------
  ucp:
    # 🔴 未實作前恆 false，且**不輸出** ucp_discovery_url／ucp_versions。
    provider_enabled: false
    declare_when_disabled: false
    # 兩條未結案前不得 enable（同 58 §A.3 的 enable_gate 形態）。
    enable_gate: [V-113, V-114]
    # 規格版本以日期命名且會滾動 ⇒ 一律當變數，不得寫成常數。
    # 出處：ucp.dev/2026-04-08/specification/overview/（ucp）
    spec_version_is_variable: true
    known_spec_version_at_survey: "2026-04-08"
    discovery_path: "/.well-known/ucp"
    # 規格要求的最低快取。（ucp）
    discovery_cache_control: "public, max-age=60"
    # 階段 1＝唯讀 Catalog 宣告（M7 可評估）；階段 2＝Cart/Checkout/Order（M7+，需簽章金鑰與 webhook 驗簽）。
    phase1_capabilities: [catalog]
    phase2_capabilities: [cart, checkout, order]

  # --- 代理 catalog／FAQ 端點（62 §H.4）---------------------------------------
  catalog_api:
    # 🔴 價格一律走 resolve_price_view()（62 §A.3 的第 5 個消費者），與 PDP／feed 四方全等。
    price_source: resolve_price_view
    # 未帶 country 時用 primary market，但**回應必須明示解析到哪個市場**，不得靜默。
    # ⚠ V-114：UCP/MCP 如何攜帶買家國別與幣別未確認 ⇒ 我方端點強制此規則。
    country_param_required: true
    echo_resolved_market: true
    # 未發佈到該市場 catalog 的商品不得出現（29 §1.3）。
    respect_market_publication: true
    # 🔴 供貨只回級別不回精確數量（免認證公開端點＝競品可即時掃庫存）。（ours）
    availability_granularity: level_only
    max_page_size: 50

  # --- AI 爬蟲（62 §D.3）------------------------------------------------------
  crawlers:
    # 🔴 分成三組，**不做成一個 AI 開關**：把 OAI-SearchBot 和 GPTBot 綁在一起，
    #    商家關訓練的同時會無聲關掉 ChatGPT 曝光——那是最貴的誤操作。
    # 出處：developers.openai.com/api/docs/bots（openai）；
    #       developers.google.com/search/docs/crawling-indexing/google-common-crawlers（google，
    #       Google-Extended「不影響搜尋收錄，也不是排名訊號」）
    groups:
      search_answer:                     # 影響 AI 答案曝光；封鎖＝不出現在該平台答案
        default: allow
        agents: [OAI-SearchBot]
      training:                          # 影響模型訓練／grounding
        default: allow                   # ⚠ 需使用者裁定；V-123 無公開對照實驗，文案不得宣稱效果
        agents: [GPTBot, Google-Extended]
      user_triggered:                    # 使用者即時觸發；官方註明 robots 規則可能不適用 ⇒ 不可靠
        default: allow
        agents: [ChatGPT-User]
        controllable: false
    # Googlebot 不可由租戶關閉（整站消失級別的誤操作）。（ours）
    googlebot_blockable_by_tenant: false
    # ⚠ V-126：ClaudeBot／PerplexityBot 等的官方 UA 字串與語義本輪未逐一取得 ⇒
    #    清單做成**可設定資料**（DB seed），不得寫死在程式碼。
    extensible_agent_list: true

# =============================================================================
# 20. 多語言（內容 i18n）——規格見 docs/specs/67-multilingual.md
# =============================================================================
# 出處等級在本區塊另加一級（定義見 67 §0.3）：
#   ruling ＝ **使用者裁定**（2026-08-12 多語言裁定）。優先於 dev——它是產品決策，不是對 Shopify 的復刻。
#
# 🔴 **本區塊不含任何語言清單。** 裁定逐字：「先開始時繁體中文、簡體中文、英文。之後我可以自行添加
#    任何語言。」⇒ 語言集合是**資料**（`platform_locales` ＋ `shop_locales` 兩張表，67 §C.1），
#    不是 enum、不是 YAML 清單。下面的 `launch_locales` 是**種子資料的指標**，不是值域——
#    任何程式碼拿它當「支援的語言」判斷都是 bug（67 §A.2）。
#
# 🔴 **語言 ≠ 幣別**（鐵律 10 ＋ 2026-08-12 裁定二）：英文版的香港商店仍顯示 HK$1,480.00。
#    金額格式的每一個部分由 market locale 決定（jurisdictions.<code>.currency_format），
#    **不隨內容語言變**。本區塊沒有任何幣別鍵，這是刻意的（67 §H.1）。
#
# 🔴 既有鍵不重複定義：譯文長度上限沿用來源欄位的上限（product.title_max_chars /
#    content.seo_title_max_chars …）；hreflang 碼規則在 seo.hreflang；市場繼承在 market.*。
i18n:
  # --- 語言註冊（67 §A.2、§C.1）-----------------------------------------------
  # 首發三語＝**種子資料**，不是值域。（ruling）
  # 2026-08-23 裁定（docs/plans/2026-08-23-多語言方案.md R1/R3）：首發五語、來源語言 en。
  launch_locales: [en, zh-Hant, zh-Hans, ja, fr]
  # 新店的來源語言（base row 的文字語言；67 §C.3）。改它不影響既有店（既有店走遷移精靈）。
  source_locale_default: en
  launch_locales_is_seed_not_enum: true
  # 每店語言數上限。出處：docs/research/29-markets-i18n.md:21（help，「全店最多 20 種語言」）
  max_shop_locales: 20
  # 標籤格式：ISO 639-1 (+ 可選 ISO 15924 script) (+ 可選 ISO 3166-1 alpha-2)。
  # 與 seo.hreflang.code_format 同一族規則，但用途不同（這是語言註冊，那是標註輸出）。
  locale_tag_format: "iso639_1[-iso15924][-iso3166_1_alpha2]"
  # 🔴 裸 zh 禁用：它在字體上是歧義的，任何以 zh 為 fallback 目標的鏈都會把繁體使用者
  #    送到簡體內容或反之。EU/UK/es-419 沿用 seo.hreflang.forbidden_codes 的理由（google）。
  forbidden_locale_tags: [zh, EU, UK, es-419]
  # 🔴 繁體一律 zh-Hant、簡體一律 zh-Hans；不得借 zh-TW / zh-CN 表示字體。
  #    出處：62 §I.4（google，官方明確舉例 zh-Hant 為合法值）＋ 本檔 §A.4。
  script_subtag_required_for: [zh]
  # 寫入層強制正規化大小寫（語言小寫 / script Title / region 大寫）。
  # 🔴 不得依賴 MySQL utf8mb4_0900_ai_ci 的大小寫不敏感做正規化（11 §2-4）。
  normalize_tag_case_on_write: true
  # 語言集合是否封閉（Shopify 是否只允許其支援清單）⇒ ⚠ V-165 未查證。
  # 我方**開放**（裁定明文），只驗格式與禁用碼。
  allow_arbitrary_locales: true

  # --- 來源語言（67 §C.3）-----------------------------------------------------
  # 每店恰一個 source locale；base 資料表的文字一律是它的語言。
  source_locale_per_shop: 1
  # 🔴 不做 per-resource 來源語言：base row 的語言若逐列不同，就沒有消費者能回答
  #    「products.title 是什麼語言」——而搜尋分析器／feed／代理端點／匯出全都需要這個答案。（ours）
  source_locale_per_resource: false
  # 改來源語言是一次性資料遷移，走精靈＋dry-run，不是設定切換。
  source_locale_change_requires_migration: true
  # 🔴 遷移時目標語言缺譯 ⇒ base 保留原文並落 gap 記錄。清空 base ＝ 整店空白商品。（ours）
  source_locale_change_missing_translation: keep_source_text
  # 來源語言不可取消發布、不可刪除 ⇒ userErrors SOURCE_LOCALE_IMMUTABLE。
  source_locale_immutable_publish: true

  # --- Fallback 鏈（67 §C.4）—— 🔴 不得靜默空白 -------------------------------
  # 解析順序：locale → 截尾鏈 → base row → 依欄位類別。
  # （依裁定 10 於 2026-08-13 修正，原文：「(locale,market) → (locale,NULL) → 截尾鏈 → …」——
  #   translations.market_id 已刪，market 維度整層消失，見 67 §C.2 沿革。）
  fallback_chain_mode: bcp47_truncation
  # 🔴 繁簡之間永不互為 fallback。地區借用只是用詞差異，**字體借用是整頁文字都不對**。
  never_fallback_pairs: [[zh-Hant, zh-Hans]]
  # 截尾不得落到被禁用的裸語言碼（zh）⇒ 鏈提前結束，不是特例分支。
  # 🔴 這一條與 CLDR 同構，**不是我方自創的加嚴**（2026-08-25 取證；同日依審查 D1
  #    更正引文——原引一個不存在的檔案路徑與一段無法溯源的「逐字」，撤回，改引下列
  #    親自複驗的來源）：CLDR 正典 supplementalData.xml 把 zh_Hant 的 parent 寫成 root
  #    （<parentLocale parent="root" localeRules="nonlikelyScript" locales="…zh_Hant"/>，
  #    https://raw.githubusercontent.com/unicode-org/cldr/main/common/supplemental/supplementalData.xml），
  #    理由在 TR35 逐字：「if the truncation algorithm changes script, then a mixture of
  #    child and parent textual data is a mishmash of different scripts.」
  #    （https://raw.githubusercontent.com/unicode-org/cldr/main/docs/ldml/tr35.md）
  #    ⚠️ 相對地，RFC 4647 §3.4 Lookup 的**字面**演算法會產生 zh-Hant → zh（它不懂 script 語義）
  #    ⇒ 我方在此刻意偏離 RFC 字面，**不得寫成「照 RFC 實作」**。實作＝Locales::FallbackChain。
  truncation_stops_at_forbidden: true
  # 🔴 商家不可自訂 fallback 鏈：可自訂的鏈會產生 A→B→A 的環。（ours）
  merchant_configurable_chain: false
  # 最終仍為空時的行為（依 67 §B.1 的欄位三分類）。🔴 沒有第四種（禁止靜默空字串／輸出 key 名）。
  missing_translation_behavior:
    required: source_text        # 標題等：顯示原文優於顯示空白
    optional: omit_field         # SEO 描述／alt：整個欄位不輸出（承 62 §E.1「空描述不編造」）
    never: source_value          # 不可翻欄位：永遠取原值
  # 空值定義：NULL / "" / 只含空白 / 語義空 HTML（<p></p>、<p><br></p>）四者等價。
  empty_includes_semantically_empty_html: true
  # 回落到來源語言的**大段文字**在前台加 lang 屬性（無障礙＋誠實）。短欄位不加。
  # 🔴 lang 的值＝`Translations::Resolved#locale`（實際語言，可能是 zh-Hant），
  #    **不是**請求語言（zh-Hant-HK）。消費者是第 34 包。
  mark_fallback_with_lang_attribute_on: [body_html, policy_body, article_body]

  # --- 解析器（67 §C.4 的執行參數；第 7 包 Translations::Resolve）-------------
  resolve:
    # 單批資源數上限。推導：等值 range 數＝資源數 × 候選語言階數。MySQL 官方逐字：
    #   「If there are two IN() lists, the number of predicates combined with OR is the
    #    product of the number of literal values in each list.」
    # 而 eq_range_index_dive_limit 預設 200，達到即從 index dive 換成統計估算
    # ⇒ 同一支查詢的執行計畫在無預警下改變。⌊200 / 3⌋ = 66，取 50 留餘裕。
    # 出處：https://dev.mysql.com/doc/refman/8.4/en/range-optimization.html（2026-08-25）
    #     ＋https://dev.mysql.com/blog-archive/you-asked-for-it-new-default-for-eq_range_index_dive_limit/（2026-08-25）
    # ✅ P7-L6 已取得（2026-08-25 bt3 正式環境實查）：@@eq_range_index_dive_limit=200
    #    （MySQL 8.4.10），與推導用的預設值相同。複驗＝SELECT @@eq_range_index_dive_limit;
    max_resources_per_batch: 50
    # 候選語言階數硬上限（含請求語言自己）。Locales::Tag::FORMAT 只有
    # language[-script][-region] 三段 ⇒ 截尾最多兩次。（ours）
    max_chain_length: 3
    # 🔴 field_key **不進 IN 清單**——三個 IN 的乘積 50×3×4=600 遠超 200。
    #    欄位在 Ruby 端過濾（每列最多 4 欄，浪費極小）。（ours）
    batch_filters_fields_in_ruby: true
    # 🔴 按 resource_type 分組查詢，不用 row constructor `(a,b) IN ((..),(..))`——
    #    後者走 range 有四個條件，其中「右側必須多於一個 row constructor」在單筆時
    #    不成立而退化成全掃。這是對 67 §F.3(c) 字面「一次 IN」的刻意偏離。（ours）
    batch_groups_by_resource_type: true
    # 前台預設只在 published 語言集合內解析（下架／未發布語言的譯文保留但不得取用）。
    # 預覽連結走 :enabled。（ours；對齊 storefront.unpublished_locale_status: 404）
    default_scope: published
    # 遙測門檻：depth >= 此值才發 i18n.fallback_hit。
    # 🔴 0 會讓**每一次正常渲染**都發一筆（請求語言＝來源語言時 depth 恆 0）。
    # 🔴 payload 禁放 resource_id：Prometheus 官方「Do not use labels to store dimensions
    #    with high cardinality … such as user IDs … or other unbounded sets of values.」
    #    出處：https://prometheus.io/docs/practices/naming/（2026-08-25）
    fallback_telemetry_min_depth: 1

  # --- 空值判準（67 §C.4(b)；讀寫共用單一實作 Translations::BlankValue）-------
  blank_value:
    # HTML parser 走 Loofah.fragment（＝Loofah::HTML4::DocumentFragment，2026-08-25 實測）。
    # 🔴 選它的理由是**與 sanitizer 同源**：Catalog::SaveProduct#sanitize_description 已經用
    #    Loofah.fragment，同一支 parser 才不會出現「sanitizer 看得到、判空器看不到」的漂移。
    # 🔴 HTML4 vs HTML5 的代價不對稱（2026-08-25 實測）：截斷輸入 "<p><img src=x"
    #    在 HTML4 判非空、HTML5 判空，而判空的動作是**刪掉商家的譯文** ⇒ 選在假陰性側。
    html_parser: html4_via_loofah
    # 🔴 判空必須在 sanitize 之後：<video src=x></video> sanitize 前判非空、sanitize 後是 ""，
    #    先判空就會存進一列「後台已翻譯、前台空白」的鬼列。（ours）
    runs_after_sanitize: true
    # 內容承載元素清單由 WHATWG「Embedded content」分類推導＋hr/table/表單控件三項加項。
    # 🔴 不是 void elements 清單（area/base/col/link/meta/track/wbr 是 void 但不可見）。
    # 出處：https://html.spec.whatwg.org/multipage/dom.html（2026-08-25）
    content_bearing_source: whatwg_embedded_content
    # 🔴 讀寫共用**同一份**實作（BlankValue 只有一支）；但讀取端有尺寸上限 fast-path
    #    （2026-08-25 二次修正，依審查 C5 撤回首版的「讀取端也跑完整判準」裁定）：
    #    首版依據「85µs/次、50 列 ~4ms」否決研究建議的讀取端快篩——該量測是錯的，
    #    實測 17KB body_html 一次判準 ≈1987µs、50 列 ≈95ms（本機，2026-08-25；審查方
    #    較慢機器量到 14ms/700ms）。修正＝html 值 bytesize 超過下列閾值時讀取端不 parse、
    #    直接判非空：語義空 HTML 的形態結構上都是幾十 bytes，大值誤判非空落在假陰性側
    #    （不刪資料、頂多多顯示）。🔴 寫入端與稽核**永遠跑完整判準**（刪列不可逆）。
    single_implementation_for_read_and_write: true
    read_fast_path_max_bytes: 1024

  # --- 過期偵測（67 §C.5）—— 假陽性率決定這個功能有沒有用 ----------------------
  digest_algorithm: sha256
  # 🔴 不正規化就算 digest ⇒ 富文本編輯器改一次換行就把全店全語言標成過期，
  #    商家隔天看到「48,000 筆待更新」，然後這個功能被永久忽略。（ours）
  digest_normalization:
    text: [nfc, trim, collapse_whitespace]
    html: [parse_dom, sort_attributes, drop_whitespace_only_nodes, collapse_whitespace, stable_serialize]
    json: [sort_keys, drop_format_whitespace, stable_serialize]
  # 分級門檻：編輯距離／原長度 ≤ 此值 ⇒ minor（不進「待翻譯」預設篩選）。
  outdated_minor_change_ratio: 0.1
  # 🔴 outdated 是**後台狀態**，不影響前台渲染：一個錯字修正不該讓整個語言版本退回英文。
  outdated_affects_storefront_render: false
  # 標記必須在來源寫入的**同一 transaction** 內完成（丟 job ⇒ 有一段視窗商家以為翻譯是最新的）。
  outdated_marking_in_same_transaction: true
  # 範本欄位的佔位符集合必須與來源一致，否則 userErrors PLACEHOLDER_MISMATCH。
  # （缺一個 {{ order_number }} 的訂單確認信是會真的寄出去的。）
  validate_placeholder_parity: true

  # --- 欄位與長度（67 §B）-----------------------------------------------------
  # 🔴 譯文長度上限**沿用來源欄位的上限**，不另立一套（英文 255／中文 500 會讓匯出匯入炸掉）。
  per_field_limits_follow_source_field: true
  # 硬天花板（任何欄位的譯文都不得超過），對齊 product.description_max_bytes。
  translation_value_hard_max_bytes: 65536
  # metafield 只有文字型可翻，且是**白名單**不是黑名單。
  # 🔴 money 型絕不進 translations 表——它會開出一條「金額寫成字串再讀回來」的路徑（鐵律 3、65 號）。
  translatable_metafield_types:
    [single_line_text_field, multi_line_text_field, rich_text_field,
     "list.single_line_text_field", "list.multi_line_text_field"]
  # 不可翻清單（理由逐條見 67 §B.3）。tags 是集合運算的鍵（13 §F4.3）；
  # Default Title 是硬相容契約（63 §B.2，catalog_flow.default_variant_liquid_title）。
  never_translatable: [sku, barcode, gid, tags, handle, currency_code, country_code,
                       default_variant_title, money_amounts, order_history_text]

  # --- 機器翻譯與繁簡轉換（67 §E.5）-------------------------------------------
  machine_translation:
    # provider 是**服務**，與語言 pack（資料）和 jurisdiction pack（法律能力）都正交（67 §A.3）。
    provider_pluggable: true
    # 未設定 provider ⇒ 整個功能**不出現**（不是出現後報錯）。承 62 §0.2 原則 3「未宣告 ≠ 支援」。
    hide_when_provider_unset: true
    # 🔴 一律非同步（鐵律 5：transaction 內禁外部 IO；63 §A.2）。
    async_only: true
    # 🔴 稽核欄一律寫入（形態同 62 §F.1 alt_source／§H.6-1 content_source）。
    value_source_marked: machine
    review_required: true
    # 未覆核的機翻**預設對外可見**：不可見等於整批沒有效果，商家會改用外部工具貼進來，
    # 那樣連 value_source 都沒有了。商家可切 hidden（走 fallback）。（ours）
    publish_default: visible
    # 大量生成的摩擦（62 §H.6-1：對 Google 是 scaled content abuse，可能整站受罰）。
    max_resources_per_batch: 500
    batch_confirm_above_resources: 100
    # ⚠ V-169：官方機翻「限 2 種語言」（29 §2.4 記載）現況未覆核 ⇒ 以鍵表達，不寫死。
    max_target_locales_per_batch: null
  script_conversion:
    # 繁簡轉換是**確定性查表工具**，不是 MT，也**不是渲染期 fallback**（67 §A.4）。
    enabled: true
    value_source_marked: script_conversion
    review_required: true
    # 🔴 兩個方向品質不對稱：繁→簡接近無損；簡→繁一對多（发→發/髮、干→干/乾/幹、后→后/後）
    #    ⇒ 完成報告必須列出含歧義字的筆數。
    ambiguous_direction: [zh-Hans, zh-Hant]
    report_ambiguous_count: true
    # 🔴 它不做詞彙在地化（软件/軟體、视频/影片）——UI 必須寫「這是字形轉換，不是翻譯」。
    ui_must_state_not_translation: true

  # --- 匯入匯出（67 §E.6）—— 翻譯是**第三套**；空白＝不動作，覆寫走顯式旗標 ------
  # 🔴🔴 **本區塊是二次修正，讀之前先看下方 import.blank_means_unchanged 的完整沿革註釋。**
  #      原值 true（我方原設計）→ 68 號依 Matrixify（第三方，press）翻成 false →
  #      69 號查到 Shopify **原生**翻譯 CSV 的官方語義後**改回 true**（2026-08-12 同日）。
  export:
    format: csv
    # 匯出必含 source_text 唯讀參考欄（沒有原文的翻譯檔對譯者不可用）。
    include_source_text: true
    # 🔴 依 69 號 §V-182 對齊 Shopify 原生翻譯 CSV 的 8 欄（`help`：Settings → Languages）：
    #    Type／Identification／Field／Locale／Market／Status／Default content／Translated content。
    #    我方欄名沿用既有命名（resource_type≈Type、resource_gid≈Identification、field_key≈Field、
    #    market_handle≈Market、source_text≈Default content、translated_text≈Translated content），
    #    **欄位集合與順序對齊**，另保留我方獨有的 source_digest（Shopify 沒有，但它是回匯安全的前提）。
    # 🔴 market_handle 是純格式相容欄（依裁定 10，2026-08-13）：匯出恆空白；
    #    匯入時空白＝唯一合法值，非空白 ⇒ 拒絕該列（本平台不做市場級內容覆寫，67 §E.6(b)／V-201）。
    #    保留它只為對齊本尊 8 欄——刪欄會讓「拿本尊檔案直接匯入」多一步手工改檔。
    columns: [resource_type, resource_gid, field_key, locale, market_handle,
              status, source_text, translated_text, source_digest]
    split_by: [locale, resource_type]
    # 🔴 `status` 三值對齊本尊（69 §V-182，`help` ＋ `vendor` 獨立佐證）：
    #    translated／outdated／untranslated。**outdated 是匯出檔的一等公民欄位**——
    #    這同時解決了 67 §C.5 的過期偵測「要往哪裡輸出」這個問題。
    status_values: [translated, outdated, untranslated]
    # ⚠ V-201：本尊在**匯入**時是否讀取 Status 欄未知 ⇒ 我方 **status 純輸出**，匯入時忽略。
    status_is_export_only: true
    # 🔴 **選擇性匯出的理由已改（依 69 §V-182），鍵值不變、價值反而更高。**
    #    68 號時它是「空白＝清空」翻面後的必要配套（不想動的不要出現在檔案裡）。
    #    現在空白＝不動作，它不再是「避免誤刪」的唯一手段，但它決定了
    #    **overwrite_existing: true 時的作用範圍**——匯入器以**表頭**判定哪些欄位在範圍內，
    #    所以「匯出時就把不想動的欄位排除掉」是縮小覆寫爆炸半徑最直接的方式。
    selectable_locales: true            # 匯出時勾選要匯出哪些語言
    selectable_fields: true             # 匯出時勾選要匯出哪些 field_key
    # 匯出檔預設只含被勾選的語言與欄位；未勾選者**整欄／整批列不輸出**（不是輸出空值）。
    omit_unselected_as_columns: true
    # 🔴 依 69 §V-182 跟隨本尊：匯出是**非同步**，完成後以通知／email 交付（本尊即如此，
    #    也符合我方 outbox 形態）。大店的全語言匯出不可能在請求內完成。
    async_delivery: true
    delivery_channels: [notification, email]
    # 單檔上限沿用 csv.product_max_upload_mb（15MB，出處 61 §6.1/§6.2 help）。
    max_upload_mb_key: csv.product_max_upload_mb
    # XLIFF 2.1 列 P2；⚠ V-163 未查證官方格式。
    xliff_enabled: false
  import:
    # =========================================================================
    # 🔴🔴 **本鍵是二次修正。沿革完整寫在這裡，否則下一個人會以為是有人手滑改回去。**
    # =========================================================================
    #   ① 原值 `true`（我方原設計，67 §E.6）——理由：「翻譯檔常常只填部分語言，
    #      空白＝清空會造成大規模誤刪」。原註釋逐字：「🔴 空白 ＝ **不變更**（與商品 CSV 相反：
    #      後者『空白儲存格會把既有資料洗掉』，61 §6.1）。同樣語義套到翻譯上 ＝ 譯者交回只填 20%
    #      的檔案，其餘 80% 既有譯文全被清空。」
    #   ② 68 號 §B-3 翻成 `false`（空白＝清空）——依據是 **Matrixify（第三方 app，`press` 級）**
    #      的翻譯匯入語義，並研判「Shopify **原生**能力薄弱或不存在」（68 的 V-182）。
    #   ③ 🔴 **69 號 §V-182 推翻了 ② 的前提，本鍵改回 `true`。**
    #      Shopify **有完整的原生翻譯 CSV 匯出／匯入**，只是**不在 Translate & Adapt app 裡**，
    #      而在 **Settings → Languages**（`help` ＋ `staff` 佐證）——這就是 68 號找不到它的原因。
    #      其模型是 **8 欄 ＋ Status 三值 ＋ 匯入時一個「覆寫既有翻譯」的勾選框**：
    #      🔴 **本尊根本沒有對「空白」賦予刪除語義，它把這個決定做成使用者的一次明示動作。**
    #      ⇒ 「全部跟隨 Shopify」的字面結論**不是翻面，是改成顯式 overwrite 旗標**。
    #
    # 🔴 **為什麼繞了這一圈（這一段比結論本身更重要）**：68 與 69 是**同時**進行的兩份查證，
    #    68 拿不到原生行為，就以生態事實標準（`press` 級）當依據翻了規格；69 換一批來源後
    #    在**官方 help**（`help` 級）找到了原生行為。**教訓：`press` 級來源足以「登記為未知」，
    #    不足以「翻面一條已生效的資料安全預設」。** 來源分級不是學術潔癖，它就是這次的成本。
    #
    # 🔴 **防回退**：任何人看到本鍵是 `true` 又看到 68 §B-3 寫著「要改成 false」，
    #    **不要照 68 改**——68 的那一條已被 69 以更高等級的來源推翻，兩份文件都不會再改
    #    （docs/research/* 是證據不是結論）。要改本鍵，必須先推翻 69 §V-182 的 `help` 級出處。
    blank_means_unchanged: true
    # ⚠ V-200：本尊在「勾選覆寫」與「不勾選」兩種模式下，對**空白** Translated content
    #    分別做什麼，官方 help 完全沒寫 ⇒ 我方**不**把空白解讀成刪除（保守失效：
    #    刪除是不可逆操作，不該由「儲存格是空的」這種易誤觸的狀態觸發）。
    #
    # --- 🔴 顯式覆寫旗標（69 §V-182 建議的形態；取代「空白＝刪除」這個隱式語義）---------
    # 不勾（預設）⇒ 只匯入新譯文，既有譯文一律不動；勾 ⇒ 檔案內有值的儲存格覆寫既有譯文。
    # 🔴 **預設 false**：跟隨本尊（其勾選框預設不勾），且與「保守失效」一致。
    overwrite_existing_default: false
    # 覆寫的作用範圍＝**表頭出現的欄位 × 檔案內有值的儲存格**。
    # 🔴 空白儲存格**永遠不在覆寫範圍內**（否則 overwrite=true 就變回「空白＝刪除」，繞回 ② 那條路）。
    overwrite_scope: non_blank_cells_in_present_columns
    # 清空譯文的**唯一**明示手段（不再是空白的同義寫法）。
    explicit_clear_token: "__CLEAR__"
    # <!-- 依 69 §V-182 由 true 改為 false。68 號把 `__CLEAR__` 降級成「空白的同義寫法」，
    #      是因為當時空白本身就會清空；現在空白＝不動作 ⇒ `__CLEAR__` **回到唯一清空手段**的位置。
    #      🔴 這一鍵與 blank_means_unchanged 是**同一個語義的兩面，必須一起改**：
    #         若有人只把 blank_means_unchanged 改回 false 而漏了這一鍵，語義仍然自洽（兩者都清空），
    #         **所以這個漏改不會被任何測試抓到** —— 這正是把兩者寫在同一段註釋裡的理由。 -->
    explicit_clear_token_is_alias_of_blank: false
    # 「不變更」的四種表達（**這是本區塊的核心契約**）：
    #   列缺席     ⇒ 該 (resource, locale, field) 完全不處理
    #   欄位缺席   ⇒ 該欄位對檔案內所有列都不處理（匯入器**不得**把缺席欄當成空字串）
    #   儲存格空白 ⇒ 🔴 **本列本欄不做任何事**（69 §V-182；**不是**刪除）
    #   有值但未勾 overwrite ⇒ 該譯文已存在時保持原值（只補新的）
    absent_row_means_unchanged: true
    absent_column_means_unchanged: true
    # 🔴 **缺席與空白仍然必須在解析層就分開——這條在本次二次修正後不但沒有失效，反而更關鍵。**
    #    技術理由不變：CSV 讀進來的「沒有這一欄」與「這一欄是空字串」在多數 CSV 函式庫裡都會塌成 nil，
    #    ⇒ 匯入器必須以**表頭**判定欄位是否存在，不以值判定。
    #    🔴 新的理由（69 §V-182）：**overwrite_existing 的作用範圍就是靠表頭界定的**。
    #       若解析層分不出缺席與空白，overwrite=true 會把「檔案裡沒有的欄位」也算進範圍，
    #       於是一份只想改標題的檔案會把描述一起洗掉——**那就是 ② 的誤刪風險換了個入口回來**。
    absent_vs_blank_distinguished_by_header: true
    # --- 匯入預覽四鍵（68 號新增，🔴 本次修正**全部保留**，但計數對象改了）-------------
    # 🔴 它們解決的是真問題，不隨空白語義改變而失效：破壞性操作在按下確認前必須有一個數字。
    #    68 號時計的是「將被清空的儲存格數」；現在破壞性來源有兩個，**兩個都要單獨列出**：
    #      ①`__CLEAR__` 的明示清空數  ②overwrite=true 時「將被覆寫的既有譯文數」
    #    🔴 ② 是本次修正**新增**的風險面：overwrite 是使用者的一次明示動作，但它的**爆炸半徑**
    #       仍然是整份檔案 —— 勾一個框而不知道會蓋掉多少既有譯文，跟誤刪一樣不可接受。
    preview_required: true
    preview_clear_count_separate: true
    preview_overwrite_count_separate: true
    # 清空／覆寫筆數佔該檔案總列數超過此比例 ⇒ 二次確認
    # （形態同 machine_translation.batch_confirm_above_resources）。
    clear_ratio_confirm_threshold: 0.2
    overwrite_ratio_confirm_threshold: 0.2
    # 🔴 清空**與覆寫**都是可回溯的：被清空／被覆蓋的舊譯文進 translations 的稽核軌
    #    （誰、何時、由哪一次匯入），否則「譯者交錯檔案」這件事在事後完全無法還原。
    clear_writes_audit_trail: true
    overwrite_writes_audit_trail: true
    # 缺 source_digest 欄 ⇒ 整檔拒絕（沒有 digest 就無法安全回寫）。
    require_source_digest_column: true
    # digest 不符 ⇒ **仍然寫入**（譯者是照當時原文翻的，內容多半可用）但標過期＋待覆核，
    # 並列入匯入報告。🔴 不得靜默當成最新。⚠ 官方行為未查證 ⇒ V-164。
    digest_mismatch_action: write_and_mark_outdated
    # 逐行獨立 transaction ＋ 逐行結果報告（沿用 13 §F6.1 既有形態）。
    per_row_transaction: true

  # --- 快取維度（67 §G；承 63 §D.3）------------------------------------------
  cache:
    # 🔴 63 §D.3 把 locale 無條件放進頁級 key；本檔改為**依實際依賴降維**。
    #    降維判定必須 fail-closed：漏偵測＝跨語言污染（英文使用者看到中文），
    #    比多存幾份嚴重得多。
    dimension_reduction_enabled: true
    fail_closed: true
    # 只有「本次渲染完全沒有 touch 任何 locale 來源」才允許移除 locale 維度。
    # 🔴 {{ '…' | t }} 命中主題 locale 檔同樣算 locale 依賴（容易漏，因為它不經 translations 表）。
    locale_sources: [translations_table, theme_locale_file, platform_string_bundle]
    # dev/staging 的雙渲染驗證：同一 section 以兩個 locale 渲染，輸出逐位元組相同才可標為
    # locale-invariant，結果存 section_dimension_profile；生產只讀該表，不現場判定。
    dimension_probe_enabled: true
    # 🔴 cache_stamp 必須加入 translations（否則 63 §D.3 紀律 2 的自檢會 raise——那是好事）。
    additional_cache_stamp_sources: [translations_updated_at, shop_locales_version]
    # translations 的 stamp 是**資源 × 語言**級；shop_locales_version 是全店級（罕見動作）。
    translations_stamp_granularity: resource_locale
    # 預熱只針對 published 且有實際流量的 (market, locale) 對；
    # 🔴 不得用 |locales| × |markets| 的笛卡兒積預熱（語言是市場的子集，會生出永不命中的 entry）。
    warm_only_published_with_traffic: true
    # 單店參與快取鍵的語言數超過此值即告警（**告警不是擋**——擋住新增語言違反裁定）。
    max_locale_dimensions_warn: 8

  # --- 格式化分界（67 §H.2）—— 判準：這個字串會不會進對帳／結構化資料／對外系統 --
  formatting:
    # 🔴 金額的符號／位置／小數位／千分位分組／小數點，五者全部由 market locale 決定，
    #    **不隨內容語言變**。英文版的 HK 店仍顯示 HK$1,480.00。（鐵律 10 ＋ 裁定二）
    money_follows: market_locale
    # 🔴 數字系統固定拉丁數字：金額字串會進 JSON-LD／feed／對帳，
    #    ١٬٤٨٠٫٠٠ 與 1,480.00 是同一個數的兩種字串 ⇒ 違反鐵律 7；
    #    且 62 §A.4 已定 JSON-LD 不套用任何 locale 格式化。
    numbering_system: latn
    # 日期／時間／非金額數字／複數／排序 ⇒ 跟著**內容語言**（鐵律 3／65 號的既有要求）。
    date_follows: content_locale
    time_follows: content_locale
    non_money_number_follows: content_locale
    plural_follows: content_locale
    collation_follows: content_locale
    # 時區是事實不是呈現 ⇒ 不隨語言。
    timezone_follows: shop_or_market
    # 🔴 機器讀的字串沒有 locale：JSON-LD／feed／API／匯出／webhook 一律 locale-invariant
    #    （ISO 8601 日期、"." 小數點、無千分位）。
    machine_readable_locale_invariant: true

  # --- 前台（67 §F）-----------------------------------------------------------
  storefront:
    # 🔴 語言只由 URL 決定。Accept-Language 只影響「要不要顯示建議橫幅」與切換器預設高亮，
    #    不得改變同一 URL 的輸出內容；cookie 同理。
    #    否則爬蟲會索引到隨機語言版本，且 62 §I.1 的自指／雙向不變量失去意義。
    language_determined_by: url_only
    accept_language_affects_content: false
    cookie_affects_content: false
    # 🔴 內容不隨 Accept-Language 變 ⇒ **不得輸出 Vary: Accept-Language**
    #    （輸出它等於把快取切成 N 份卻沒有任何內容差異）。
    emit_vary_accept_language: false
    # 建議橫幅必須是 locale-invariant 片段（否則把 Accept-Language 拉回快取鍵）。
    suggestion_banner_locale_invariant: true
    # 依 68 號 §C-3 跟隨 Shopify 做法修正（2026-08-12）。
    # 原註釋：「語言自動重導：**不做**（地區重導已由 seo.redirect_geo.enabled_default: false 定案，62 §K）」
    # 🔴 **值不變（仍為 false），改的是理由**：原註釋把「語言不重導」掛在「地區也不重導」上，
    #    而地區的預設已翻成 true（seo.redirect_geo.enabled_default）。若不改這行，下一個人會
    #    照著括號裡那句話把本鍵一起翻成 true——那是 Shopify **明文預設停用**的東西。
    # Shopify 實際做法：**地區自動重導預設啟用、自動語言偵測預設停用**（help，兩個預設值方向相反）。
    #    ⇒ 本鍵維持 false 不是我方偏好，而是**與 Shopify 一致**；我方之前沒意識到這一半已經對齊了。
    auto_redirect_on_language: false
    # 切換器必須是真實 <a href>（62 §K.2 已定：爬蟲發現其他版本的路徑之一）。
    switcher_must_be_anchor: true
    # 未發布語言：URL 立即 404，且不進 hreflang／sitemap
    # （62 §0.2 原則 4 要求矩陣內每個 URL 對任何客戶端回 200）。出處：29 §1.2（help）
    unpublished_locale_status: 404
    # 主題 locale 檔是 JSONC（/* */ 註解、CRLF、BOM、尾隨逗號）⇒ tolerant parser 是硬需求。
    # 出處：docs/research/66 §A.9（fixture，Ella 7.2.0 實證）
    theme_locale_tolerant_parser: true
    # 前台字串（xx.json）與編輯器字串（xx.schema.json）是兩套，混用是靜默錯誤；
    # 且兩套語言清單不對稱 ⇒ 🔴 fallback 必須**逐檔獨立解析**，
    # 不能有「本主題支援語言 X」這個單一布林。（fixture，66 §A.9 坑 2/3）
    theme_locale_fallback_per_file: true
    # 主題硬編字串：解析器「以 t: 開頭才查表，否則原樣顯示」（66 §A.7 既有結論）。
    theme_translate_only_t_prefixed: true
    # 結帳鎖語言（對稱於 29 §5「結帳鎖定進入時的 presentment currency」）＋訂單快照 locale
    # （同 56 §0.2「訂單成立即快照法域碼」的紀律）。
    checkout_locale_locked_on_entry: true
    order_locale_snapshot_required: true
    # 通知信語言解析鏈。⚠ 官方優先序未查證 ⇒ V-170。
    notification_locale_chain: [customer_locale, order_locale_snapshot, shop_source_locale]

  # --- 搜尋與排序（67 §C.7）---------------------------------------------------
  search:
    # 索引鍵含 locale，且分析器 per-script：ngram 對中文正確、對英文產生大量噪音詞元；
    # 詞界分析器反之。D6（DECISIONS.md）只定了「MySQL ngram」，不足以涵蓋多語言。（ours）
    index_key_includes_locale: true
    analyzer_by_script: { Hant: ngram, Hans: ngram, Jpan: ngram, default: word_boundary }
    # 只搜當前語言；無結果時**提示**跨語言搜尋，不自動跨（中文查詢回英文結果看起來像壞掉）。
    cross_locale_search: suggest_only
    # 索引一律套 discoverable scope（13 §F1.2(e) 第 5 項）；多語言不改變這條。
    scope: discoverable
    # ⚠ V-168：官方多語言搜尋行為未查證。
  # 排序 collation 由 platform_locales.collation 提供。
  # ⚠ V-166：MySQL 8 可用的中文 collation 與其排序依據未查證 ⇒
  #    沿用預設，UI 標「依系統順序」，**不宣稱拼音或筆畫排序**。
  collation_source: platform_locales.collation

  # --- 後台兩層語言（67 §E.1）-------------------------------------------------
  admin:
    # 🔴 介面語言與內容語言是**兩個切換器**，不得連動。合成一個下拉的事故：
    #    商家切成 English 想看懂 UI ⇒ 內容語言也切到 en ⇒ 標題欄空白（尚未翻譯）
    #    ⇒ 商家以為資料掉了，把中文打進英文版標題。只有前台切語言時才會被發現。
    ui_locale_and_content_locale_are_separate: true
    # 介面語言是**員工**屬性（同一家店可能有講不同語言的員工）。
    ui_locale_scope: staff_member
    # 🔴 平台 UI 字串在**平台 bundle**，不進租戶 translations 表：
    #    否則每租戶存一份副本、租戶能改平台文案、平台改版無法覆蓋。
    ui_strings_storage: platform_bundle
    # 內容語言進 URL（可分享、可回退、重整不丟失）。形態沿用 52 號 P0-18「路由進 URL」。
    content_locale_in_url: true
    content_locale_default: source_locale
    # 🔴 2026-08-23 裁定 C1 翻轉（原 true）：建立態**即可填多語**（SHOPLINE 內嵌形態；
    #    productSet 一次 tx 寫 base＋譯文）。來源語言欄位仍必填（C4）。原文保留供追溯：
    #    「建立新資源一律在 source locale 下（base row 還不存在，沒有東西可翻）」——資料層仍成立
    #    （base 先寫、譯文後寫，同一 tx），改的只是 UI 能不能在同一次提交裡帶譯文。
    create_only_in_source_locale: false
    # 平台 admin 介面語言包（ML-1）；與 launch_locales 同集合但**不是同一件事**（介面 vs 內容）。
    ui_locales: [en, zh-Hant, zh-Hans, ja, fr]
    ui_locale_default: en
    # 🔴 非來源語言下必須唯讀的欄位——最貴的誤操作在這裡：
    #    不做唯讀，商家會在 en 頁面把價格 1,480 改成 148（以為只影響英文版），
    #    而實際上改的是唯一的那筆 product_variants.price_cents（63 §B.3：商品層沒有價格）。
    #    這不是顯示問題，是真的收錯錢。
    readonly_fields_in_non_source_locale:
      [price, compare_at_price, unit_cost, margin, sku, barcode, inventory_tracked,
       inventory_quantity, status, publications, variant_publications, handle, tags,
       taxonomy_category, option_structure]
    # UI 形態：灰化＋tooltip，不是隱藏（隱藏會讓商家以為英文版沒有價格）。
    # 沿用 notification.non_toggleable_ui 的既有形態。
    readonly_ui: disabled_with_tooltip
    # 唯讀必須雙層（前端灰化 ＋ 後端拒絕）。
    readonly_enforced_server_side: true
    # 翻譯進度四個出口（列表徽章／翻譯後台／健康頁／GraphQL）讀**同一張** translation_status
    # 物化表（鐵律 7）；任一處不得現算 GROUP BY。
    progress_single_source: translation_status
    # 翻譯輸入的兩種模式（67 §E.2-1；alt 觀察＋我方判準，V-226）。
    # 🔴 模式只是 UI 形態，**不影響 schema**（驗收 AD-1b③：分頁式編輯後 translations 仍逐欄位一列，
    #    不得出現「一個語言一份 JSON blob」的列）。
    translation_input_mode:
      stacked_for: [short_single_line]        # 短單行欄位（title 等）堆疊式，每框標題帶 endonym 後綴
      tabbed_for: [rich_text, seo_group]      # 富文本／SEO 組分頁式
      mode_does_not_affect_schema: true
      stacked_label_suffix: endonym            # 「商品名稱 (English)」——用 endonym 不用國旗
      no_flag_icons: true                      # 🔴 國旗≠語言（zh-Hant 沒有旗；掛旗必錯一種市場）

  # --- URL locale 前綴（67 §F.1(b)(c)；2026-08-13 使用者裁定）--------------------
  # 🔴 依據是「使用者裁定」，不是查證、不是跟隨 Shopify——本組是 67 號第二處**明知偏離本尊**
  #    （第一處＝handle.ascii_only）。本尊：primary market 預設語言無前綴、其他語言裸語言前綴
  #    （/en）；我方：恆帶地區、恆有前綴、無例外（裁定逐字「香港就是 en-HK……台灣就是 zh-Hant-TW」）。
  # 🔴 裁定若改：本組、seo.hreflang.always_region_qualified／bare_language_code_forbidden、
  #    67 §F.1 必須連帶重審——單獨改任何一個都是半套（62 §I.2-1「裁定若改」欄）。
  locale_prefix:
    always_region_qualified: true
    bare_language_prefix_forbidden: true      # /en 這種裸語言前綴一律不存在
    format: "/{lang(2-3)}[-{script(4)}]-{region(2)}"   # 正則 ^/[a-z]{2,3}(-[a-z]{4})?-[a-z]{2}$
    case: lowercase                            # 🔴 與 hreflang 碼大小寫不同、不得互相借用（62 §I.2）
    # 根路徑不是內容頁：302 到預設 (market, locale) 前綴（不是 301——預設市場會變）。
    # 🔴 爬蟲不豁免此重導（它與 62 §K.2 地區重導是兩件事）。⚠ V-221（我方推導，非裁定明文）。
    root_path_behavior: redirect_to_default_prefix
    root_redirect_status: 302
    # 🔴 前綴 ≡ (market, locale) 身分（67 §F.1(c)）：路由＝剝第一段查表，未命中一律 404。
    prefix_is_market_locale_identity: true
    market_determined_by: url_only             # 🔴 不得從 GeoIP／cookie 推市場（同一 URL 恆同一市場）
    unknown_prefix_status: 404
    # 🔴 前綴輸出永遠不得被當成 hreflang 值（兩者驗證器無交集，67 §F.1(a)；SF-9 型別分離）。
    never_reused_as_hreflang_code: true
    # 多國市場的 region 段來源＝presence 的 subfolder_suffix（暫案 C）。⚠ V-225 待裁定。
    multi_country_region_source: web_presence_subfolder_suffix

  # --- per-market 語言白名單（67 §A.5／§C.8；2026-08-13 使用者裁定）--------------
  market_locales:
    # 🔴 概念名 market_locales、實體沿用既有表——另建表會與 presence 粒度立刻不同步（§C.8(a)）。
    entity: market_web_presence_locales
    separate_table_forbidden: true
    grain: web_presence                        # 🔴 市場的開放語言＝resolved presences 的聯集
    inheritance: additive_only                 # 沿 market.inheritance_additive（web_presences）
    subtractive_override_forbidden: true       # 子市場不可減掉父市場開放的語言（§A.5(d)）
    # 白名單是曝光決策不是存取控制：其他市場的合法前綴仍 200（不做地域封鎖）。
    whitelist_is_presentation_not_access_control: true
    switcher_lists_open_locales_only: true
    # 🔴 切換器是 country＋language 兩個控件（§F.2）；前綴 en-hk 字面像「一個下拉」，明文擋住合併。
    switcher_is_two_controls: true
    unopened_prefix_status: 404                # 未開放／已關閉的 (market, locale) 組合
    other_market_prefix_status: 200            # 對照組：別的市場開放的前綴照常服務
    close_requires_impact_counts: true         # 關閉確認對話三數字（§C.8(c)）
    close_does_not_delete_translations: true   # 🔴 譯文是資產，曝光是決策（§A.5(a)）
    # 沿用 i18n.max_shop_locales 作上界（③⊆② 已由 FK 保證；本鍵只讓錯誤訊息說得出話）。
    max_per_market: 20

# =============================================================================
# 21. Handle 政策——規格見 docs/specs/67-multilingual.md §D（並取代 62 §F.3 的舊規則）
# =============================================================================
# 🔴 使用者 2026-08-12 裁定逐字：「url hand 使用英文標題，**禁止使用中文**。」
#    範例：kerastase-specifique-stimuliste-nutri-energising-daily-anti-hairloss-spray-125ml-4-2oz
#    這**推翻**了 62 §F.3 原本的「保留 CJK ＋ percent-encoding」（原登記為 V-119，已結案）
#    與 13 §F2-1 的「demo 選 unicode handle（/products/棉質短T 可用）」（13 待改，67 §M-1）。
#
# 🔴 **下一個人請先讀這段再動手**：看到 handle 規則不允許中文，不要當成國際化沒做好而「修回去」。
#    多語言是**做在別的地方**——語言維度由 URL 前綴承載（/en/products/x），handle 本身
#    全站單一且恆為 ASCII（67 §D.3）。把 CJK 加回 handle 會同時打破 URL 前綴的唯一性推論、
#    301 的正規路徑比對、以及裁定本身。
#
# 🔴 **本區塊獨立於 i18n 與 seo**：handle 政策同時被 62（SEO／301／canonical）、
#    67（語言維度）、13（商品欄位）引用。放進任一方都會讓另外兩方跨區塊引用「別人的鍵」。
handle:
  # --- 字元規則（67 §D.1，由裁定範例逆推；已用該範例做過可重跑驗證，逐字元相同）------
  charset: "a-z0-9-"
  # （ruling）🔴 依 68 號 §B-1 補記：**Shopify 實際不是這樣。** 本尊對非拉丁字集（CJK／西里爾／
  #   希伯來／emoji）是**原樣保留**，中文標題得到的是中文 handle，從不落代碼、也不擋發布
  #   （press ×4，含 staff 承認的兩則）。本鍵**依使用者裁定**（「url handle 一律英文，禁止中文」）
  #   而存在，是**明知偏離 Shopify**，不是對齊。裁定若改，本鍵與 min_latin_alpha_chars／
  #   max_dropped_letter_ratio／fallback_pattern 四者必須連帶重審（67 §D.2、62 §F.3）。
  ascii_only: true
  separator: "-"
  lowercase: true
  nfkc_normalize: true                   # 全形 → 半形：ＳＫ－ＩＩ　230ｍL → sk-ii-230ml
  # 撇號與引號類**刪除**（不是分隔）：Bob's → bobs，不是 bob-s。
  # ✅ 依 68 號 §C-4 補出處：**與 Shopify 一致**，本輪實測（test）：`Women's → womens`（allbirds）、
  #   `Men's → mens`（god）、`16" Cash Drawer → 16-cash-drawer`（hardware.shopify.com）。
  #   同表另證：`.`／`/` 轉分隔（`A.P.C. → a-p-c`、`#AU/NZ → au-nz`）、變音折疊
  #   （`Créature → creature`、`Décor → decor`）、首尾分隔修剪、`®` 消失 —— 逐條與我方相同。
  delete_chars: ["'", "’", "‘", "ʼ", "\"", "“", "”", "`", "´"]
  # 🔴 不可分解的拉丁字母必須先查表轉寫——NFKD **不分解**這些字母，
  #    少了這一步 Straße 會變成 stra-e（HDL-4）。
  transliterate_table:
    { "ß": ss, "ø": o, "đ": d, "ł": l, "æ": ae, "œ": oe, "þ": th, "ð": d, "ı": i, "ŋ": ng }
  fold_diacritics: true                  # Kérastase → kerastase（NFKD → 去 combining marks）
  # 🔴 其餘標點一律轉分隔符，**不是刪除**：125ml/4.2oz → 125ml-4-2oz。
  #    刪除小數點會得到 42oz —— **規格數字被改寫**，這是本區塊最重要的一條（HDL-3）。
  punctuation_to_separator: true
  decimal_point_to_separator: true
  # 不做詞彙展開（& → and、% → percent）：那是英文特定的，開了頭就要為每個語言維護一張表，
  # 而它換來的 SEO 收益沒有任何證據支持。（ours）
  # ✅ 依 68 號 §C-6 補出處：**與 Shopify 完全一致，本輪實測 5 次確認**（test）：
  #   `Carroll&Chan → carroll-chan`、`Bags & Wallets → bags-wallets`、`Herbs & Grow Kits →
  #   herbs-grow-kits`、`Plant Duos & Trios → plant-duos-trios`、`… Originals & the New York
  #   Yankees → …-originals-the-new-york-yankees`；0 例展開成 `and`。`%`／`$` 同樣轉分隔符
  #   （`Clearance 50% Off → clearance-50-off`、`Only HK$88 → only-hk-88`）。
  #   ⇒ 本鍵從「我方判斷（ours）」升格為「已對齊本尊（test）」，不得再被當成待確認項重開。
  expand_symbol_words: false
  collapse_separators: true
  trim_separators: true
  # 長度上限。裁定範例本身 86 字元未被截斷 ⇒ 上限遠大於 86。
  # 依 68 號 §C-4 更新出處：Shopify 的 255 已有**二手佐證且數值與我方相同**
  #   （matrixify.app/documentation/shopify-limits/，press，記載「超過會被截斷」）。
  #   ⇒ 原 V-160 的「未查證」狀態降為「二手佐證」；「取得官方出處」改由 **V-183** 承接。
  max_chars: 255
  # 🔴 截斷必須在分隔符邊界，不得從字元中間切（會產生半個詞）。
  truncate_on_separator_boundary: true

  # --- 品質閘門（67 §D.2(b)）--------------------------------------------------
  # 「殘渣 slug」比自動代碼更糟：棉質短T → "t" 幾乎必然碰撞（變成 t-2、t-3），且對任何人無語義。
  min_latin_alpha_chars: 3
  # 被丟棄的字母比例上限。0.5 讓「無印良品 MUJI 有機棉 T-Shirt → muji-t-shirt」通過，
  # 讓「棉質短T」與純中文標題落 fallback。
  max_dropped_letter_ratio: 0.5
  # 有任何字母被丟棄（ratio > 0）⇒ 標記「handle 可能不完整」，供後台篩選與提示。不得靜默。
  flag_when_letters_dropped: true

  # --- 來源優先序（67 §D.2，🔴 我方決策 D-67-H1）------------------------------
  # 為什麼「英文標題」這一步是免費的：裁定同時要求「商品所有數據都要多語言，首發含英文」
  # ⇒ 英文標題**本來就要填**。只要多語言做對了，handle 的中文問題自動消失。
  source_field_priority: [manual, en_title, base_title, deterministic_fallback]
  # 🔴 不做拼音：對粵語圈是錯的（基準法域＝香港，鐵律 11）、多音字讓確定性也不成立、
  #    產生的字串沒有任何搜尋價值。
  transliteration_pinyin_forbidden: true
  # 🔴 MT 不得直接產生 handle：URL 是永久身分，生成器必須確定性（同輸入同輸出、
  #    不依賴當日模型版本）；且它會在寫入路徑引入外部 IO（63 §A.2、鐵律 5）。
  #    MT 只能產生 **en 標題的草稿**，人確認後才成為譯文，handle 再由該譯文推導。
  machine_translation_as_direct_source_forbidden: true
  # 不用 SKU：非必填、軟唯一（61 §1.5）、常含供應商內部編碼 ⇒ 放進公開 URL 是營運資訊外洩。
  sku_as_source_forbidden: true
  # 確定性 fallback：8 字元 Crockford base32，per-shop 隨機且不重用
  # （不用流水號——那會洩漏商品數與建立順序）。
  fallback_pattern: "{resource}-{token8}"
  fallback_token_alphabet: crockford_base32
  # 🔴 不擋發布：用硬擋換 URL 品質，換來的是商家亂打英文字母——那比自動代碼更糟，
  #    因為亂打無法被偵測與修復，自動代碼可以（可篩選、可統計、可提示）。（ours）
  require_meaningful_on_publish: false
  # 取而代之的四條可觀測摩擦（67 §D.2(a)）。
  surface_auto_token_ratio_in_seo_health: true
  # handle 只在建立時自動生成一次；之後標題變更**不自動改 handle**，
  # 只在 SEO 卡提供「同步更新網址（會建立 301）」的可選動作。
  regenerate_on_title_change: false

  # --- 語言維度（67 §D.3，🔴 我方決策 D-67-H2）-------------------------------
  # handle 是 per-shop-per-resource 的**單一值**，不隨語言變；語言由 URL 路徑前綴承載。
  #   ✅ /products/x  ・ /en/products/x  ・ /zh-hans/products/x
  #   ❌ /products/x-en（語言寫進尾綴：與衝突尾綴 -2 字面無法區分）
  #   ❌ 每語言不同 handle（handle 一律英文 ⇒ 三個英文 handle ＝ 同義詞增生，在地化收益為零）
  # 這也讓 62 §I.1 的 absolute_url() 變成純字串拼接，不必對每個 (wp, locale) 查 DB。
  per_locale_enabled: false
  # 逃生口：resource_handles 表已預留 locale_tag 欄（首發恆 NULL），開鍵即可，不需 migration。
  per_locale_schema_reserved: true
  # 🔴 handle 不是可翻譯欄位——刻意偏離 29 §2.1 的 TranslatableResourceType（67 §M-2）。
  translatable: false

  # --- 唯一性與衝突（67 §D.4）------------------------------------------------
  # 鐵律 2：複合索引以 shop_id 開頭。per resource_type（/products/summer 與
  # /collections/summer 可並存），**不乘 locale**。
  uniqueness_scope: [shop_id, resource_type]
  # 🔴 檢查對象 ＝ 現用 handle ∪ **已退役 handle**。退役集合直接讀 url_redirects
  #    （source='handle_change'），**不另建第二張表**——62 §F.3 允許商家刪除該重導來釋放
  #    handle，兩張表會立刻不同步。
  never_reuse_retired_handles: true
  retired_handle_source: url_redirects
  # 依 68 號 §C-4/5/6 附帶條跟隨 Shopify 做法修正（2026-08-12）。
  # 原值 `numeric_suffix_from_2`，原註釋：「生成衝突 ⇒ 自動尾碼，自 -2 起算（「第二個」的直覺）。
  #   ⚠ 13 §F2-2 寫的是 -1 起算 ⇒ 不一致，登記於 67 §M-1。」
  # Shopify 實際做法：**自 `-1` 起算**。出處：shopify.dev/docs/api/liquid/basics（dev，官方例
  #   兩個同名商品 ⇒ `potion` 與 `potion-1`）＋ 本輪實測（test）：同店兩個同名系列得到
  #   `ceiling-fans` / `ceiling-fans-1`；另見 `home-decor-accessories-1`、`nathan-road-collection-1`。
  # 🔴 **這條不一致是反向解決的：13 §F2-2 寫的 `-1` 本來就是對的，要改的是 67（與本鍵）。**
  #    「第二個用 -2」只是我方的直覺，沒有任何依據，而它會讓從 Shopify 匯入的 handle 在
  #    重新生成時全部偏移一號（`potion-1` 已存在 ⇒ 我方生 `potion-2`，本尊生 `potion-1`）。
  # 🔴 **防回退**：不要因為「-1 看起來像第一個」而改回 from_2。67 §M-1 已反向結案。
  collision_strategy_generated: numeric_suffix_from_1
  # 🔴 手填衝突 ⇒ **拒絕**（userErrors HANDLE_TAKEN），不得靜默加尾碼——
  #    那是把商家明確輸入的值偷偷改掉。
  collision_strategy_explicit: reject
  # 保留字：至少含平台路由段與**全部啟用中的 locale 前綴／市場 subfolder suffix**。
  # 新增語言時必須檢查其前綴不與既有第一路徑段衝突，衝突則拒絕新增語言。
  reserved: [all, new, index]
  reserved_first_segments: [products, collections, pages, blogs, cart, checkout, account,
                            search, apps, admin, ".well-known", "agents.md", "llms.txt",
                            "llms-full.txt", sitemap.xml, robots.txt]

  # --- 改名 301（承 62 §F.3／§B.5，本區塊只補多語言面）------------------------
  # 登記與比對一律用**不帶前綴的正規路徑**（否則一次改名要為每個語言寫一列，
  # 刪語言時那些列變成孤兒）。
  redirect_path_is_prefix_stripped: true
  # 🔴 路由層命中 404 前先剝 locale 前綴 → 查表 → **命中後把前綴加回去再 301**：
  #    /en/products/舊 ⇒ /en/products/新（不得丟回 /products/新，那會把英文使用者踢回預設語言）。
  redirect_preserves_locale_prefix: true
  # 鏈長沿用 seo.redirect_max_chain(10)。

  # --- 🔴 Liquid handleize filter 不是 URL handle 生成器（67 §D.5）------------
  # Ella 用 handle/handleize **91 處**（27 §5，fixture），幾乎都在產生 CSS class／DOM id／JS 鍵，
  # 不是 URL：data-option="{{ option.name | handleize }}"。
  # 若把上面的 ASCII-only 管線套上這個 filter：{{ '顏色' | handleize }} → "" ⇒ 多個選項的
  # 選擇器全部相同 ⇒ **變體選擇器選錯選項，不報錯、不空白，只是選錯**。
  liquid_filter_ascii_only: false
  # 空結果必須有值（空字串會造成選擇器碰撞）。
  liquid_filter_empty_fallback: "h-{sha1_8}"
  # 依 68 號 §F-3 跟隨 Shopify 做法修正（2026-08-12）：**觸發條件收窄**。
  # 原本沒有這個鍵，§D.5 的敘述隱含「ASCII-only 會讓結果落空 ⇒ 落 fallback」。
  # 68 §F-3 查到（community.shopify.dev/t/unicode-in-handleize-output/1060，2024-10，**staff 已復現**）：
  #   `{{ 'Abc 123-D--E 🔪 ŭ' | handleize }}` 的實際輸出**保留 emoji**、把 `ŭ` 折成 `u`
  #   ⇒ Shopify 的 filter 對非拉丁字元是**保留**，不是落空。
  # ⇒ 🔴 `{{ '顏色' | handleize }}` 在 Shopify **回 `顏色`，不是空字串**，
  #   所以我方的 `h-{sha1_8}` fallback **不得因「結果非 ASCII」而觸發**——那樣會輸出一個
  #   本尊不會產生的字串，主題若把 handleize 的輸出寫死進 CSS（Ella 91 處）就對不上。
  #   fallback **只在輸入本身為空或全為分隔符**時觸發（那時本尊也產生空字串，是真的必須兜底）。
  liquid_filter_fallback_trigger: empty_or_all_separator_input_only
  liquid_filter_fallback_on_non_ascii_result_forbidden: true
  # 🔴 兩個獨立實作，不得共用；filter 的文檔註釋必須寫明「這不是 URL 生成器」。
  #    （本條**不變**：URL 身分要 ASCII-only 是裁定，filter 要保留非 ASCII 是相容需求，
  #     兩個值域天生不同。68 §F-3 修正的是 fallback 觸發條件與其**依據**，不是這條分離規則。）
  liquid_filter_shares_implementation: false
  # ⚠ V-161 **已依 68 §F-3 縮小**：原問題「Shopify handleize filter 對 CJK 的實際輸出
  #    （保留／落空／轉寫）」已由 staff 復現的 bug 報告正面回答＝**保留**。
  #    殘留未證的只剩「**全形字元** 與 **空輸入／全分隔符輸入**」兩個邊界 ⇒ 併入 68 的 V-181。

# =============================================================================
# 22. Combined Listings（合併商品）——Shopify 官方等價物，**是否實作待裁定**
# =============================================================================
# 依 68 號 §B-6(c) 新增（2026-08-12）。出處：help.shopify.com/en/manual/products/
#   combined-listings-app（help）。
# 🔴 **本區塊是「已登記的缺口」，不是「已決定要做的功能」。**
#    背景：我方 62 §B.2 原有「模式 B＝變體獨立 URL」，形態不對（見 seo.variant_independent_urls_supported
#    的完整註釋）。官方要「每個變體一個獨立可索引 URL」時給的是 Combined Listings：
#      形態不是「給變體加 URL」，而是**把數個真實商品串成一個前台商品列表**；
#      每個子商品保有自己的 title／description／URL／圖片／價格／庫存，在 feed 裡是獨立項目。
#    ⇒ 這在架構上是不同的東西（parent/child 的商品關係），**不是一個開關**。
# 🔴 **依 69 號 §B-6 補一句定性（2026-08-12）**：Combined Listings **就是 Google 官方定義的
#    multi-page 形態**（各變體頁地位對等、「單一 canonical」的要求**明文不適用**，`std`），
#    不是 Shopify 私有的變通做法。⇒ 本區塊登記的是「**我方只做了 Google 兩種合規形態中的
#    single-page 那一種**」，而不是「本尊有個奇怪功能我方沒抄」。
#    這個差別會直接影響「要不要做」的裁定，所以不能省。
# 🔴 **未實作前這些鍵不得被任何程式碼讀取**（承 62 §0.2 原則 3「未宣告 ≠ 支援」）：
#    它們的用途是把上限值先落鍵（鐵律 6），避免日後實作時散落硬編碼。
combined_listing:
  implemented: false
  # 待裁定：我方要不要做等價物、要不要照 Shopify 做成方案閘門（68 §H）。
  pending_user_decision: true
  # --- 官方上限（help）--------------------------------------------------------
  max_products: 60                # 每個 combined listing 最多 60 個子商品
  max_custom_options: 3
  max_option_values: 2000
  # --- 官方限制（help）--------------------------------------------------------
  requires_plan: plus             # Plus／enterprise 方案
  requires_online_store_channel: true
  free_theme_min_version: "15.0.0"   # 其他主題要改碼
  product_single_membership: true    # 商品同時只能屬於一個 combined listing
  # --- 我方定案（先寫下來，避免實作時猜）--------------------------------------
  # 🔴 子商品一律 **self-canonical**（與 62 §B.4「一律 self-canonical，不跨市場 canonical」同一條），
  #    **不指向 parent**——指向 parent 等於宣告子商品不該被索引，那就失去做這件事的意義。
  # ✅ 依據升級（69 §B-6／§V-187）：本條現在有 **Google 官方**支撐，不只是我方推論——
  #    multi-page 形態下「整個 ProductGroup 只有一個 canonical」的要求**明文不適用**，各頁對等。
  child_canonical: self
  # ⚠ V-187：子商品 canonical 的**實際輸出**仍未一手驗證。69 號把 dev docs 也讀完了
  #    （combined-listings 與 build-for-combined-listings 兩頁**對 URL／canonical／SEO 完全沉默**），
  #    🔴 且唯一的第三方說法是**同一作者、同一 app 廠商的兩個網域**（算 1 個 `blog` 來源、
  #    無測試數據）⇒ **不得採信、不得引用**。我方按上一條定案，**不猜 Shopify**。
  verify_child_canonical: true
  # ⚠ V-203（69 號新登記）：**parent 商品本身**在 online store 上是什麼——有無可索引 URL、
  #    是否進 sitemap、canonical 指向哪裡。官方只說 parent 不可購買／無庫存／無銷售數據，
  #    **沒說它在前台是什麼**，而這對我方 sitemap／canonical 規則是必答題。
  #    我方若做等價物的預設：parent **不進 sitemap**；若有 URL 則 self-canonical。
  parent_in_sitemap: false
  parent_canonical: self
  verify_parent_url_semantics: true

# =============================================================================
# 23. 商品 CSV 匯出入（多語言）——規格見 docs/specs/70-product-csv-io.md
# =============================================================================
# 出處等級沿用 67 §0.3：
#   ruling ＝ 使用者裁定｜help ＝ Shopify 官方說明中心｜alt ＝ 對照平台官方產物
#   observed ＝ 本輪對一手檔案的實測｜ours ＝ 本專案決策（無外部依據）
#
# 🔴 **本區塊在本輪之前不存在，但已經被兩個地方引用了**：
#    ① 67 §E.6 / i18n.export.max_upload_mb_key: csv.product_max_upload_mb
#    ② 61 §9.5 把 csv.product_max_upload_mb 標成「✅ 已有」，實際指的是 media.csv_max_upload_mb
#    ⇒ 兩處都是**懸空引用**（yaml.safe_load 取不到 csv 這個頂層鍵）。本輪補上真鍵。
#    media.csv_max_upload_mb（15）**不動**：它是媒體匯入的上限，數值相同但用途不同；
#    61 §9.5 把商品 CSV 的上限映到它身上是當時的權宜，自本區塊起以本區塊為準。
#
# 一手證據（本輪實測，observed）：
#   E1 = 使用者真實商店的 Shopify 商品匯出檔（44 欄、LF、無 BOM、Body (HTML) 含換行）
#   E2 = Shopify 官方商品匯入範本（57 欄、CRLF、無 BOM、17 列含多變體與數位商品範例）
#   E3 = Shopline 商品範本 xlsx（62 欄、雙語表頭兩列、成對語言欄、(DO NOT EDIT) 標記）
csv:
  # --- 檔案格式（70 §B）-------------------------------------------------------
  # E1 與 E2 都是 UTF-8 無 BOM，但換行不同（E1=LF、E2=CRLF）⇒ 匯入兩種都收，匯出固定 LF。
  encoding: utf-8
  accept_bom_on_import: true        # Excel 存出來的檔常帶 BOM（13 §F6 坑既有）
  emit_bom_on_export: false         # observed：E1／E2 皆無 BOM
  accept_newline_on_import: [lf, crlf]
  emit_newline_on_export: lf        # observed：E1（真實匯出）＝LF
  delimiter: ","
  quote_char: '"'
  escape_style: rfc4180_double_quote
  # 🔴 儲存格內允許換行（E1 的 Body (HTML) 實測含 \n）⇒ 解析器**必須**是有狀態的 CSV 解析器，
  #    不得以「一行一列」切割。這條寫在這裡是因為它被寫錯過的成本是整檔錯位而非單列失敗。
  multiline_cell_allowed: true
  streaming_parse_required: true    # 13 §F6-2：CSV.foreach，不整檔載入

  # --- 尺寸上限（70 §B.2）-----------------------------------------------------
  # 出處：61 §6.1／§6.2（help）——商品 CSV 與庫存 CSV 都是 15 MB。
  product_max_upload_mb: 15
  inventory_max_upload_mb: 15
  # 🔴 ours（非官方）：官方未載明列數上限（61 §9.5 V-64 已登記）。沿用 13 §F6.2 的 5 萬行。
  product_max_rows: 50000
  # 🔴 ours：欄數硬上限。推導＝base_columns(43) + translatable(12) × (max_locales_per_file(4) − 1)
  #    = 43 + 36 = **79**，取 512 作結構性護欄（留給日後 metafield 欄與 Google 屬性欄的空間）。
  #    它**不是**多語言的實際約束——實際先撞到的一定是 product_max_upload_mb（15 MB）。
  # 🔴 實測補充（70 §E.2.1）：15 MB 在 **1 個語言時就已經是約束**（43 欄 ⇒ ~40,600 列 < product_max_rows
  #    的 50,000）⇒ 15 MB 是這個功能的常態約束，**不是多語言引進的**。
  # <!-- 🔴 初版推導用 max_locales_per_file(5) ⇒ 91 欄。該上限本輪改為 4（見 multilingual 區塊的推導）。 -->
  product_max_columns: 512
  # 任一商品的變體數 > 100 ⇒ 匯出改 email 寄送。出處：61 §6.1（help，P53）。
  export_email_threshold_variants: 100
  # 匯入專用的 Collection 欄字元上限。出處：61 §9.5（help，P51）。
  collection_column_max_chars: 255

  # --- 多語言欄名契約（70 §D）—— 🔴 本區塊是 70 號的核心 ----------------------
  multilingual:
    # 🔴🔴 **CSV 的語言維度＝語言（shop_locales.tag），不帶地區。** 全文＝70 §D.0／§D.5。
    #
    #    內容維度（本區塊）  shop_locales      en / fr / zh-Hant / zh-Hans   ⇒ 4 份內容 ⇒ 4 組欄
    #    呈現維度（62 §I.2） market × locale   /en-hk /en-ca /zh-hant-hk …   ⇒ 7 條 URL 前綴
    #    🔴 /en-hk 與 /en-ca 讀的是**同一格** `Title [en]`。7 條前綴只要 4 個語言欄。
    #
    # <!-- 🔴 沿革：commit c2c1355 的初版訂 `locale_tag_requires_region: true`（欄名 `Title [en-HK]`），
    #      那是把使用者「URL 一律帶地區碼」的裁定誤讀成「內容也按語言＋地區鍵」。
    #      使用者 2026-08-13 澄清（ruling，逐字）：「英文都是同一組英文，不同國家只要是使用英文，
    #      都是調用 Product Name (English)。**區別只是國家在後台設定的時候，會添加國家區分碼**。」
    #      🔴 62 §I.2 行 921 早就點名過這個錯：「恆帶地區改的是**輸出的碼**，不是語言註冊表。
    #         把 zh-Hant-HK 存進 platform_locales 是本次修改最容易犯的錯。」——初版犯的就是這條，
    #         只是犯在 CSV 表頭。**不得因為 62／67 寫著「恆帶地區」就把本鍵改回去**：那兩份講輸出碼，本區塊講內容鍵。 -->
    #
    # 欄名形態：`{基礎欄名}␣[{BCP-47 語言標籤}]`。例：`Title [zh-Hant]`、`Body (HTML) [fr]`。
    # 🔴 **輸出**不抄 Shopline 的 `Product Name (English)`（三條理由見 70 §D.1）；
    #    **匯入**兩種都認（accept_locale_header_dialects），因為那換到 Shopline 商家零轉檔。
    locale_column_pattern: "{base_column} [{bcp47_tag}]"
    locale_column_open: "["
    locale_column_close: "]"
    # observed（2026-08-13 **第二輪重新驗證，數字全部重現**）：
    #   `[` 與 `]` 在 E1(44欄)＋E2(57欄)＋E3(62欄) 共 163 個表頭中出現 **0 次**；
    #   而 `(` `)` 出現 **33** 次（`Body (HTML)`／`Weight value (grams)`／`X (product.metafields.…)`
    #   ／`Product Name (English)`／`Quantity (DO NOT EDIT)`），`/` 出現 13 次。
    #   ⇒ 圓括號在 Shopify 表頭裡**已經有兩種意思**（單位註記、metafield 路徑），Shopline 又是第三種（語言）。
    # 🔴 **輸出用圓括號的具體壞法**：`Body (HTML)` 的英文譯文欄會變成 `Body (HTML) (English)`
    #    ——兩層圓括號，外層與內層無法靠語法區分，解析器只能靠寫死清單消歧義，
    #    那正是 i18n.launch_locales_is_seed_not_enum 要避免的 enum。
    #    方括號零出現 ⇒ `Body (HTML) [en]` 一眼可解析：`[…]` 一定是語言，`(…)` 一定不是。
    bracket_choice_evidence: "re-verified 2026-08-13: 0 hits of [ ] and 33 hits of ( ) across 163 header cells in E1+E2+E3"
    # 語言標籤格式沿用語言註冊的同一條規則，**不另立**。
    locale_tag_format_key: i18n.locale_tag_format
    # 🔴 表頭裡一律寫 BCP-47 標籤，禁止寫語言**顯示名**——這條只約束輸出，匯入見 accept_locale_header_dialects。
    locale_display_name_in_header_forbidden: true
    # 🔴🔴 **表頭語言標籤不得帶地區**（取代初版的 locale_tag_requires_region: true，理由見上方沿革）。
    #    `Title [en-HK]`／`Title [zh-Hant-TW]` 一律拒絕——不論是匯入進來的，還是我方自己產生的。
    #    ⚠ 想加 `Title [en-HK]` ⇒ 那是**市場級覆寫**，是**資料模型變更**不是格式變更——
    #      且該維度已依裁定 10 刪除，要先依 67 §C.2 復活條件恢復資料模型。詳見 70 §D.5(b)。
    locale_tag_forbids_region: true
    locale_tag_regex: "^[a-z]{2,3}(-[A-Z][a-z]{3})?$"
    region_bearing_tag_action: reject_file
    # 🔴 本檔假設「無市場級覆寫」——同一語言在所有市場的商品內容完全一致。
    #    依據＝2026-08-13 使用者裁定（逐字：「不必考慮香港英文和加拿大英文的揭露事項因法規必須不同，
    #    所有的都會保持一致」）。⇒ [locale] 欄唯一對應 translations(locale)——無市場維度。
    assumes_no_market_level_override: true
    market_override_ruling_date: "2026-08-13"
    # 依裁定 10（2026-08-13）修正：translations.market_id 欄已刪（67 §C.2 沿革），
    # 原鍵 locale_columns_map_to_market_id: "NULL" 的受指涉物消失 ⇒ 改為刪欄記錄。
    # （原註釋尚有一句「這是『不使用』不是『不該存在』：translations.market_id 是 67 的範圍，
    #   本區塊不動它」——成文時欄位還在，現已由 67 依裁定執行刪除。）
    market_id_column_removed: "2026-08-13"

    # --- 🔴 匯入的欄名方言（70 §D.2b）—— Shopline 商家零轉檔 -------------------
    # 與 shopify_import.accept_header_dialects（**基礎欄名**的方言）是**兩張獨立的表**，
    # 可自由組合：`Product Name (English)` ＝ Shopline 基礎欄名 ＋ Shopline 語言後綴。
    accept_locale_header_dialects: [bracket_tag, paren_display_name]
    canonical_locale_dialect: bracket_tag
    # 🔴 這張對照表是**封閉的、且只用於匯入**：商家拿來匯入的舊檔案只會出現 Shopline 支援過的
    #    語言名——新增我方語言**不會**讓別人的舊檔案多出一個語言名。⇒ 不違反 67 §A.2
    #    （那條講的是「**組出**欄名需要全集」；「**認得**欄名只需要對方用過的那些」）。
    locale_display_name_aliases_import_only: true
    locale_display_name_aliases:
      English: en
      Traditional Chinese: zh-Hant
      Simplified Chinese: zh-Hans
      Japanese: ja
      Korean: ko
      French: fr
      German: de
      Spanish: es
      Thai: th
      Vietnamese: vi
      Indonesian: id
      Malay: ms
    locale_display_name_match_case_sensitive: false
    # 🔴 表裡沒有的顯示名 ⇒ **不猜**，照 unknown_column_action 進報告。
    #    絕不做 startswith／Levenshtein 之類的近似匹配：`Product Summary (English)` 與
    #    `Product Name (English)` 差三個字，猜錯就是把摘要寫進標題。
    locale_display_name_fuzzy_match_forbidden: true
    # 🔴 顯示名解析出的標籤仍要過 unknown_locale_column_action：`(Japanese)` 解析成 ja，
    #    但店鋪沒啟用 ja ⇒ 整檔拒絕，與 `Title [ja]` 完全同路。
    #    方言只影響「怎麼讀懂欄名」，不影響「這個語言能不能寫」。
    dialect_does_not_bypass_locale_validation: true
    # 同一個 (欄, 語言) 被兩種方言各寫一次（`Title [en]` ＋ `Title (English)`）⇒ 同一格資料
    # 兩個真相 ⇒ 整檔拒絕。與 source_locale_duplicate_column_action 是同一個問題，處置相同：**不仲裁**。
    duplicate_locale_column_action: reject_file
    # 基礎欄（無後綴）＝**來源語言**的值，不是「預設值」也不是「所有語言共用」。
    # 🔴 這條是 Shopify 匯出檔能被原檔吃進來的唯一理由：一份沒有任何 [locale] 欄的檔案
    #    ＝ 一份純來源語言的檔案 ＝ Shopify 匯出檔。
    base_column_is_source_locale: true
    # 同一基礎欄同時出現「無後綴」與「[來源語言]」兩欄 ⇒ 同一格資料兩個真相 ⇒ 整檔拒絕。
    # 🔴 不做「取其一」的仲裁：任何仲裁規則都會在某個商家的檔案上選錯，而且不會報錯。
    source_locale_duplicate_column_action: reject_file
    # 表頭出現店鋪未啟用的語言 ⇒ 整檔拒絕（不靜默忽略：商家以為翻譯進去了）。
    unknown_locale_column_action: reject_file
    # 可掛 [locale] 後綴的基礎欄白名單（**白名單，不是黑名單**；同 67 §B.4 對 metafield 的做法）。
    translatable_columns:
      - "Title"
      - "Body (HTML)"
      - "Type"
      - "Option1 Name"
      - "Option1 Value"
      - "Option2 Name"
      - "Option2 Value"
      - "Option3 Name"
      - "Option3 Value"
      - "Image Alt Text"
      - "SEO Title"
      - "SEO Description"
    # 🔴 名單上沒有的欄出現 [locale] 後綴 ⇒ 整檔拒絕，並在錯誤訊息裡指出理由分類。
    #    Handle（67 §D.3 不可翻）／Tags（67 §B.3-2 集合運算的鍵）／SKU・Barcode（識別碼）／
    #    所有金額欄（鐵律 3）是最常被誤加後綴的四類。
    non_translatable_locale_column_action: reject_file
    # 🔴 Default Title 的譯文一律拒絕（63 §B.2 硬相容契約、67 §B.3-3）。
    #    翻成「預設標題」⇒ Ella 的 variants.first.title != 'Default Title' 判定翻轉。
    default_title_translation_action: reject_row
    # 欄位佈局：譯文欄緊接其基礎欄（E3 的做法，人工編輯時原文與譯文同屏）。
    # 另一個合法值 grouped_by_locale（同語言的欄集中在一起，適合機器 diff）。
    # 🔴 **匯入器一律與欄序無關**（以表頭名定位），所以佈局純粹是匯出端的人因選擇。
    export_column_layout: adjacent_to_base
    importer_is_column_order_independent: true
    # --- 🔴 寬表／長表的門檻（70 §E.2）—— 判準不是欄數，是「這份檔案由幾個人填」-----
    #
    # 🔴 **先說一件反直覺的事：欄數與檔案大小都定不出門檻。** 四個候選判準的實測：
    #   A 欄數硬上限（product_max_columns: 512）⇒ L=40 才撞到，訂在這裡等於沒訂。
    #   B 檔案大小 ⇒ **平滑退化，沒有懸崖**。實測（範本檔基準，含富文本）：
    #       L=1 43欄 388 B/列 → 15MB 容 ~40,600 列
    #       L=4 79欄 817 B/列 → 15MB 容 ~19,300 列
    #       L=8 127欄 ~1242 B/列 → 15MB 容 ~12,700 列
    #     邊際＝每多一語 +12 欄／表頭 +205 B／資料 +106 B/列 ⇒ **是加法不是乘法**
    #     <!-- 🔴 初版寫「語言數對檔案大小的影響是乘法的」，實測是加法。前半錯、後半（對列數是零）對。 -->
    #     ⇒ 檔案大小產生的是「列數 × 語言數」的乘積約束，**不可能產生語言數門檻**。
    #   C Excel／人的可用性 ⇒ 43 個基礎欄本身就超過任何「舒適」欄數；Shopify 官方範本 57 欄 0 語言。
    #   D 🔴 **這份檔案由幾個人填** ⇒ **這才是判準**（wide_vs_long_criterion）。
    #
    # 寬表一列 = 一個變體 × 全部欄位 × 全部語言 ⇒ 適合「一個人把一個商品填完」
    # 長表一列 = 一個 (資源, 欄位, 語言)      ⇒ 適合「一個人把一個語言填完」，9 欄固定不隨語言成長
    wide_vs_long_criterion: single_editor_vs_divided_editing
    long_form_is_translation_csv: true
    long_form_spec_key: "67 §E.6(b)"
    long_form_column_count: 9
    long_form_column_count_is_locale_invariant: true
    # 🔴 「多人分工」有兩條硬後果，都不是美學問題：
    #   ① 寬表的 43 個基礎欄裡有 Cost per item（成本）／Variant Inventory Qty（庫存）／
    #      Variant Barcode・Variant SKU（供應鏈識別碼）。長表的 9 欄一個都沒有。
    #      ⇒ 檔案一旦**出境**給外部譯者，寬表在合規上就是錯的工具，**與它有幾欄無關**。
    #   ② 寬表在結構上無法分工：4 個譯者改同一份檔案的不同欄 ⇒ 只能序列化或手工合併。
    #      長表可按 (locale, resource_type) 分檔（67 §E.6(b) 既有）。
    wide_form_forbidden_for_external_translators: true
    commercially_sensitive_base_columns:
      - "Cost per item"
      - "Variant Inventory Qty"
      - "Variant Barcode"
      - "Variant SKU"
    long_form_must_exclude_sensitive_columns: true
    #
    # 🔴 單檔語言數上限（ours）。**判準：R = 譯文欄數 / 基礎欄數 < 1**（譯文欄不得多過基礎欄）。
    #    R = 12 × (L−1) / 43 ⇒ L=2:0.28  L=3:0.56  **L=4:0.84**  L=5:1.12  L=6:1.40
    #    R<1 ⇒ 檔案主體仍是商品資料，「商品 CSV」這個名字還成立；
    #    R≥1 ⇒ 譯文欄多過商品欄，這份檔案已經是一張攤平的翻譯表，而那已有專用格式（長表）。
    #    ⇒ max_locales_per_file = R 首次 ≥1 的前一個整數 = **4**
    # <!-- 🔴 初版值為 5，原註解：「12 個可翻譯欄 × 5 語 ⇒ 48 個譯文欄，已與 43 個基礎欄同量級」。
    #      **判準沒換，只是把「同量級」算清楚了**：48 > 43，R = 1.12 ——它不是「同量級所以可以」，
    #      它是「已經越線」。初版把 R≥1 的那一格算進了允許範圍。 -->
    # 🔴 **這個數字剛好等於使用者的配置（4 語言），這件事本身要標出來**：使用者卡在最後一格，
    #    現在合法、開第 5 個語言就會撞上 ⇒ UI 不能只在超過時才講話（見 locale_picker_warn_at_max）。
    #    也**不得**因為「使用者剛好是 4」就以為這條規則被驗證過——它只是還沒被觸發。
    # 🔴 這是 ours，是判斷不是量測。兩個對照平台把答案夾在中間：
    #    Shopline 的寬表是 **2** 語言就停住（E3，alt）；Shopify 語言最多，它的商品 CSV 是
    #    **0** 語言、翻譯 100% 走長表（help）。⇒ 4 已經比任何一個對照平台的寬表都寬。
    max_locales_per_file: 4
    max_locales_derivation: translation_columns_must_not_outnumber_base_columns
    translation_to_base_ratio_at_max: 0.84
    translation_to_base_ratio_limit: 1.0
    # 超過上限**不是錯誤**，是把商家導去正確的工具（70 §H 的分工）。
    # 🔴 上限是「一份檔案能帶幾個語言」，**不是「店裡能有幾個語言」**——8 個語言的店照樣
    #    可以匯出商品 CSV，只是一次帶 ≤4 個。
    over_max_locales_action: redirect_to_translation_csv
    # 欄數公式（供 UI 在勾選語言時即時顯示欄數與檔案大小估算）。
    column_count_formula: "base_columns + translatable_columns * (selected_locales - 1)"
    # 實測列寬（餵給上面的大小估算；範本檔基準，含富文本描述）。
    measured_header_bytes_at_4_locales: 1341
    measured_row_bytes_at_4_locales: 817
    measured_marginal_row_bytes_per_locale: 106
    # --- 🔴 後台語言勾選器（匯出 modal）的四條行為（70 §E.2.4）------------------
    locale_picker_live_estimate: true          # 勾一個變一次；誤差 < 10%（CSV-16）
    # 🔴 勾到**第 4 個**（＝上限）時就預告，不是等到第 5 個才擋。等商家把工作流建立在寬表上，
    #    第 5 個語言才告訴他要換工具，換工具的成本已從「選一個選項」變成「改流程」。
    locale_picker_warn_at_max: true
    # 🔴 擋下時同時給出口，文案要說明**為什麼**而不只是「超過上限」。
    locale_picker_block_message_must_explain_why: true
    # 🔴 偵測到「要交給外部譯者」的意圖時，**即使未超過門檻**也推薦長表——
    #    出境是與語言數無關的獨立理由（2 語的寬表一樣洩漏全部商品成本）。
    suggest_long_form_for_external_translation: true
    # 🔴 寬表／長表在 UI 上是**同一次匯出的兩種輸出形狀**，不是兩個埋在不同選單裡的功能。
    #    否則商家根本不會知道長表存在——而上面那兩條硬後果，是他不知道就會踩的那種。
    export_form_choice_is_single_control: true
    # 🔴 商品 CSV 的多語言欄**只准出現在商品 CSV**。庫存 CSV 的 Title／Option Name 是
    #    「僅供閱讀、不會更新」欄（61 §6.2）⇒ 在那裡放譯文欄是雙重無意義，且會讓
    #    「庫存 CSV 只寫 on_hand」這條不變量出現例外。
    allowed_on: [product_csv]
    forbidden_on: [inventory_csv]
    forbidden_on_action: reject_file

  # --- 匯入語義（70 §F）—— 🔴 同一份檔案裡有**兩套**空白語義 ------------------
  product_import:
    key: handle                       # 13 §F6.4：以 handle upsert
    # 🔴 **這是本區塊最容易誤解的一條**：基礎欄與 [locale] 欄的破壞性語義**不同**，
    #    而且分界線就寫在表頭上（有沒有 [locale] 後綴）。
    #      基礎欄   ⇒ 61 §6.1（help）：勾了覆寫，**空白儲存格會把既有資料洗掉**
    #      [locale] ⇒ 67 §E.6①（69 §V-182，help）：空白 ＝ **本列本欄不做任何事**
    #    兩者都是**已生效的既有契約**，本檔不改任何一條，只把分界線做成可讀的（欄名後綴）。
    #    ⚠ 為什麼不統一：統一到「空白＝洗掉」會推翻 67 §E.6（那條同日已被翻面兩次，
    #      最終依據是 help 級的本尊原生行為）；統一到「空白＝不動作」會讓從 Shopify
    #      搬過來的商家在同一個勾選框下拿到不同結果。⇒ 保留兩套，但**分別計數、分別確認**。
    semantics_differ_by_column_class: true
    base_column_blank_semantics_key: "61 §6.1 (help): overwrite ⇒ blank wipes"
    locale_column_blank_semantics_key: i18n.import.blank_means_unchanged
    # --- 兩個獨立的覆寫旗標，🔴 不得連動（同 67 §E.1「兩個切換器不得連動」的理由）------
    # 一個旗標控兩件事 ⇒ 只想改價的商家勾下去，順手蓋掉整店譯文。
    overwrite_products_default: false          # 基礎欄；對應 Shopify「以相同 handle 覆寫商品」
    overwrite_translations_default_key: i18n.import.overwrite_existing_default   # = false
    overwrite_flags_must_be_independent: true
    # 清空：基礎欄用「勾覆寫＋留空」（Shopify 語義）；[locale] 欄用 __CLEAR__（唯一手段）。
    # 🔴 __CLEAR__ 在基礎欄裡是**字面字串**，不是 token——一欄一種機制，機制由後綴決定。
    clear_token_key: i18n.import.explicit_clear_token          # "__CLEAR__"
    clear_token_scope: locale_columns_only
    # ⚠ 已知窟窿（自 67 §E.6 繼承，本檔不自創逃逸語法）：譯文的字面值若剛好是 __CLEAR__，
    #    無法以 CSV 表達 ⇒ V-311。
    clear_token_not_escapable: true
    # --- 缺席語義：三鍵沿用 67，不重新定義 -------------------------------------
    absent_row_means_unchanged_key: i18n.import.absent_row_means_unchanged
    absent_column_means_unchanged_key: i18n.import.absent_column_means_unchanged
    absent_vs_blank_distinguished_by_header_key: i18n.import.absent_vs_blank_distinguished_by_header
    # --- 預覽：🔴 三類破壞性操作**分開計數**（67 只有兩類，本檔多一類）-----------
    #    ① 基礎欄被洗掉的格數（overwrite_products）
    #    ② [locale] 欄的 __CLEAR__ 明示清空數
    #    ③ [locale] 欄被覆寫的既有譯文數（overwrite_translations）
    #    合成一個數字 ＝ 商家無法判斷風險落在商品資料還是譯文上。
    preview_required: true
    preview_counts_separate: [base_wipe, translation_clear, translation_overwrite]
    preview_ratio_confirm_threshold: 0.2      # 形態同 i18n.import.clear_ratio_confirm_threshold
    writes_audit_trail: true
    per_row_transaction: true                 # 13 §F6.1 既有形態
    # --- 必填與致命錯誤 --------------------------------------------------------
    # Title 在**每個 handle 的第一列**必填（61 §6.1／P54：有 handle 就必須有 title）。
    # 🔴 續列的 Title **必須留白**——這是同一條規則的另一面，不是兩條規則。
    required_on_first_row: ["Handle", "Title"]
    blank_required_field_action: fail_row
    # 價格留白在 Shopify 是常見失敗（61 §6.1，P54）⇒ 建立新變體時必填，更新既有變體時可留白。
    price_required_on_create: true
    # --- 金額（🔴 鐵律 3 ＋ 65 §B X6）------------------------------------------
    # 🔴 匯入是 X6：BigDecimal(raw) × 100 ⇒ Integer cents。**不得先轉 float**。
    money_crossing_point: X6
    money_parse_type_key: money_boundary.decimal_parse_type          # BigDecimal
    money_excess_precision_action_key: money_boundary.decimal_parse_excess_precision_action  # raise
    # 🔴 **接受**的格式比**輸出**的格式寬：輸出恆兩位（money_boundary.decimal_string_regex），
    #    但 E2（Shopify 官方範本）裡 `Compare-at price` 實測有 `80` 這種零位小數的值
    #    ⇒ 若匯入端直接套 ^-?\d+\.\d{2}$，**Shopify 自己的官方範本會被我方拒收**。
    money_accept_regex: '^-?\d+(\.\d{1,2})?$'
    # 千分位：只在**無歧義**時清洗。^\d{1,3}(,\d{3})+(\.\d{1,2})?$ 不可能是小數逗號寫法
    #   （小數逗號後面是 1–2 位，不是 3 位）⇒ 這個 pattern 命中才清洗，其餘含 `,` 一律該列失敗。
    # 🔴 **不做 locale 猜測**：de-DE 的 `1,29`（＝1.29）與 en 的 `1,290`（＝1290）
    #    只能靠猜，猜錯就是十倍價差且測試全綠。
    money_thousands_separator_strict_pattern: '^\d{1,3}(,\d{3})+(\.\d{1,2})?$'
    money_ambiguous_separator_action: fail_row
    # 全形數字：NFKC 正規化後再解析（13 §F6 坑既有）。
    fullwidth_digit_normalize: nfkc
    # 🔴 單位價格的四個欄位（Unit Price Total/Base Measure）**不是金額**，是數量。
    #    E2 實測值 `500.00`／`50.00` 與價格欄長得一模一樣 ⇒ 型別必須不同
    #    （Money::Decimal vs 一般 BigDecimal），否則它們會走進 X6 被 ×100。
    unit_price_measure_columns_are_not_money: true
    # --- 識別碼欄的清洗 --------------------------------------------------------
    # observed（E1，使用者真實商店）：Variant SKU 與 Variant Barcode 的值都是 `'7340032875324`
    #   —— 開頭多一個單引號，那是 Excel 的「強制文字」前綴漏進 CSV。
    # ⇒ 只對識別碼欄剝除**單一個**開頭 U+0027，並在報告裡計數。
    # 🔴 **不得**對文字欄做同樣的事：商品標題合法地可以用單引號開頭。
    strip_leading_apostrophe_columns: ["Variant SKU", "Variant Barcode", "Product ID", "Variant ID"]
    strip_leading_apostrophe_reports_count: true
    # --- 來源語言的檔級不變量（70 §D.3）----------------------------------------
    # Source Locale 欄的角色與庫存 CSV 的 `On hand (current)` 相同：**逐列攜帶、只用來驗證**
    #   （61 §6.2：官方明載那兩欄一起用是為了安全驗證）。CSV 沒有檔頭 metadata 的地方放它。
    source_locale_column: "Source Locale"
    source_locale_must_be_uniform_in_file: true
    source_locale_mismatch_action: reject_file        # 與目標店鋪的來源語言不符 ⇒ 整檔拒絕
    # 缺這一欄**不是錯誤**（否則 Shopify 匯出檔無法直接匯入）⇒ 假定為目標店鋪的來源語言並告警。
    source_locale_absent_action: assume_shop_source_and_warn
    # 🔴 這一欄**不建立** per-resource 來源語言（i18n.source_locale_per_resource: false）。
    #    它是斷言，不是設定；逐列不同 ⇒ 整檔拒絕，不是「這一列用別的語言」。
    source_locale_is_assertion_not_setting: true
    # --- 變體身分（70 §E.4）----------------------------------------------------
    # 🔴 Shopify 語義：改動 Option{n} Value ⇒ 刪除既有變體 ID、產生新 ID（61 §6.1）。
    #    我方**必須複製**（61 明載，否則搬家後訂單歷史對不上）——但只在沒有 Variant ID 時。
    variant_identity_without_id: option_value_combination
    variant_identity_with_id: variant_gid
    variant_identity_id_wins: true
    # 🔴 多語言讓這條變得更貴：選項值一改，變體重建，掛在舊 option_value_id 上的**譯文一起消失**
    #    （67 §B.3-4：譯文掛 id 不掛字串）⇒ 匯出必填 Variant ID，UI 必須警告「無 ID 的改名會丟譯文」。
    warn_on_option_value_rename_without_variant_id: true
    # --- 選項值譯文：product-scoped 映射，不是列值 -----------------------------
    # 同一個選項值在多列重複出現（4 個變體 × 2 個選項 ⇒ 每個值出現 2 次）。
    # 🔴 重複出現的譯文**必須一致**；不一致 ⇒ **整個商品失敗**，不做 last-wins。
    #    理由：61 §6.1 官方警告「在試算表裡排序 CSV 會讓變體脫鉤」⇒ **列序不是穩定的**，
    #    以列序決定勝負 ＝ 結果不可重現。
    option_value_translation_scope: product
    option_value_translation_conflict_action: fail_product
    option_value_translation_repeat_allowed: true     # 重複填相同值合法；只有「不同值」才失敗
    # --- 重量 ------------------------------------------------------------------
    # Variant Grams 恆為公克，Variant Weight Unit 只影響**顯示**（61 §6.1 欄位語義）。
    # observed（E1）：真實商店裡一支 100ml 香水的 Variant Grams = 100000.0（＝100 公斤），
    #   Variant Weight Unit = kg ⇒ 商家把「100」當成 kg 填進了 grams 欄，系統照收不誤。
    # ⇒ 不設硬上限（重貨合法），但超過門檻要進匯入報告的覆核清單。
    weight_review_threshold_grams: 50000
    # --- 未知欄位：🔴 一律進報告，永不靜默 --------------------------------------
    unknown_column_action: report_never_silent
    # `X (product.metafields.ns.key)` 形態的表頭（E1／E2 都實測有）⇒ 依 metafield 定義寫入；
    #   型別不在 i18n.translatable_metafield_types 白名單者不得帶 [locale] 後綴（67 §B.4）。
    metafield_column_pattern: '^(?P<label>.+) \(product\.metafields\.(?P<ns>[^.]+)\.(?P<key>[^)]+)\)$'
    metafield_column_action: upsert_by_definition

  # --- 匯出語義（70 §G）-------------------------------------------------------
  product_export:
    # 🔴 匯出是 X4（65 §B／§G）：價格欄一律主單位兩位小數，**不得輸出 cents**。
    #    JPY ¥1,480 儲存 148000 ⇒ 匯出 `1480.00`。輸出 148000 的話回匯會被 X6 收成 ¥148,000。
    money_crossing_point: X4
    money_emit_regex_key: money_boundary.decimal_string_regex        # ^-?\d+\.\d{2}$
    # 預設**不含**任何 [locale] 欄 ⇒ 匯出檔就是一份純來源語言的、欄序對齊 Shopify 匯出的檔案。
    # 🔴 這個預設同時服務兩件事：搬家友好，以及「不勾就不會多出 48 欄」。
    default_locales: [source_only]
    selectable_locales: true          # 形態同 i18n.export.selectable_locales
    # 系統欄一律填值（匯出檔要能原檔回灌，且回灌時走 variant_gid 這條安全路徑）。
    always_emit_system_columns: ["Source Locale", "Product ID", "Variant ID"]
    # 🔴 分檔一律落在 handle 邊界上：一個商品的續列離開它的首列就失去商品層欄位，
    #    整組變成孤兒列。**這條比檔案大小重要**。
    split_when_exceeds_mb: true
    split_strategy: handle_boundary
    split_mid_product_forbidden: true
    # 大檔改 email 交付（沿用 export_email_threshold_variants；形態同 i18n.export.async_delivery）。
    async_delivery: true
    delivery_channels: [notification, email]
    signed_url_ttl_hours: 24          # 13 §F6.3 既有
    # 匯出時**不做**任何 locale 的 fallback 填值：該語言沒有譯文就是空格。
    # 🔴 填入回落值 ⇒ 商家原檔回灌後，回落值變成真的譯文，缺譯狀態被永久洗掉。
    emit_fallback_values_forbidden: true

  # --- Shopify 匯入器（70 §I）—— 自製，因為官方把跨平台搬家導向第三方 app -------
  # 出處：60 §5 匯入 modal 逐字（observed）：「使用我們推薦的其中一款應用程式，從其他平台
  #   匯入您的資料副本〔Matrixify〕」⇒ 反向路徑（Shopify → 我方）沒有官方工具，必須自製。
  shopify_import:
    # 🔴 E1（匯出檔）與 E2（匯入範本）**不是同一套欄名**（實測）：
    #    Handle/URL handle、Body (HTML)/Description、Variant Price/Price、
    #    Variant Taxable/Charge tax、Variant Grams/Weight value (grams)、Published/Published on online store…
    #    ⇒ 匯入器必須同時認得兩套，且**不得**要求商家先改表頭。
    accept_header_dialects: [shopify_export, shopify_import_template, chilllove_canonical]
    canonical_dialect: chilllove_canonical
    # 我方正規欄名在名稱衝突時取 **Shopify 匯出**那一套。理由（tiebreak，非偏好）：
    #   ① 商家手上實際有的檔案是匯出檔，不是空白範本；
    #   ② `Handle` 這個名字同時出現在 Shopify 的**庫存 CSV**（61 §6.2）⇒ 三份文件裡有兩份用它。
    canonical_name_tiebreak: shopify_export_wins
    # Shopify 有、我方沒有的欄位：逐欄宣告處置，🔴 **沒有「靜默丟棄」這個選項**。
    unmapped_column_dispositions:
      "Option1 Linked To": drop_with_report      # taxonomy 連動選項，我方未實作
      "Option2 Linked To": drop_with_report
      "Option3 Linked To": drop_with_report
      "Google Shopping / *": map_to_marketing_attributes   # 30 §9-8 的 feed 欄位組
      "Included / *": drop_with_report           # market 別的上架旗標，改由我方 market 設定
      "Price / *": drop_with_report              # market 別價格，改由我方 market 價格表
      "Compare-at price / *": drop_with_report
      "Variant Inventory Tracker=shipwire|amazon_marketplace_web": drop_with_report
      "Fulfillment service=<third_party>": map_to_manual_with_report
    unmapped_column_report_required: true
    # 我方有、Shopify 沒有的欄位：建立時的預設值一律**宣告在這裡**，不散在程式碼裡。
    defaults_on_create:
      "Source Locale": shop_source_locale        # 見 product_import.source_locale_absent_action
      "Status": from_shopify_status              # active→ACTIVE / draft→DRAFT / archived→ARCHIVED
      locale_columns: absent_means_unchanged     # 沒有譯文欄 ⇒ 不建立任何譯文（不是建立空譯文）
    # 🔴 UNLISTED 永遠不會從 Shopify 檔案裡進來（本尊只有三態）——這是我方多出來的第四態
    #    （product.status_values，13 §F1.2）。匯入器**不得**用 Published=FALSE 推導成 UNLISTED：
    #    Published 管的是「上不上架到線上商店這個管道」，UNLISTED 管的是「可購買但不可被發現」。
    never_infer_unlisted: true
    # 值域映射（大小寫不敏感比對，輸出一律我方 enum 的大寫形態）。
    value_maps:
      status: {active: ACTIVE, draft: DRAFT, archived: ARCHIVED}
      inventory_policy: {deny: DENY, continue: CONTINUE}
      inventory_tracker: {shopify: chilllove}
      boolean_true: ["TRUE", "true", "True", "1", "yes"]
      boolean_false: ["FALSE", "false", "False", "0", "no", ""]
    # 🔴 一次性搬家的順序：商品 CSV（含譯文）→ 庫存 CSV → 翻譯 CSV（非商品線資源）。
    #    倒過來做，翻譯 CSV 的 resource_gid 還不存在（見 70 §H 的結構性理由）。
    migration_order: [product_csv, inventory_csv, translation_csv]

# ── 分析 / 報告（R11，2026-08-14 實測＋help/shopify.dev 雙源；全文＝docs/research/80）────────
analytics:
  # 🔴 報表顯示上限：表格最多 1,000 列，但**總計列反映全部資料**（不只這 1,000 列）。
  #    資料量更大時走匯出。抄漏「總計含全部」這半句會做出錯的 footer。（80 §4.1）
  report_table_display_rows_max: 1000
  report_totals_reflect_all_rows: true
  # 報告頁一次最多列出的自訂報告數；可建更多，超出者需自存 URL 才能存取。
  custom_reports_displayed_max: 250
  # 🔴 匯出格式與範圍（實測彈窗值域，非推測）。預設值＝本尊預設值。
  export_formats: [csv, xml, jsonl, parquet]
  export_format_default: csv
  export_scopes: [all_query_results, displayed_only]
  export_scope_default: all_query_results
  # 資料新鮮度（help 明載）。auto_refresh 僅在所選期間**包含今天**時生效。
  overview_freshness_seconds: 60
  auto_refresh_interval_seconds: 60
  auto_refresh_requires_period_including_today: true
  # 🔴 歷史資料起算日：平台級硬限制，**與方案無關**（各方案差異＝文檔未載）。
  #    我方若自建 rollup 沒有這個限制，但對照本尊數字時必須知道差異來源。
  history_floor:
    sessions_based: "2022-10-01"
    inventory_based: "2023-10-01"
    attribution: "2021-10-01"
  # 即時層口徑（Live View；help 明載的三個窗）。
  live_view:
    visitors_window_minutes: 5
    customer_behaviour_window_minutes: 10
    day_boundary: shop_local_midnight
  # 歸因：官方唯一數字＝session 後 N 天未購買則 first interaction referrer 重置。
  # 🔴 這不是「歸因視窗」——五種模型各自的視窗長度＝文檔未載，不得拿這個數字當視窗用。
  attribution_first_referrer_reset_days: 30
  attribution_models: [first_click, last_click, last_non_direct_click, linear, any_click]
  # 🔴 any_click 各通路加總會超過 metric 本身（官方明列）⇒「小計＝總計」一致性測試必須白名單。
  attribution_models_excluded_from_sum_checks: [any_click]
  # 探索器槽位（自由形式 4 / 組別 5）——兩套不同槽位集合，切換會清空查詢。
  exploration_modes: [freeform, cohorts]
  cohort_intervals: [week, month, quarter]
  cohort_interval_default: month
  # 🔴 組別預設期間＝過去 12 個月且**排除當月**（SINCE startOfMonth(-12m) UNTIL endOfMonth(-1m)）。
  cohort_default_period: last_12_months_excluding_current
  # 期間選擇器的兩個**滾動窗**（不是固定清單，須以當前日期推導）。
  date_range_bfcm_years_shown: 4
  date_range_quarters_shown: 4
  # ShopifyQL 對照（我方查詢層若做等價物則引此節；上限數字＝文檔未載，不得臆造）。
  shopifyql:
    date_offset_units: [s, min, h, d, w, m, q, y]   # 🔴 min=分鐘、m=月，不是慣例的 m=分鐘
    time_dimensions_interval: [second, minute, hour, day, week, month, quarter, year]
    time_dimensions_cyclic: [hour_of_day, day_of_week, week_of_year, month_of_year]
    # 🔴 NOT 系運算子不排除 NULL 列（官方明列陷阱）；AND 優先於 OR。
    negation_excludes_null: false
    and_binds_tighter_than_or: true
    # 未載：LIMIT 最大值／OFFSET 語法／HAVING 彙總函式／rate limit 數字／最大回傳列數。
    limit_max: null
    api_max_rows: null
# ── 設定 / 使用者與權限（R12，2026-08-14 實測＋help 雙源；全文＝docs/research/81）────────
settings:
  # 🔴 設定樹＝組織層 2 ＋ 商店層 18。市場不在設定裡（頂層 /markets，R10）；檔案不在設定裡（內容區，R9）。
  store_pages_count: 18
  organization_pages_count: 2
  # slug 對照（我方 key → 本尊 slug）；🔴 政策是 legal 不是 policies。
  slug_map:
    policies: legal
    taxes: taxes                 # 非 taxes_and_duties
    shipping: shipping           # 非 shipping_and_delivery
    apps: apps                   # 非 apps_and_sales_channels
    privacy: privacy             # 非 customer_privacy
    customdata: custom_data
    users: organization-account
    activity: general/activity
    brand: general/branding      # 🔴 品牌是「一般」的子頁，不是頂層設定分頁
users_and_roles:
  # 🔴 2026 模型＝使用者 ↔（群組）↔ 角色 ↔ 權限。群組是 Plus 專屬的第四段。
  model: rbac
  groups_supported_plans: [plus]
  # 角色類別：一個角色**不得混用不同類別的權限**；但一個使用者可同時持有多個類別的角色。
  role_categories: [organization, store, point_of_sale, partner]
  role_cannot_mix_categories: true
  user_can_hold_multiple_roles: true
  role_name_max_chars: 255
  role_description_max_chars: 255
  role_min_permissions: 1        # 驗證錯誤原文：「至少必須授予一項權限」
  # 權限目錄（商店類別）：實測巢狀 17 群／115 權限；help 是扁平 19 群（同一批權限、不同分組邊界）。
  store_permission_groups_live: 17
  store_permission_count_live: 115
  store_permission_groups_help: 19
  # 🔴 依賴圖不是樹：授予要往上補齊祖先、撤銷要往下連動移除，且有「不可取消」的邊。
  dependency_propagation: [grant_ancestors_up, revoke_dependents_down]
  non_deselectable_dependencies:
    - {from: inventory_any, to: products_view}
    - {from: catalogs_any,  to: products_view}
  # help 明列的敏感權限（UI 未特別標示，我方應標）。
  sensitive_permissions:
    - customers_request_data
    - finance_edit_billing_payment_methods
    - finance_manage_other_payment_settings
    - org_business_entities_view_sensitive_information
    - partner_view_financials
    - partner_manage_credits_and_refunds
    - pos_manage_other_payment_settings
  # 🔴 高敏動作需 step-up auth（重新輸入密碼）——help 未載，實測發現（建立角色、移除使用者）。
  step_up_auth_required_for: [create_role, remove_user]
  # 使用者座位上限（依方案）；🔴 Starter/Basic 是 0。
  seats_by_plan:
    pause_and_build: 1
    starter: 0
    basic: 0
    grow: 5
    advanced: 15
    plus: null                   # 無限
  # 不計入座位者。
  seats_excluded: [store_owner, organization_owner, collaborators, pos_only_staff]
  invitation_expiry_days: 7      # 過期官方做法＝移除再重新新增（無「重寄」操作）
  user_states: [pending, active, suspended]
  collaborator_request_code_digits: 4
  # 安全登入規定【2】：all_users（🔴 不適用 POS）／specific_users（預設）
  secure_signin_enforcement: [all_users, specific_users]
  secure_signin_enforcement_default: specific_users
  secure_signin_excludes_pos: true
notifications:
  # 顧客通知範本：實測 11 組 47 個（help 未窮舉，官方叫你去後台看 ⇒ 本輪實測補齊）。
  customer_template_groups: 11
  customer_template_count: 47
  # 🔴 範本集合受法域閘控（實例：「已建立訂單層級退貨單（僅限美國）」）⇒ 清單要進 jurisdiction pack。
  templates_jurisdiction_gated: true
  subsections: [customer, staff, fulfillment_request, webhooks]
  staff_notification_types: [store_order_summary, new_order, new_return_request, sales_attribution_ended, new_draft_order]
  new_draft_order_owner_only: true
  webhook_formats: [json, xml]
  webhook_event_immutable_after_create: true
  # 連續非 200 回應 ⇒ Shopify 自動刪除該 webhook 訂閱。
  webhook_auto_delete_on_repeated_failure: true
  webhook_max_count: null        # 文檔未載
brand_assets:
  logo_min_width_px: 512
  square_logo_recommended_px: 512
  cover_image_recommended: "1920x1080"
  cover_image_max_count: 1
  slogan_max_chars: 80
  short_description_max_chars: 150
  # 🔴 primary/secondary 都是**陣列**，每個元素是 background/foreground 配對——不是「一主色一副色」。
  colors_are_arrays_of_pairs: true
  favicon_derived_from_square_logo_px: 32
  # 🔴 品牌資產**不可依市場或語言本地化**（可引為 G13 的佐證）。
  localizable: false
store_activity_log:
  max_entries_displayed: 250     # 🔴 保留範圍由筆數決定，不是天數；保留天數＝文檔未載
  retention_days: null
  view_only: true                # 不可展開／不可點擊個別事件／不可匯出／不可篩選
  actor_types: [user, app, sales_channel]
languages:
  # 🔴 語言上限除 Lite 外一律 20——沒有方案階梯。
  max_languages: 20
  max_languages_applies_to_all_plans_except: [lite]
  language_states: [published, unpublished]
  # 語言列 ⋯ 選單【5】；設為網域預設在未發布時禁用（條件控件）。
  row_actions: [publish, preview, assign_to_domain, set_as_domain_default, remove_language]
  set_as_domain_default_requires_published: true
  auto_translate_free_language_count: 2
  auto_translate_unsupported_languages_count: 14
  policies_auto_translated: false
  # Translate & Adapt 是官方 app（新增語言時自動安裝），可翻譯資源型別＝TranslatableResourceType 30 值。
  translate_and_adapt_is_app: true
  translatable_resource_type_count: 30
  never_translatable: [collection_filters, shopify_forms, manual_payment_instructions, product_images, tags]
policies:
  # help 窮舉 6 份；🔴 是 Return policy 不是 Refund policy，且沒有 Contact information。
  documents: [return, privacy, terms_of_service, shipping, legal_notice, subscription]
  url_pattern: "/policies/{policy-type}"
  auto_generate_template_locales: [en]
# ── 銷售管道 / POS / 代理式 / app（R13，2026-08-14 實測＋help 雙源；全文＝docs/research/82）──
sales_channels:
  # 🔴 管道全部是 app（路由 /apps/{handle}），只有線上商店是第一方特例（/themes）。
  #    ⇒ 資料模型是 App 之下的 Channel（帶 channel capability），不是兩張平行表。
  channels_are_apps: true
  first_party_exception_routes: {online_store: "/themes"}
  # 管道 app 比一般 app 多三項強制功能。
  channel_required_capabilities: [account_connection_onboarding, product_publishing, marketplace_navigation]
  row_actions: [open_app, view_details, uninstall]
  max_channels: null              # 文檔未載
  # 🔴 發布模型三層 AND：Publishable × Publication × Catalog，缺一不可上架。
  publication_model: [publishable, publication, catalog]
  catalog_types: [app, company_location, market]
  new_channel_publishes_existing_products_by_default: true
  publication_bulk_products_max: 50
  # 🔴 本鍵是**本尊規則的登記**，不是我方生效判準（射程：僅 product）。D53 F1 補上出處。
  #    出處：https://help.shopify.com/en/manual/shopify-admin/productivity-tools/future-publishing
  #    （`## Set a publish date for a product` 段首的 `#### Caution` 區塊，取證 2026-08-27）
  #    逐字：「Products must be in Active status for future publishing to work.
  #           If a product is in Draft status at the scheduled publish time, then the product
  #           won't be published to your online store or sales channels.」
  #    🔴 射程限定：官方**只**點名 product；同頁 collection／blog post／page 三節無等價前提
  #       ⇒ 不得外推到 future_publishing_supported_resources 的其餘三種。
  #    🔴 官方**只**寫「不會被發布」，對排程列去留與是否報錯／通知**全面沉默**（見 D53）。
  #    🔴 我方**到點閘門**採可見性軸 Product::PURCHASABLE_STATUSES（含 UNLISTED），不是 ACTIVE 單值
  #       ——理由＝到點事件的載荷是 cache stamp 而非發布動作；且官方對 UNLISTED 逐字
  #       「The product is active but you need a direct link to view it.」。全文見 D53 F1。
  #    ⚠️ 本鍵目前**零程式消費者**（正典登記鍵）。日後做對外 webhook（本尊 product_listing/add
  #       等價物，其官方定義逐字 "Occurs whenever an active product is listed on a channel."）
  #       時，該層才用 ACTIVE 閘門，屆時本鍵才有消費者。已登記 91 §3.23。
  #    ⚠️ 不得與 shopify.dev 的另一句「For products to be visible in a channel, they must have an
  #       active ProductStatus.」混為同一出處——前者講排程到點不執行，後者講管道可見性。
  future_publishing_requires_active_status: true
  future_publishing_supported_resources: [product, collection, blog_post, page]
  future_publishing_unsupported: [variant, shop_channel]
agentic:
  # 🔴 唯一「符合資格即預設啟用、不需安裝」的管道；且 Markets 明文排除（不能加入 channel market）。
  enabled_by_default_for_eligible: true
  excluded_from_channel_markets: true
  channels: [chatgpt, microsoft_copilot, other_ai_platforms, shop, google_ai_mode, gemini, meta]
  early_access_channels: [google_ai_mode, gemini]
  # 每個管道兩件獨立的事：發現來源（catalog 存取）與結帳位置（代理內 vs 導回商店）。
  per_channel_axes: [catalog_discovery, checkout_location]
  direct_checkout_supported: [microsoft_copilot]
  discovery_only: [chatgpt]
  sources: [shopify_catalog, knowledge_base]
  # 🔴 只支援 D2C；B2B-only 商品自動排除（但自訂第三方設定可能繞過保護）。
  d2c_only: true
  requires_supplemental_terms: true
  # UCP（B-7 的答案）：開放標準，規格在 ucp.dev，Shopify+Google 共同開發。
  ucp:
    versions_supported: ["2026-04-08", "2026-01-23", "draft"]
    capabilities: [catalog, cart, checkout, orders]
    profile_meta_key: "meta.ucp-agent.profile"
    extension_namespacing: reverse_domain   # 「Own the domain, own the namespace」，無中央審批
    mcp_endpoints: [global_catalog, storefront_catalog, cart, checkout, order]
    # 🔴 update_cart / update_checkout 是 PUT 語義——省略的欄位會被移除（與 patch 相反）。
    update_semantics: put_replace_full_state
    checkout_states: [incomplete, requires_escalation, ready_for_complete, completed]
    # agent 只能查它自己促成的訂單。
    order_scope: facilitated_by_agent_only
    rate_limit: null              # 文檔未載
    merchant_opt_out_mechanism: null  # 文檔未載
    # 🔴 受限 Liquid context：只有 request 與 agents 兩個物件；不可為 JSON template。
    liquid_templates: [agents.md.liquid, llms.txt.liquid, llms-full.txt.liquid]
    liquid_context_objects: [request, agents]
    liquid_json_template_allowed: false
pos:
  # 🔴 範圍未定（71-R13-V1）：本輪只做管道殼與分析，POS 本體未做。
  tiers: [lite, pro]
  lite_included_in_all_paid_plans: true
  pro_billing: per_location
  pro_price_usd_per_location_month: 89
  pro_included_locations_on_plus: 20
  pro_trial_days: 3
  pro_bulk_location_update_max: 250
  refund_window_days: {monthly: 7, annual: 30}
  # Pro 專屬能力（Lite 沒有）——這條界線＝收銀機 vs 門市營運系統。
  pro_only: [custom_printed_receipts, automatic_discounts, retail_staff_permissions,
    unlimited_pos_only_staff, add_staff_to_sale, order_cancellations, exchanges,
    save_retrieve_cart, email_carts, ship_to_home, ship_and_carry_out, pickup_in_store,
    local_delivery_fulfillment, inventory_tracking_and_adjusting, receiving_stock_transfers,
    fulfilling_and_receiving_transfers, daily_sales_reports, in_app_retail_analytics,
    required_checkout_information]
  hardware_warranty_years: {lite: 1, pro: 2}
  # 🔴 POS 權限模型與 admin 完全不同：organization role 而非 store permission；
  #    只能指派角色不能指派單一權限；粒度以「裝置所在地點」為軸。
  permissions_via_organization_roles: true
  individual_permissions_assignable: false
  permission_axis: device_location
  permission_groups: [manager_approval, checkout, discounts, orders, customers, apps, analytics, register, store_settings]
  default_pos_role: associate
  pos_only_staff_requires_pro: true
  pos_only_staff_login: pin
  lite_locations_ignore_role_restrictions: true
  tips_preset_max: 3
  tips_credit_only: true
  unsupported_regions: [CN]
  ui_extension_targets: [tiles, actions, blocks]
apps:
  types: [public_listed, public_unlisted, custom, legacy_custom]
  # 🔴 2026-01-01 是分界點：之後建立的 custom app 走 Dev Dashboard，之前的留在後台管理。
  legacy_custom_cutoff_date: "2026-01-01"
  custom_level2_pii_min_plan: grow
  # 安裝畫面把 scope 呈現成兩類。
  scope_presentation_groups: [view_personal_data, view_and_edit_store_data]
  billing_models: [one_time, free, monthly_recurring, annual_recurring, usage_based]
  billing_on_shopify_invoice: true
  protected_customer_data_levels: [0, 1, 2]
  level2_sensitive_fields: [name, address, email, phone]
  # 🔴 預設不允許自訂 app 開發（需「啟用開發作業」權限）。
  custom_app_development_default_enabled: false
  max_apps: null                  # 文檔未載
  max_custom_apps: null           # 文檔未載
  theme_extension_types: [app_block, app_embed_block]
  app_embed_scope: global_liquid_only
  app_embed_supported_in_all_themes: true

# 出站 HTTP（SSRF 防線的回應／下載／逾時預算）。出處：bytes 三鍵＝我方裁定（2026-08-17，
# PR #52 第 19 輪，Codex 意見「Define SSRF response limits in limits.yml」）——tenant 可控
# 端點不設回應上限＝可打爆 worker 記憶體/磁碟；本尊無對應公開值。三條出站 HTTP 契約各自引用：
#   webhook 投遞（90-blueprint/13 D.1/C.3）／3PL callback（90-blueprint/09 A.1）／
#   檔案外部 URL 抓取（90-blueprint/12 §C.7 內容檔案業務規則 <!-- 第 20 輪更正：原引 §B files，
#   §B 是狀態機節；契約在 §C.7（12:252-257） -->）。讀滿即斷線並計為該次投遞/抓取失敗。
# 逾時四鍵（第 20 輪落鍵——原第 19 輪只落 bytes、09/12 兩章把「時間上限」也等號綁到 bytes 鍵）：
#   webhook 兩鍵＝官方明載值（90-blueprint/13 C.3 表，G-2）；callback/file_fetch＝我方裁定。
outbound_http:
  webhook_response_bytes_max: 65536          # 64 KiB——webhook 投遞回應體上限。權威＝specs/18 F4-2 既定 64KB（39:598/39:167 同）；僅需狀態碼、回應體不消費（第 21 輪由 1 MiB 改對齊——16 倍放寬與 18 既定值互斥且方向錯）
  callback_response_bytes_max: 1048576       # 1 MiB——3PL fetch_stock/fetch_tracking_numbers 回應上限。與 webhook 不同：此回應**要被解析**（fetch_stock 回 SKU→qty map，尺寸隨 SKU 數成長，1 MiB ≈ 數萬行條目預算）——webhook 的 64KB 理由（不消費回應體）不適用（第 21 輪補各自理由）
  file_fetch_download_bytes_max: 20971520    # 20 MiB——originalSource 抓檔上限＝12 §C.1 泛型檔案/圖片門檻。僅適用外部 URL 抓取路徑：影片/3D 走兩段式 staged upload 不經此路（我方裁定，推論自 12 §C.7「兩段式是大檔唯一路徑」；範圍子句已回寫 12 §C.7 業務規則列，第 22 輪）。第 21 輪由 100 MiB 改對齊——原值在 20MB 業務門檻之前永不生效，純增攻擊面
  webhook_connect_timeout_seconds: 1         # 官方明載（13 C.3：連線 timeout 1s，G-2）
  webhook_response_timeout_seconds: 5        # 官方明載（13 C.3：回應 timeout 5s，G-2）
  callback_timeout_seconds: 5                # 3PL callback 逾時——官方未載，我方裁定對齊 webhook 回應 5s
  file_fetch_timeout_seconds: 30
  # 第 25 包：originalSource 抓檔的 redirect 上限（每跳重驗 scheme/IP——12 §B.6:155
  # 「redirect 每跳重驗」；上限值官方未載＝ours，3 跳涵蓋常見 CDN 跳轉鏈）
  file_fetch_redirect_hops_max: 3             # originalSource 抓檔逾時——我方裁定（20 MiB 預算的下載窗，≈5.6 Mbps 持續即讀滿；第 21 輪隨 bytes 上限對齊改註）

# ─────────────────────────────────────────────────────────────────────────────
# 事件與 outbox 轉發（第 19 包，docs/plans/2026-08-24-第19包執行規格.md §4.1）
# 🔴 本區塊只新增鍵，不改既有鍵的值。合併窗兩鍵在 catalog_flow（63 §C.6），不搬。
events:
  outbox_poll_interval_s: 5        # relay 輪詢間隔。權威＝specs/18 F1-2「每 5s」。🔴 雙寫點：config/recurring.yml events_relay 的 schedule 不讀本鍵，改值要同步兩處
  outbox_batch_size: 100           # 單批取件上限。權威＝specs/18 F1-2「LIMIT 100」
  outbox_dead_letter_attempts: 8   # attempts 達此值 ⇒ status=dead。權威＝specs/18 F1-5「attempts ≥8 → dead」
  outbox_retention_days: 30        # published/dead 保留天數，逾期 purge。權威＝specs/18 F1-5「保留 30 天 purge」
  # 🔴 裁定候選 A1（PR #115 假設清單；18 號規格未給值，不得靜默發明——此值＝提案）：
  #    本包零真實消費者、單批 ≤100 筆秒級完成；300s 給未來慢消費者 60 倍餘裕，
  #    又讓 worker 死亡後的孤兒鎖在一兩輪輪詢內被回收。
  outbox_lock_timeout_s: 300

# ── 包 30（D77）：Liquid 渲染 resource limits（25 §6 規則 3 的防 DoS 值；ours）──
theme_engine:
  # 單頁渲染輸出上限（bytes）。超過 ⇒ Liquid MemoryError（lax 下記錯不炸頁）。
  liquid_render_length_limit: 2097152
  # 渲染節點計分上限（防惡意迴圈模板）。
  liquid_render_score_limit: 200000
  # assign 計分上限。
  liquid_assign_score_limit: 100000
  # 範本總數上限（78 §4 官方逐字「範本總數上限 1,000」，help 取證 2026-08-25）。
  max_templates_per_theme: 1000
  # 選單巢狀深度（78 §4：本尊 ≤3 層）。
  max_menu_depth: 3
  # Section Rendering API 的 ?sections= 單請求 id 上限。官方逐字「render up to
  # five sections」（shopify.dev/docs/api/ajax/section-rendering，2026-08-30）；
  # 超限行為＝HTTP 400 空 body（83 §12.3 真店實測 2026-08-31）。
  section_rendering_max_ids: 5

# =============================================================================
# 24. 命名契約（鐵律 9 的界線；規格見 docs/specs/67-multilingual.md §H.5）
# =============================================================================
# 🔴 一句話版本（§H.5 逐字）：「介面（名字、形狀）可以一樣，內容（樣式值、文案、說明）
#    一律自寫。判準是『這個字串有沒有被別人的程式碼比對』——是就是契約，不是就是文案。」
# 🔴 獨立成頂層區塊的理由與 handle: 相同：同時被 14／25／27／31（主題）、28（API）、
#    62／67 引用，塞進任一方都會讓其餘的人跨區塊引用「別人的鍵」。
#    （67 §J 原文寫「§23」——該編號已被商品 CSV 佔用，落地為 §24；語義不變。）
naming_contract:
  # 判準（§H.5(b)，沿 §H.3）：被第三方資產（主題 Liquid／CSS／JS、商家自訂 CSS）比對＝契約字串。
  contract_string_test: compared_by_third_party_code
  # ① 主題端 class 名／DOM：渲染引擎**原樣輸出**主題寫的字串（相容性需求）——
  #    改寫或加前綴＝商家自訂 CSS 靜默失效（§H.5(d) 反例 6）。
  theme_class_names: preserve_verbatim
  theme_class_rewrite_forbidden: true
  # 🔴 class 名 ≠ 樣式：輸出 class="product-title" 可以；複製 .product-title { … } 的宣告與值
  #    就是抄 CSS（鐵律 9 明文）。界線＝「有沒有帶著值」。
  css_declarations_copy_forbidden: true
  # 平台注入的節點只能新增、不得包壞主題的 class 與 DOM 層級（62 §A.1 同紀律）。
  platform_injection_additive_only: true
  # 🔴 不維護「Shopify class 名清單」——class 名的來源是主題不是平台（§H.5(b) 紅線 2）。
  platform_class_name_list_forbidden: true
  # ② API 契約層：欄位名／型別名／enum 值對齊本尊（鐵律 4 既有規則；bodyHtml 不是 descriptionHtml）。
  api_field_names: align_with_shopify
  # 錯誤碼：本尊已有的碼對齊；我方新增的碼自己命名（§H.4 五個）。
  error_codes: align_existing_self_name_new
  # 🔴 message 字串內容一律自寫（code 是契約、message 是文案——同一物件兩欄分屬兩邊）。
  error_message_text: self_written
  # 🔴 API 文檔描述不得逐句轉貼 shopify.dev；主題 locale 檔字串不得進我方 bundle（§H.3）。
  docs_text_copy_forbidden: true
  # GID namespace 是我方的（鐵律 4 既有）。
  gid_namespace: chilllove

# =============================================================================
# 25. 公開店面（包 33 後半；hosting／限流）
# =============================================================================
storefront:
  # 公開端點限流（本尊 cart 端點有 bot 牆——連續 JSON POST ⇒ 429 挑戰頁，
  # 83 §12.5 實測 2026-08-31；我方以 Rack::Attack 對位，回應形＝既有 429 JSON）。
  # 🔴 兩組數值皆為我方提案（ours；本尊閾值不可觀測）——壓測後調整，調整只改這裡。
  rate_limits:
    cart_writes_per_ip: { limit: 60, period_seconds: 60 }
    page_views_per_ip: { limit: 300, period_seconds: 60 }
