functions:
  # 每店每類上限。出處：46b:99–104、46b:964–969（dev）
  max_discount_functions_per_shop: 25
  max_validation_functions_per_shop: 25
  max_delivery_customizations_per_shop: 25
  max_payment_customizations_per_shop: 25
  max_cart_transform_per_app_per_shop: 1
  max_discounts_allocator_per_shop: 1
  # 資源限制。出處：46b:69–94、46b:953–963（dev）
  binary_max_kb: 256
  linear_memory_max_kb: 10000
  stack_max_kb: 512
  log_max_kb: 1
  max_instructions: 11000000
  input_max_kb: 128
  output_max_kb: 20
  input_query_max_bytes: 3000
  metafield_max_bytes: 10000
  list_argument_max_items: 100
  query_cost_max: 30
  # 本專案等價護欄（46b §1⑥-2 建議換算）。（ours）
  equivalent_guard_max_cart_lines: 200
