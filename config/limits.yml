# config/limits.yml — CHILL LOVE 全域上限與預設值（唯一真相）
#
# 鐵律 6（CLAUDE.md）：所有上限值一律引用本檔，**不得硬編碼**。
# 建立依據：docs/specs/50-logic-gap-register.md P0-11／H-02／H-18／H-44～H-47，
#           以及 docs/research/22 §9.4「配額類常數表 → 建 config/limits.yml 一處管理」。
#
# 每一條都必須帶出處註解，格式：
#   # 出處：<檔案>:<行號>（<官方層級>）
#   官方層級：dev＝shopify.dev 開發文檔（46a/46b，最高權威）
#             help＝help.shopify.com 商家文檔（46c，次高）
#             live＝2026-08 實測畫面（44，第三）
#             ours＝本專案決策（官方未載明；必須註明「Shopify 未公開，本專案決策」）
#
# ⚠ 標記 `verify: true` 的條目代表「來源未載明或三方衝突」，實作前必須查證（見 docs/specs/52 §附錄 A）。

# =============================================================================
# 0. 司法管轄區契約（jurisdiction capability contract）
# =============================================================================
# 出處：docs/specs/56-jurisdiction-architecture.md（使用者 2026-08-12 裁定；CLAUDE.md 鐵律 11）
# 🔴 基準法域＝**香港**，其餘法域以 pack 形式擴充（目標是全球市場）。
#    本區塊只定義**契約**（有哪些能力、未宣告時怎麼辦）；能力的**值**一律在 `jurisdictions.<code>.*`。
#    核心規格不得再直接引用「統一發票／字軌／折讓／超商取貨／統編／電支條例」——要引就引本契約的能力名。
jurisdiction:
  default: hk
  # 解析順序（先命中先用）。訂單一旦成立即**快照**法域碼，日後改市場不回溯
  #（同 15-F2「訂單存快照」、55 §B.1 T30「不回溯」）。
  resolution_order: [order_snapshot, market_jurisdiction, shop_operating_entity, platform_default]
  snapshot_on_order: true
  # 🔴 一筆交易有**兩個**法域：賣方（營運主體稅籍所在地）與買方（收貨／買家所在地）。
  #    把兩者混成一個 `country` 欄位是最容易犯的錯——跨境單會用錯稅制或錯的消費者權利。
  seller_capabilities: [tax_invoice, consumption_tax, stored_value_regime, tax_id_format, invoice_document]
  buyer_capabilities: [privacy_regime, pickup_networks, currency_format, consumer_rights]
  required_capabilities:
    [tax_invoice, consumption_tax, stored_value_regime, privacy_regime, tax_id_format,
     pickup_networks, currency_format, consumer_rights, invoice_document]
  # 🔴 **未宣告 ≠ none**：能力缺值時不得靜默取預設。三種合法 fallback，依序取最保守者——
  #    reject（回 userErrors `JURISDICTION_CAPABILITY_UNDECLARED`）／
  #    manual_queue（不阻斷已成立的金流，比照 55 §D G-01 的處置）／
  #    documented_no_op（必須落一列 `jurisdiction_capability_skips` 稽核）。
  #    **禁止靜默略過**——病根同 55 §D G-03（掛勾寫了沒接上）與 G-05（router 入參語義不成立），只是換到法域層。
  undeclared_capability_action: reject
  allowed_fallback_actions: [reject, manual_queue, documented_no_op]
  silent_skip_forbidden: true
  # pack 未通過 `jurisdictions.<code>.enable_gate` 時解析器拒絕啟動（比照 54 號 V-02 的既有處置）。
  resolver_refuses_start_when_gate_unmet: true
  # 🔴 schema 級決定一律取**所有 pack 的聯集**，不得只按 default pack 建表
  #    （例：`einvoices(shop_id, order_id)` 仍**不得**建唯一索引——55 §D G-04 的結論在 HK 雖 N/A 但要保留）。
  schema_is_union_of_all_packs: true
  # 🔴 上一鍵只是「原則」，以下是**列舉**。原則不可執行，列舉才可以做成 migration 測試。
  #    56 §0.2 原則 3 只寫了原則，把 G-04 的裁決值（`multiple_invoices_per_order_allowed`）留在
  #    `jurisdictions.tw.tax_invoice` 底下——但 `tw.enabled: false`，**建表時沒有人會去讀一個未啟用的 pack**。
  #    schema 級決定必須在**核心**層可見，否則 HK 首發上線建表時就會把索引建錯，屆時要停機 migration。
  #    （57 §G-04；原 55 §D G-04 的結論一字未改，只是把它從 pack 內提到核心層）
  schema_union_rules:
    # 建表時**禁止**建立的索引（migration 測試逐條斷言其不存在）
    forbidden_unique_indexes:
      - table: einvoices
        columns: [shop_id, order_id]
        reason: >-
          一訂單多發票：訂單編輯加收補開、TW V-23 若定案為「每次出貨各開一張」皆會產生多張。
          HK 下該表恆空（tax_invoice: none），但索引一旦建錯，啟用 tw pack 時要停機 migration。
        source: 55 §D G-04 / 57 §G-04
    # 建表時**必須**存在的表（即使當前 pack 不會寫入任何一列）
    required_tables:
      - name: jurisdiction_capability_skips
        columns: [shop_id, jurisdiction, capability, event_kind, source_write_point, reason, occurred_at]
        reason: documented_no_op 的落地處；沒有這張表，「什麼都沒做」就看不見（56 §A.3）
      - name: contract_liability_entries
        columns: [shop_id, source_type, source_id, direction, amount_cents, recognised_at, basis]
        unique_key: [shop_id, source_type, source_id, direction]
        reason: HKFRS 15 合約負債分錄落點（56 §B.3.1 J-01）；HK 為 default 法域即**首發就要有**
      - name: einvoices
        reason: tw pack 素材；HK 下恆空，但 schema 取聯集（見上方 forbidden_unique_indexes）
      - name: einvoice_allowances
        reason: 同上
    # 建表時的欄位級硬要求
    required_columns:
      - table: orders
        columns: [seller_jurisdiction, buyer_jurisdiction]
        reason: "訂單成立即快照法域碼（snapshot_on_order: true）；商家日後改市場不得回溯舊單"
      - table: gift_card_transactions
        composite_foreign_key: [shop_id, gift_card_id]
        reason: >-
          單欄 gift_card_id 在應用層漏檢時擋不住跨店扣抵。理由自 2026-08-12 起
          從「SVF 法遵」改為「多租戶資料隔離」（鐵律 2），**技術動作不變**（56 附錄 Z）。
  # 舊鍵路徑 → 新鍵路徑（本輪搬移；引用舊路徑的文件清單與修改計畫見 56 §D.1／§D.2）
  _moved_keys:
    einvoice: jurisdictions.tw.tax_invoice
    pickup_point.carriers: jurisdictions.tw.pickup_networks.providers
    pickup_point.cod_max_amount_twd: jurisdictions.tw.pickup_networks.cod_max_cents
    pickup_point.max_dimension_sum_cm: jurisdictions.tw.pickup_networks.max_dimension_sum_cm
    pickup_point.max_weight_kg: jurisdictions.tw.pickup_networks.max_weight_kg
    cod.fee_cents_default_range: jurisdictions.tw.cod.fee_cents_default_range
    cod.fee_taxable: jurisdictions.tw.cod.fee_taxable
    return.tw_minimum_window_days: jurisdictions.tw.consumer_rights.cooling_off_days
    return.tw_minimum_window_enforcement: jurisdictions.tw.consumer_rights.enforcement
    return.tw_statutory_channel_always_available: jurisdictions.tw.consumer_rights.statutory_channel_required
    return.tw_statutory_reason_code: jurisdictions.tw.consumer_rights.statutory_reason_code
    gift_card.tax_event_on_issue: jurisdictions.tw.accounting.gift_card_on_sale
    gift_card.tax_event_on_redeem: jurisdictions.tw.accounting.gift_card_on_redeem
    gift_card.tax_event_on_expire: jurisdictions.tw.accounting.gift_card_on_expire
    store_credit.tax_event_on_issue: jurisdictions.tw.accounting.store_credit_on_issue
    store_credit.tax_event_on_use: jurisdictions.tw.accounting.store_credit_on_use
    dispute.tax_event_on_lost: jurisdictions.<code>.accounting.chargeback_lost_treatment

# =============================================================================
# 0b. 金額顯示位數（2026-08-12 使用者裁定）
# =============================================================================
# 使用者原話：「金額數字可以顯示兩位小數．這個適用於所有國家的貨幣金額。」
#
# 🔴 **這是產品決策，不是 ISO 4217 慣例。** ISO 4217 給 JPY／TWD／KRW／VND 等幣別的
#    minor unit 是 **0**（不顯示小數）；本專案刻意**統一顯示兩位**，因為：
#    ①同一張報表併排多市場金額時，位數不一致會讓對齊（tabular-nums）失效；
#    ②「1,480」與「1,480.00」在對帳時是兩種可信度不同的字串，統一位數少一類人工誤判。
#
# 🔴 **下一個人請先讀這段再動手**：看到 `jurisdictions.jp.currency_format.exponent: 2`
#    不要當成 bug 修回 0。若日後要恢復依 ISO 顯示，**改的是各 pack 的 exponent 這一欄**，
#    不是刪掉 exponent 欄位——欄位結構（符號／位置／位數／分組全部是市場資料）是對的抽象，
#    只是目前所有市場的值都一樣。刪掉欄位＝把「顯示位數是市場資料」這個事實從程式碼裡抹掉，
#    等到第一個要用 ISO 位數的市場進來時就要重做一次抽象。
currency_display:
  force_minor_unit_digits: 2
  applies_to: all_markets
  # 被本決策覆蓋的 ISO 4217 zero-decimal 幣別（只列本專案原型／limits 現有的；非窮舉）
  iso4217_zero_decimal_overridden: [JPY, TWD]
  # 顯示位數 ≠ 儲存尺度：儲存一律 integer cents（×100，鐵律 3），本鍵只影響顯示。
  storage_scale_unchanged: true
  # 範圍＝**完整金額顯示**（fmtMoney／fmt）。KPI 磚與圖表軸的**縮寫**（2.06M／485K／1.2 億）
  # 不在本規則內：那是位數壓縮的近似值，`M`／`K` 後面的小數不是幣別的 minor unit，
  # 補成 `485.00K` 只會讓軸標籤更難讀。裁定原文強調的是「適用於所有國家」——
  # 要解決的是「JPY／TWD 0 位、其餘 2 位」的跨市場不一致，不是縮寫顯示。
  # 🔴 若日後要連縮寫也統一兩位，改的是 fmtMoneyCompact 的尾隨零裁切，**不是** exponent。
  applies_to_compact_abbreviations: false
  # 恢復 ISO 行為的方式（保留在這裡，免得日後靠考古）
  restore_iso_behaviour_by: set jurisdictions.<code>.currency_format.exponent to ISO minor unit
  source: 使用者 2026-08-12 裁定（ours；**非** ISO 4217）
  # 🔴 **救命條款**（63 §G.4，ours）：本裁定管的是**顯示**與**儲存**，**不管對外送款**。
  #    送 PSP／物流商／任何外部系統的金額一律依 ISO 4217 exponent 換算：
  #      psp_minor_unit = storage_cents / 10 ** (2 - iso_exponent)
  #    JPY 的 ¥1,480 顯示 `¥1,480.00`、儲存 148_000、**送 Stripe 必須是 1480**。
  #    把儲存值直接送出去＝收款金額 100 倍。餘數不為 0 時直接 raise（代表上游湊整沒套用），
  #    **不得四捨五入抹掉**。
  #    <!-- 依 68 號 §D-3 修正交叉引用，原文：「exponent=3 的幣別首發不支援，見
  #         catalog_flow.unsupported_currency_exponents。」該鍵已由 [3] 改為 []（跟隨 Shopify：
  #         幣別代碼開放、金額當 2 位處理）。🔴 **本條（送款依 ISO exponent 換算、餘數 raise、
  #         禁四捨五入）不受影響，一個字都沒鬆**——exponent=3 幣別現在是「可選但送款須 PSP pack
  #         明文宣告，未宣告即 reject」，見 catalog_flow.exponent3_* 四鍵與 money_boundary R5。 -->
  # 🔴 **本鍵自 2026-08-12（69 號 §V-188）起語義收窄，值不變。** 詳見 65 §J M-8。
  #    本鍵成文時（63 §G.4）的世界觀是「所有 PSP 都收整數 minor unit，只是 exponent 各異」。
  #    69 號查到的四家 PSP 是**四種算法**（`alt` ＝ PSP 官方文檔）：
  #      Adyen＝整數 minor units，且**明文說 CLP／CVE／IDR／ISK 以自家表為準、與 ISO 4217 不同**；
  #      Datatrans＝整數 minor units，自稱遵循 ISO；
  #      Stripe＝整數 minor units ＋ `Special cases` 表覆蓋 ISO（ISK／HUF／TWD／UGX），
  #              且 **HUF／TWD 的 payout 金額須整除 100**；
  #      Airwallex＝🔴 **十進位主單位字串，根本不用 minor units**。
  #    ⇒ 正確讀法是「**`amount_format: minor_units` 的 pack 若選擇以 ISO 為底時，底表就是 ISO**」，
  #      **不是**「所有 PSP 都跟 ISO」，更**不是**「沒宣告就套 ISO」。
  #    🔴 換算基數的唯一來源是 `psp_packs.<code>` 的宣告（見 money_boundary.psp_pack_required_keys）。
  # 🔴 DEPRECATED（2026-08-13，65 §J M-8 結案輪）：原鍵 `psp_minor_unit_follows_iso4217: true` 已改名如下。
  #    舊鍵名把「minor unit」與「follows ISO」寫進名字，兩者在 V-188 之後都不成立
  #    （Airwallex 型 pack 根本沒有 minor unit；ISO 只是 minor_units 格式可選的底表）。
  #    比照 D-2 前例：**不做別名**——別名會讓兩個鍵同時存在。63 §G.4 與其 §9 鍵表已同輪改寫，
  #    「規格說 A、鍵說 B」的分裂條件已解除。
  psp_amount_format_declared_per_pack: true
  # 🔴 **本鍵不是 PSP 換算的資料來源**（65 §J M-4）：`iso4217_zero_decimal_overridden` 的用途是
  #    「哪些幣別的**顯示位數**被裁定二覆蓋」，鍵名裡的 `iso4217` 講的是被覆蓋的對象，不是宣告值。
  #    拿它去推導 PSP minor unit＝下一個 100 倍事故。PSP 單位一律走 `money_boundary`（見下一區塊）。
  not_a_psp_unit_source: true

# =============================================================================
# 0b. 金額單位邊界契約（money unit boundary）——規格見 docs/specs/65-money-unit-boundary.md
# =============================================================================
# 🔴 **儲存尺度 ≠ 顯示位數 ≠ 對外單位，這是三件事。** 上一區塊（currency_display）只管前兩件；
#    第三件（對外送款）在這裡。把儲存值直接送 PSP＝**收款 100 倍**；把 PSP 回報值直接落庫＝
#    **少記 99%**。兩個方向都要轉，而且**在 HKD／USD／MYR 這些 exponent=2 的幣別下兩者都不會
#    被任何測試抓到**——這是本區塊存在的唯一理由。
# 出處：docs/specs/65（ours，承 63 §G.4／58 §G.3／62 §A.4 三處既有裁定，本區塊是它們的共同上位契約）
money_boundary:
  # --- R1 內部儲存 -------------------------------------------------------------
  # 一律 ×100，**不看幣別**（＝currency_display.storage_scale_unchanged 的數值化）。
  storage_scale_multiplier: 100
  storage_scale_ignores_currency: true
  # DB 金額欄位的硬約束：名字以 _cents 結尾、型別 bigint。migration 掃描違反即 CI fail（65 §C 檢查 C3）。
  storage_column_suffix: _cents
  storage_column_sql_type: bigint
  storage_column_decimal_or_float_forbidden: true

  # --- R4 十進位字串（JSON-LD／feed／CSV／MoneyV2.amount／物流商）----------------
  # 恆兩位小數、無幣別符號、無千分位、小數點為 "."。與 seo.jsonld.price_* 同一規則，不重複定義。
  decimal_string_digits: 2
  # 🔴 2026-08-23 錨點修正（productSet 對抗審查 confirmed #2）：原值用行錨點 ^/$，
  #    Ruby 的 $ 匹配尾隨換行之前 ⇒ 「128.00 尾隨 LF」通過本 regex 後在 to_storage 以
  #    split 數出 3 位小數而 raise Money::ExcessPrecision，穿透成 HTTP 500。
  #    \A/\z 是字串錨點，整串必須恰為金額形。psp_decimal_string_regex 同型
  #    但其字串一律由我方 fixed_string 生成（無外部輸入面），登記於 91 §3.7 不改。
  decimal_string_regex: '\A-?\d+\.\d{2}\z'
  decimal_string_divisor: 100
  # 解析外部十進位字串：BigDecimal 全程，小數超過 2 位 ⇒ raise/該行失敗，**不得 round**（58 §G.3 規則 2）。
  decimal_parse_type: BigDecimal
  decimal_parse_float_forbidden: true
  decimal_parse_excess_precision_action: raise

  # --- R5 PSP minor unit（🔴 100 倍事故點）--------------------------------------
  # 正常值＝ISO 4217 exponent，但**必須由該 PSP pack 明文宣告**，不得「沒宣告就當 ISO」。
  # 理由（比照 56 §A.3 與 58 §A.3「未宣告 ≠ 預設」）：業界確實存在「ISO 為 2 位、但該 PSP 要求
  # 金額為 100 的倍數」的特例幣別（⚠ V-130 未取得一手出處），靜默套 ISO 會在那些幣別上直接算錯。
  psp_minor_unit_source_default: iso4217
  psp_minor_unit_must_be_declared_by_pack: true
  psp_undeclared_currency_action: reject
  psp_undeclared_error_code: PSP_MINOR_UNIT_UNDECLARED
  # 送款只支援 exponent ≤ 2（儲存尺度 ×100 表達不了 exponent=3 的最小單位）。
  # <!-- 依 68 號 §D-3 修正交叉引用，原文：「首發只支援 exponent ≤ 2（…）。與
  #      catalog_flow.unsupported_currency_exponents:[3] 是同一條規則的兩個執法點
  #      （market 建立期／送款期）。」
  #      跟隨 Shopify 之後，**market 建立期的那個執法點被移除了**（幣別代碼開放，
  #      catalog_flow.unsupported_currency_exponents: []）。
  #      🔴 **本鍵的值不變（2），而且從「兩個執法點之一」變成「唯一的執法點」——
  #         也就是說它比改動前更重要，不是更不重要。** 任何人不得因為「幣別已經開放了」
  #         而把本鍵提高到 3 或刪除：那不是放寬幣別清單，那是動金額模型（鐵律 3、65 號全文）。
  #         exponent=3 幣別的收款路徑是「PSP pack 明文宣告 minor unit ＋ 宣告儲存精度不足的處理」，
  #         不是把本鍵改大。 -->
  max_supported_iso_exponent: 2
  # 換算餘數不為 0 ⇒ raise（代表上游湊整沒套用），**禁止四捨五入抹掉**。
  psp_non_integral_conversion_action: raise
  psp_rounding_forbidden: true

  # --- 🔴 R6／A0／A5／A6：PSP 的金額**格式**（依 69 號 §V-188 新增，2026-08-12）-------
  # 🔴 **上面所有 psp_* 鍵的隱含前提是「PSP 收整數 minor unit」——那個前提是錯的。**
  #    69 號查到四家 PSP 四種算法（`alt` ＝ PSP 官方文檔，見 65 §D.4 實證表）：
  #      Adyen／Datatrans／Stripe ＝ 整數 minor units（且 Adyen 明文覆蓋 ISO、Stripe 有 Special cases 表）
  #      Airwallex               ＝ 🔴 **十進位主單位字串**（`9.99` 就是九元九角九分）
  #    ⇒ `Money::PspMinor` 這個型別在 Airwallex 型 PSP 上**根本不適用**。這是**型別設計擋不住的形態**，
  #      不是參數問題 ⇒ 65 §A 新增 **R6（`Money::PspDecimal`）**，本區塊是它的鍵。
  # 🔴🔴 **不得把本區塊讀成「鐵律 3 放寬了」。** 反過來：外部證據正面證實了「PSP 單位必須逐家宣告、
  #      不得套 ISO」是對的，只是**宣告的內容比原本想的多一個維度（格式）**。
  #      `psp_undeclared_currency_action: reject` 與 `max_supported_iso_exponent: 2` 一個字都沒動。
  psp_amount_formats: [minor_units, decimal_string]
  # A0：pack 必須明文宣告 amount_format；未宣告 ⇒ reject，**且該 pack 不得 enable**。
  psp_amount_format_must_be_declared_by_pack: true
  psp_amount_format_undeclared_error_code: PSP_AMOUNT_FORMAT_UNDECLARED
  # 🔴 **禁止預設**。預設 minor_units ⇒ 對 Airwallex 型 PSP 送出「主單位被當 minor unit 解讀」的金額，
  #    而**該錯誤在所有幣別上都成立**（不像 exponent 的錯只在 zero-decimal 幣別現形）。
  psp_amount_format_default_forbidden: true
  # A6：decimal_string 格式的位數上限。我方儲存尺度 ×100 只能無損表達 2 位；
  #     pack 宣告 > 2 ⇒ 不得 enable（宣告 3 位卻只給得出 2 位＝靜默的精度謊報）。
  psp_decimal_max_places: 2
  # A6b：**位數下限**（2026-08-15 新增，PR #29 驗收指出的缺口）。
  #      🔴 原本只有上限 ⇒ 宣告 `decimal_places: 0` 或 `1` 的 pack **完全合法**，
  #      而 `to_psp_decimal` 走的是 `Money.fixed_string(major, decimal_places)`，
  #      它會 `value.round(digits)` **靜默四捨五入**：
  #        decimal_places=1 ＋ HKD 14.85（儲存 1485）⇒ 送出 "14.9"
  #        ＝帳上 14.85、送款 14.90，**差額 0.05 沒有任何一張表記得住**。
  #      這正是 65 §D.2 A5 逐字說的「自動湊整是最壞的處置」，
  #      而 `minor_units` 側有 A3 餘數 raise 擋住，`decimal_string` 側**沒有等價物**。
  #      ⚠️ **上下限相等（都是 2）不是冗餘**：兩個鍵擋的是兩種相反的謊報
  #      （宣告太多＝精度謊報／宣告太少＝金額被改），日後若儲存尺度改成 ×1000，
  #      兩者會一起變成 3 而**仍然要分別存在**。
  # 🔴 為什麼是「拒絕」而不是「支援 sub-2 位」：我方至今**沒有任何一家真的用
  #    sub-2 位的 PSP**（65 §D 無出處），要「支援」就得先發明湊整規則
  #    （誰決定進位方向？差額記到哪張表？）——那是憑空造規則。
  #    fail-closed 的代價是「真出現時第一次呼叫就 raise」，那是**看得見**的失敗；
  #    現狀的代價是**靜默送錯金額**。裁定：擋掉，留到第一家真 PSP 出現時再裁。
  psp_decimal_min_places: 2
  psp_decimal_string_regex: '^-?\d+\.\d{2}$'
  # A5：divisibility_constraint。🔴 **不是虛構需求**——Stripe 明文要求 **HUF／TWD 的 payout 金額整除 100**
  #     （`alt`，69 §V-188），而 **TWD 正好在下方 test_matrix_zero_decimal_required 裡**。
  #     pack 必須宣告（空表＝已查證無此約束；缺鍵＝沒人查過 ⇒ 不得 enable）。
  psp_divisibility_must_be_declared_by_pack: true
  psp_divisibility_violation_action: raise
  psp_divisibility_error_code: PSP_DIVISIBILITY_VIOLATION
  # 🔴 基準＝**即將送出的值，用該 PSP 自己的單位**（minor_units 檢查 minor 整數；
  #    decimal_string 以 BigDecimal 檢查主單位、禁 float）。**刻意不統一成以 cents 為基準**：
  #    那會逼 pack 作者把來源文檔上的數字自己換算一次再填——**而那個手工換算正是本區塊在防的東西**。
  #    宣告值必須能與來源文件逐字對照。
  psp_divisibility_basis: outbound_value_in_psp_unit
  # 🔴 **違反時不得自動湊整**（同 psp_rounding_forbidden 的理由）：湊整會讓「送出去的錢」與
  #    「帳上記的錢」不同，而差額沒有任何一張表記得住。
  psp_divisibility_rounding_forbidden: true
  # pack 宣告的必填鍵（缺任一 ⇒ 不得 enable）。逐鍵語義見 65 §D.3。
  psp_pack_required_keys: [amount_format, divisibility, divisibility_scope,
                           storage_precision_shortfall, enable_gate]
  psp_pack_required_keys_when_minor_units: [minor_unit_source, minor_unit_overrides]
  psp_pack_required_keys_when_decimal_string: [decimal_places]
  # ISO 4217 minor unit 表的來源：進 repo、版本釘死，不用未釘版的 gem。⚠ V-131
  iso4217_table_source: config/iso4217_minor_units.yml
  iso4217_table_unpinned_gem_forbidden: true

  # --- 型別層防呆（65 §C；註釋不算防呆）-----------------------------------------
  # 三個值物件彼此不可隱式互換；PSP adapter 簽名只收 Money::PspMinor，傳裸 Integer 即 TypeError。
  value_objects:
    storage: Money::Storage          # R1
    psp_minor: Money::PspMinor       # R5  amount_format: minor_units
    psp_decimal: Money::PspDecimal   # R6  amount_format: decimal_string（依 69 §V-188 新增）
    decimal: Money::Decimal          # R4  🔴 無 :psp 欄位 ⇒ **不是**對 PSP 的表示法，傳進 adapter 即 TypeError
  # 🔴 值物件**不得**實作 to_i / to_int / coerce / 數值型 to_s——一旦有隱式轉換，防線等於不存在。
  #    🔴 R6 的等價陷阱是 **to_s／to_str**：它內含字串，`"#{amount}"` 在組 JSON body 時到處都是，
  #       一旦 to_s 回傳裸金額字串，R6 的型別防線就跟不存在一樣。
  value_object_implicit_coercion_forbidden: true
  # Money::PspMinor 與 Money::PspDecimal 的唯一建構路徑都是 Money::Storage#to_psp_amount(psp:)
  # （依 pack 宣告的 amount_format 分流）；兩者的 .new 皆為 private_class_method。
  # <!-- 依 69 §V-188 改：原方法名 to_psp_minor（單一分支）。🔴 舊名**不保留為別名**——
  #      留著別名等於留著一條「不看 amount_format」的路徑。 -->
  psp_minor_single_construction_path: true
  psp_amount_single_construction_path: to_psp_amount
  psp_adapter_rejects_bare_integer: true
  psp_adapter_rejects_bare_string: true
  # 🔴 adapter 只收「該 pack 宣告格式對應的那一個」值物件，並驗 psp 相符：
  #    minor_units ⇒ Money::PspMinor／decimal_string ⇒ Money::PspDecimal；
  #    **Money::Decimal（R4，物流商與 JSON-LD 用的那個）一律拒收**——它與 R6 的字串內容可能一模一樣，
  #    但它不帶 psp、不跑 65 §D 的斷言（65 §A 末段第 3 點）。
  psp_adapter_amount_class_from_pack_format: true
  psp_adapter_rejects_money_decimal: true
  # 識別字後綴鐵律（人眼的編譯期）：看到 `_cents` 出現在送款呼叫點就是 bug。
  identifier_suffixes:
    storage: _cents
    psp_minor: _minor
    # 🔴 R6 的後綴刻意**不是** `_decimal`：那個已被 R4 佔用，而兩者 wire form 相同 ⇒
    #    共用後綴會讓本規則在 Airwallex 這條路徑上完全失效（65 §C.2）。
    psp_decimal_string: _psp_decimal
    decimal_string: _decimal
    display_string: _display
  # CI 靜態檢查（命中即 fail；機器的編譯期）。逐條說明見 65 §C。
  ci_checks:
    - psp_dir_must_not_reference_cents      # app/services/psp/** 出現 `_cents`（白名單兩處除外）
    # 🔴 依 69 §V-188 擴充：原規則只允許 `_minor`，那會讓 Airwallex 型 adapter **無法在不違規的
    #    情況下被呼叫** ⇒ 第一個實作它的人就會去改這條規則。放寬一條擋不住新形態的規則，
    #    比一開始就寫對更難修回來。
    - external_call_kwarg_must_be_minor     # 對 Psp::* 的呼叫，金額 kwarg 名須為 *_minor 或 *_psp_decimal
    - money_migration_must_be_bigint_cents  # 新增金額欄位須 bigint ＋ _cents 結尾
    # 🔴 依 69 §V-188 新增：PSP 目錄裡出現 R4，唯一的可能就是有人拿 feed／物流商的值來送款。
    - psp_dir_must_not_reference_money_decimal  # app/services/psp/** 出現 Money::Decimal 或 `_decimal`
                                                # （`_psp_decimal` 除外）

  # --- 反方向（inbound；🔴 1/100 事故點）----------------------------------------
  # PSP 回應／webhook 的金額是 R5 **或 R6**，落庫前必須轉回 R1；直接存＝少記 99%。
  # 🔴 依 69 §V-188 補：入向也要依 pack 的 amount_format 決定包成哪一個值物件；
  #    **包不出來就不准進**（宣告 decimal_string 卻收到整數 ⇒ 要嘛 pack 宣告錯、要嘛對方改了 API，
  #    兩者都必須進死信人工看，不得就地猜一個轉換）。
  inbound_psp_minor_must_convert: true
  inbound_amount_format_must_match_pack: true
  inbound_format_mismatch_action: dead_letter
  # 🔴 金額比對必須先化到同一表示法。15 §F4「PI 金額與 checkout 現值不符 ⇒ 不建單、自動退款」
  #    若拿 PI 的 R5 直接比 checkout 的 R1，**每一張 JPY 訂單都會被判成金額不一致而自動退款**。
  inbound_comparison_must_normalize_to_storage: true
  # 冪等鍵一律用 R1（15 §F4-1 的 "pi-{token}-{amount_cents}"）。中途改成 R5 會讓 key 全變 ⇒ 重複建 PI。
  idempotency_key_amount_representation: storage_cents

  # --- 會計分錄與對帳 ----------------------------------------------------------
  # 分錄一律 R1 ＋ 幣別碼；**禁止**以 PSP minor 記帳（對不回訂單金額）。雙幣別走 MoneyBag 雙欄，兩欄都是 R1。
  journal_representation: storage_cents
  journal_psp_minor_forbidden: true
  # 三方對帳（我方訂單 R1／PSP 結算檔 R5／銀行入帳 R4 字串）必須各自先轉成 R1 再比。
  reconciliation_normalize_to: storage_cents
  # 跨幣別不得直接相加（平台 rollup 的 gmv_*_cents 尤其）。⚠ V-134：換算時點口徑未定。
  cross_currency_sum_forbidden: true

  # --- 測試矩陣（65 §H）--------------------------------------------------------
  # 🔴 **zero-decimal 幣別必須進矩陣**。沒有這條，這個 bug 會在上線後才出現：
  #    exponent=2 的幣別下所有轉換的 divisor 都是 1，錯誤實作與正確實作**輸出完全相同**。
  test_matrix_zero_decimal_required: [JPY, TWD, KRW]
  test_matrix_two_decimal_required: [HKD, USD]
  # 🔴 依 69 §V-188 新增：**格式也是一個測試維度，而且是目前零覆蓋的那一個。**
  #    只測 minor_units 的矩陣，在 Airwallex 型 PSP 上等於沒有測試；而 decimal_string 的誤用
  #    （把儲存值 148000 輸出成 "148000.00"）**在 HKD 上也會錯** ⇒ 它是唯一「基準法域測得到、
  #    卻沒人在測」的送款事故形態。缺 decimal_string 的 fixture pack ⇒ CI fail。
  test_matrix_amount_formats_required: [minor_units, decimal_string]
  test_matrix_missing_amount_format_action: ci_fail
  # 🔴 divisibility 至少要有一個 fixture pack（以 TWD／100 為原型，來源＝Stripe payout 的明文要求）。
  #    斷言必須同時檢查「有 raise」與「**沒有靜默湊整**」——只測前者的話，
  #    一個「先湊整再 raise」的實作也會綠（65 §H.2 T16）。
  test_matrix_divisibility_required: {TWD: 100}
  # 🔴 「rejected」自 2026-08-12（68 §D-3）起指的是**送 PSP 時被 reject**，
  #    **不再**是「market 建立時被擋掉」——幣別本身已可選（catalog_flow.exponent3_currency_selectable）。
  #    斷言要測的是：KWD 市場可建立、金額以 2 位小數儲存與顯示、精度損失被登記，
  #    **而 to_psp_amount 在 PSP pack 未宣告 amount_format／minor unit 時 raise/reject**
  #    （方法名依 69 §V-188 由 to_psp_minor 改為 to_psp_amount，見上方 R6 區塊）。
  test_matrix_three_decimal_rejected: [KWD]
  test_matrix_boundary_values: [0, 1, smallest_representable, non_representable_remainder, bigint_max]
  # 金額路徑的測試檔若一個 zero-decimal 幣別都沒有 ⇒ 視為未涵蓋，CI fail。
  test_matrix_missing_zero_decimal_action: ci_fail
  # 往返自檢：from_psp_amount(to_psp_amount(x)) == x（兩種 amount_format 各跑一次），
  # 在非生產環境每次轉換都跑。<!-- 依 69 §V-188：原文只有 minor 一種 -->
  roundtrip_selfcheck_envs: [development, test, staging]

# =============================================================================
# 0c. PSP pack 宣告（規格見 docs/specs/65 §D.3；形態比照 58 的 carrier pack）
# =============================================================================
# 依 69 號 §V-188 新增（2026-08-12）。**本區塊在 65 §D.3／§L V-132 早已被引用，但一直沒有落鍵**
# ——這次把宣告契約落下來，順便把 69 號查到的「格式」這個維度補進去。
#
# 🔴 **本區塊目前沒有任何 enabled 的 pack，也不得有。** 我方不自建支付系統（open-decisions §F），
#    要接哪一家、該家對各幣別宣告什麼，一律等該家的官方文檔或合約文件到手才填（鐵律：未宣告 ⇒ reject）。
# 🔴 **不得從 65 §D.4 的實證表把數值抄進來當宣告值。** 那張表記的是「外部世界長什麼樣」，
#    用來證明 A0／A1／A5 三條斷言不是過度設計；**pack 的宣告值必須來自我方實際簽約那一家的一手文件**
#    ——Adyen 明文說自家表覆蓋 ISO，就是「別家的表不能拿來推這一家」最好的反證。
psp_packs:
  # --- 宣告契約（每個 pack 的必填鍵見 money_boundary.psp_pack_required_keys）-------
  # <psp_code>:
  #   amount_format: minor_units | decimal_string   # 🔴 必填（A0）；未宣告 ⇒ 不得 enable，送款 reject
  #   minor_unit_source: iso4217                    # minor_units 專用；「以 ISO 為底」也要明講
  #   minor_unit_overrides: {}                      # minor_units 專用；空表＝已查證無例外（≠ 未宣告）
  #   decimal_places: 2                             # decimal_string 專用；> 2 ⇒ 不得 enable（A6）
  #   divisibility: {}                              # 幣別 → 倍數；空表＝已查證無此約束（≠ 未宣告）
  #   divisibility_scope: []                        # charge／refund／payout ⚠ V-206
  #   storage_precision_shortfall: reject           # 目前唯一合法值
  #   enable_gate: []                               # 未結案的 V 編號；非空 ⇒ enabled 必為 false
  #   enabled: false
  #
  # 🔴 空表 ≠ 缺鍵（三處都適用：minor_unit_overrides／divisibility／enable_gate）：
  #    明文空表＝「已查證、無例外」；沒有這個鍵＝「沒人查過」⇒ 不得 enable。58 §A.3 已吃過一次虧。
  #
  # --- 已登記的閘門（pack 本體未建立，先把閘門記著，免得日後有人直接開）-------------
  # airwallex：⚠ V-132。單位面已由 69 號答出＝**十進位主單位字串**（amount_format: decimal_string），
  #            但 **per-currency 位數、幣別欄位名、webhook 金額形態**仍未取得一手文檔 ⇒ 不得 enable。
  # ⚠ V-206：divisibility 的作用範圍（charge / refund / payout）未明 ⇒ `divisibility_scope`
  #          缺鍵的 pack 一律不得 enable；已宣告者以**最嚴格**解讀（charge 亦套用）。
  enable_gates_registered: {airwallex: [V-132]}

# =============================================================================
# 1. API 契約（GraphQL）
# =============================================================================
api:
  # 分頁 cursor 每頁上限。出處：docs/research/28-api-contract.md:18（ours，對齊 Shopify）
  pagination_max_page_size: 250
  # 陣列型 input 元素上限。出處：docs/research/28-api-contract.md:21（ours，對齊 Shopify）
  array_input_max_items: 250
  # 單一請求 cost 上限。出處：docs/research/28-api-contract.md:23（ours，對齊 Shopify）
  max_query_cost_points: 1000
  # Leaky bucket 容量與回填速率。出處：docs/research/28-api-contract.md:24（ours）
  cost_bucket_capacity: 2000
  cost_restore_points_per_sec: 100
  # metafieldsSet 單次原子上限。出處：docs/research/28-api-contract.md:159（ours，對齊 Shopify）
  metafields_set_max_items: 25
  # --- 以下四鍵 2026-08-13 隨 M0 骨架移植新增（28 §0.3–0.4 的 cost 模型與預設頁量）。
  #     原骨架把它們放在自己的 58 行 limits.yml 的 `api.graphql.*` 底下——該檔已廢棄，
  #     本檔是唯一來源（鐵律 6）；GraphqlLimits 讀的就是本區塊的鍵名。
  # 未指定 first/last 時的預設頁量。出處：docs/research/28-api-contract.md §0.3（ours，對齊 Shopify 慣例）
  # ⚠ 前端鏡像：app/frontend/admin/api/pagination.ts（前端讀不到 YAML，改本鍵要同步改它）。
  pagination_default_page_size: 50
  # cost 模型權重。出處：docs/research/28-api-contract.md §0.4（ours，對齊 Shopify cost 模型）
  object_cost_points: 1
  scalar_cost_points: 0
  mutation_base_cost_points: 10

# =============================================================================
# 1b. 認證與登入限流（M0；docs/specs/12 F2）
# =============================================================================
auth:
  # 雙鍵限流（12 F2）：單一攻擊 IP 與「針對已知帳號的分散式攻擊」是兩種形態，
  # 一把鍵擋不住另一種。帳號鍵＝SHA-256(shop_id + email)，PII 不落 cache。
  # 出處：docs/specs/12-spec-tenancy-auth-permissions.md F2（每 IP 10 次/分；每帳號 10 次/10 分）
  admin_login_throttle_per_ip:
    limit: 10
    period_seconds: 60
  admin_login_throttle_per_account:
    limit: 10
    period_seconds: 600

# =============================================================================
# 2. 冪等（P0-11）
# =============================================================================
idempotency:
  # 🔴 **本區塊法域無關**（57 §G-08）。金流寫入點是「錢動了」，與賣方有沒有稅務憑證制度無關；
  #    55 §D G-08 系的 10 支強制冪等（含第 25 輪增列的 refundMarkAsSettled）在 hk／tw／任何
  #    未來 pack 下**完全相同**，不得放進 `jurisdictions.*`。
  #    唯一的例外是下方 `required_for_platform`（見該鍵註解）。
  jurisdiction_scope: core_all_packs
  # 冪等鍵保留期。逾期後同一把 key 的重試「視為全新操作」。
  # 出處：docs/research/46a-shopify-docs-orders-returns.md:789、46a:1006（dev，逐字
  #       「The retention window is 24 hours from the original request.」）
  ttl_hours: 24
  # 回放策略：由「當前 DB 狀態重建回應」，不存原始回應快照。
  # 出處：46a:791、46a:1009（dev，逐字「Successfully cached responses are constructed
  #       from current database state」）。11 號 spec 原本寫「存 response_body 原樣回放」＝寫錯，已修正。
  replay_strategy: rebuild_from_current_state
  # 參數指紋：欄位遞迴排序後再 hash，否則同一請求換欄位順序會誤判 mismatch。
  # 出處：46a:793、46a:816（dev，逐字「Ensure consistent ordering of input fields」）
  fingerprint_normalize_field_order: true
  # 建議的 key 產生方式：互動請求 UUID v4/v7；排程/背景任務 UUID v5（namespace + job 參數）。
  # 出處：46a（dev，S47/S48）
  key_format_interactive: uuid_v4_or_v7
  key_format_scheduled: uuid_v5
  # Bulk 操作每個 JSONL row 一把獨立 key，絕不共用。出處：46a:1015（dev）
  bulk_key_per_row: true
  # 🔴 **本尊的冪等是 GraphQL directive 形，不是 input 欄位**（2026-08-15 考掘）：
  #    `mutation { refundCreate(...) @idempotent(key: "…") { … } }`
  #    少數走 input 欄位（`SubscriptionBillingAttemptInput.idempotencyKey: String!`）。
  #    ⚠ `@idempotent` 的 SDL 定義（directive location、key 可空性）shopify.dev 上**沒有獨立頁面**
  #      （該站無 directives 索引），`directive @idempotent(key: String!) on FIELD` 是從用法範例
  #      反推的 ⇒ 我方實作時登記為假設。
  #    ⇒ 我方 28 §0.6 原本寫成 mutation 參數，**那是我方形態不是本尊形態**，已於 28 §0.6 標明。
  #
  # 🔴 **下面這份清單分兩段，混在一起讀會誤以為全部有官方背書**：
  #    段一＝本尊 2026-04 起強制的官方清單（公告日 2025-12-12，共 **17 支**，全部是
  #          refund／inventory／location 三類，也就是 **Shopify 自己的金流寫入點**）；
  #    段二＝我方擴充（ours），判準沿用 NP1-D「凡金流寫入一律強制冪等」。
  # 🔴 **本尊的 `orderCreate` 至 unstable 版都沒有任何冪等機制**。
  #    ⚠ 我方目前**沒有** `orderCreate` 這支 mutation——訂單成立走 `draftOrderComplete`
  #      （已在下方 ours 段）與結帳流程。CLAUDE.md 鐵律 5 的「訂單成立必帶 idempotencyKey」
  #      由 `draftOrderComplete` 承載，不是由一支叫 orderCreate 的 mutation 承載。
  #    ⇒ 日後若真的加 `orderCreate`，它**必須進 ours 段**（本尊沒有 ⇒ 不是 parity），
  #      且**不會因為升版變成官方段**。
  #    <!-- 2026-08-15 自我修正：本註解第一版寫「我方對它強制冪等是加嚴」，
  #         但全庫 grep `orderCreate` **只命中這一行註解本身** —— 我方從來沒有這支 mutation。
  #         🔴 對自己的清單做斷言之前要先 grep 自己的倉庫，不要照抄考掘報告的措辭。 -->
  #
  # 出處：46a:781–787（dev，公告日 2025-12-12）
  required_for:
    - refundCreate
    - returnProcess        # Shopify 文檔未載明其冪等；本專案強制（46a:620、46a:1062，ours）
    - orderCancel          # 非同步 job，本專案強制（46a:877 async；ours）
    - orderEditCommit      # 🔴 46a:962 逐字「不在強制冪等名單內」，但它產生應收/退款＝金流寫入，
                           #    與 returnProcess 同性質；重覆 commit ⇒ 重複扣款或重複退款。
                           #    **本專案強制**（NP1-D，50 號漏列；見 docs/specs/16 F8.1(c)、docs/specs/54 §4）
    - inventoryAdjustQuantities
    - inventoryMoveQuantities
    - inventorySetQuantities
    - inventorySetOnHandQuantities
    - inventoryShipmentReceive
    - inventoryShipmentCreate
    - inventoryTransferCreate
    - locationActivate
    - locationDeactivate
    # 🔴 2026-08-15 補齊：上面只收了官方 17 支裡的 10 支，註解卻寫「共 17 個」——
    #    數字與清單對不上，而**對不上的方向是少收**（漏掉的 7 支會在沒有冪等的情況下被實作）。
    #    以下 7 支同屬官方強制清單，我方**尚未實作**；先列著是刻意的：
    #    這是「要求清單」不是「存在清單」，列在這裡的作用是讓第一個實作它的人被 CI 擋下來。
    - inventoryActivate
    - inventorySetScheduledChanges
    - inventoryShipmentAddItems
    - inventoryShipmentCreateInTransit
    - inventoryTransferCreateAsReadyToShip
    - inventoryTransferDuplicate
    - inventoryTransferSetItems
    # --- 以下 10 支為 55 號盤點（docs/specs/55 §A / §D G-08）反向補齊（第 10 支 refundMarkAsSettled
    #     為 PR #52 第 25 輪隨 16 §F5 落地格增列）：
    #     官方 17 個強制清單是「Shopify 自己的金流寫入點」，**不涵蓋我方自己的**。
    #     50/52/54 三輪都只抄了官方清單，從未反向盤點「我方哪些路徑會動錢」。
    #     判定標準沿用 NP1-D（orderEditCommit）的既有決策：**凡金流寫入一律強制冪等，不論 Shopify 有無強制**。
    - orderCapture               # 支援部分請款且可多次（46c:526）；重試 ⇒ 重複扣款（55 §A M05–M08）
    - orderMarkAsPaid            # 兩個 staff 同時標記 ⇒ 兩筆 sale（55 §A M21）
    - draftOrderComplete         # 重複 complete ⇒ 兩張訂單（55 §A M22）
    - giftCardCreate             # 重複發卡 ⇒ 憑空多出負債（55 §A M27/M28）
    - giftCardCredit             # 重複儲值（55 §A M29）
    - giftCardDebit              # 重複扣抵 ⇒ 顧客資損（55 §A M30）
    - giftCardDeactivate         # 天然冪等，列入以統一契約（55 §A M31）
    - storeCreditAccountCredit   # 重複發放（55 §A M23）
    - storeCreditAccountDebit    # 重複扣抵 ⇒ 顧客資損（55 §A M24）
    - refundMarkAsSettled        # 線下待確認退款的人工確認（16 §F5 步 3 落地格，PR #52 第 25 輪增列；
                                 #   重試/雙擊不得二次翻列——55 §A 補列待該檔下次更新，登記於 PR #52 描述）
    # --- 以下 4 支為 58 號（物流商對接）補齊，判定標準同上：不可重試的外部副作用。
    #     與前面 22 支的差別：前者的副作用在**我方 DB 內**（可用條件式 UPDATE 兜底），
    #     這 4 支的副作用在**物流商那邊**（我方無法回滾）。重試一次＝多一張運單、多一筆運費，
    #     而且多出來的那張沒有人會去銷號 ⇒ 直接漏錢。見 docs/specs/58 §E.1。
    - shipmentIntentCreate       # 觸發取號（K2）；重試 ⇒ 多一張運單（58 §A.2 K2）
    - shipmentVoid               # 銷號為破壞性動作；號碼若已被物流商回收再發，二次 void 可能誤傷（58 §D.5）
    - shipmentCancel             # 重覆取消污染錯誤率指標與熔斷器（58 §F.5）
    - carrierPickupSchedule      # 重試 ⇒ 多一次上門取件，部分物流商對空跑計費（58 §C.5）
  # 平台域強制清單（與租戶 GraphQL 層解耦；兩者不得混用同一個 resolver 檢查點）。
  # 這兩支的簽名本就有 idempotencyKey!（38:1061–1062），列入使「唯一真相」成立。
  # 🔴 **本清單與上面的 `required_for` 不同：它是 pack-scoped 的**（57 §G-08 發現，56 §E 未涵蓋）。
  #    兩支都是台灣統一發票的專屬 mutation——HK 為 default 時它們**根本不存在於 schema**
  #    （56 §A.4 CI-3：非 tw pack 啟用時 `app/services` 下不得有 einvoice/* 呼叫路徑）。
  #    CI 檢查必須跟著 pack 走：對未啟用 tw 的部署，斷言的是「這兩支不存在」而**不是**「這兩支要帶 key」。
  #    若照 `required_for` 的方式做成無條件斷言，HK 首發的 schema 快照測試會直接紅掉。
  required_for_platform_pack_scope: jurisdictions.tw.tax_invoice
  required_for_platform:
    - platformEinvoiceVoid
    - platformEinvoiceAllowanceCreate
  # 🔴 第二層業務唯一鍵（**不取代**冪等 key，只做重覆偵測）。
  # 為什麼需要：ttl_hours = 24（46a:789 逐字「24 小時後同 key 視為全新操作」），
  # 但「同一張 fulfillment 只能請款一次」是**永久**約束，24 小時的冪等窗擋不住。見 docs/specs/55 §A.3。
  business_unique_keys:
    orderCapture:              [order_id, parent_transaction_id, amount_cents, seq]
    orderMarkAsPaid:           [order_id]
    refundMarkAsSettled:       [transaction_id]   # 同一筆 REFUND 交易只能被標記結清一次（16 §F5 步 3，第 25 輪）
    draftOrderComplete:        [draft_order_id]
    giftCardDebit:             [checkout_token, gift_card_id]
    storeCreditAccountDebit:   [checkout_token, store_credit_account_id]
    # 58 號補：`package_fingerprint` ＝ packages[] 正規化 JSON 的 SHA-256。
    # 必須套用上面的 `fingerprint_normalize_field_order`，否則同一批包裹換欄位順序會被誤判成不同請求。
    shipmentIntentCreate:      [fulfillment_order_id, carrier_account_id, service_code, package_fingerprint]
    shipmentVoid:              [waybill_id]
    shipmentCancel:            [waybill_id]
    carrierPickupSchedule:     [carrier_account_id, location_id, pickup_window_start, pickup_window_end]
  # 🔴 **建立型（B 類）商品線 mutation 的強制冪等**（63 §A.3，ours）。
  #    判準與上面 22+4 支相同——「重放會不會憑空多出一個實體或一筆錢」——但商品沒有錢動，
  #    它多出來的是**實體**：handle 衝突時自動加 -1 後綴（13 §F2-2）、title 可合法重複，
  #    ⇒ **沒有任何業務唯一鍵可以兜底**，重複點擊儲存就是兩個一模一樣的商品。
  #    宣告式覆寫型（productUpdate/productSet/productVariantsBulkUpdate/metafieldsSet/
  #    publishablePublish…）**刻意不列入**：它們天然冪等且沒有錢動，強制帶 key 只會讓
  #    idempotency_keys 表在 CSV 匯入（5 萬行，13 §F6）下無謂膨脹；那一類的併發防線是
  #    `lock_version` 樂觀鎖（63 §A.4），要擋的是靜默覆蓋不是重放。
  # ⚠ 刻意獨立成鍵而不併進上面的 `required_for`：後者的註解承載「官方 17 支／我方 10 支金流／
  #    我方 4 支物流」的出處分層（金流支數第 25 輪隨 refundMarkAsSettled 增列同步），
  #    本清單是第四類來源，混入會讓出處註解失真。
  required_for_catalog_create:
    - productCreate
    - productDuplicate
    - productVariantsBulkCreate
    - productCreateMedia
    - collectionCreate
    - fileCreate
  # 合併進 `required_for` 是一行改動，但**必須同步更新 CI 的無條件斷言**
  #（教訓見上面 required_for_platform 那段：斷言與清單語義不同步會讓 schema 快照測試紅掉）。
  catalog_create_merge_pending: true

# =============================================================================
# 3. 訂單／取消／編輯
# =============================================================================
order:
  # 訂單流水號起始值（只能改前後綴，流水號不可變）。出處：docs/research/22:146（live）
  number_start: 1001
  # orderCancel.staffNote 字元上限（買家不可見）。出處：46a:848、46a:880（dev）
  cancel_staff_note_max_chars: 255
  # 批次取消訂單單次上限。出處：46c:149（help）
  bulk_cancel_max_orders: 250
  # 匯出/批次動作轉背景 job 的門檻。出處：docs/research/22:160（ours）
  bulk_async_threshold: 50
  # ===== 71-R7（2026-08-13，help）=====
  # 匯出直接下載上限（超過或依日期→email 寄操作者+店主）。出處：help exporting-orders（help）
  export_direct_download_max: 50
  # 行動版 bulk 一次可選上限。出處：help bulk-actions（help）
  bulk_select_mobile_max: 25
  # 平台收款授權請款窗（天；逾期可能無法請款）；「即將到期」badge=截止前 2 天。出處：help capturing-payments（help）
  payment_auth_capture_window_days: 7
  payment_capture_due_badge_days: 2
  # 延遲付款自動提醒上限（則；購買選項訂單不寄）。出處：help deferred-payments（help）
  payment_reminders_max: 5
  # 付款條款 net 值域。出處：help deferred-payments（help）
  payment_terms_net_days: [7, 15, 30, 45, 60, 90]
  # 運送標籤批次列印上限（張）。出處：71-R7 實測 shipping_labels promo＋sl-auto 既有值（test）
  shipping_label_batch_max: 250
  # 轉換摘要資料延遲上限（小時；cookie 封鎖時區塊空白）。出處：help conversion-summary（help）
  conversion_summary_delay_max_hours: 48
  # 訂單編輯 session TTL 與並發鎖。
  # ⚠ Shopify 文檔未載明鎖/TTL/並發行為（46a:961、46a:988–989、46a:1061）→ 本專案決策。
  edit_session_ttl_hours: 24
  edit_session_single_open_per_order: true
  # orderEditAddVariant.allowDuplicates 預設值。出處：46a:924、46a:991（dev）
  edit_add_variant_allow_duplicates_default: false
  # orderEditSetQuantity.restock 預設值。出處：46a:929、46a:991（dev）
  edit_set_quantity_restock_default: false
  # 訂單草稿閒置自動刪除（2025-04-01 後建立者）。出處：46c:552（help）
  draft_idle_auto_delete_days: 365
  # 🔴 訂單／訂單草稿的**單一標籤**字元上限是 **40**，與商品／顧客／轉移／網誌文章的 255 **不同**。
  #    兩者共用一個常數＝訂單標籤可以寫進 255 字元，之後在 Shopify 匯入時整批被拒。
  #    出處：help.shopify.com/en/manual/products/details/tags（P9，help；61 §9.1）
  tag_max_chars: 40

# =============================================================================
# 4. 履行（FulfillmentOrder / Fulfillment）
# =============================================================================
fulfillment_order:
  # 每張 FulfillmentOrder 最多同時存在的 active hold 數，超過回 userError。
  # 出處：46a:320、46a:374（dev）
  max_active_holds: 10
  # fulfillmentOrderSplit 單次最大拆分數。
  # ⚠ 文檔未載明（46a:1049–1067 已逐條列為未載明項）→ 實作前查證，暫不設限。
  max_splits_per_call: null
  verify_max_splits: true

fulfillment:
  # 單張 fulfillment 的 tracking number / URL 數量上限。
  # ⚠ 文檔未載明（46a §3②）→ 實作前查證。
  max_tracking_numbers: null
  verify_max_tracking_numbers: true

# =============================================================================
# 5. 退貨／退款（P0-01、P0-02）
# =============================================================================
return:
  # returnReasonNote 字元上限。出處：46a:523、46a:653（dev）
  reason_note_max_chars: 255
  # 自助退貨單次可申請的品項上限。出處：46c:375–384（help，H16 zh-TW）
  self_serve_max_line_items: 250
  # 退貨期間可選檔位（天）；`unlimited` 代表「不限」。出處：46c:415–416（help）
  window_day_options: [14, 30, 90, unlimited, custom]
  # 退貨期間起算點二選一。出處：46c:415–416（help）
  window_start_options: [item_delivered_at, order_last_item_delivered_at]
  # 退貨運費三選一。出處：46c:417（help）
  shipping_fee_modes: [free, flat_fee_per_return, customer_buys_own_label]
  # 重新上架費：以退貨金額的**百分比**計（per line item）。出處：46c:418–419（help）、46a:526（dev）
  restocking_fee_is_percentage: true
  # RestockingFeeInput.percentage 最大值。
  # ⚠ 文檔未載明（46a §4② 逐字「最大值：文檔未載明」）→ 實作前查證；暫以 100 作為程式防呆上界。
  restocking_fee_max_percentage_guard: 100
  verify_restocking_fee_max: true
  # 在 Shopify 內建立退貨運送單的地區限制。出處：46c:297（help，逐字「僅限美國地點」）
  platform_label_supported_countries: [US]
  # 🔴 法定鑑賞期／法定解約管道已搬到 `jurisdictions.<code>.consumer_rights`（原 `return.tw_*` 五鍵）。
  #    第三個搬移理由本來就寫在原註解裡：「退貨規則可按市場切換，把台灣法規套到所有市場是錯的」——
  #    本輪只是把它做成結構，不是新結論。
  # 🔴 香港的值是 `cooling_off_days: null` ＋ `statutory_channel_forbidden: true`：
  #    HK **無**通訊交易法定鑑賞期，提供「依法申請解約」入口等於宣稱一個不存在的法定權利
  #    （可能構成 TDO 的不實陳述）。這是「少做一件事」與「多做會出事」的差別，見 56 §E.1。
  consumer_rights_ref: jurisdictions.<code>.consumer_rights
  # pack 未宣告 consumer_rights ⇒ 只走商家自訂退貨規則，且 UI **不得**出現任何「依法…」字樣。
  undeclared_action: merchant_policy_only_no_statutory_claim

refund:
  # 退款金額下限鉗制：建議退款不得為負，一律 floor 到 0。
  # 出處：46a:595–601（dev，逐字「the suggested amount cannot be lower than $0 CAD」）
  floor_to_zero: true
  # 軟上限：預設 netPayment（Σcaptured − Σrefunded）。**不得做成 DB CHECK 硬擋**——
  # help 明載「先發過商店抵用金者可對原付款方式超額退款」（46c:223、46c:241）。
  # maximumRefundable 公式 ⚠ Shopify 未公開（46a:606、46a:770、46a:819）→ 以下為本專案決策。
  soft_cap_strategy: net_payment
  over_refund_requires_permission: "orders.over_refund"
  over_refund_requires_confirm: true
  # 線下待確認退款的人工確認（refundMarkAsSettled，16 §F5 步 3 落地格）——治理鍵與 over_refund
  # 同形（PR #52 第 25 輪落鍵：原僅散文，實作只能硬編權限字串與 confirm 旗標＝鐵律 6 擋的形態）。
  mark_refund_settled_requires_permission: "orders.mark_refund_settled"
  mark_refund_settled_requires_confirm: true
  verify_maximum_refundable_formula: true
  # --- 金流側累計上限的**執行方式**（57 §G-02；55 §A.2 M09/M10 只給了式子，沒給落地契約）---
  # 🔴 **本組鍵法域無關**。55 §D G-02 的「折讓累計上限 Σ allowances ≤ invoice.total_cents」在 HK 是 N/A
  #    （無憑證 ⇒ 無折讓），但**金流側的 `Σ refunded_cents ≤ maximumRefundable` 必須留著**。
  #    56 §E.1 已明文標為「高（容易誤刪）」——把稅務側與金流側一起拿掉是本輪最容易犯的錯。
  #    完整可測式子（條件式 UPDATE 樣式／併發情境／回應碼）見 docs/specs/16 F5.1「退款上限」段。
  cumulative_cap_formula: "Σ refunded_cents ≤ orders.captured_total_cents"   # ＝ netPayment 的展開式
  cumulative_cap_enforcement: conditional_update      # 🔴 禁止先 SELECT 再 INSERT／UPDATE
  cumulative_cap_column: orders.refunded_total_cents  # 物化欄位，與 refunds 明細 nightly 對帳
  # 條件式 UPDATE 的 affected rows == 0 時的兩種語義**必須分開回**，否則前端無從判斷要不要顯示二次確認：
  cap_exceeded_error_code: REFUND_EXCEEDS_MAXIMUM_REFUNDABLE   # 超過軟上限 → 走 over_refund 權限路徑
  concurrent_conflict_error_code: REFUND_CONCURRENT_MODIFIED   # 併發競爭失敗 → 呼叫端可原樣重試
  # 超額退款是**合法情境**（46c:223）：帶權限與二次確認後，同一條 SQL 改走 `allow_over_refund` 分支，
  # **不是**繞過條件式 UPDATE——繞過就等於在超額路徑上失去併發保護。
  over_refund_uses_same_conditional_update: true
  # 混合付款的退款分配順序（P1-05／H-83）：**禮品卡永遠第一順位**，逐筆吃滿再進下一筆（不按比例攤）。
  # 出處：46c:221（help，H05 zh-TW 逐字「混合付款時，系統先把退款金額套用到禮品卡，直到禮品卡達可退全額，餘額才用其他付款方式」）
  # 🔴 這是硬規則，**不得做成商家可調整的順序設定**。演算法與三個算例見 docs/specs/16 F5.4。
  allocation_order: [gift_card, others]
  allocation_within_group_sort: [created_at, id]   # 同類多筆：先收先退（結果可重現）
  allocation_strategy: greedy_fill                 # 逐筆吃滿，**不是** proportional
  # 稅額分攤（P1-02／H-07）：分攤**原始已收稅額**，不用現行稅率重算；餘數歸最後一次退貨。
  # ⚠ 官方未載明退款稅額分攤規則（46a:1049–1067 列為未載明項）→ 以下為本專案定義。見 16-F5.1 X1–X6。
  tax_allocation_basis: original_collected_tax
  tax_allocation_rounding: largest_remainder
  tax_allocation_remainder_owner: last_refund
  return_fees_taxable: false
  verify_tax_allocation_rule: true
  # F5.4 的 Refunds::Allocator 是純函式、輸出原本不落庫 → 無法對帳「退到哪張卡」，
  # 也無法支撐發票折讓基數的計算（55 §B.3）。建議表 `refund_transaction_allocations`
  # （唯一鍵 `(refund_id, order_transaction_id)`）。見 docs/specs/55 §D G-16。
  allocation_persistence_required: true
  # 退款分配到禮品卡的部分**必須回補卡片餘額**——F5.4 只寫了「分配」沒寫「回補寫入點」（55 §D G-17）。
  gift_card_refund_credits_balance: true

# =============================================================================
# 6. 請款／授權（P0-12）
# =============================================================================
capture:
  # 請款四模式（**不是三模式**；22:147/22:157 原本寫「三模式」＝寫錯，已修正）。
  # 出處：46c:508–514（help，H33 zh-TW）
  modes:
    - automatic_at_checkout      # 結帳時自動請款（預設，全方案）
    - automatic_after_fulfilled  # 整張訂單出貨完成後自動請款（全方案）
    - automatic_per_fulfillment  # 每次出貨各自請款一次（🔴 僅 Shopify Plus）
    - manual                     # 手動請款（全方案）
  default_mode: automatic_at_checkout
  plus_only_modes: [automatic_per_fulfillment]
  # 授權效期（天）。出處：46c:517–525（help，Shopify Payments）
  authorization_days_default: 7
  authorization_days_plus:
    visa: 30
    mastercard: 30
    amex: 30
    discover: 10
    jcb: 10
    diners: 7
    cup: 7
  # 顧客銀行帳單上的 pending hold 最長顯示天數。出處：46c:517–525（help）
  pending_hold_display_max_days: 30
  # 🔻 informational only — 不參與任何計算（P1-06 降級）。
  # 出處：46c:526（help）逐字「超過授權期限後才請款，需付 1.75% 附加費」。
  # 那是 **Shopify Payments 對商家的收單定價**；CHILL LOVE 依 TW-9 電支條例鐵律（37 §3、37 §479–491）
  # 不代收代付、不是收單機構，租戶貨款直接進租戶自持商戶號 → 既不收這筆費、也無權加收。
  # **不得**在帳單或訂單金額引擎產生 1.75% 行項。保留此鍵僅供「若未來自營收單」時參考。見 docs/specs/54 §P1-06。
  late_capture_surcharge_rate_informational_only: 0.0175
  # 上方 authorization_days_* 是 **PSP／卡組織屬性，不是方案旗標**（P1-07）：
  # 只作為 UI 顯示與到期提醒 job 的預設值，實際上界以 Stripe PaymentIntent 為準。
  # 寫成「Plus ⇒ 30 天」的硬邏輯會產生「系統說還能請款、Stripe 已 declined」的錯誤狀態。見 docs/specs/15 F4.1(b)。
  authorization_days_source: psp_and_card_network   # 非 shop.plan
  # 授權到期示警提前天數。出處：docs/research/22:40（ours，對應 46c:536「即將到期 badge」）
  expiry_warning_days_before: 2
  # --- 部分請款的累計上限與併發（55 號盤點 §A.2／§D G-13、G-14；規格見 docs/specs/15 F4.1(d)）---
  # 46c:526 逐字「支援部分請款；金流商或 Plus 可**多次**部分請款」→ 這是「同一筆金流的多次寫入」，
  # 只做冪等不夠（冪等擋同一把 key 重送，擋不住兩把合法 key 加起來超額）。
  partial_capture_allowed: true
  cumulative_cap_source: authorization_amount        # Σ captured_cents ≤ authorization.amount_cents
  cumulative_cap_enforcement: conditional_update     # 🔴 禁止先 SELECT 再 UPDATE
  # 開放 automatic_per_fulfillment 前必須探測 PSP 能力，**不是只看 shop.plan**（15-F4.1(a)）
  multi_partial_capture_requires_psp_probe: true
  idempotency_key_template: "capture-{order_id}-{fulfillment_id|checkout|fulfilled|seq}"

# =============================================================================
# 7. 庫存（P0-15）
# =============================================================================
inventory:
  # 頂層五態（不可省略）。出處：46c:891–907（help，H18 zh-TW）、44:150（live）
  top_level_states: [on_hand, available, committed, unavailable, incoming]
  # unavailable 的子分類。出處：46c:925–927（help，H20 zh-TW）
  unavailable_subtypes: [damaged, quality_control, safety_stock, draft_reserved, app_reserved, other]
  # 🔴 API 的 quantity name 全集（8 個，小寫底線）。出處：inventoryProperties.quantityNames，
  #    2026-07，取證 2026-08-24（docs/research/95 §2）。
  #    `top_level_states` 是**顯示層**的五態（UI 的 unavailable 是四項的彙總顯示），
  #    本鍵是**API 層**的真實 name 集合，兩者不可混用。
  quantity_names: [available, committed, damaged, incoming, on_hand, quality_control, reserved, safety_stock]
  # on_hand 的組成（官方 comprises，**六項、不含 incoming**）。它是導出量不是獨立變數。
  on_hand_comprises: [available, committed, damaged, quality_control, reserved, safety_stock]
  # `isInUse` 語義＝**該商家用過沒有**（原文 "Whether the quantity name has been used by the merchant."），
  # **不是** per-shop 功能開關。parity 行為：未使用過的狀態不主動在庫存表格露出欄位。
  hide_unused_quantity_names: true
  # `displayName` 是**已本地化**字串 ⇒ 我方繁中介面自備對照表，不得直接顯示 API 回的英文。
  use_own_quantity_display_names: true

  # 🔴 調整原因：**API 17 個，admin UI 手動下拉只露 7 個**——兩者是同一份值域的兩個投影，都要。
  #    出處：docs/research/95 §3（2026-07，取證 2026-08-24）＋ 實機 docs/research/94 §2.4。
  #    ⚠ 舊鍵存的是 **UI 標籤 snake_case**（count／return_restock／theft_or_loss），
  #      **不是 API 識別字**——與 collection 的 title_asc vs alpha_asc 是同一種坑，本輪改正。
  adjustment_reasons: [correction, cycle_count_available, received, restock, damaged, shrinkage, promotion,
                       other, quality_control, safety_stock,
                       movement_created, movement_updated, movement_received, movement_canceled,
                       reservation_created, reservation_updated, reservation_deleted]
  # UI 手動下拉露出的子集（順序即 UI 順序；第一項 correction 為預設，help 明文
  # "The default option when no other reason is selected."）。
  adjustment_reasons_manual_ui: [correction, cycle_count_available, received, restock, damaged, shrinkage, promotion]
  # 數量邊界：🔴 **adjust 與 set 不同**，照一個數字實作會在其中一支放行不該放行的值。
  #   adjust：INVALID_QUANTITY_TOO_HIGH "The quantity can't be higher than 2,000,000,000."
  #   set   ：INVALID_QUANTITY_TOO_HIGH "The **total** quantity can't be higher than 1,000,000,000."
  adjust_quantity_max: 2000000000
  adjust_quantity_min: -2000000000
  set_total_quantity_max: 1000000000
  set_total_quantity_min: -1000000000
  # 🔴 **結果值**邊界（與單次 delta/目標邊界是兩件事）：欄位是 signed INT，
  #    兩次各 +1.5e9 單獨合法、相加溢位 ⇒ 寫入前驗累積結果（含投影 on_hand）。
  #    對齊本尊「resulting quantity can't exceed 2,000,000,000」語義且落在 INT 內。
  quantity_result_max: 2000000000
  quantity_result_min: -2000000000
  # ledgerDocumentUri：除 available 外**全部必填**，且不得用 gid://shopify/*。
  ledger_document_required_except: [available]
  ledger_document_forbid_shopify_gid: true
  # 建店預設地點名（同本尊「Shop location」；資料預設英文＝2026-08-23 使用者指示）。
  default_location_name: Shop location
  # 調整歷史保留天數。出處：docs/research/22:81（live）
  adjustment_history_retention_days: 180
  # 訂單草稿保留庫存的去向＝unavailable（**不是 committed**）。出處：46c:546–549、46c:895（help）
  # 🔴 **官方正在遷移這個值，本鍵目前刻意不改**（61 §3.3／§9.4，衝突 C-1）：
  #    shopify.dev/changelog/draft-order-and-transfer-shipment-inventory-is-moving-from-reserved-to-committed
  #    （2026-08-05，dev）宣告草稿訂單／轉移保留正從 unavailable 遷往 **committed**，help 尚未更新。
  #    ⚠ **V-53 結案前不要因為「dev 比 help 新」就改值**——遷移未完成時改了會兩頭不對。
  draft_reservation_target_state: unavailable

# =============================================================================
# 8. 商品／集合／媒體
# =============================================================================
product:
  # 出處：46c:657–669（help）、docs/research/22:70/74/160（live）
  # 本輪（61 §9.1）以官方頁逐一覆核：
  #   max_options 3        — help.shopify.com/en/manual/products/variants/add-variants（P14）
  #                          ＋ shopify.dev/.../mutations/productOptionsCreate 錯誤碼 OPTIONS_OVER_LIMIT（D6）
  #   max_variants 2048    — 同 P14 ＋ shopify.dev/changelog/the-product-variant-limit-is-now-2048-for-all-merchants（D12）
  #   max_media 250        — 同 P14 ＋ help.shopify.com/en/manual/products/import-export/using-csv（P51）
  max_options: 3
  max_variants: 2048
  max_media: 250
  # 🔴 下列兩鍵**不是官方值**（61 §9.1 V-68 逐頁查證：help 與 dev 的商品欄位頁、REST Product 資源
  #    皆未載明字元／位元組上限）。原本掛的「出處：46c／22」是誤植，本輪改標為本專案自訂。
  #    ⚠ V-68：若日後取得官方值再改；在那之前**不得**在規格裡寫成「對齊 Shopify」。
  title_max_chars: 255            # ours（非官方）
  description_max_bytes: 65536    # ours（非官方）
  # 廠商／產品類型字元上限：官方未載明（同上 V-68 查證脈絡）⇒ 本專案自訂，對齊 DB varchar(255)。
  vendor_max_chars: 255           # ours（非官方）
  product_type_max_chars: 255     # ours（非官方）
  # 子類每日上傳速率（>500,000 子類的店）；Plus 豁免。出處：46c:657–669（help）、P14、P54
  daily_variant_upload_limit: 10000
  daily_variant_upload_plus_exempt: true
  # 上述速率只在變體數超過此門檻的商店生效（原本只在註解裡，本輪成鍵）。出處：P14、P54（help）
  daily_variant_upload_applies_above_variants: 500000
  # --- 61 §9.1 新增（全部有官方 URL 出處）-------------------------------------
  # 每個商品的標籤數／單一標籤字元數。
  # 出處：help.shopify.com/en/manual/products/details/tags（P9，help）
  #      ＋ shopify.dev/docs/api/admin-rest/latest/resources/product（D16，dev）
  max_tags: 250
  tag_max_chars: 255
  # 每個變體可掛的圖片數（官方明載變體不支援 3D 模型與影片，且每變體只能一張圖）。
  # 出處：help.shopify.com/en/manual/products/product-media/add-images-variants（P21，help）
  max_images_per_variant: 1
  # 單次 productVariantsBulkCreate 帶入的變體數／單一查詢可取回的變體數。
  # 出處：shopify.dev/docs/apps/build/graphql/migrate/new-product-model（D8，dev）、D1
  variant_bulk_create_max: 2048
  variant_query_max: 2048
  # 🔴 每個選項的選項值數上限：錯誤碼 OPTION_VALUES_OVER_LIMIT 存在（shopify.dev/.../enums/
  #    ProductOptionUpdateUserErrorCode，D7）證明**有**這個上限，但官方未公布數字，
  #    ShopResourceLimits（D5）也沒有對應欄位 ⇒ 留 null，UI 不做前端提示，靠後端錯誤碼回報。⚠ V-50
  max_option_values_per_option: null
  # 每店商品數上限：官方未載明 ⇒ 不設上限。⚠ V-69
  max_products_per_shop: null
  # ⚠ ShopResourceLimits 同時暴露 maxProductOptions 與 maxProductVariants 兩個 Int!（D5）
  #    ⇒ 上限是 **per-shop 可查詢的**，不是全域常數。本檔的值是**預設值**，須允許 per-shop 覆寫，
  #    否則之後接 Plus 級租戶會撞牆。
  limits_are_per_shop_overridable: true

  # --- 商品狀態：官方是**四**態（規格見 docs/specs/13 §F1.2）---------------------
  # 出處：shopify.dev/docs/api/admin-graphql/latest/enums/ProductStatus（D3，dev）
  #      ＋ shopify.dev/docs/apps/build/product-merchandising/unlisted-products（D4，dev）
  # 🔴 我方原本寫死三態（13 第 13 行）。UNLISTED＝**可購買但不可被發現**，
  #    它的存在證明「可購買」與「可被發現」是兩個獨立維度，一個 scope 兼管兩件事必定出錯。
  status_values: [ACTIVE, DRAFT, ARCHIVED, UNLISTED]
  # 兩個獨立 scope（取代原本單一的 Product.published）。真值表見 13 §F1.2。
  purchasable_statuses: [ACTIVE, UNLISTED]
  discoverable_statuses: [ACTIVE]
  # 恆等不變量：discoverable ⊆ purchasable。違反＝把買家從搜尋送進買不了的頁面（soft-404）。
  discoverable_subset_of_purchasable: true
  # UNLISTED 的對外行為（D4 逐條）：輸出 noindex,nofollow、排除於 sitemap、排除於平台 catalog。
  unlisted_meta_robots: "noindex,nofollow"
  unlisted_excluded_from: [sitemap, search_index, collections_storefront, recommendations,
                           feed, agent_catalog, jsonld_offer, hreflang]
  # 🔴 我方**刻意不做** Shopify 那種「舊 API 版本把 unlisted 回成 active」的降級（D4）：
  #    那會讓舊版整合把 UNLISTED 當 ACTIVE 處理，再把它送進 feed／索引，等於 noindex 完全失效。
  #    我方 enum 一次到位四值，舊版本一律照實回 UNLISTED。（ours，刻意偏離，13 §F1.2(f)）
  unlisted_downgrade_on_old_api_version: false

collection:
  # 出處：docs/research/22:160（live）；本輪（61 §9.3）以官方頁覆核並補齊四項。
  # help.shopify.com/en/manual/products/collections/create-collection（P23，help）
  max_smart_collections_per_shop: 5000     # ＝官方「每店含任何條件的商品系列」上限
  max_rules_per_collection: 60             # ＝官方「單一商品系列的條件總數」上限
  # --- 61 §9.3 新增（全部出自 P23／P26，官方逐字有數字）------------------------
  # 每店「含手動或自動加入之**變體**」的商品系列數。出處：P23（help）
  max_with_variants_per_shop: 100
  # 每店「**內含**另一個商品系列」的商品系列數。出處：P23（help）
  max_containing_collection_per_shop: 50
  # 每店「**排除**另一個商品系列」的商品系列數。出處：P23（help）
  max_excluding_collection_per_shop: 5
  # 商品系列品項區每頁顯示數。出處：help.shopify.com/en/manual/products/collections/collection-layout（P26，help）
  items_page_size: 60
  # 單一商品系列可手動加入的商品數：官方未載明 ⇒ 不設上限，靠分頁與效能測試把關。⚠ V-59
  max_manual_items_per_collection: null

  # --- sources 模型（規格見 docs/specs/13 §F4；值域全文＝docs/research/95）-------
  # 🔴 官方已把 manual／smart 二分法標為 **legacy**。新模型是**來源（sources）**。
  #
  # 🔴🔴 2026-08-24 重大修正：本區塊原本抄的是 **help 頁的 UI 形態**（四型來源 × include/exclude 旗標），
  #      那與 **GraphQL 資料模型**不同。實測（94 §1.3）UI 下拉確實有四項，但 API 上
  #      products/variants 是同一型來源的 **targetType**、app 是 `CollectionSource.app` **欄位**。
  #      照 UI 形態建表會多出兩個不存在的維度、少掉 targetType 與 shareable 兩個真實維度。
  #      出處：docs/research/95 §1.1（2026-07，取證 2026-08-24）
  source_types: [conditions, sub_collections]        # ＝CollectionConditionsSource／CollectionSubCollectionsSource
  source_target_types: [products, variants]          # ＝CollectionSourceTargetType（僅 conditions 型適用）
  # include/exclude **不是 source 上的極性旗標**，而是 conditions source 內部的兩個區塊，
  # 各自帶 conditions ＋ matchType ＋ selections（手選與條件在**同一區塊內共存**，不是二選一）。
  source_blocks: [inclusion, exclusion]
  # 條件的邏輯連接（per block）：CollectionConditionMatchType，官方未提供混合或括號分組。
  condition_logic_modes: [all, any]
  condition_grouping_supported: false
  # 🔴 求值公式：**最終集 = ⋃ₛ ( inclusion(s) − exclusion(s) )**——排除**只在自己這個 source 內結算**。
  #    官方原文「evaluated per source and reconciled into the collection's final membership」。
  #    ⇒ A source 排掉商品 X、B source 包含 X ⇒ **X 仍在系列裡**。
  #    ⚠ 舊鍵 `source_precedence`（全域相減）與 V-57 已撤銷：V-57 的登記前提是「官方未載明
  #      exclude 與 include 的交互」，該前提已被上述原文推翻。全域相減是**靜默錯誤**——
  #      只在「A 排除、B 包含同一商品」的系列露餡，測試資料裡不會自然出現。
  membership_formula: union_of_per_source_inclusion_minus_exclusion
  verify_per_source_exclusion: true
  # 🔴 巢狀深度上限＝**1**，官方明載（SubCollectionIneligibleReason.CHAIN_REFERENCE：
  #    「The referenced collection itself owns a sub-collection source」）。⚠ 舊值 5 與 V-135 已撤銷。
  #    ⇒ 深度 1 之下環偵測退化成兩個謂詞（不得參照自己／被參照者不得自己擁有 sub-collection 來源），
  #      **`collection_graph_locks` 圖鎖表不必建**，用被參照列的 row lock 就擋得住併發成環。
  source_nesting_max_depth: 1
  sub_collection_ineligible_reasons: [self_reference, chain_reference, invalid_collection_reference]
  # 巢狀取的是來源系列的**最終成員**（＝它自己的 exclude 套用後的結果），不是候選集。（ours，13 §F4.5）
  nested_source_uses_final_membership: true
  # 🔴 exclusion 的條件集合是 inclusion 的**子集**（6 vs 19），且 `collection` 型**只在 exclusion 側**。
  #    ⇒ schema 不得用單一 field ENUM ＋ mode ENUM——沒有東西阻止在 exclusion 列寫 price。
  #    值域不是「有哪些欄位」，是「**哪個區塊有哪些欄位**」。全文＝docs/research/95 §1.2／§1.3
  exclusion_condition_types: [collection, product_category, product_tag, product_type, product_vendor, unknown]
  # 🔴 本尊在兩個 union 裡都放了一個顯式的 `...ConditionUnknown` 成員，讓舊客戶端遇到新條件型別
  #    不會炸。我方必須有等價物：不認識的條件型別**原樣保留**，不 reject、不丟棄。
  condition_unknown_passthrough: true
  # 🔴 column ↔ relation 的對應**不是靜態表**：本尊用執行期 query `collectionRulesConditions`
  #    回 allowedRelations／defaultRelation，因為 metafield 條件的關係集合依 metafield 型別逐筆而定。
  #    ⇒ 我方也要一支同語義的 API 給 admin SPA 動態渲染，前端**不得硬編對應表**。
  condition_relations_source: runtime_query

  # --- 標籤條件是集合運算，不是子字串（🔴 61 §4.2 C-6）--------------------------
  # `Product tag` 的運算子是 includes / does not include（集合），與字串類的 contains 是**不同東西**。
  # 實作成 LIKE '%red%' 會讓 `red` 誤中 `red-new`。出處：P24（help）
  tag_condition_operators: [includes, does_not_include]
  tag_condition_sql_form: exists_equality_on_tag_key    # 不是 LIKE
  # 字串類欄位（title／type／vendor／variant title）的 contains 才是子字串，用 LIKE，
  # 且 `%` 與 `_` 必須跳脫（商家輸入 `50%` 不跳脫會變成萬用字元）。（ours，13 §F4.3）
  string_contains_requires_wildcard_escape: true
  # 標籤正規化：官方明載 `red_new`／`red+new`／`red&new` 與 `red-new` 被當成**同一個標籤**。
  # 出處：help.shopify.com/en/manual/products/details/tags（P9，help）
  # 不做正規化 ⇒ product_tags 會出現兩列，條件比對結果與 Shopify 不一致（61 §10 C-7）。
  tag_normalize_before_write: true
  tag_normalize_equivalent_chars: ["_", "+", "&"]   # 全部映射到 "-"（官方明載）
  tag_normalize_to: "-"
  # 下列三步官方未載明，為本專案推導（13 §F4.4）：NFKC、連續分隔壓縮、大小寫摺疊。⚠ V-136
  tag_normalize_unicode_form: NFKC                  # ours
  tag_normalize_collapse_repeats: true              # ours
  tag_normalize_casefold: true                      # ours
  verify_tag_normalize_casefold: true
  # 🔴 正規化只有一處實作；DB **不得**再加自己的等價規則 ⇒ tag_key 欄位 collation 明文宣告 bin，
  #    不依賴 schema 預設（預設 collation 在 dev／prod 不同時會產生兩套比對行為）。
  tag_key_collation: utf8mb4_bin

  # --- 排序（P26 九種）----------------------------------------------------------
  sort_orders: [most_relevant, best_selling, alpha_asc, alpha_desc,
                price_desc, price_asc, created_desc, created_asc, manual]
  # 🔴「最暢銷」官方定義是**全期訂單數**。13 §F4 原寫「90 天銷量 rollup」＝我方自訂且與官方不同
  #    （61 §10 C-8），鐵律 7（數字同源）下會在分析頁與系列頁露餡。本輪改為全期。出處：P26（help）
  best_selling_window: all_time
  # 手動排序的移動操作。出處：P26（help）
  manual_move_actions: [move_to_front, move_to_back, move_to_position]

  # --- 第 11 包（D50）新鍵 ---------------------------------------------------------
  # contains／not_contains 的最小值長。官方逐字 "You need to specify a value that is at
  # least 3 characters long"（help /smart-collections/conditions，2026-08-25）。
  condition_value_contains_min_length: 3
  # 🔴 規則值上限＝欄寬（`collection_source_rules.value_text` varchar(255)）
  #   （2026-08-26 收斂輪 J1；ours——本尊未取得）。**必須有寫入層檢查**：少了它，
  #   >255 字的規則值讓 `create!` 拋 `ActiveRecord::ValueTooLong`（`StatementInvalid`
  #   子類、不在 SaveCollection 的 rescue 清單）⇒ 漏成 top-level INTERNAL、
  #   userErrors 為空，違反鐵律 4①。同 normalize 的 title／description／seo／handle
  #   都有上限，只有規則值沒有——與 F5→G3 同一個「只封被點名那幾格」形態。
  condition_value_max_chars: 255
  # 🔴 金額規則值的上界（2026-08-26 第六輪 K3；ours）。`value_cents` 是 BIGINT，
  #   而 `parse_money_for` 只擋格式與負數、不限位數 ⇒ 超大數在 `create!` 落庫時拋
  #   `ActiveModel::RangeError`——它**既不是** `ActiveRecord::StatementInvalid`
  #   **也不是** `ActiveRecordError`，所以連 GraphQL controller 的兜底 rescue 都接不到
  #   ⇒ 直接 500、userErrors 為空。這是 J1／J2「欄寬鏡射到寫入層」的殘留面：
  #   varchar 那兩格補了，同一個 normalize_rule 裡的 BIGINT 這格沒補。
  #   值＝BIGINT 上限（9223372036854775807）除以 100 再留一位安全邊際。
  condition_value_max_cents: 92233720368547758
  # 單一系列的來源數上限（ours；本尊未取得）。與 `max_rules_per_collection` 是兩件事：
  # 空來源不貢獻條件數，少了這一條就沒有任何東西擋得住無限量的 source 列（K6）。
  max_sources_per_collection: 10
  # 60 條上限的口徑：官方 "A single collection can have a maximum of 60 total conditions"
  # 傾向 per-collection；新模型 per-source 口徑未實測（P11-U18）⇒ fail-closed 取嚴的一側
  # （三道裁定 :289 的既定判準）。
  rule_limit_scope: per_collection
  # 超限舊系列可續用但不得再加條件。官方逐字 "If you already have a collection that has
  # more than 60 conditions, then you can still use it…you can't add any conditions when
  # it's over the limit."（/smart-collections/create，2026-08-25）。v1 整份取代語義下
  # 自然成立（超限的新輸入整份被拒），鍵先落供 UI 端引用。
  over_limit_grace_editable: false
  # inclusion 條件 19 型（95 §1.2；補齊「只有 exclusion 側落了鍵」的不對稱）。
  # 🔴 v1 引擎支援其中 10 型（RuleCompiler::INCLUSION_TYPES）；metafield **七型**與
  #    product_category 待 metafield／taxonomy 系統（寫入層拒收，登記於 dev doc）。
  #    算術：10（v1）＋7（metafield）＋product_category＋unknown＝19，與 95 §1.2 一致
  #    （95 §1.2 逐字：「19 種扣掉 7 個 Metafield* 與 Unknown」）。
  #    2026-08-26 收斂輪 H9：原文寫「六型」，被它自己下方的 value 列舉推翻（列了 7 個）。
  inclusion_condition_types: [metafield_boolean, metafield_decimal, metafield_integer,
                              metafield_metaobject, metafield_metaobject_list,
                              metafield_string, metafield_string_list,
                              product_category, product_status, product_tag, product_title,
                              product_type, product_vendor, unknown,
                              variant_compare_at_price, variant_inventory,
                              variant_price, variant_title, variant_weight]
  # rebuild 的商品 id 批次大小（ours：批間不持鎖、前台讀舊物化列——13 §F4.9）。
  rebuild_batch_size: 1000
  # rebuild 對 rebuild 的整程序列化（2026-08-26 審查 F2；ours——本尊內部排程不可觀測）：
  # advisory lock 等待預算與讓位後的重排延遲。
  rebuild_lock_wait_seconds: 60
  rebuild_lock_requeue_delay_seconds: 30
  # 🔴 compare_at 的 is_set 是 ALL-variants 語義。官方逐字 "all variants must have a
  # compare-at price value (including 0) for the product to match."（2026-08-25）——
  # 寫成 any-variant EXISTS 是靜默語義錯（研究 §9-5）。
  compare_at_is_set_variant_scope: all_variants
  # 數值/字串變體條件的比對基準＝任一變體。官方逐字 "the condition is true if any
  # variant matches the condition."（/collections/conditions，2026-08-25）——V-58 據此結案。
  variant_match_scope: any_variant

media:
  # 出處：docs/research/22:160（live）
  csv_max_upload_mb: 15
  # ── 第 24 包：媒體裁定 B6–B9 落鍵（整合規格 §5，2026-08-24）。B10（處理走 outbox）
  #    無 limits 鍵，落點＝第 25 包 event_deliveries。 ──
  # B6：儲存層＝自建 files/media 兩表＋presigned POST 直傳，不啟用 Active Storage
  #（AS 疊上去＝兩套真相；AS direct-upload routes 已刻意關閉；13 §F3 已加更正註）。（ours 裁定）
  storage_backend: self_hosted_presigned_post
  # B7：單檔上限的正典＝content.files_* 五鍵（本節不重複數字，只登記來源）。
  #    官方 help 逐字：「Maximum of 20 MB (megabytes)」「Maximum of 20 MP (megapixels)」
  #    「Between 100:1 and 1:100」「Maximum of 1 GB (gigabyte)」
  #    「Maximum video length of 10 minutes」「Maximum of 20 MB」（generic）。
  #    出處：help.shopify.com/en/manual/shopify-admin/productivity-tools/file-uploads
  #   （取證 2026-08-24）——limits 現值與官方一致，13 §F3 的 200MB/50MP 已加更正註。
  size_limit_source_keys:
    - content.files_image_max_mb
    - content.files_image_max_megapixels
    - content.files_video_max_gb
    - content.files_video_max_minutes
    - content.files_generic_max_mb
  # B8：撞名解法 enum＝官方三值照搬（shopify.dev enum
  #    FileCreateInputDuplicateResolutionMode：APPEND_UUID／RAISE_ERROR／REPLACE，
  #    取證 2026-08-24）。🔴 預設 append_uuid 是**我方裁定（ours）**——官方文檔未載明
  #    預設值；理由＝永不靜默覆蓋、永不因撞名失敗。
  duplicate_resolution_modes: [append_uuid, raise_error, replace]
  duplicate_resolution_mode_default: append_uuid
  # B9：本批可上傳型別（伺服器僅 libvips、無影片轉碼器）；影片/3D 上傳 UI 擋、
  #    外嵌 ExternalVideo＝第 37 包。（ours 裁定）
  upload_media_types_enabled: [image]
  # 媒體處理四態（第 26 包管線狀態機：uploaded→processing→ready／failed）。
  # 🔴 schema 現值 media.status default "ready" 與起點 uploaded 矛盾＝第 26 包
  #    migration 修（整合規格 §4-26），本鍵先立正典供 CI enum 對照。
  statuses: [uploaded, processing, ready, failed]
  # 第 25 包：staged 簽名有效期。🔴 官方簽名時長未明文（12 §D.7-2 ⚠、90 blueprint
  # Q-100 登記待查）＝本值是我方裁定（ours）：上傳窗 15 分鐘，逾期重簽。
  # alt 文字上限。官方 `FilesErrorCode.ALT_VALUE_LIMIT_EXCEEDED` 逐字：
  # "The alt value exceeds the maximum limit of 512 characters."
  # （<https://shopify.dev/docs/api/admin-graphql/latest/enums/FilesErrorCode>，取證 2026-08-25）
  # 🔴 D48 之後 alt 只有一份（`files.alt_text`），這個上限因此也只該有一份判準：
  #    原本 `MediaSync`／`FileCreate`／`FileWrite` 各自硬編 512（鐵律 6 違反），
  #    三處同時守同一欄卻各寫一份，改一處就漂移。
  alt_max_length: 512
  # 第 3 包：alt 來源稽核的值域（62 §F.1：AI 產生的 alt 要標來源）。
  # human＝後台人工輸入（現行全部寫入路徑）；ai／imported 的寫入者分別隨
  # AI alt 產生器與 CSV 匯入（M2）落地。null＝立欄前的存量（來源未知，不猜）。
  alt_sources: [ai, human, imported]
  staged_upload_ttl_seconds: 900
  # 第 28 包：staged 孤兒清掃的**寬限窗**（加在 ttl 之上才是刪除判準）。
  # 🔴 為什麼不能只用 ttl：簽名過期的那一刻，`Storage::FileCreate` 可能正在讀那份
  #    bytes——fileCreate 本身不驗簽（簽名是在上傳端點驗的），沒有寬限就是在別人
  #    讀到一半時抽掉檔案。3600 秒＝我方裁定（ours；官方對 staged 保留期未明文，
  #    本輪查證＝未取得），取「遠大於任何一次 fileCreate 的執行時間」而非精算值。
  staged_purge_grace_seconds: 3600
  # 檔名保留字尾（本尊的衍生圖尺寸後綴，撞名會蓋掉衍生圖；出處 12 §C.7:255，
  # 取證 2026-08-14）＋不得以 . 開頭＋HTML 一律拒收（同處）。
  filename_reserved_suffixes: [pico, icon, thumb, testing, small, compact, medium, large, grande]
  # 圖片 content-type 白名單（13 §F3-2 白名單去 mp4——B9 本批 image-only）。
  image_content_types: [image/jpeg, image/png, image/webp, image/gif]
  # fileCreate 單次批量上限。出處：12 §C.7:87（官方 ≤250 檔/次，取證 2026-08-14）；
  # content.files_upload_batch_max(20) 是 UI 單次選檔上限，兩者不同層。
  file_create_batch_max: 250

  # ── 第 37 包：外嵌 ExternalVideo（B9 的收斂面）。2026-08-25 取證。 ──
  # 🔴 `upload_media_types_enabled` **一個字都不動**：那是「可上傳」的型別，
  #    B9 的閘門（伺服器僅 libvips、無轉碼器）就靠它；外嵌不是上傳，另立一鍵。
  #    `MediaContentTypeEnum` ＝ upload ∪ embed 兩鍵聯集。（ours）
  embed_media_types_enabled: [external_video]
  # host 值域。官方 `MediaHost` enum 恰兩值且封閉，逐字：
  #   "VIMEO — Host for Vimeo embedded videos." / "YOUTUBE — Host for YouTube embedded videos."
  #   <https://shopify.dev/docs/api/admin-graphql/latest/enums/MediaHost>（取證 2026-08-25）
  # 🔴 型別名是 `MediaHost` **不是** `ExternalVideoHost`——後者不存在，憑印象寫會建出
  #    一個本尊沒有的型別。小寫存庫＝對齊 Liquid `external_video.host` 的值域，前台零轉換。
  external_video_hosts: [youtube, vimeo]
  # 平台影片 ID 的長度上界。🔴 **官方未載明**（YouTube 的「11 碼」是坊間說法、
  #    本輪取證＝未取得）⇒ 本值是 ours 的防呆上界，只擋異常長度，不作正確性判準。
  external_video_id_max_length: 32
  # origin URL 樣板。help 逐字兩形態："https://youtube.com/watch?v=[video-id]"、
  #   "https://vimeo.com/[video-id]"
  #   <https://help.shopify.com/en/manual/products/product-media/add-media>（取證 2026-08-25）
  external_video_origin_url_templates:
    youtube: "https://www.youtube.com/watch?v=%{id}"
    vimeo: "https://vimeo.com/%{id}"
  # embed URL 樣板。🔴 **序列化時導出、不落庫**：隱私決策會變，落庫等於改設定後舊資料
  #    還停在舊網域，要跑 data migration 才救得回來。
  #   youtube 的 privacy-enhanced 逐字＝只換網域："Change the domain for the embed URL in
  #     your HTML from https://www.youtube.com to https://www.youtube-nocookie.com."
  #     <https://support.google.com/youtube/answer/171780?hl=en>（取證 2026-08-25）
  #   🔴 vimeo 的 `player.vimeo.com/video/{id}` 形態**官方未取得**
  #     （developer.vimeo.com 是 JS 渲染頁，抓到的是空殼）⇒ 本值 ours 暫定，
  #     **第 33 包前台上線前必須補一輪取證**（未取得清單 U3）。
  external_video_embed_url_templates:
    youtube: "https://www.youtube-nocookie.com/embed/%{id}"
    vimeo: "https://player.vimeo.com/video/%{id}"
  # 隱私參數。vimeo `dnt` 官方逐字："Setting this parameter to 'true' blocks the player
  #   from collecting session data and analytics"；值域 "true, false OR 1,0"、預設 false
  #   <https://help.vimeo.com/hc/en-us/articles/12426260232977-About-Player-Parameters>（取證 2026-08-25）
  # 🔴 **文案紅線**：同頁逐字警告 "With DNT active, some essential cookies will still be
  #    active." ⇒ UI **不得**宣稱「零 cookie」。youtube-nocookie 官方整頁沒有任何 cookie
  #    敘述（本輪取證＝未取得），只宣稱不用於個人化 ⇒ 同樣不得寫成「不設 cookie」。
  external_video_privacy_enhanced: true
  external_video_privacy_params:
    youtube: {}
    vimeo: { dnt: "1" }
  # 外嵌是否計入 `product.max_media`（250）。🔴 **官方未取得**：250 的措辭是
  #   "a maximum of 250 images, 3D models, or videos"，但 dev 指南對 ExternalVideo
  #   另寫 "No limits (hosted externally)"，兩處官方未調和 ⇒ 本值 ours，取保守側。
  external_video_counts_toward_product_max_media: true
  # 外嵌不佔儲存配額。官方逐字："Doesn't count against shop's storage quota."
  #   <https://shopify.dev/docs/apps/build/online-store/product-media>（取證 2026-08-25）
  external_video_counts_toward_storage_quota: false
  # B 面閘門：oEmbed 可用性驗證與縮圖抓取。🔴 端點與回應形狀**本輪未取得**，
  #   取證前一律 false（false ⇒ `preview` 恆 null、建立即 ready）。
  #   🔴 沒有它，商家貼一支私人／已刪除的影片我方會**靜默接受**，前台才顯示錯誤
  #   ——這是本包與本尊最大的行為差距（本尊六個 EXTERNAL_VIDEO_* 錯誤碼正是為此存在）。
  external_video_oembed_enabled: false

# =============================================================================
# 9. 折扣（P0-03 相關上限）
# =============================================================================
discount:
  # 同時 active 的自動折扣上限（**全店口徑，不是每張訂單**；錯誤碼 ACTIVE_PERIOD_OVERLAP）。
  # 出處：46b:264（dev）。46c:688 寫「每張訂單」是 help 自身誤植（50 號表 3 T-09）。
  max_active_automatic_per_shop: 25
  # 每店累計唯一折扣碼數。出處：46b:265（dev）
  max_codes_per_shop: 20000000
  # 單一折扣碼可指定的顧客／商品／變體數。出處：46b:266（dev）
  max_entitlements_per_code: 100
  # 單次結帳可用碼數。出處：46b:267（dev）
  max_codes_per_checkout_product_and_order: 5
  max_codes_per_checkout_shipping: 1
  # 自動折扣可指定客群數／折扣碼可指定客群數。出處：46c:690–691（help）
  max_segments_per_automatic: 5
  max_segments_per_code: 100
  # 折扣 tags。出處：46b:268–270（dev）
  max_tags: 5
  tag_max_chars: 255
  max_tags_same_cart_line_plus: 10
  # 百分比值域為 0–1 Float（不是 0–100）；內部以 basis points（0–10000 整數）儲存，
  # 序列化除以 10000。出處：46b:189、46b:272（dev），46b §2⑥-2 建議。
  percentage_wire_range: [0.0, 1.0]
  percentage_storage: basis_points
  # combines_with 三旗標的預設值＝全 false（組合不會自動發生，商家須逐折扣開啟）。
  # 出處：46c:705（help）
  combines_with_default: false
  # 硬規則：運費折扣不可疊運費折扣（非 combinesWith 旗標可控）。出處：46b:285、46c:716（dev+help）
  shipping_plus_shipping_allowed: false
  # 草稿訂單折扣（71-R6，2026-08-13）：單張草稿可輸入碼數；不支援的碼型（運費碼/買X送Y碼）。
  # 自動折扣預設不套草稿、需明確勾選。出處：help create-orders/discounts（help）
  max_codes_per_draft_order: 5
  draft_order_unsupported_code_types: [free_shipping, bxgy]
  # 重新啟用已停用折扣＝回「使用中」且**不保留原結束日期**（需重設）。出處：help managing-discounts（help）
  reactivate_clears_end_date: true

# =============================================================================
# 10. 結帳／購物車／棄單
# =============================================================================
cart:
  # 加入購物車「總件數」上限（cart_item_limit），系統建議值 50。
  # 例外：POS／草稿單／B2B／不追蹤庫存的品項不受限。
  # 出處：44:378（live，modal 實測 stepper=50＋「您商店的建議上限為 50」）、24:230
  item_limit_suggested: 50
  item_limit_enabled_default: true
  item_limit_exempt: [pos, draft_order, b2b, untracked_inventory]
  # 單行數量上限與行數上限（本專案防呆，與 cart_item_limit 是不同概念，兩者並存）。
  # 出處：docs/specs/15:9（ours）
  max_quantity_per_line: 999
  max_lines: 100
  # 未動作的 cart purge 天數。出處：docs/specs/15:9（ours）
  purge_days: 90

abandoned_checkout:
  # 判定為棄單的門檻：**留下 email 後 10 分鐘未完成**（唯一權威門檻）。
  # 出處：44:373（live）、docs/research/22:60（live）。
  # 15:94 原寫「active 超過 1 小時」、三處門檻不一致，已統一至此值。
  qualify_after_minutes: 10
  # 棄單挽回信延遲四檔（小時），預設 10 且官方標「建議」。出處：44:373（live）、24:228
  recovery_delay_hour_options: [1, 6, 10, 24]
  recovery_delay_default_hours: 10
  # 寄送對象二選一。出處：44:373（live）
  recovery_audience_options: [any_incomplete_checkout, email_subscribers_only]
  # 棄單資料保留期。出處：docs/research/22:60、22:160（live）
  retention_days: 90

checkout:
  # 表單欄位三態。出處：46c:756–768（help）、44:369–371（live）
  field_visibility_modes: [hidden, optional, required]
  # --- 地址欄位形態：法域給**預設值**，商家逐市場覆寫（2026-08-12 使用者裁定）---
  # 使用者原話：「郵遞區號可以在後台設定是否需要強制．可以針對不同國家進行強制開啟．
  #              香港地區沒有就可以設定為不用填寫。」
  # 🔴 反面教材（本輪修正的就是它）：2026-08-12 上一輪把 HK 的郵遞區號欄**整欄拿掉**，
  #    理由是一條未查證的「香港不使用郵遞區號」。那等於把商家的設定權變成寫死的行為——
  #    商家連「我要收」都做不到。**法域預設值只是預設值**，商家一定要能覆寫。
  address_field_defaults_ref: jurisdictions.<code>.address
  address_field_modes_ref: checkout.field_visibility_modes      # 同一組三態，不另立值域
  address_field_merchant_override_allowed: true                 # 🔴 不得做成不可改
  address_field_override_scope: per_market                      # 「針對不同國家分別設定」
  address_field_override_storage: shops.settings JSON key `checkout.address_field.<market>.*`（19-F4 key 註冊表）
  # 商家未覆寫 ⇒ 取該市場法域 pack 的 `address.*`；pack 也沒宣告 ⇒ 取下方**已宣告的**核心 fallback。
  # 🔴 這個 fallback 是**寫出來的**，不是靜默預設（56 §0.2 原則 2）：地址欄位形態是表單形態
  #    不是法域能力閘門，所以它**不列入** `jurisdiction.required_capabilities`；相對地，
  #    fallback 一律取「不擋使用者」那一邊——未查證的格式規則不該擋人輸入。
  address_field_fallback:
    postal_code: optional          # 顯示、但不驗證、不阻擋
    postal_code_regex: null
    phone_enforcement: warn        # off | warn | block
    phone_regex: null
  # `hidden` 的語義：欄位不渲染且**不收集**，既有訂單快照裡的舊值仍保留（同 field_visibility_modes）。
  # `optional`：渲染、可空；有值且該市場有 regex 時才驗格式，失敗只提示不阻擋。
  # `required`：渲染、不可空；有 regex 時格式錯即阻擋送出。
  address_field_hidden_means_not_collected: true
  # 「要求登入」⇒ 強制 email 通道（欄位聯動硬規則）。出處：46c:756–768（help）、44:369（live）
  require_login_forces_email_contact: true
  # SMS 行銷同意永不可預先勾選。出處：46c:756–768（help）
  sms_consent_never_prechecked: true
  # 小費（tip）。出處：docs/research/22:180（live，「小費三檔%」）——**檔位的實際數值三方文檔皆未載明**。
  # 55 號盤點發現 15-F2 的 Result 結構沒有小費欄位（G-19）；小費是否計入發票金額亦未定義。
  tip_enabled_default: false
  tip_percent_options: null
  verify_tip_options: true

# =============================================================================
# 11. 地點／運送
# =============================================================================
location:
  # 地點配額（app 建立的地點不佔配額），頁面須顯示「已用 N / 配額 M」。
  # 出處：44:400（live）、docs/research/22:152（live）
  quota_basic_to_advanced: 10
  quota_plus: 200
  app_locations_count_toward_quota: false

shipping:
  # 運送設定檔：一般 1 ＋ 自訂 ≤99；預設設定檔的商品集合是「補集」。
  # 出處：46c:863（help）、44:513（live）
  general_profiles: 1
  max_custom_profiles: 99
  # 本地外送半徑上限與郵遞區號字數。出處：docs/research/22:150（live）
  local_delivery_max_radius_km: 160
  local_delivery_postal_codes_max_chars: 3000
  local_delivery_max_zones_per_location: 10

  # --- 跨設定檔合併運費（P1-23／原 NP0-F；完整公式與五個算例見 docs/specs/15 F2.1）---
  # 出處：46c:869–876（help，H42 zh-TW 逐字四條）：
  #   「名稱相同的運費費率會相加」／「若所有費率的名稱都不同，系統會將最便宜的選項相加」
  #   「（同一 location group 內多地點）系統會只收取一次單一費率」
  #   「重量制逐品項加上商店預設包裹重量後再相加，可能算出比單一設定檔更高的總額」
  #   46c:876 逐字：「費率名稱是**合併鍵**。名稱一字之差就會從『相加』變成『取最便宜相加』」
  rate_merge_key: rate_name                       # 合併鍵＝費率名稱（不是 rate id、不是 service code）
  rate_merge_participant_unit: profile_x_location_group   # 合併的最小單位，同 group 多地點只收一次
  rate_merge_no_common_name_strategy: sum_of_cheapest_per_participant
  # 名稱正規化規則：Unicode NFC ＋ trim，**大小寫敏感**。
  # ⚠ 46c 只說「名稱相同」，未定義正規化 → 以下為本專案決策，實作前查證（V-15）。
  rate_merge_key_normalization: nfc_trim_case_sensitive
  verify_rate_name_case_sensitivity: true
  # 無共同名稱時，合併選項對顧客顯示的名稱。⚠ 文檔未載明（V-15）。
  merged_option_fallback_label: "運費"
  # 重量制：每個 participant 各加一次商店預設包裹重量（這是 46c 說「可能更貴」的成因，不是 bug）
  weight_adds_package_weight_per_participant: true
  # UI 硬要求（46c:876 明確點名）：跨設定檔的近似但不相同名稱要出警示
  warn_on_near_duplicate_rate_names: true
  near_duplicate_edit_distance: 2
  # 官方合併顯示名＝字面 `Shipping`（85 §6，help combined-shipping-rates 逐字，2026-08-31）
  # ⇒ V-15 的「顯示名未載明」半格已關閉；merged_option_fallback_label 是我方繁中文案
  # （鐵律 10），語義對齊官方、字面不抄。正規化半格（大小寫敏感）仍 V。
  # --- 結帳線第二包（85 號實測正典，2026-08-31）---
  # 店預設包裹重量（克）：重量制 basis 的 per-participant 加項（46c:869–876）。
  # ⚠ 本尊 Settings→Packages「1 box」的具體重量本輪未展開量測（85 §1）→ 預設 0（V）。
  default_package_weight_grams: 0
  # split shipping 開關預設值（85 §5.3 admin「Manage split shipping [On]」；shops 欄位預設同源）
  split_shipping_default: true
  # 費率型別四值（85 §3 DOM 逐字 flat_rate/carrier/order_amount/weight；我方內部名
  # flat＝flat_rate；carrier 隨 58 物流商對接包，RateResolver v1 不產出 carrier 選項）
  rate_types: [flat, order_amount, weight, carrier]
  # transit 預設檔（秒制區間；85 §3 select value＝base64 JSON {min,max}）：
  # 1–2／3–5／5–8 個工作天；None＝雙 NULL；必填（85 §3「Transit time is required」）
  transit_presets_seconds: [[86400, 172800], [259200, 432000], [432000, 691200]]
  transit_required: true

  # --- zone ≠ market（P1-24／H-112）---
  # 出處：44:524（live，zone 頁黃色警示橫幅逐字「若要在此區域開始銷售至 27 個國家/地區，請將這些國家/地區加入市場」）
  # 兩個方向都要 guard：有 zone 不在 market → 不可販售；在 market 無 zone → 結帳運送階段擋。見 15-F2.2／29 §5。
  zone_requires_market: true

# 超商取貨／取貨點（P0-13）
pickup_point:
  # Shopify 側「其他配送方式」第三種（取貨點 / pickup points）。出處：44:322（live）
  # 🔴 本區塊只留**法域無關的機制鍵**；業者清單與合約值（COD 上限／材積／領件方式／離島規則）
  #    已搬到 `jurisdictions.<code>.pickup_networks`（搬移對照見 `jurisdiction._moved_keys`）。
  #    理由：台灣是 carrier==brand 兩層、香港是 carrier→network→brand 三層，硬塞同一個 `carriers`
  #    欄位會逼實作者二選一。核心只需要知道「這個市場有沒有取貨點、選了哪一個」。
  # pack 未宣告 `pickup_networks` ⇒ 該市場的「取貨點」配送方式**不出現**（不是出現但選不了）。
  capability_ref: jurisdictions.<code>.pickup_networks
  undeclared_action: hide_delivery_method

# 貨到付款（COD）代收手續費（P1-08／TW-7；金額引擎行項規格見 docs/specs/15 F2.3）
cod:
  # 🔴 手續費區間與「是否課稅」為法域值，已搬到 `jurisdictions.tw.cod`；
  #    「是否課稅」在 HK 為 **N/A**（無消費稅 ⇒ 沒有這個問題）。以下只留法域無關的機制鍵。
  # COD 上限比較的基數＝顧客實際要付的代收金額（含手續費），不是商品小計。
  # 用小計比較會讓 19,900 + 60 的單超出物流商上限而被退件。
  cap_compares_against: total_including_fee
  # 對帳匯入冪等鍵。出處：docs/research/42:542（ours）
  settlement_idempotency_key: [carrier, statement_id, row_no]
  # 金額不符時**不得**自動回寫 paid（現金流入口，差 1 元也不放行）。
  settlement_mismatch_action: hold_for_manual_review

# =============================================================================
# 11b. 物流商對接（carrier）——規格見 docs/specs/58-carrier-integration.md
# -----------------------------------------------------------------------------
# 🔴 **本區塊法域無關**。物流商「能做什麼」是廠商的 API 決定的，與法域無關；
#    物流商「在哪裡可用」才是法域的函數，那部分走 `carrier.packs.*.serviceable_lanes`
#    與 `jurisdictions.<code>.pickup_networks` 的交集（58 §H）。
#    **carrier pack 與 jurisdiction pack 正交，不得互相繼承、不得合併成一層。**
# =============================================================================
carrier:
  # --- 能力宣告的 fallback 契約（與 56 §A.3 同構；理由見 58 §A.3）---------------
  # 「未宣告」與「宣告不支援」在程式上長得一樣，但風險完全相反：
  #   supported: false ⇒ 有人想過，並決定了降級行為
  #   沒填            ⇒ 沒人想過 —— 靜默當成 false 就是把「還沒設計」偽裝成「已設計好的降級」
  undeclared_capability_action: reject
  allowed_fallback_actions: [reject, manual_queue, documented_no_op]
  silent_fallback_forbidden: true
  # 走了降級路徑一律落一列（「什麼都沒做」必須看得見）。與 jurisdiction_capability_skips 同理由。
  capability_skips_table: carrier_capability_skips

  # --- 十三項能力（58 §A.1）-----------------------------------------------------
  # required：對照組四家物流商全部具備、且形態一致的操作。
  #   「必宣告」不等於「必須支援」——寫 supported: false 也算宣告，但必須附 reason。
  #   K4 shipment_void 之所以在 required 裡：缺席它的後果是**財務性**的（背著「取了沒用的號要付錢」
  #   這個負債卻不自知），不是功能性的。
  required_capabilities:
    - rate_quote            # K1 運費試算
    - shipment_create       # K2 建立運單並取號
    - label_render          # K3 面單檔案產出
    - shipment_void         # K4 銷號（把號還回去）
    - shipment_cancel       # K5 取消運送安排
    - tracking_pull         # K6 主動查詢路由
    - tracking_push         # K7 路由推送（webhook）
  optional_capabilities:
    - pickup_schedule       # K8
    - cod                   # K9
    - customs_doc           # K10
    - service_point         # K11
    - address_validate      # K12
    - billing_reconciliation # K13

  # --- 每項能力的宣告欄位（CI-1 就是拿這張表去驗每個 pack）----------------------
  # 通則：每一項至少要有 `supported`（true/false，**不得為 null**）；
  #       supported: false 時 `reason` 必填非空（reason 會原樣顯示在 carrier 設定頁與降級處的 UI 文案，
  #       所以不得在前端硬編說明文字 —— 58 §B.2 通則 3）。
  capability_schema:
    _common: [supported, reason]
    rate_quote:      [currency_scope, includes_surcharges]
    # allocates_number：下單是否同時發號（多數如此）；
    # lookup_by_client_reference：能否用我方帶過去的識別回查 —— 為 false 時 unknown 一律進人工佇列，
    #   **不得假設查得到**（58 §F.4 前提 2）。
    shipment_create: [allocates_number, lookup_by_client_reference, max_packages_per_shipment]
    # formats/sizes 為離散值域：商家選了 pack 沒宣告的格式 ⇒ 設定期就擋（LABEL_FORMAT_UNSUPPORTED），
    # 不是等到列印時才失敗。billable_per_render 為 true 的 pack 需改走帶冪等 key 的批次作業（58 §E.3）。
    label_render:    [formats, sizes, reprint_allowed, billable_per_render]
    # 🔴 四欄缺一不可（58 §A.2 K4）：
    #    window_hours    —— 過期不是「還沒做」而是「做不到了」，人工處置不同
    #    frees_number    —— unknown 時一律不重用號碼
    #    billed_if_unused—— **這一欄只決定逾期未銷的告警等級，不決定銷號帳的存廢**（58 §D.5(a0)）：
    #      true  ⇒ P1 **成本／財務事故**（每一張都在燒錢）
    #      false ⇒ P3 **資料一致性事故**
    #      🔴 2026-08-12 第四輪改寫本行，原文為 `false ⇒ P3 資料清理`。順豐是本專案第一個 false 的 pack
    #         （SF-30／B-23），這一格從此會被真的讀到，而「資料清理」會害實作者以為 58 §D.5 的
    #         (b)/(c)/(e) 可以省略。**false 代表不會被收錢，不代表沒有後果**：那個號仍然存在於物流商
    #         系統、仍然不可回收（SF-14），仍可能在場景 4 變成同一張 FO 的第二張有效面單。
    #         ⇒ false 的 pack 一樣要跑閉環等式、一樣要有待銷號佇列。**不得改回。**
    shipment_void:   [window_hours, frees_number, billed_if_unused]
    shipment_cancel: [window_hours, refunds_freight]
    tracking_pull:   [supports_batch, max_numbers_per_call]
    tracking_push:   [push_verification, event_code_vocabulary]
    pickup_schedule: [min_lead_time_minutes, cancellable, charges_for_no_show]
    # effective_cod_max = min(carrier.cod.max_cents, jurisdictions.<buyer>.pickup_networks.cod_max_cents)
    # 任一為 null ⇒ reject，**不得當作無上限**（58 §A.2 K9）。
    cod:             [max_cents, currency, settlement_file_available, settlement_cycle_days]
    customs_doc:     [document_types, electronic_submission]
    service_point:   [network_brands, supports_locker]
    address_validate: [granularity]
    billing_reconciliation: [file_format, delivery_channel, cycle_days]

  # --- 金額（鐵律 3）------------------------------------------------------------
  money:
    storage: integer_cents
    # 物流商回的是十進位字串或 JSON number；一律 BigDecimal 解析，全程不經 Float。
    parse_from_carrier: decimal_string_only
    float_parsing_forbidden: true
    # 小數位超出 storage_multiplier 能表示的位數（＝2）⇒ raise，**不得 round**。
    # 吞掉它會讓對帳永遠差幾分錢卻查不出來（58 §G.3 規則 2）。
    round_forbidden: true
    # 🔴 換算尺度**一律 ×100，不看幣別**。依 `currency_display.storage_scale_unchanged`
    #    （2026-08-12 裁定）：儲存一律 integer cents ×100，ISO 4217 的 zero-decimal 幣別
    #    （JPY／TWD）同樣 ×100。物流商回 JPY "1000" ⇒ 100000。
    #    ⚠️ **不要**用 `jurisdictions.<code>.currency_format.exponent` 來換算——那一欄在同日的
    #    裁定後已改為**顯示位數**（TWD 由 0 改為 2），不再是 ISO minor unit。拿它當換算基數
    #    會在 zero-decimal 幣別上算出 100 倍誤差。
    storage_multiplier: 100
    storage_scale_source: currency_display.storage_scale_unchanged
    # 顯示位數同樣恆為 2（currency_display.force_minor_unit_digits），符號由市場 locale 決定。
    display_decimals: 2
    display_digits_source: currency_display.force_minor_unit_digits

  # --- 運單號＝不可回收的識別（58 §D.5，本檔最容易被漏掉的一節）------------------
  waybill:
    # 🔴 2026-08-12 第二輪順豐查證後改寫本區塊的立論。
    #    原鍵值為 `number_is_billable_resource: true`，註解為「取號＝向物流商借了一個有價的資源。
    #    借了不用要還；不還，物流商照樣計費。」—— 那是把**未查證的商業假設**寫成了跨物流商的事實斷言。
    #    順豐官方兩份 PDF 對「未使用之運單號是否計費」通篇沉默（58 §0.4 SF-15），且該問題屬月結
    #    合約條款，不在 API 文檔的涵蓋範圍內 —— 它不會因為多查幾個網頁而有答案。
    #
    #    改法：把「計費」降級為我方的**保守姿態**（policy_default），權威一律回到 pack 級的
    #    capabilities.shipment_void.billed_if_unused。留一個全域 true 會讓實作者以為這件事查證過了。
    #
    #    ⚠️ 但本區塊其餘規則**一條都沒放寬**，因為銷號帳換了一根更硬的樑：
    #    不是「號有價所以要記帳」，而是「**號不可回收**所以要記帳」——順豐官方明載訂單取消後
    #    客戶訂單號不得重複使用（SF-14）。就算查明未使用的號一毛都不收，場景 4（換物流商／換箱
    #    重取號）造成的仍是同一張 FO 掛著兩個都無法回收的識別 ＝ **資料正確性事故**，與計費無關。
    #
    # 🟢 **2026-08-12 第四輪：本鍵維持 policy_default，不因順豐的裁定而改。**
    #    使用者裁定「順豐取號未使用不計費」（SF-30／B-23）是**針對順豐這一家**的事實，
    #    **不是跨物流商的斷言** —— 它正好證明了本區塊第二輪的改法是對的：權威在 pack 級。
    #    ⇒ 順豐填 `packs.sf_express.capabilities.shipment_void.billed_if_unused: false`，
    #      全域姿態維持 policy_default（保守）。**不得把全域改成 false 去「簡化」**：
    #      那等於拿一家物流商的合約條款去替所有還沒查的物流商作答，是第二輪剛拆掉的那個錯誤的鏡像。
    number_is_billable_resource: policy_default
    number_is_billable_resource_authority: capabilities.shipment_void.billed_if_unused
    # 🔴 未宣告（null）**不得**當作 false —— 沉默不是否認（58 §A.3）。
    #    ⚠️ 順豐現在是 false，但那是**明示裁定**填進去的，不是「沉默 ⇒ false」推導出來的。兩者依據等級不同。
    billed_if_unused_null_means: unknown_blocks_pack_enable
    # 逾此時數仍在 ALLOCATED 且未交寄 ⇒ 自動銷號（有 K4）或入人工佇列（無 K4）。
    unused_void_after_hours: 24
    void_attempt_max: 3
    void_ledger_table: waybill_void_ledger
    reconcile_cron: daily
    # 閉環不變量：Σ ALLOCATED == Σ HANDED_OVER + Σ VOIDED + Σ 寬限期內 + Σ ABANDONED_UNRESOLVED
    # 且 Σ ABANDONED_UNRESOLVED 必須為 0；超過此門檻即告警（財務事故）。
    unaccounted_alert_threshold: 1
    # 同一張 FO 同時最多一張非終態運單。MySQL 8 無部分索引 ⇒ 以產生欄位 active_waybill_key
    # （非終態時＝fulfillment_order_id、終態時＝NULL）＋唯一索引實作（58 §D.5(b) 場景 4）。
    one_active_waybill_per_fulfillment_order: true
    non_terminal_statuses: [ALLOCATED, LABEL_RENDERED]
    terminal_statuses: [HANDED_OVER, VOIDED, ABANDONED_UNRESOLVED]

  # --- 面單（58 §D.2–§D.4）-----------------------------------------------------
  label:
    # 🔴 2026-08-12 第三輪（裁定二）：值域新增 `html`。原值域為 [pdf, zpl, png]，寫於「順豐面單格式未知」
    #    的時期。使用者選定的兩支面單介面是 COM_RECE_CLOUD_PRINT_WAYBILLS（→PDF，關聯 2024）與
    #    COM_RECE_CLOUD_PRINT_HTML（→HTML，關聯 2026，新介面）—— 順豐是**一種輸出一支介面**，
    #    不是同一支介面用參數切格式。html 因此成為第一個真的會被 pack 宣告的非 PDF 格式。
    #
    # 🔴 `zpl` 留在值域裡的理由也在同一輪被改寫（結論不變、理由整段換掉，58 §D.2）：
    #    ❌ 二輪的理由「順豐不支援 ZPL」是**錯的** —— 順豐有 COM_RECE_CLOUD_PRINT_COMMAND
    #       （雲打印面單轉指令接口，SF-27）。
    #    ✅ 現行理由：DHL／UPS／FedEx 原生支援，屬抽象層值域；而我方**首發不接指令流是範圍決策**，
    #       不是技術限制 —— 差別在於前者隨時可以加（加一支服務代碼），後者會讓人以為做不到。
    #    ⚠️ 順豐的「指令」未載明是 ZPL 還是 TSPL／CPCL（V-54）—— 要接之前先確認方言，不得假設。
    #    ⚠️ 值域裡有某個格式 **不等於** 任何 pack 宣告了它：pack 級的 label_render.formats 才是權威。
    formats_allowed: [pdf, html, zpl, png]
    # ZPL 是**指令流**不是圖片：原樣位元組保存，禁止任何轉碼或字串正規化，改一個位元組就印歪。
    # 規格先寫好、程式後做 —— 等第一個真的要用熱感標籤機的 pack 上線時再實作（58 §D.2 V-40）。
    zpl_byte_exact: true
    # --- html 面單的三條專屬規則（58 §D.2、§D.3；三輪新增）------------------------
    # 🔴 原樣保存、不得改寫 DOM／注入樣式或腳本。與 zpl_byte_exact 同一個理由，只是載體不同：
    #    ZPL 改一個位元組印歪，HTML 改一個節點就是**竄改面單內容**。
    html_dom_rewrite_forbidden: true
    # 🔴 HTML 面單來自外部系統，直接塞進 admin 的 DOM 等於把第三方 HTML 當自己的頁面執行。
    #    一律 sandbox iframe ＋ 不繼承 admin session。這是 pdf 沒有的風險，新增格式就要新增防線。
    html_render_sandboxed: true
    # 🔴 批次不得合併成單一 HTML：DOM 合併會破壞分頁與樣式 ⇒ 印出來的與物流商產出的不同 ＝ 等同竄改。
    #    要單檔就走 pdf；要 html 就逐張輸出。
    html_batch_merge_forbidden: true
    batch_max_per_call: 50
    batch_max_per_job: 500
    render_timeout_ms: 15000
    # 重印是內控關注點；沒有原因就無法查「為什麼這個倉庫每天重印 200 張」。
    reprint_requires_reason: true
    # 面單含收件人姓名／地址／電話 ⇒ PII。私有儲存 ＋ 簽名連結 ＋ 到期 purge（11 §0 維度 7）。
    signed_url_ttl_seconds: 900
    retention_days: 90

  # --- 運費試算（58 §A.1 K1、§I）-----------------------------------------------
  rate_quote:
    # 結帳期預算遠緊於後台：超時寧可降級也不能拖垮結帳 p95（11 §0 維度 4）。
    checkout_timeout_ms: 2000
    admin_timeout_ms: 8000
    # 降級是**已宣告**的行為，且必須落一列 carrier_capability_skips —— 不是靜默 fallback。
    on_timeout: fallback_to_static_rates
    cache_ttl_seconds: 300

  # --- 追蹤（58 §C.4）-----------------------------------------------------------
  tracking:
    poll_interval_seconds: 3600
    # 運單進終態後停止輪詢，否則每張歷史運單永久佔用配額。
    stop_polling_on_terminal: true
    # 物流商重送同一事件是常態，唯一索引去重，不得產生兩列時間軸。
    push_dedupe_key: [shop_id, carrier_code, waybill_number, carrier_event_code, carrier_event_at]
    # 驗簽失敗一律 401 且不落庫；未宣告驗簽方式的 pack 不得 enable（58 §C.4 第 2 點）。
    push_verification_required: true
    # 🔴 2026-08-12 第二輪查證：順豐官方規範對 RoutePushService **沒有定義任何驗簽欄位**
    #    （58 §0.4 SF-16）—— 也就是說「等查到驗簽方式」可能永遠等不到。因此處置改為：
    #    pack 必須在 carrier_signature / none 之間**明確二選一**，選 none 時補償控制為必填。
    push_verification_modes: [carrier_signature, none]
    # mode: none 時下列四項補償控制**缺一不可**，否則 pack 不得 enable（58 §C.4 第 2 點）。
    push_none_mode_required_controls:
      - per_shop_endpoint_token       # 不可猜測、可輪替
      - source_ip_allowlist           # 清單本身屬 carrier account 設定，非本檔常數
      - waybill_ownership_check       # 運單號必須已存在於該 shop_id 的 waybills，否則丟棄並記一列
      - tracking_only_no_side_effects # 推送只能推進追蹤時間軸，不得觸發金流或狀態機躍遷
    # 🔴 沒有簽章時，waybill_number 本身就是那個共享秘密（由物流商發放、不可預測、我方已知歸屬）。
    #    這不是強驗證，但它把攻擊面從「任何人可對任意租戶灌任意事件」縮到「必須先知道一個真實
    #    運單號才能對該運單灌事件」。必須寫成常數，否則實作者在沒有簽章可用時只會直接放行。
    push_source_ip_allowlist_required: true
    # 🔴 2026-08-12 第三輪新增（58 §C.4）：未知事件碼的 fail-safe。
    #    背景：順豐本輪宣告 tracking_push: false（6 支不含推送）⇒ V-47 的「驗簽」一問移出 gate。
    #    ⚠️ 但**事件碼值域的問題並沒有消失，它換到 K6 去了** —— EXP_RECE_SEARCH_ROUTES 拉回來的
    #       路由事件同樣帶操作碼，同樣要映射到我方的 fulfillment event 值域，而順豐官方**未列舉**
    #       操作碼（SF-17，只給示例 50／922，不得當值域）。
    #    處置：未在 pack 映射表內的事件碼 ⇒ ①照樣入時間軸（顯示原始文字，不丟事件）；
    #          ②不得映到任何終態；③**絕對不得**推導出 DELIVERED 或 READY_FOR_PICKUP
    #          （「到店領取 ≠ 已送達」在未知碼上更危險，因為猜錯的方向通常是「看起來像送達」）；
    #          ④未知碼比例進 dashboard —— 比例上升代表物流商改了值域。
    unknown_event_code_action: timeline_only_no_state_change

  # --- 出貨編排（58 §F）---------------------------------------------------------
  shipment_intent:
    settle_timeout_ms: 20000
    unknown_reconcile_after_seconds: 60
    unknown_reconcile_max_attempts: 10
    poll_backoff_seconds: [5, 15, 60, 300, 900]
    # 🔴 本檔最重要的一條：逾時／連線中斷（unknown）**禁止自動重試**。
    #    逾時不代表沒發生 —— 順豐官方自己就把查單介面定位成回應遺失時的補救手段（58 §0.4 SF-6）。
    #    自動重試一個可能已成功的取號請求 ⇒ 兩張運單、兩筆運費，其中一張永遠不會被使用也不會被銷號。
    auto_retry_on_unknown_forbidden: true
    # unknown 只能靠回查解開；回查需要下單時帶我方唯一識別（＝shipment_intent id，不是 order name
    # 也不是 FO id —— 同一張 FO 可能有多個 intent，用 FO id 回查會撈到舊的）。
    reconcile_reference_source: shipment_intent_id
    # 🔴 2026-08-12 第二輪查證新增（58 §D.5(f)，出處 SF-14）：
    #    順豐官方明載「訂單取消之後，客戶訂單號也是不能重複利用的」。這打穿一個很自然的直覺：
    #    「這單失敗了，用同一個單號重試一次」。送給物流商的 client_reference 一律用後即棄 ——
    #    同一個 intent 重試沿用同一識別；intent 落 FAILED 或運單被 void ⇒ 必須開新 intent、換新識別。
    #    ⚠️ 這與 idempotency_key 是**兩件事**：idempotency_key 擋「同一次請求送兩遍」，
    #       本鍵擋「**不同次**請求想借用同一個識別」。58 §E.2 的兩層模型各管各的。
    #    DB 兜底：(shop_id, carrier_account_id, client_reference) 唯一索引，重用即撞索引。
    client_reference_reuse_forbidden: true
    client_reference_unique_key: [shop_id, carrier_account_id, client_reference]

  # --- 節流與熔斷（58 §F.5）-----------------------------------------------------
  # 順豐官方兩份 PDF 均未載明限流／QPS（58 §0.4 SF-7 → V-46）⇒ 客戶端自我節流取保守值，
  # **不假設物流商端無限制**。各 pack 可在 packs.<code>.client_qps 覆寫。
  client_qps_default: 5
  circuit_breaker:
    # 熔斷粒度為 (shop_id, carrier_account_id) —— 不是 per carrier_code。
    # 一個租戶的憑證失效不該影響其他租戶。
    scope: [shop_id, carrier_account_id]
    error_rate_threshold_bp: 5000
    window_seconds: 60
    open_seconds: 120
    half_open_probes: 3
    # 🔴 熔斷時**不得**自動改用另一家物流商 —— 那是靜默 fallback，會產生商家沒同意的運費。
    auto_failover_to_other_carrier_forbidden: true

  # --- 憑證（鐵律 2 ＋ 11 §1；58 §G.2）------------------------------------------
  credentials:
    storage: active_record_encryption
    plaintext_forbidden: true
    # 秘密欄位一律 non-deterministic 加密；需查詢的識別另存不敏感 label 供顯示（只顯示末四碼）。
    secret_fields_deterministic_forbidden: true
    # 單一事實來源：config.filter_parameters、錯誤上報過濾、CI grep 三處共用這份清單。
    log_filter_keys:
      - checkword
      - check_word
      - msg_digest
      - msgDigest
      - client_secret
      - api_secret
      - access_token
      - refresh_token
      - partner_id
    # 🔴 Solid Queue 的 job 參數會落 DB 明文 ⇒ job 只帶 carrier_account_id，
    #    由 adapter 執行時自行解密取用。把憑證塞進 job payload 等於在 solid_queue_jobs 存明文憑證。
    job_payload_forbidden_keys: [checkword, check_word, client_secret, api_secret, access_token, refresh_token]
    environment_enum: [sandbox, production]
    cross_environment_use_forbidden: true

  # --- pack 註冊表與 enable gate（58 §H.4）--------------------------------------
  # enabled ⟺ ① K1–K7 全部有非 null 的 supported ∧ ② supported:false 者有非空 reason
  #          ∧ ③ enable_gate 為空 ∧ ④ credential_schema 非空且已通過 carrierAccountTest
  # 🔴 enable_gate 非空 ⇒ enabled 必須為 false（CI-2）。
  #    本輪唯一可 enable 的是 manual —— 這是規格刻意的結果，不是缺漏：沒查證完就上線才是缺漏。
  packs:
    manual:
      display_name: 手動出貨
      enabled: true
      enable_gate: []
      # 十三項全部宣告 supported: false ＋ reason ⇒ 通過 gate。
      # 它不是玩具：是所有 carrier 尚未接通時的正式營運路徑，也是任何 carrier 故障時的降級目的地。
    sf_express:
      display_name: 順豐速運
      enabled: false
      # 出處：docs/specs/58 附錄 A（2026-08-12 **第三輪**使用者裁定後更新）。
      #   V-39 面單欄位／模板／尺寸（**格式已定案為 [pdf, html]，不再是缺口**）
      #   V-41 逐介面欄位表（**目錄層已取得**，剩欄位表 —— 沒有它組不出任何請求）
      #   ~~V-42 銷號計費／時間窗／mailno 是否回收（合約問題，不會由任何文檔回答）~~
      #        🟢 **四輪已結案並移出 gate**（使用者裁定 A-2「不會計費」，SF-30／B-23）—— 詳見下方。
      #   V-51 msgDigest 簽章演算法（🔴 **第一號阻塞項：算不出簽章＝一個請求都送不出去**）
      #
      # 🔴 第二輪值為 [V-39, V-41, V-42, V-43, V-44, V-47, V-48, V-51]（8 項），本輪移出 4 項：
      #   移出 V-43／V-44 —— **裁定一**：使用者已實際以香港為發貨地開發過（58 §0.4 SF-25）。
      #     二輪從「丰橋公開文檔全篇以內地為寄件地」推出「香港不能當 origin」，那是**從文檔缺席
      #     推得的否定結論**，權威性低於一手實作經驗。缺的只剩 express_type **數值** ⇒ 閘門**下移到
      #     lane 級**（service_code: null ⇒ 該 lane 不可選），不再鎖整個 pack。**用最小的鎖，鎖最小的範圍。**
      #   移出 V-47／V-48 —— **裁定二**（範圍決策）：6 支不含路由推送、不含 COD ⇒ K7／K9 宣告
      #     supported: false ＋ reason。V 編號是用來擋「**不知道**會做錯事」的，不是用來擋
      #     「**我們決定不做**這件事」；宣告完整就通過 58 §A.3。
      #     ⚠️ 但移出時要檢查問題有沒有換一個入口回來 —— V-47 的「事件碼值域」就換到 K6 去了，
      #        以 carrier.tracking.unknown_event_code_action 的 fail-safe 接住。
      #
      # 🔴 **本輪的新資訊完全沒有觸及 V-51 與 V-42** —— gate 從 8 項減到 4 項，第一號阻塞項一動也沒動。
      #    **gate 的長度不代表嚴謹度**，內容才是。
      # 🔴 **V-42 是唯一不會自己結的一項**，它的出口只有兩條（58 §H.4）：①順豐月結／商務窗口的**書面**
      #    回覆；②一個**明示接受人工銷號營運成本的營運裁定**（工程不得自決 —— 那換來的不是技術風險，
      #    是每天要有人去看待銷號佇列的人力承諾）。
      #
      # 🟢 **2026-08-12 第四輪：V-42 已結案並移出 gate（4 項 → 3 項）。** 走的是上面第 ② 條出口：
      #    使用者裁定 A-2 逐字「不會計費」（58 §0.4(e) SF-30、附錄 B B-23）
      #    ⇒ capabilities.shipment_void.billed_if_unused: false（見下方 K4 格）。
      #    第三輪值為 [V-39, V-41, V-42, V-51]。
      #    ⚠️ **只答了三問中的第一問**：銷號時間窗（window_hours）與 mailno 是否回收（frees_number）
      #       使用者未裁定、官方仍沉默 ⇒ 兩者維持 null ⇒ **號碼一律不重用**、取消成功仍不得寫成 VOIDED。
      #    🔴 **防回退**：不得把 V-42 加回 gate。它是以**明示裁定**結案的（依據＝B-23），不是以推論結案；
      #       若日後書面回覆與裁定不符，正確做法是**新登記一個 V 編號**並改 58 §D.5(d) 的告警等級，
      #       **不是**復活 V-42 —— V 編號一旦以明示裁定結案就不再重開，否則 gate 會變成一本翻不完的舊帳。
      #
      # 🔴 **剩下的三項全部是「文檔在牆後面」，沒有一項是「答案不存在」** —— 拿到丰橋帳號的文檔中心
      #    存取權當天即可全數結案、gate 歸零。這是本 pack 投報率最高的一步（開放決策 A-4）。
      #    而 V-51 到第四輪依然一動也沒動：**gate 從 8 項縮到 3 項，第一號阻塞項四輪未變。**
      enable_gate: [V-39, V-41, V-51]
      # ✅ V-38 已結案（2026-08-12，DNS）：官方 SDK PDF 印的 sfexpress.com（無連字號）**無 A 記錄**，
      #    連 apex 都沒有；sf-express.com（有連字號）才正確。官方 PDF 這一處是錯的或已過期。
      endpoints_verified: true
      endpoints:
        sandbox: https://sfapi-sbox.sf-express.com/std/service
        production: https://sfapi.sf-express.com/std/service
      # 🔴 仍不讓商家自填 base_url —— 設定期由下拉選單選，避免打錯字打到別人的主機。
      base_url_freeform_allowed: false
      # --- 對接範圍：使用者裁定的 6 支服務代碼（58 §0.4(e) SF-26；三輪新增）--------
      # 🔴 這是**範圍裁定**，不是順豐能力的全集。順豐還有很多介面（見 SF-28 的目錄），
      #    但我方這一輪只接這 6 支 —— 能力矩陣（58 §B.1）的每一個 supported: true 都必須
      #    在這張表裡找得到支撐它的服務代碼，找不到的一律宣告 supported: false ＋ reason。
      # 🔴 CI-8：①supported: true 的能力，其實作只能呼叫 api_scope 內的服務代碼；
      #          ②api_scope 內的每一支都必須被至少一項能力（或 §F.4 回查）引用。
      #          「宣告了一個沒接的能力」與「接了一支沒人用的介面」都是 build fail。
      # ⚠️ 報文格式全部 JSON ⇒ 走新世代 /std/service 信封（SF-2 六欄），**不是**舊世代 XML（SF-5）。
      #    舊世代欄位名（orderid／mailno／dealtype／express_type）只作語義說明，**不得**當成新世代
      #    JSON 的欄位名寫進實作 —— 新世代欄位表仍未取得（V-41）。
      api_scope:
        - service_code: EXP_RECE_CREATE_ORDER
          name: 下訂單接口
          category: 速運API
          payload_format: json
          status: 已上線
          capability: shipment_create        # K2
        - service_code: EXP_RECE_SEARCH_ORDER_RESP
          name: 訂單結果查詢接口
          category: 速運API
          payload_format: json
          status: 已上線
          capability: shipment_create_reconcile  # 非獨立能力鍵：58 §F.4 的 UNKNOWN 回查
        - service_code: EXP_RECE_UPDATE_ORDER
          name: 訂單取消接口
          category: 速運API
          payload_format: json
          status: 已上線
          capability: shipment_cancel        # K5
          # 🔴 官方目錄頁的名稱是「訂單確認/取消接口」，使用者截圖的名稱是「訂單取消接口」——
          #    同一支多用途，兩者不衝突（舊世代對應 OrderConfirmService 的 dealtype ∈ {1 確認, 2 取消}）。
          #    **我方只用「取消」用途，不使用「確認」用途**（58 §0.4 SF-29、§D.5(h)）。
          usage: cancel_only
          confirm_usage_forbidden: true
        - service_code: EXP_RECE_SEARCH_ROUTES
          name: 路由查詢接口
          category: 速運API
          payload_format: json
          status: 已上線
          capability: tracking_pull          # K6
        - service_code: COM_RECE_CLOUD_PRINT_WAYBILLS
          name: 雲打印面單轉PDF接口
          category: 基礎通用API
          payload_format: json
          status: 已上線
          associated_year: 2024
          capability: label_render           # K3（pdf）
          label_format: pdf
        - service_code: COM_RECE_CLOUD_PRINT_HTML
          name: 雲打印面單轉HTML接口
          category: 基礎通用API
          payload_format: json
          status: 已上線
          # 🔴 關聯日期 2026 ⇒ **新介面**。不得假設它與 2024 的 PDF 那支同構（欄位表、模板代碼、
          #    錯誤碼都要各自覆核）；沙箱開通狀態常晚於目錄的「已上線」標示 ⇒ carrierAccountTest
          #    必須逐格式各測一次。若實作期發現未開通 ⇒ formats 縮回 [pdf]（宣告變更，不是靜默降級）。
          associated_year: 2026
          capability: label_render           # K3（html）
          label_format: html
      # --- 十三項能力宣告的鏡像（權威在 pack 程式碼的 self.capabilities；此處供 CI-1／CI-8 對照）---
      # 🔴 兩處必須一致，drift 即 build fail —— 這張鏡像的用途是讓「規格說接 6 支」與「程式碼真的
      #    只接 6 支」對得起來，不是第二個事實來源。
      # 值域說明：supported: true ＝ 由 api_scope 內的服務代碼支撐；
      #           supported: false ＋ reason ＝ **我方決定不做**（範圍決策／合約未確認），
      #           **不代表順豐沒有這個能力** —— 58 §B.1 的 ⛔ 與 ❌ 必須分開，混用會讓後人以為做不到。
      capability_declarations:
        rate_quote:                       # K1
          supported: false
          reason: "對接範圍不含 EXP_RECE_QUERY_SFWAYBILL；且其官方名稱為「清單運費查詢」（對已產生的運單清單查費），語義本就不等於下單前試算。降級走 15 的靜態運費表，結帳頁不得出現「即時運費」字樣"
        shipment_create:                  # K2
          supported: true
          service_code: EXP_RECE_CREATE_ORDER
          # 下單同時發號：舊世代語義如此（回應帶 mailno，SF-14），新世代欄位表待覆核（V-41）。
          allocates_number: true
          # ✅ 可用我方帶過去的識別回查（58 §F.4 前提 2）：回查介面 EXP_RECE_SEARCH_ORDER_RESP 在
          #    api_scope 內，且順豐的去重鍵就是 orderid＝我方 client_reference＝shipment_intents.id
          #    （V-49 已結案）。⇒ UNKNOWN 可自動回查，不必一律進人工佇列。
          lookup_by_client_reference: true
          # ⚠️ null：單張運單的最大包裹數未取得（V-41）。**不得**拿 documented_limits 的
          #    sub_waybill_max_parcel_quantity（子母件子單號上限 20）來充數 —— 那是子單號申請的上限，
          #    語義不同，混用會在邊界上錯得很安靜。
          max_packages_per_shipment:
        label_render:                     # K3
          supported: true
          # 🔴 formats 本輪由 null 改為 [pdf, html] —— 兩支專屬介面，一種輸出一支（SF-26）。
          formats: [pdf, html]
          # ⚠️ sizes 仍是 null：模板代碼與尺寸值域**官方未取得**（V-39）。第三方 1.0 版的疑似值
          #    （100×150／100×180／100×210／76×130 等）**不得**寫進來 —— 面單尺寸不對，物流商可拒收。
          sizes:
          # ⚠️ 兩者皆 null（V-39）。保守處置（58 §D.4、§E.3）：
          #    reprint_allowed 未知 ⇒ 重印一律留痕 ＋ 必填原因（全域 reprint_requires_reason 已為 true）；
          #    billable_per_render 未知 ⇒ **比照 true 處置**：渲染一律走帶冪等 key 的批次作業，
          #    不得做無節制的自動重渲染。沉默不是否認。
          reprint_allowed:
          billable_per_render:
        shipment_void:                    # K4
          supported: false
          reason: "順豐的取消介面取消的是**訂單**，其對運單號（mailno）的**回收**效果官方通篇沉默（SF-15）。我方不宣稱線上銷號能力：逾期未交寄一律進 VOID_MANUAL_REQUIRED 人工佇列（58 §D.5(g)(h)）"
          # ⚠️ 兩者仍為 null：可銷號時間窗與 mailno 是否回收，官方沉默且**使用者未裁定**（V-42 三問只結了第一問）。
          #    ⇒ 號碼一律不重用（carrier.shipment_intent.client_reference_reuse_forbidden）；
          #    ⇒ K5 取消成功**不得**把運單寫成 VOIDED（58 §D.5(h) 規則 1）。
          window_hours:
          frees_number:
          # 🟢 2026-08-12 第四輪：由 null 改為 false。
          #    依據＝**使用者裁定 A-2 逐字「不會計費」**（58 §0.4(e) SF-30、附錄 B B-23），
          #    屬 58 §0.3 第四輪新增的 `user-ruling` 第二類「**營運／合約裁定**」：
          #      ①該值確認不在 API 文檔涵蓋範圍內（屬月結合約，SF-15 已確認）；
          #      ②合約當事人是使用者本人，不是我方 agent；
          #      ③它只影響**告警等級**，不影響任何機制的存廢。
          #
          # 🔴 **這不是「沉默當否認」。** 58 §D.5(d) 原本那句「不得因為官方沒說會收錢就填 false ——
          #    沉默不是否認」**一個字都沒有被推翻**：我方填 false 的依據是**明示裁定**，不是文檔的沉默。
          #    下一個人若看到這個 false 就以為沉默可以當否認，那是誤讀 —— 請回頭讀 58 §0.3。
          #
          # 🔴 **false 只降告警等級（P1 成本事故 → P3 資料一致性事故），不拆任何機制。**
          #    58 §D.5 的 (b) 五個場景、(c) 閉環不變量、(e) 待銷號佇列、(f) 識別不重用 —— **一條都沒拿掉。**
          #    因為銷號帳的樑早在第二輪就從「號有價」換成「**號不可回收**」（順豐官方明載訂單號取消後
          #    不可重複使用，SF-14）：場景 4（換物流商／換箱重取號）造成的是**同一張 FO 掛著兩個都無法
          #    回收的識別** ⇒ 倉庫會有**兩張面單對得上同一批貨，拿哪一張都看起來對**。
          #    **那是資料正確性事故，與計不計費完全無關 —— 順豐一毛不收，倉庫照樣拿錯面單。**
          billed_if_unused: false
          # 🟢 由 p1_platform_ops_only 改為 p3_data_consistency_platform_ops_only（58 §D.5(d)）。
          #    等級 P1 → P3：不燒錢了，急迫性下降，可以排隊處理。
          #    類別「成本／財務事故」→「**資料一致性事故**」：🔴 **不是「資料清理」** ——
          #      逾期未銷的號不能被「清理」掉，只能被「結案」掉（要有人確認那張運單究竟出了什麼事）。
          #    通知對象不變（僅平台營運、不通知店主），而**理由從頭到尾與計費無關**：
          #      我方尚未提供線上銷號，店主收到也無從處置，**無法行動的告警只會訓練人忽略告警**。
          # ⚠️ 本值的成立前提是 58 §D.5(e) 的待銷號畫面**真的有人在看**。P3 ＋ 沒有畫面 ＝ 風險被藏起來，
          #    比什麼都不記還糟 —— 因為 (c) 的閉環等式會一直「表面上是平的」。
          unbilled_overdue_alert: p3_data_consistency_platform_ops_only
        shipment_cancel:                  # K5
          supported: true
          service_code: EXP_RECE_UPDATE_ORDER
          # ⚠️ 兩者皆 null：可取消的時間窗與取消是否退運費，官方未載明（與 V-42 同一片沉默）。
          #    window_hours 為 null ⇒ **不得**在 UI 上宣稱「N 小時內可取消」；一律試了才知道，
          #    回 8019 即視為 too_late。
          window_hours:
          refunds_freight:
          # 二次取消回 8019 ⇒ too_late（狀態衝突，非拒絕），見 error_code_outcome_map。
          # 🔴 取消成功**不得**把運單標成 VOIDED —— 那是用技術事實冒充財務事實（58 §D.5(h) 規則 1）。
          on_success_waybill_status: VOID_MANUAL_REQUIRED
        tracking_pull:                    # K6
          supported: true
          service_code: EXP_RECE_SEARCH_ROUTES
          supports_batch: true
          # 舊世代 RouteService 明載 ≤10（SF-18）；新世代上限未確認 ⇒ 取舊世代的保守值。
          max_numbers_per_call: 10
        tracking_push:                    # K7
          supported: false
          reason: "對接範圍不含路由註冊／推送介面 ⇒ 追蹤一律走 K6 輪詢（carrier.tracking.poll_interval_seconds）。⚠️ 輪詢的代價：追蹤延遲上限＝輪詢間隔，且每張未終態運單都在消耗未知的配額（V-46）⇒ stop_polling_on_terminal 從最佳化升級為必要條件"
        pickup_schedule:                  # K8
          supported: false
          reason: "對接範圍不含取件相關介面"
        cod:                              # K9
          supported: false
          reason: "對接範圍不含任何 COD 介面；且香港 COD 的可用性與上限屬合約（V-48，仍登記但不擋 gate）。COD × 順豐的組合在結帳頁不出現，不是出現後才在提交時報錯"
        customs_doc:                      # K10
          supported: false
          reason: "對接範圍不含報關文件介面；且新平台把「國際件」列為獨立頂層分類，與舊世代「國際件與國內件同用 OrderService」的敘述未對齊（V-53）。⇒ 依 58 §H.2 關卡 1，跨境 lane 判不可服務"
        service_point:                    # K11
          supported: false
          reason: "對接範圍不含網點查詢（EXP_RECE_QUERY_GIS_DEPARTMENT）"
        address_validate:                 # K12
          supported: false
          reason: "對接範圍不含地址驗證。⚠️ COM_RECE_QUERY_ADDRESS_BOOK_NEW 是「地址簿查詢」不是「地址驗證」，語義不同，不得拿來充數"
        billing_reconciliation:           # K13
          supported: false
          reason: "對接範圍不含對帳檔介面 ⇒ 58 §D.5(c) 的外部閉環驗證改為人工（待銷號佇列的人工登記不是可選步驟）"
      # --- 可服務航線（58 §H.2、§H.5）----------------------------------------------
      # 🔴 2026-08-12 第三輪（裁定一）：本鍵原為空陣列 []，理由是「連香港商戶能不能用丰橋都還沒
      #    確認（V-43）」。**該理由已作廢** —— 使用者逐字：「香港地區可以作為發貨地。已經成功開發過。」
      #    我方二輪是從「公開文檔沒寫」推出「做不到」，那是**從缺席推得的否定結論**，權威性低於
      #    使用者的一手實作經驗（58 §0.3 的 user-ruling 等級）。**文檔取樣的缺口不等於產品的缺口。**
      #
      # 🔴 但界線必須守住：**被推翻的是可行性，不是參數值。** 我方仍未親眼見到香港 origin 的服務
      #    代碼數值（V-44）⇒ 每條 lane 的 service_code 一律 null，**不得憑空編一個數值**。
      #    憑空編的代價不是被拒單（那是好的情況），是**下成別的產品類別、按別的費率計費，
      #    而且看起來一切正常**。
      serviceable_lanes:
        # ① 香港本地。首發要點亮的就是這一條。
        - origin_country: HK
          destination_country: HK
          display_name: 香港本地
          cross_border: false
          requires_customs_doc: false
          service_code:                   # ⚠️ null：express_type 數值待實作期以帳號實測填入（V-44）
        # ② 香港出境。**目的地尚未逐一登錄**（B-19 稱 40＋ 目的地含澳門、台灣，我方未取得完整清單）。
        #    🔴 destination_country: null **不是萬用字元** —— 它不命中任何目的地，因此這條 lane
        #       目前不會讓任何跨境服務出現在結帳頁。這是**正確的失效方向**（58 §H.2 ①）。
        #    另有兩道獨立閘門同時擋著：customs_doc 宣告 false（§H.2 關卡 1）、service_code 為 null。
        - origin_country: HK
          destination_country:
          display_name: 香港出境（目的地清單待登錄）
          cross_border: true
          requires_customs_doc: true
          service_code:
      # 🔴 CI-9：service_code 為 null 的 lane **不得對外可選**（結帳頁不出現、後台下拉不出現），
      #    觸及時回 CARRIER_LANE_NOT_SERVICEABLE。
      #    這條規則就是「可行性已確認、參數未確認」的正確表達方式：事實照寫（HK 可作 origin），
      #    但**閘門開在最小的範圍**（單一 lane），而不是把整個 pack 鎖死。
      lane_requires_service_code: true
      # --- 官方明載的分批上限（58 §0.4 SF-18；鐵律 6：不得硬編）------------------
      # ⚠️ 這些是**分批上限**，不是**速率上限**。順豐官方兩份 PDF 對 QPS／日配額通篇未載明
      #    （SF-7，V-46 仍開）⇒ 速率仍走 carrier.client_qps_default 的保守自我節流。
      #    兩者不可互相替代：分批對了不代表不會被限流。
      documented_limits:
        order_filter_max_elements: 5          # OrderFilterService
        route_query_max_tracking_numbers: 10  # RouteService
        route_push_max_elements: 10           # RoutePushService
        route_label_batch_max: 100            # RLS 路由標籤批次，超過回錯誤碼 0003
        sub_waybill_max_parcel_quantity: 20   # OrderZDService parcel_quantity
        order_create_batch_supported: false   # OrderService 明載不支援批次
      # --- 原始錯誤碼 → 我方四值 outcome 的映射（58 §E.2；pack 級，不進核心）-----
      # 🔴 8016（重複下單）必須映射成 unknown 而非 business_rejected。
      #    順豐以 orderid 去重，且**回錯誤不回放原結果**（錯誤報文不夾帶 mailno），所以收到 8016
      #    只證明「這個 orderid 已被受理過」，不證明「上一次拿到了什麼號」。
      #    當成 business_rejected ⇒ intent 落 FAILED，但順豐那邊其實已經有一張運單，且因為
      #    orderid 不可重用（SF-14），這張運單再也接不回任何 intent，直接變成 ABANDONED_UNRESOLVED。
      #    這張表每一列都必須有測試（58 §K 維度 6）。
      error_code_outcome_map:
        "8016": unknown            # 重複下單 ⇒ 副作用可能已發生且結果查不回來 ⇒ 走回查
        "8019": too_late           # 訂單已確認或已取消 ⇒ 狀態衝突，非拒絕（K4／K5 路徑）
        "4001": transient_error    # 系統資料錯誤／執行期例外
        "0000": business_rejected  # 介面參數異常
        "0001": business_rejected  # XML 解析異常
        "0002": business_rejected  # 欄位校驗異常
        "0003": business_rejected  # 單號節點超過上限 ⇒ 我方分批分錯，屬程式 bug，不得重試
        "0004": business_rejected  # 缺少必填欄位
    dhl_express:
      display_name: DHL Express
      enabled: false
      enable_gate: [V-45]
      serviceable_lanes: []
    ups:
      display_name: UPS
      enabled: false
      enable_gate: [V-45]
      serviceable_lanes: []
    fedex:
      display_name: FedEx
      enabled: false
      enable_gate: [V-45]
      serviceable_lanes: []

# =============================================================================
# 12. 商店抵用金（store credit）
# =============================================================================
store_credit:
  # 單一顧客累計上限（美元）。出處：46c:253–277（help）
  max_balance_usd: 15000
  # 需新版顧客帳號；最早到期的先用；到期以商店時區當日結束為準。出處：46c:253–277（help）
  requires_new_customer_accounts: true
  consumption_order: earliest_expiry_first
  expiry_boundary: shop_timezone_end_of_day
  unsupported_contexts: [draft_order, edited_order, third_party_channel]
  # --- 併發與稅務（55 號盤點 §A M23–M26／§B T22–T23／§D G-07）---
  # 抵用金是金流寫入點但**專案內完全沒有規格章節**：只有本區塊 5 個常數。
  # 兩分頁同時結帳用同一帳戶 ⇒ 超額扣抵；累計上限（< USD 15,000）在併發下也會被突破。
  concurrent_debit_strategy: conditional_update      # UPDATE … WHERE balance_cents >= ?
  balance_floor_cents: 0
  # 🔴 儲值監管：抵用金帳戶**必須綁單一 shop_id 且不可跨 shop 使用**（HK PSSVFO 單一用途豁免，
  #    見 `jurisdictions.hk.stored_value_regime`）。跨租戶通用＝多用途 ⇒ 平台可能需要 SVF 牌照。
  redeemable_scope: issuing_shop_only        # 設計預設（非法遵閘門，2026-08-12 降級）
  # 🔴 稅務／會計定性已搬到 `jurisdictions.<code>.accounting.store_credit_on_issue|on_use`。
  #    TW＝稅務問題（V-22：付款方式 vs 折扣，直接決定發票金額）；
  #    HK＝會計問題（V-29：合約負債 vs 退款負債，直接決定收入認列金額）。
  #    **問題沒有消失，只是換了法域就換了性質**——不可互相套用答案。（56 §E.1）
  accounting_ref: jurisdictions.<code>.accounting

# =============================================================================
# 12b. 禮品卡（55 號盤點新增；金流寫入點 M27–M32、稅務事件點 T19–T21）
# =============================================================================
# 🔴 本區塊在 55 號盤點前**完全不存在**——禮品卡在專案內只有 22:116 一行按鈕描述與 28 §8 的四支 mutation，
#    卻同時是 6 個金流寫入點與 3 個稅務事件點的交會處（docs/specs/55 §D G-06、G-12）。
gift_card:
  # 面額上限。出處：docs/research/41:426、docs/research/22:116（live，後台發卡表單「面額 ≤ $2,000」）
  max_initial_value_cents: 200000
  # 停用＝**永久**（22:116 逐字）；停用不歸零餘額（保留供對帳）
  deactivate_is_permanent: true
  deactivate_zeroes_balance: false
  # 後台只見末 4 碼，完整卡號僅顧客可見（22:116）；code 以 digest 存（同 api_tokens，S19-F5）
  admin_sees_last4_only: true
  # 排程寄送最多 90 天後。出處：docs/research/42:494（ours，前台收件人表單實測值）
  scheduled_send_max_days: 90
  # 併發：同一張卡兩張訂單同時結帳 ⇒ 超額扣抵（最典型的併發資損，55 §A.2）
  balance_floor_cents: 0
  concurrent_debit_strategy: conditional_update      # UPDATE … WHERE balance_cents >= ?
  # 🔴 **儲值監管硬限制（產品級，不是設定項）**：一張卡只能在**發行它的那一個租戶店內**使用。
  #    法源＝HK PSSVFO 單一用途豁免（`jurisdictions.hk.stored_value_regime`，hk-user 已查證）：
  #    跨多個不相關商戶＝多用途 ⇒ 平台自己可能需要 SVF 牌照。
  #    落地：`gift_cards.shop_id NOT NULL`；`gift_card_transactions` 以**複合外鍵 (shop_id, gift_card_id)**
  #    綁回卡片（單欄 gift_card_id 擋不住跨店扣抵）；`giftCardDebit` 驗 shop_id 不符即回
  #    `CROSS_SHOP_REDEMPTION_FORBIDDEN`；`Platform::` 不得有任何跨租戶發卡／扣抵的 mutation
  #    （比照 37:895「無任何發起撥款的 mutation」的既有寫法）。
  #    平台想做全平台通用的行銷抵用 ⇒ 只能用**平台補貼的折扣碼**（17 號折扣引擎），不是儲值工具。（56 §B.3）
  redeemable_scope: issuing_shop_only        # 設計預設（非法遵閘門，2026-08-12 降級）
  cross_shop_redemption_error_code: CROSS_SHOP_REDEMPTION_FORBIDDEN
  # 🔴 稅務／會計定性已搬到 `jurisdictions.<code>.accounting.gift_card_on_sale|on_redeem|on_expire`。
  #    TW＝**稅務時點**二選一（V-21，兩邊都開＝重複課稅）；
  #    HK＝**會計分類**（HKFRS 15：售出＝合約負債、兌換＝認列收入、breakage 依預期兌換模式，hk-user 已查證）。
  #    ⚠ 原 `resolver_refuses_start_when_undecided: true` 一併移入 `jurisdictions.tw.accounting` 並**限定 TW**：
  #    照搬到 HK 會讓禮品卡永遠無法啟用（HK 根本沒有 tax_event_* 這回事）。（56 §E.1）
  accounting_ref: jurisdictions.<code>.accounting

